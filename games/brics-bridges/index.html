<style>/* BRICS Bridges v2 · "Atlas at dusk" (UX_DIRECTION.md §5). Light paper by day; dark palette only for the council vote and the night (Done for today) scene.
   Motion uses transform / opacity / stroke-dashoffset only, and every animation has a reduced-motion path (html.rm or the OS setting). Targets are at least 48px. */
@font-face { font-family: 'Fraunces'; src: url(../../assets/fonts/fraunces-display.woff2) format('woff2'); font-display: swap; font-weight: 300 900; }
:root {
  --paper: #fbf8f3; --paper2: #f2eadc; --card: #fffdf9; --ink: #1d2433; --ink2: #4a5163; --line: #d9ccb6;
  --sea: #eaf0ef; --land: #efe3cc; --land-edge: #d8c39f; --teal: #0f766e; --teal-d: #0b5c56; --gold: #8a5a12; --sun: #f2a93b;
  --ok: #1f6f47; --warn: #9a3f08; --night: #19213a; --night2: #2a2346; --nink: #f3f1ea; --nink2: #cdd3ea;
  --r: 18px; --r-sm: 12px; --sh: 0 1px 2px rgba(29,36,51,.06), 0 6px 20px rgba(29,36,51,.08); --sh-up: 0 10px 30px rgba(29,36,51,.18);
  --ease: cubic-bezier(.2,.8,.2,1); --spring: cubic-bezier(.34,1.56,.64,1); --t: 1;
  --disp: 'Fraunces', Georgia, serif; --ui: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', 'Noto Sans Devanagari', 'Noto Sans Ethiopic', 'Noto Sans SC', sans-serif;
}
html[dir=rtl] { --disp: 'Noto Kufi Arabic', 'Noto Naskh Arabic', 'Vazirmatn', serif; --ui: 'Noto Sans Arabic', 'Vazirmatn', system-ui, sans-serif; }
html:lang(hi), html:lang(am), html:lang(zh-Hans) { --disp: var(--ui); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; min-height: 100%; background: var(--paper); color: var(--ink); font: 16px/1.5 var(--ui); -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
body.night-body { background: var(--night); }
button { font: inherit; color: inherit; cursor: pointer; }
button[disabled] { cursor: default; }
a { color: var(--teal-d); }
img.e { width: 1.15em; height: 1.15em; vertical-align: -0.2em; display: inline-block; }
.sr-only { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; margin: -1px; padding: 0; border: 0; }
.skip { position: absolute; inset-inline-start: 8px; top: -80px; background: var(--ink); color: #fff; padding: 12px 16px; border-radius: 10px; z-index: 99; min-height: 48px; }
.skip:focus { top: 8px; }
[tabindex="-1"]:focus { outline: none; }
:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
.night :focus-visible, .pop :focus-visible { outline-color: #ffd27a; }
.pop :focus-visible { outline-color: var(--teal); }
#app { min-height: 100dvh; }
#app.night { background: linear-gradient(180deg, var(--night) 0%, var(--night2) 100%); color: var(--nink); }
.screen { min-height: 100dvh; display: flex; flex-direction: column; animation: scr-in calc(.35s * var(--t)) var(--ease); max-width: 1280px; margin: 0 auto; width: 100%; }
@keyframes scr-in { from { opacity: 0; transform: translateY(8px); } }
h1, h2, h3 { line-height: 1.15; }
p { margin: 6px 0; }
ul, ol { padding-inline-start: 20px; }

/* buttons: 48px minimum (WCAG 2.5.8 asks 24px; we follow Material 48dp / Apple 44pt) */
.btn { min-height: 52px; padding: 12px 22px; border-radius: 999px; border: 0; font-weight: 700; font-size: 17px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; text-align: center; transition: transform calc(.12s * var(--t)) var(--ease); text-decoration: none; }
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--teal); color: #fff; box-shadow: 0 6px 16px rgba(15,118,110,.3); }
.btn-primary[disabled] { background: #5f6b69; color: #fff; box-shadow: none; }
.btn-ghost { background: var(--card); border: 2px solid var(--line); color: var(--ink); }
.btn-block { width: 100%; }
.btn-sm { min-height: 48px; min-width: 48px; padding: 6px 14px; border-radius: 999px; border: 2px solid var(--line); background: var(--card); font-weight: 700; font-size: 14px; }
.btn-sm[disabled] { color: #5b6170; background: var(--paper2); }
.icon-btn { min-width: 48px; min-height: 48px; border-radius: 14px; border: 0; background: transparent; display: inline-grid; place-items: center; font-size: 20px; padding: 0; color: inherit; }
.icon-btn:hover { background: rgba(29,36,51,.06); }
.top .sp { width: 48px; flex: none; }
.lnk { background: none; border: 0; padding: 10px 4px; min-height: 48px; color: var(--teal-d); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.links { display: flex; flex-wrap: wrap; gap: 8px; }
.chipbtn { display: inline-flex; align-items: center; gap: 6px; min-height: 48px; padding: 8px 14px; border-radius: 999px; background: var(--card); border: 2px solid var(--line); font-size: 14px; font-weight: 700; color: var(--ink); text-decoration: none; }
.note { font-size: 14px; color: var(--ink2); }
.muted { color: var(--ink2); font-size: 14px; }
.src { display: inline-flex; align-items: center; gap: 4px; min-height: 32px; font-weight: 700; font-size: 13px; color: var(--teal-d); padding: 4px 0; }
.mech { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .02em; padding: 1px 8px; border-radius: 999px; border: 1px dashed #6d6656; color: #4f4a3e; vertical-align: 1px; }
.night .mech { color: var(--nink2); border-color: #8f97b8; }
.para { font-size: 12px; color: var(--ink2); font-weight: 700; }
.night .para, .night .muted, .night .note { color: var(--nink2); }
.disc { font-size: 12px; color: var(--ink2); margin-top: 14px; }
.night .disc { color: var(--nink2); }
.lbl { font: 700 13px var(--ui); letter-spacing: .06em; text-transform: uppercase; color: var(--ink2); margin: 4px 0 8px; }
html[dir=rtl] .lbl, html:lang(zh-Hans) .lbl { letter-spacing: 0; }
.lbl2 { font: 700 13px var(--ui); color: var(--ink2); margin: 0 0 4px; }
.h3 { font: 700 16px/1.25 var(--ui); margin: 0; display: block; }
.warnbox, .okbox { border-radius: 14px; padding: 10px 12px; font-size: 14px; margin: 8px 0; }
.warnbox { background: #fdf0e4; color: #6e2d05; border: 1px solid #f0c9a6; }
.okbox { background: #e9f5ef; color: #134a30; border: 1px solid #b9dcc8; }
.night .warnbox { background: rgba(255,178,122,.14); color: #ffe1c9; border-color: rgba(255,178,122,.35); }
.night .okbox { background: rgba(158,230,183,.12); color: #d6f5e1; border-color: rgba(158,230,183,.3); }
.twl { font-size: 14px; padding: 8px 12px; border-radius: 12px; background: var(--paper2); margin: 8px 0 0; }
.twl.on { background: #e6f3f1; color: #0b4a45; font-weight: 700; }
.night .twl { background: rgba(255,255,255,.08); color: var(--nink); }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px; background: var(--paper2); font-size: 12px; font-weight: 600; border: 2px solid transparent; color: var(--ink); }
.tag.m { border-color: var(--teal); background: #e6f3f1; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.vpips { display: inline-flex; gap: 3px; direction: ltr; vertical-align: middle; }
.vpips i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid #6b7180; }
.vpips i.on { background: var(--teal); border-color: var(--teal); }
.night .vpips i { border-color: #aab2d0; } .night .vpips i.on { background: #ffd27a; border-color: #ffd27a; }
.mbadge { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--c); color: #fff; font: 800 12px/1 var(--ui); border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); direction: ltr; vertical-align: middle; flex: none; }
.mbadge.sm { width: 26px; height: 26px; font-size: 10px; }
.mbadge.lg { width: 52px; height: 52px; font-size: 17px; border-width: 3px; }
.mbadge.guest { background: #fff; color: #15653a; border: 2px dashed #15653a; }

/* top bar */
.top { display: flex; align-items: center; gap: 6px; padding: 6px 8px; padding-top: max(6px, env(safe-area-inset-top)); position: sticky; top: 0; z-index: 5; background: rgba(251,248,243,.92); backdrop-filter: blur(8px); }
.top .mid { flex: 1; min-width: 0; text-align: center; }
.top .q { font: 600 13px var(--ui); color: var(--ink2); }
.top .t { font: 700 16px var(--disp); }
.coins { display: inline-flex; align-items: center; gap: 4px; font-weight: 800; padding: 6px 10px; border-radius: 999px; background: #fff1d6; color: #6b3f04; min-height: 36px; direction: ltr; }
.night .top { background: transparent; backdrop-filter: none; color: var(--nink); }
.night .top .q { color: var(--nink2); }
.night .icon-btn:hover { background: rgba(255,255,255,.08); }

/* ---------- map: coastlines only, approximate positions ---------- */
.mapwrap { position: relative; }
.map { position: relative; width: 100%; aspect-ratio: 1000 / 540; background: radial-gradient(120% 90% at 50% 40%, #f3f7f5 0%, var(--sea) 60%, #dfe8e6 100%); border-radius: var(--r); overflow: hidden; }
.map svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.map .land { fill: var(--land); stroke: var(--land-edge); stroke-width: 1.2; stroke-linejoin: round; }
.map .grat { stroke: #cfdcd8; stroke-width: .8; fill: none; stroke-dasharray: 2 6; }
.map .lead { stroke: #8a7a5c; stroke-width: 1.2; }
.map .anchor { fill: #6b5b3e; }
.map .arc { fill: none; stroke: var(--teal); stroke-width: 4; stroke-linecap: round; }
.map .arc.now { stroke: var(--teal); stroke-width: 4.5; filter: drop-shadow(0 0 4px rgba(20,184,166,.45)); }
.map .arc.old { stroke: #4f9a91; stroke-width: 2.6; opacity: .75; }
.map .arc.draw { stroke-dasharray: var(--len, 900); stroke-dashoffset: var(--len, 900); animation: draw calc(.7s * var(--t)) var(--ease) forwards; }
.map .arc.ghost { stroke: #9fb0ac; stroke-dasharray: 3 7; stroke-width: 2; }
/* year atlas: each quarter has its own colour AND dash pattern, so colour is never the only cue */
.map .arc.q1 { stroke: #0f766e; opacity: .9; }
.map .arc.q2 { stroke: #7c3aed; stroke-dasharray: 12 6; opacity: .9; }
.map .arc.q3 { stroke: #b45309; stroke-dasharray: 2 6; stroke-width: 3.4; opacity: .95; }
.map .arc.q4 { stroke: #be185d; stroke-dasharray: 14 5 3 5; opacity: .9; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.map .jring { fill: rgba(124,58,237,.08); stroke: #7c3aed; stroke-width: 2.5; stroke-dasharray: 8 6; animation: march calc(6s / var(--t)) linear infinite; }
@keyframes march { to { stroke-dashoffset: -140; } }
.jbadge { position: absolute; transform: translate(-50%, -50%); width: 34px; height: 34px; border-radius: 50%; background: #fff; display: grid; place-items: center; box-shadow: var(--sh); border: 2px solid #7c3aed; }
.map .coin circle { fill: #f2a93b; stroke: #fff; stroke-width: 2; }
.map .coin text { fill: #5a3604; font: 800 11px var(--ui); }
.mark { position: absolute; transform: translate(-50%, -50%); width: 28px; height: 28px; border-radius: 8px; background: #fff; display: grid; place-items: center; box-shadow: var(--sh); border: 2px solid var(--gold); font-size: 15px; }
.mark.fresh { animation: pop calc(.6s * var(--t)) var(--spring) .5s both; }
@keyframes pop { from { transform: translate(-50%, -50%) scale(.2); opacity: 0; } }
.night .map { background: radial-gradient(120% 90% at 50% 40%, #26304f 0%, #1b233d 70%); }
.night .map .land { fill: #2f3a5c; stroke: #45527a; }
.night .map .grat { stroke: #2c3657; } .night .map .lead { stroke: #8f97b8; } .night .map .anchor { fill: #aab2d0; }
.night .map .arc, .night .map .arc.old { stroke: #ffd27a; opacity: 1; stroke-width: 3; filter: drop-shadow(0 0 5px rgba(255,210,122,.7)); }
.node { position: absolute; transform: translate(-50%, -50%); display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--c); color: #fff; font: 800 12px/1 var(--ui); border: 2.5px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.22); direction: ltr; cursor: pointer; }
.node.guest { background: #fff; color: #15653a; border: 2.5px dashed #15653a; }
.node.hit { animation: pulse calc(1.6s * var(--t)) ease-out infinite; z-index: 2; }
.node .hz { position: absolute; top: -12px; inset-inline-end: -12px; width: 24px; height: 24px; background: #fff; border-radius: 50%; display: grid; place-items: center; box-shadow: var(--sh); }
.node .hz img { width: 16px; height: 16px; }
.node.lit { box-shadow: 0 0 0 4px rgba(20,184,166,.4), 0 2px 6px rgba(0,0,0,.2); }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(242,169,59,.75), 0 2px 6px rgba(0,0,0,.22); } 70% { box-shadow: 0 0 0 16px rgba(242,169,59,0), 0 2px 6px rgba(0,0,0,.22); } 100% { box-shadow: 0 0 0 0 rgba(242,169,59,0); } }
.map-cap { position: absolute; inset-inline-end: 6px; bottom: 4px; font-size: 10.5px; color: #3b4152; background: rgba(255,255,255,.85); padding: 2px 8px; border-radius: 8px; }
.night .map-cap { color: var(--nink); background: rgba(0,0,0,.45); }
.mapbtn { position: absolute; top: 8px; inset-inline-start: 8px; background: rgba(255,255,255,.94); box-shadow: var(--sh); }
.mapbtn:hover { background: #fff; }

/* ---------- home ---------- */
.home { padding: 0 16px 0; gap: 12px; }
.hero { position: relative; margin-top: 4px; }
.brand { text-align: center; padding: 8px 0 0; }
.brand h1 { font: 800 clamp(32px, 8.6vw, 56px)/1.04 var(--disp); margin: 0; letter-spacing: -.01em; }
.brand h1 span { color: var(--teal); }
.brand .tagline { margin: 6px auto 0; max-width: 34ch; color: var(--ink2); font-size: 16px; }
.count { margin: 0; }
.qlist { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; position: relative; }
.qlist::before { content: ''; position: absolute; top: 30px; inset-inline: 12%; height: 3px; background: repeating-linear-gradient(90deg, var(--line) 0 8px, transparent 8px 14px); }
.qn button { position: relative; width: 100%; min-height: 48px; display: flex; flex-direction: column; align-items: center; gap: 3px; text-align: center; font-size: 12px; color: var(--ink2); background: none; border: 0; padding: 4px 2px; border-radius: 14px; }
.qn .medal { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: #fff; border: 2px solid var(--line); font-size: 24px; }
.qn.now .medal { border: 3px solid var(--teal); box-shadow: 0 0 0 6px rgba(15,118,110,.14); }
.qn.lock .medal { filter: grayscale(1); opacity: .6; }
.qn.done .medal, .qn.doneToday .medal { border-color: var(--gold); }
.qn b { color: var(--ink); font-size: 13px; line-height: 1.2; }
.qn small { color: #464c5c; line-height: 1.2; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.seg button { min-height: 60px; border-radius: var(--r-sm); border: 2px solid var(--line); background: var(--card); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-weight: 700; padding: 6px 4px; }
.seg button small { font-weight: 500; color: var(--ink2); font-size: 12px; }
.seg button[aria-pressed=true] { border-color: var(--teal); background: #e6f3f1; box-shadow: inset 0 0 0 1px var(--teal); }
.week { list-style: none; padding: 0; margin: 0; display: flex; gap: 6px; }
.day { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; color: var(--ink2); }
.day i { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--paper2); font-style: normal; font-size: 13px; }
.day.p i { background: var(--teal); color: #fff; font-weight: 900; }
.day.r i { background: #ece6f6; }
.day.today i { outline: 2px solid var(--ink); outline-offset: 2px; }
.night .day { color: var(--nink2); } .night .day i { background: rgba(255,255,255,.1); color: var(--nink); }
.night .day.p i { background: #ffd27a; color: var(--night); } .night .day.r i { background: rgba(160,140,220,.25); } .night .day.today i { outline-color: #fff; }
.foot { font-size: 13px; color: var(--ink2); text-align: center; margin: 6px 0; }
.side { display: flex; flex-direction: column; gap: 14px; }
.side section { margin: 0; }
.cta { position: sticky; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); margin: auto -16px 0; background: linear-gradient(to top, var(--paper) 72%, rgba(251,248,243,0)); display: flex; flex-direction: column; gap: 8px; z-index: 4; }
.row { display: flex; gap: 8px; align-items: stretch; }
.row .btn { flex: 1; min-height: 48px; font-size: 15px; padding: 8px 12px; }
.night .cta { background: linear-gradient(to top, var(--night2) 72%, rgba(42,35,70,0)); }
.night .btn-ghost { background: transparent; color: #fff; border-color: rgba(255,255,255,.45); }

/* ---------- board ---------- */
.board { padding: 0 12px; gap: 10px; }
.left, .right { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.brief { display: flex; gap: 12px; align-items: flex-start; background: var(--card); border-radius: var(--r); padding: 12px 14px; box-shadow: var(--sh); position: relative; z-index: 2; }
.brief .hz { width: 48px; height: 48px; border-radius: 14px; background: #fff1d6; display: grid; place-items: center; font-size: 26px; flex: none; }
.brief .bt { min-width: 0; flex: 1; }
.brief h1, .brief h2 { margin: 2px 0 0; font: 800 20px/1.2 var(--disp); }
.brief .who { margin: 0; font-size: 14px; color: var(--ink2); display: flex; gap: 6px; align-items: center; }
details.more { margin-top: 6px; font-size: 14px; }
details.more summary { min-height: 48px; display: flex; align-items: center; font-weight: 700; color: var(--teal-d); cursor: pointer; list-style-position: inside; }
details.more summary::marker { color: var(--teal-d); }
.needs { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.need { display: flex; align-items: center; gap: 8px; padding: 8px 12px 8px 10px; border-radius: 14px; background: var(--card); border: 2px solid var(--line); font-weight: 700; font-size: 14px; min-height: 48px; transition: border-color .3s, background .3s; }
.need .ic { font-size: 20px; }
.need .carry { font-size: 11px; color: var(--warn); font-weight: 700; }
.pips { display: inline-flex; gap: 4px; direction: ltr; }
.pip { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #757b88; background: transparent; transition: background .2s, border-color .2s; }
.pip.on { background: var(--teal); border-color: var(--teal); }
.pip.bump { animation: pip calc(.45s * var(--t)) var(--spring); }
@keyframes pip { 0% { transform: scale(.4); } 60% { transform: scale(1.5); } 100% { transform: scale(1); } }
.need.full { border-color: var(--teal); background: #e6f3f1; }
.need.full::after { content: '✓'; color: var(--teal); font-weight: 900; }
.lblrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.hintline { font-size: 14px; background: #fff1d6; color: #5a3604; padding: 8px 12px; border-radius: 12px; margin: 4px 0; }
.hand-wrap { margin: 0 -12px; }
.hand { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 12px 12px 12px; scrollbar-width: thin; }
.card { scroll-snap-align: start; flex: none; width: 164px; min-height: 216px; border-radius: 16px; background: var(--card); border: 0; padding: 0; text-align: start; box-shadow: var(--sh); display: flex; flex-direction: column; overflow: hidden; position: relative; transition: transform calc(.25s * var(--t)) var(--spring), box-shadow .25s; }
.card .band { height: 46px; display: flex; align-items: center; gap: 8px; padding: 0 10px; color: #fff; font-weight: 700; font-size: 13px; background: var(--c); }
.card .mono { width: 28px; height: 28px; border-radius: 50%; background: rgba(0,0,0,.22); border: 2px solid rgba(255,255,255,.9); display: grid; place-items: center; font-size: 11px; font-weight: 800; direction: ltr; flex: none; }
.card .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.card .h3 { font-size: 15px; }
.card .teaser { font-size: 12px; color: var(--ink2); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card .gline { font-size: 12px; color: #15653a; font-weight: 700; }
.card .warnline { font-size: 12px; color: var(--warn); font-weight: 700; }
.card .state { margin-top: auto; font-size: 13px; font-weight: 800; color: var(--teal-d); display: flex; align-items: center; gap: 6px; }
.card.rel { box-shadow: 0 0 0 3px #f2a93b, var(--sh); }
.card[aria-pressed=true] { transform: translateY(-8px); box-shadow: 0 0 0 3px var(--teal), var(--sh-up); }
.card[aria-pressed=true]::after { content: '✓'; position: absolute; top: 9px; inset-inline-end: 8px; width: 26px; height: 26px; border-radius: 50%; background: #fff; color: var(--teal); display: grid; place-items: center; font-weight: 900; }
.card.dim { box-shadow: none; background: var(--paper2); }
.card.guestc .band { background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.16) 0 6px, transparent 6px 12px); }
.warnline { color: var(--warn); font-weight: 700; font-size: 13px; }
.flyer { position: fixed; z-index: 30; pointer-events: none; border-radius: 50%; width: 30px; height: 30px; display: grid; place-items: center; color: #fff; font: 800 12px var(--ui); transition: transform .5s var(--ease), opacity .5s; box-shadow: var(--sh-up); }
.dock { position: sticky; bottom: 0; margin: auto -12px 0; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: var(--paper); box-shadow: 0 -10px 16px -8px rgba(29,36,51,.12); display: flex; flex-direction: column; gap: 6px; z-index: 4; }
.dock .hint { text-align: center; font-size: 14px; color: var(--ink2); margin: 0; }

/* ---------- sheets ---------- */
.scrim { position: fixed; inset: 0; background: rgba(25,33,58,.45); z-index: 20; animation: fade calc(.25s * var(--t)); }
@keyframes fade { from { opacity: 0; } }
.sheet { position: fixed; inset-inline: 0; bottom: 0; z-index: 21; background: var(--paper); color: var(--ink); border-radius: 22px 22px 0 0; padding: 6px 16px calc(16px + env(safe-area-inset-bottom)); max-height: 88dvh; overflow: auto; animation: up calc(.35s * var(--t)) var(--ease); box-shadow: var(--sh-up); }
@keyframes up { from { transform: translateY(100%); } }
.sh-head { display: flex; align-items: center; gap: 8px; position: sticky; top: -6px; background: var(--paper); padding: 6px 0; z-index: 1; }
.sh-head h2 { flex: 1; font: 800 21px/1.2 var(--disp); margin: 0; }
.sheet-cta { position: sticky; bottom: calc(-16px - env(safe-area-inset-bottom)); background: var(--paper); padding: 12px 0 4px; margin-top: 8px; }
.sheet h3 { font: 700 16px var(--ui); margin: 14px 0 4px; }
.demo .map { border: 1px solid var(--line); }
.rule { font-weight: 600; }
.projs { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
.proj { width: 100%; display: flex; flex-direction: column; gap: 6px; text-align: start; background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 12px; min-height: 76px; }
.proj .pj-h { display: flex; gap: 10px; align-items: center; width: 100%; }
.proj .pe { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 22px; background: #e6f3f1; flex: none; }
.proj .h3 { flex: 1; }
.proj .cost { font-weight: 800; color: #6b3f04; white-space: nowrap; }
.proj .cost s { color: var(--ink2); font-weight: 600; }
.proj .sdg { font-size: 12px; color: var(--ink2); font-weight: 600; }
.proj .fit { font-size: 13px; color: #0b4a45; font-weight: 600; }
.proj .pj-f, .proj .pj-n { font-size: 13px; color: var(--ink2); }
.proj .fnote { display: block; }
.proj.on { border-color: var(--teal); background: #e6f3f1; box-shadow: inset 0 0 0 1px var(--teal); }
.proj[disabled] { opacity: 1; background: var(--paper2); color: #4f5566; }
.proj.save .pe { background: var(--paper2); }
.mini { padding: 10px 0; border-bottom: 1px solid var(--line); } .mini p { font-size: 14px; }
.how li { margin: 8px 0; }
.srcs { font-size: 13px; padding-inline-start: 18px; } .srcs li { margin: 6px 0; } .srcs a { word-break: break-all; display: inline-block; min-height: 24px; }
.mlist { list-style: none; padding: 0; margin: 0; }
.mrow { width: 100%; display: flex; align-items: center; gap: 10px; min-height: 52px; background: none; border: 0; border-bottom: 1px solid var(--line); text-align: start; padding: 6px 4px; }
.mrow .mn { flex: 1; font-weight: 700; }
.langs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.lrow { min-height: 52px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); font-weight: 700; font-size: 16px; }
.lrow[aria-pressed=true] { border-color: var(--teal); background: #e6f3f1; }
.passrow { display: flex; gap: 14px; align-items: center; background: #fff8ea; border: 1px solid #ecd9b0; border-radius: 16px; padding: 12px 14px; margin: 8px 0; }
.passrow h3 { margin: 0 0 6px; font-size: 15px; }
.passrow b { font: 800 16px var(--disp); }
.passrow p { margin: 2px 0; }
.passrow small { color: var(--ink2); }
.stamps { display: flex; flex-wrap: wrap; gap: 10px; }
.stampmini { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--ink2); }
.pstamp { width: 76px; height: 76px; border-radius: 50%; border: 3px dashed var(--gold); display: grid; place-items: center; transform: rotate(-8deg); flex: none; background: #fffdf6; }
.pstamp.fresh { animation: pstamp calc(.55s * var(--t)) var(--spring) .8s both; }
@keyframes pstamp { from { transform: scale(2.2) rotate(-20deg); opacity: 0; } }
.night .passrow { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.14); }
.night .passrow small, .night .stampmini { color: var(--nink2); }

/* ---------- council vote (dark) ---------- */
.council { padding: 0 16px calc(16px + env(safe-area-inset-bottom)); align-items: center; text-align: center; }
.council .ch { padding-top: max(16px, env(safe-area-inset-top)); }
.council .lbl { color: var(--nink2); }
.council h1 { font: 800 24px/1.2 var(--disp); margin: 4px 0 0; }
.council h1 small { font: 700 15px var(--ui); color: #ffd27a; }
.ring { position: relative; width: min(84vw, 380px); aspect-ratio: 1; margin: 12px auto 4px; flex: none; }
.ring svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.ring line { stroke: rgba(255,255,255,.14); stroke-width: .6; }
.ring line.yes { stroke: #ffd27a; stroke-width: .9; }
.ring line.no { stroke: #ffb27a; stroke-width: .9; stroke-dasharray: 2 1.5; }
.seats { list-style: none; margin: 0; padding: 0; }
.seat { position: absolute; transform: translate(-50%, -50%); width: 46px; height: 46px; border-radius: 50%; background: var(--c); display: grid; place-items: center; color: #fff; font: 800 13px var(--ui); border: 3px solid rgba(255,255,255,.55); opacity: .35; transition: opacity .3s, transform .3s var(--spring); direction: ltr; }
.seat.in { opacity: 1; transform: translate(-50%, -50%) scale(1.06); }
.seat i { position: absolute; bottom: -7px; inset-inline-end: -9px; width: 22px; height: 22px; border-radius: 50%; display: none; place-items: center; font-size: 13px; font-weight: 900; font-style: normal; }
.seat.in.yes i { display: grid; background: #ffd27a; color: #1d2433; }
.seat.in.no i { display: grid; background: #fff; color: var(--warn); border-radius: 6px; }
.seat.in.no { border-color: #ffb27a; box-shadow: 0 0 0 4px rgba(255,140,60,.4); }
.hub { position: absolute; left: 50%; top: 50%; width: 28%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; background: #fff; display: grid; place-items: center; font-size: 34px; box-shadow: 0 0 0 8px rgba(255,255,255,.08); }
.gnote { font-size: 13px; color: var(--nink2); max-width: 440px; display: flex; gap: 8px; align-items: center; text-align: start; }
.verdict { width: 100%; max-width: 460px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.verdict h2 { font: 800 24px var(--disp); margin: 4px 0; }
.verdict .why { list-style: none; padding: 0; margin: 6px 0; width: 100%; text-align: start; }
.verdict .why li { background: rgba(255,255,255,.08); border-radius: 12px; padding: 8px 10px; margin: 6px 0; font-size: 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.go { display: flex; flex-direction: column; gap: 8px; width: 100%; margin-top: 8px; }
.verdict h2.stamp { margin: 6px 0 2px; }
.stamp { font: 900 32px var(--disp); color: #ffd27a; text-shadow: 0 0 24px rgba(255,210,122,.55); animation: stamp calc(.6s * var(--t)) var(--spring); }
.stamp.no { color: #ffc89e; text-shadow: none; font-size: 26px; }
@keyframes stamp { from { transform: scale(2.2) rotate(-6deg); opacity: 0; } }
.skipv { margin-top: 12px; min-width: 140px; }
.council .warnbox { text-align: start; }

/* ---------- celebration ---------- */
.celebrate { padding: 0 14px; gap: 12px; position: relative; }
.hero2 { text-align: center; }
.hero2 .big-e { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; font-size: 42px; margin: 4px auto 0; background: #fff; box-shadow: 0 0 0 6px #ffe2a8, 0 0 0 12px rgba(242,169,59,.2), var(--sh-up); animation: medal calc(.8s * var(--t)) var(--spring); }
@keyframes medal { from { transform: scale(.2) rotate(-30deg); opacity: 0; } }
.hero2 h1, .hero2 h2 { font: 800 28px/1.1 var(--disp); margin: 12px 0 2px; }
.hero2 .sub { color: var(--ink2); margin: 0; }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 10; overflow: hidden; }
.confetti i { position: absolute; top: -20px; left: calc(var(--i) * 5.5%); width: 10px; height: 14px; border-radius: 2px; background: hsl(calc(var(--i) * 40), 80%, 55%); animation: fall calc(1.8s + var(--i) * .05s) var(--ease) forwards; animation-delay: calc(var(--i) * 40ms); }
@keyframes fall { to { transform: translate(calc((var(--i) - 9) * 6px), 105vh) rotate(calc(var(--i) * 70deg)); opacity: .9; } }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stats > div { background: var(--card); border-radius: 16px; padding: 10px; box-shadow: var(--sh); text-align: center; display: flex; flex-direction: column; justify-content: center; }
.stats b { font: 800 24px var(--disp); }
.stats small { font-size: 12px; color: var(--ink2); font-weight: 700; }
.night .stats > div { background: rgba(255,255,255,.07); box-shadow: none; } .night .stats small { color: var(--nink2); }
.lens { background: var(--card); border-radius: 16px; padding: 12px 14px; box-shadow: var(--sh); }
.lens h2, .lens h3 { margin: 0 0 6px; font: 700 15px var(--ui); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.lens .m { display: grid; grid-template-columns: minmax(90px, 40%) 1fr auto; gap: 10px; align-items: center; font-size: 13px; font-weight: 700; margin: 4px 0; }
.lens .m.x { color: #0b4a45; }
.bar { height: 10px; border-radius: 6px; background: var(--paper2); overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--teal), #14b8a6); border-radius: 6px; transition: width calc(1s * var(--t)) var(--ease); }
.realq { background: #fff8ea; border: 1px solid #ecd9b0; border-radius: 16px; padding: 12px 14px; }
.realq h2, .realq h3 { margin: 0 0 4px; font: 800 15px var(--ui); }
.realq p { font-size: 14px; }
.quiz { background: var(--card); border-radius: 16px; padding: 12px 14px; box-shadow: var(--sh); }
.quiz h2, .quiz h3 { margin: 0; font: 800 15px var(--ui); }
.qa { display: flex; gap: 8px; flex-wrap: wrap; }
.qopt { flex: 1; min-height: 48px; min-width: 72px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); font-weight: 700; padding: 6px 10px; }
.qopt[disabled] { color: var(--ink); }
.qopt.right { border-color: var(--ok); background: #e9f5ef; }
.qopt.wrong { border-color: var(--warn); background: #fdf0e4; text-decoration: line-through; }
.quiz .why { font-size: 14px; min-height: 1em; }

/* ---------- night: Done for today ---------- */
.night.screen { padding: 0 16px; gap: 12px; }
.center { text-align: center; }
.moon { display: block; font-size: 44px; margin-top: 4px; }
.night h1 { font: 800 32px/1.1 var(--disp); margin: 4px 0 0; }
.night .sub { color: var(--nink2); margin: 4px 0 0; }
.bigidx { text-align: center; display: flex; flex-direction: column; align-items: center; }
.bigidx span { font-weight: 700; color: var(--nink2); }
.bigidx b { font: 800 56px/1 var(--disp); color: #ffd27a; }
.bigidx em { font-style: normal; font-weight: 800; background: #ffd27a; color: var(--night); padding: 2px 10px; border-radius: 999px; margin-top: 4px; }
.bigidx small { color: var(--nink2); }
.card2 { background: var(--card); border-radius: 16px; padding: 12px 14px; box-shadow: var(--sh); }
.card2 .h3 { margin-bottom: 6px; }
.card2 ul { margin: 4px 0; font-size: 14px; } .card2 li { margin: 4px 0; }
.night .card2 { background: rgba(255,255,255,.06); box-shadow: none; border: 1px solid rgba(255,255,255,.1); }
.night a, .night .src { color: #9ee6d8; }
.acts { display: flex; flex-direction: column; gap: 8px; }
.act { text-align: start; min-height: 56px; border-radius: 14px; border: 2px solid rgba(255,255,255,.2); background: rgba(255,255,255,.05); color: var(--nink); padding: 10px 12px; font-size: 15px; display: flex; gap: 10px; align-items: center; }
.act[aria-pressed=true] { border-color: #ffd27a; background: rgba(255,210,122,.14); }
.act[aria-pressed=true]::after { content: '✓'; margin-inline-start: auto; color: #ffd27a; font-weight: 900; }
.notes { list-style: none; padding: 0; margin: 8px 0 0; font-size: 14px; color: var(--nink2); }
.env { border: 1px dashed rgba(255,255,255,.35); border-radius: 16px; padding: 12px; text-align: center; }
p.go { font-weight: 700; font-size: 17px; display: block; color: var(--nink); }

/* ---------- year in review ---------- */
.year.screen { padding: 0 16px; gap: 12px; }
.year h1 { font: 800 30px var(--disp); margin: 4px 0 0; }
.year .sub { color: var(--ink2); margin: 0; }
.qlegend { list-style: none; padding: 0; margin: 8px 0 0; display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; }
.qlegend li { display: flex; align-items: center; gap: 6px; }
.sw { width: 32px; height: 0; border-top: 4px solid; display: inline-block; }
.sw.q1 { border-color: #0f766e; } .sw.q2 { border-top-style: dashed; border-color: #7c3aed; } .sw.q3 { border-top-style: dotted; border-color: #b45309; } .sw.q4 { border-top: 4px double #be185d; }
.ycols { display: grid; grid-template-columns: 1fr; gap: 10px; font-size: 14px; }
.ycols p { margin: 3px 0; }
.st { display: inline-block; font-size: 11px; font-weight: 800; padding: 1px 8px; border-radius: 999px; vertical-align: 1px; }
.st.ok { background: #e9f5ef; color: #134a30; border: 1px solid #9fcdb3; }
.st.pr { background: #fdf0e4; color: #6e2d05; border: 1px dashed #c98a5a; }

/* ---------- coach marks, popover ---------- */
.coach { position: absolute; z-index: 15; background: var(--ink); color: #fff; padding: 10px 12px; border-radius: 14px; font-size: 14px; font-weight: 600; box-shadow: var(--sh-up); animation: coach calc(.35s * var(--t)) var(--spring); }
.coach p { margin: 0 0 4px; }
.coach .btn-sm { background: transparent; color: #9ee6d8; border-color: rgba(255,255,255,.3); }
@keyframes coach { from { transform: scale(.85); opacity: 0; } }
.spot { position: relative; z-index: 3; box-shadow: 0 0 0 4px #f2a93b, var(--sh-up) !important; }
.pop { position: fixed; top: 58px; inset-inline-end: 10px; z-index: 22; background: var(--card); border-radius: 16px; padding: 8px; box-shadow: var(--sh-up); min-width: 250px; animation: coach calc(.2s * var(--t)); color: var(--ink); border: 1px solid var(--line); }
.pop .opt { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; min-height: 48px; border: 0; background: none; padding: 0 10px; border-radius: 10px; text-align: start; }
.pop .opt:hover { background: var(--paper2); }
.pop .opt span:last-child { font-weight: 800; color: var(--teal-d); }

/* ---------- desktop ---------- */
@media (min-width: 900px) {
  .home { display: grid; grid-template-columns: 1.35fr 1fr; grid-template-rows: auto 1fr auto; column-gap: 32px; padding: 0 32px 0; }
  .home > .top { grid-column: 1 / -1; }
  .home .hero { grid-row: 2 / 4; align-self: center; }
  .home .side { grid-row: 2; align-self: center; }
  .home .cta { grid-column: 2; grid-row: 3; position: static; background: none; padding: 12px 0 24px; margin: 0; }
  .brand { text-align: start; } .brand .tagline { margin-inline: 0; }
  .board, .celebrate { display: grid; grid-template-columns: 1.25fr 1fr; grid-template-rows: auto 1fr; column-gap: 24px; padding: 0 24px 16px; align-items: start; }

  { id: 'IN2', m: 'IN', title: 'Cyclone warning and shelters', tags: ['warn', 'infra'], fact: 'Before Cyclone Phailin (2013), Odisha moved about 1 million people to shelters. 44 people died, compared with about 10,000 in the 1999 super cyclone.', srcName: 'Govt of Odisha, ADB and World Bank damage assessment (Dec 2013)', src: 'https://documents1.worldbank.org/curated/en/168471468257979992/pdf/838860WP0P14880Box0382116B00PUBLIC0.pdf' },
  { id: 'CN1', m: 'CN', title: 'Solar panel manufacturing', tags: ['energy'], fact: 'China’s share of every main stage of solar PV manufacturing is above 80%, which has made solar panels much cheaper worldwide.', srcName: 'IEA: Solar PV Global Supply Chains', src: 'https://www.iea.org/reports/solar-pv-global-supply-chains/executive-summary' },
  { id: 'CN2', m: 'CN', title: 'Rail and big construction', tags: ['infra'], qt: { 3: ['infra', 'trade'] }, fact: 'By December 2025 China’s high-speed rail network passed 50,000 km, more than the rest of the world combined.', srcName: 'Xinhua / Ministry of Transport, Dec 2025', src: 'https://english.news.cn/20251226/558786c99de5428b98a84c3ff93300e3/c.html' },
  { id: 'ZA1', m: 'ZA', title: 'Public-health programmes', tags: ['health'], fact: 'South Africa runs the world’s largest HIV treatment programme, with about 6.3 million people on antiretroviral therapy in 2024.', srcName: 'UNAIDS: South Africa', src: 'https://www.unaids.org/en/regionscountries/countries/southafrica' },
  { id: 'ZA2', m: 'ZA', title: 'Water-saving know-how', tags: ['water'], fact: 'In the 2018 drought Cape Town cut its water use by more than half, from about 1.2 billion to about 0.5 billion litres a day, and avoided “Day Zero”.', srcName: 'Princeton ISS case study', src: 'https://successfulsocieties.princeton.edu/publications/keeping-taps-running-how-cape-town-averted-day-zero-2017-2018' },
  { id: 'EG1', m: 'EG', title: 'Suez Canal shipping', tags: ['infra', 'food'], qt: { 3: ['trade', 'food'] }, fact: 'About 12% of world trade, including grain and fertiliser, passes through Egypt’s Suez Canal.', srcName: 'UNCTAD (2024)', src: 'https://unctad.org/system/files/non-official-document/cimem7-2024-ppt05ahmedelshazly_en.pdf' },
  { id: 'EG2', m: 'EG', title: 'Desert solar parks', tags: ['energy'], fact: 'Egypt’s Benban solar park near Aswan, about 1.65 GW, is one of the largest solar parks in the world.', srcName: 'IFC', src: 'https://www.ifc.org/en/stories/2010/benban-solar-park-egypt' },
  { id: 'ET1', m: 'ET', title: 'Green Legacy tree planting', tags: ['water', 'food'], qt: { 4: ['nature', 'water'] }, fact: 'Ethiopia’s Green Legacy Initiative reports more than 48 billion seedlings planted since 2019 to restore land and watersheds.', srcName: 'Green Legacy Initiative (official)', src: 'https://www.ethio-greenlegacy.et/' },
  { id: 'ET2', m: 'ET', title: 'Humanitarian air hub', tags: ['health', 'infra'], qt: { 3: ['trade', 'health'] }, fact: 'In 2020 an Addis Ababa air hub, run with the UN World Food Programme and Ethiopian Airlines, carried COVID-19 supplies to all 54 African countries.', srcName: 'WFP', src: 'https://www.wfp.org/news/wfp-launches-ethiopian-government-supported-air-hub-covid-19-response' },
  { id: 'IR1', m: 'IR', title: 'Qanat water engineering', tags: ['water'], fact: 'Iran’s qanats are ancient underground channels that carry water by gravity. The Persian Qanat is a UNESCO World Heritage site (2016).', srcName: 'UNESCO', src: 'https://whc.unesco.org/en/list/1506' },
  { id: 'IR2', m: 'IR', title: 'Earthquake engineering', tags: ['infra', 'warn'], fact: 'Iran’s International Institute of Earthquake Engineering and Seismology (IIEES, founded 1989) researches safer buildings and quake monitoring.', srcName: 'IIEES', src: 'https://www.iiees.ac.ir/en/', verify: true },
  { id: 'SA1', m: 'SA', title: 'Desalination at scale', tags: ['water'], fact: 'Saudi Arabia is the world’s largest producer of desalinated water: more than 16 million cubic metres a day.', srcName: 'Arab News', src: 'https://www.arabnews.com/business/saudi-arabia-leads-world-with-16m-cubic-meters-of-desalinated-water-daily-2647115' },
  { id: 'SA2', m: 'SA', title: 'Large solar plants', tags: ['energy'], fact: 'The 1.5 GW Sudair solar plant has been fully operating since January 2024.', srcName: 'Zawya / ACWA Power', src: 'https://www.zawya.com/en/projects/utilities/saudis-1.5gw-sudair-solar-pv-ipp-is-fully-operational-acwa-power-statement-441761' },
  { id: 'AE1', m: 'AE', title: 'Clean nuclear power', tags: ['energy'], fact: 'The UAE’s Barakah nuclear plant supplies about a quarter of the country’s electricity.', srcName: 'World Nuclear Association: UAE', src: 'https://world-nuclear.org/information-library/country-profiles/countries-t-z/united-arab-emirates' },
  { id: 'AE2', m: 'AE', title: 'Humanitarian logistics hub', tags: ['health', 'food'], qt: { 3: ['trade', 'food'] }, fact: 'Dubai Humanitarian, formerly International Humanitarian City, describes itself as the world’s largest humanitarian hub, with about 80 UN, NGO and other members.', srcName: 'Dubai Humanitarian', src: 'https://dubaihumanitarian.ae/about/' },
  { id: 'ID1', m: 'ID', title: 'Tsunami early warning', tags: ['warn'], fact: 'Indonesia’s InaTEWS, launched in 2008, can issue a tsunami warning about 5 minutes after a strong earthquake.', srcName: 'ReliefWeb / Govt of Indonesia', src: 'https://reliefweb.int/report/indonesia/indonesia-tsunami-early-warning-system-launched' },
  { id: 'ID2', m: 'ID', title: 'Geothermal power', tags: ['energy'], fact: 'Indonesia has the world’s second-largest geothermal power capacity, about 2,744 MW.', srcName: 'Antara', src: 'https://en.antaranews.com/news/380545/indonesia-ranks-second-globally-in-geothermal-energy-capacity' },
  // Quarters 2–4: new strengths. qt on a Q1 card above re-tags it for a later quarter (the fact stays the same).
  { id: 'BRd', m: 'BR', title: 'Pix instant payments', tags: ['digital'], fact: 'Brazil’s central bank launched Pix, a free instant-payment system, in November 2020. By 2025 it had more than 170 million users.', srcName: 'Banco Central do Brasil: Pix', src: 'https://www.bcb.gov.br/en/financialstability/pix_en', verify: true },
  { id: 'RUd', m: 'RU', title: 'GLONASS satellite navigation', tags: ['digital', 'warn'], fact: 'Russia runs GLONASS, one of the world’s four global satellite navigation systems, with full global coverage since 2011.', srcName: 'GLONASS information centre', src: 'https://www.glonass-iac.ru/en/about_glonass/', verify: true },
  { id: 'INd', m: 'IN', title: 'UPI and digital public infrastructure', tags: ['digital'], fact: 'India’s UPI lets anyone send money instantly from a phone. In 2025 it handled more than 20 billion payments in a single month.', srcName: 'NPCI UPI statistics', src: 'https://www.npci.org.in/what-we-do/upi/product-statistics', verify: true },
  { id: 'CNs', m: 'CN', title: 'Patents and research labs', tags: ['skills', 'digital'], fact: 'China receives more patent applications than any other country: about 1.6 million in 2023.', srcName: 'WIPO IP statistics', src: 'https://www.wipo.int/ipstats/en/', verify: true },
  { id: 'ZAs', m: 'ZA', title: 'Radio astronomy (MeerKAT)', tags: ['skills', 'digital'], fact: 'South Africa’s MeerKAT, 64 radio dishes in the Karoo, is a precursor of the Square Kilometre Array telescope, which South Africa co-hosts with Australia.', srcName: 'SARAO: MeerKAT', src: 'https://www.sarao.ac.za/science/meerkat/about-meerkat/' },
  { id: 'EGs', m: 'EG', title: 'Egyptian Knowledge Bank', tags: ['skills'], fact: 'The Egyptian Knowledge Bank, launched in 2016, gives everyone in Egypt free online access to research journals and learning resources.', srcName: 'Wikipedia (secondary; official site ekb.eg)', src: 'https://en.wikipedia.org/wiki/Egyptian_Knowledge_Bank', verify: true },
  { id: 'IRs', m: 'IR', title: 'Fertility and stem-cell research', tags: ['health', 'skills'], fact: 'Iran’s Royan Institute, founded in 1991, is known for research on fertility treatment and stem cells.', srcName: 'Royan Institute', src: 'https://royan.org/', verify: true },
  { id: 'AEs', m: 'AE', title: 'Hope Mars mission', tags: ['skills', 'digital'], fact: 'The UAE’s Hope probe reached orbit around Mars in February 2021, the first interplanetary mission by an Arab country.', srcName: 'Wikipedia: Emirates Mars Mission (secondary)', src: 'https://en.wikipedia.org/wiki/Emirates_Mars_Mission', verify: true },
  { id: 'IDd', m: 'ID', title: 'QRIS: one QR code for all', tags: ['digital'], fact: 'Indonesia’s QRIS, launched by Bank Indonesia in 2019, lets any shop accept payments from any app through one standard QR code.', srcName: 'Bank Indonesia: QRIS', src: 'https://www.bi.go.id/QRIS/default.aspx', verify: true },
  { id: 'SAs', m: 'SA', title: 'Research university (KAUST)', tags: ['skills', 'water'], fact: 'King Abdullah University of Science and Technology (KAUST), opened in 2009, researches desalination, solar energy and Red Sea science.', srcName: 'KAUST', src: 'https://www.kaust.edu.sa/en/about' },
  { id: 'INt', m: 'IN', title: 'ITEC training partnerships', tags: ['skills'], fact: 'Since 1964 India’s ITEC programme has trained more than 200,000 officials and professionals from about 160 partner countries.', srcName: 'ITEC, Ministry of External Affairs', src: 'https://www.itecgoi.in/', verify: true },
  { id: 'ZAt', m: 'ZA', title: 'Port of Durban', tags: ['trade', 'infra'], fact: 'Durban is one of Africa’s busiest container ports and a gateway for southern Africa’s trade.', srcName: 'Wikipedia: Port of Durban (secondary; Transnet)', src: 'https://en.wikipedia.org/wiki/Port_of_Durban', verify: true },
  { id: 'IRt', m: 'IR', title: 'North–South Transport Corridor', tags: ['trade', 'infra'], fact: 'In 2000 Iran, India and Russia agreed to build the International North–South Transport Corridor, a ship, rail and road route linking the Indian Ocean to Russia.', srcName: 'Wikipedia: INSTC (secondary)', src: 'https://en.wikipedia.org/wiki/International_North%E2%80%93South_Transport_Corridor', verify: true },
  { id: 'IDt', m: 'ID', title: 'Regional trade hub (ASEAN)', tags: ['trade', 'skills'], fact: 'Indonesia is a founding member of ASEAN (1967), and Jakarta hosts the ASEAN Secretariat.', srcName: 'ASEAN', src: 'https://asean.org/about-us/' },
  { id: 'INe', m: 'IN', title: 'International Solar Alliance', tags: ['energy', 'skills'], fact: 'India and France launched the International Solar Alliance in 2015. It is based in Gurugram and has more than 100 signatory countries.', srcName: 'International Solar Alliance', src: 'https://isa.int/', verify: true },
  { id: 'BRn', m: 'BR', title: 'Satellite forest monitoring', tags: ['nature', 'warn'], fact: 'Brazil’s space research institute INPE has measured Amazon deforestation by satellite every year since 1988 (the PRODES project).', srcName: 'Wikipedia: PRODES (secondary; INPE)', src: 'https://en.wikipedia.org/wiki/PRODES', verify: true },
  { id: 'RUn', m: 'RU', title: 'The world’s largest forests', tags: ['nature'], fact: 'Russia has the largest forest area of any country, about a fifth of all the world’s forests.', srcName: 'FAO Global Forest Resources Assessment', src: 'https://www.fao.org/forest-resources-assessment/en/' },
  { id: 'CNe', m: 'CN', title: 'Electric city buses', tags: ['energy', 'infra'], fact: 'In 2017 Shenzhen became the first big city to run its whole public bus fleet, more than 16,000 buses, on electricity.', srcName: 'Wikipedia: Shenzhen Bus Group (secondary)', src: 'https://en.wikipedia.org/wiki/Shenzhen_Bus_Group', verify: true },
  { id: 'ZAe', m: 'ZA', title: 'Renewable energy auctions', tags: ['energy'], fact: 'Since 2011 South Africa’s renewable energy auction programme (REIPPPP) has brought privately built wind and solar plants onto the grid.', srcName: 'IPP Office, South Africa', src: 'https://www.ipp-projects.co.za/', verify: true },
];

// One impersonal hazard per member (Quarter 1: Resilience). needs: tag -> points.
const CHALLENGES = [
  { id: 'c-ET', m: 'ET', e: '☀️', title: 'Long drought', needs: { water: 2, food: 2, health: 1 },
    fact: 'From late 2020 to 2022 the Horn of Africa, including Ethiopia, had five failed rainy seasons in a row.', srcName: 'WMO', src: 'https://wmo.int/media/news/greater-horn-of-africa-faces-5th-failed-rainy-season',
    quiz: { q: 'How many rainy seasons in a row failed in the Horn of Africa drought?', a: ['2', '3', '5'], c: 2, why: 'Five seasons failed, from late 2020 to 2022. That is why water and food help were needed together.' } },
  { id: 'c-IN', m: 'IN', e: '🌀', title: 'Cyclone season', needs: { warn: 2, infra: 2, health: 1 },
    fact: 'Cyclone Phailin (2013) affected about 13.2 million people in Odisha. Early warning and shelters kept the death toll to 44.', srcName: 'Govt of Odisha, ADB and World Bank damage assessment (Dec 2013)', src: 'https://documents1.worldbank.org/curated/en/168471468257979992/pdf/838860WP0P14880Box0382116B00PUBLIC0.pdf',
    india: 'Odisha’s “zero casualty” approach is now a model that India shares with others.',
    quiz: { q: 'Before Cyclone Phailin, about how many people did Odisha move to safety?', a: ['10,000', '100,000', 'About 1 million'], c: 2, why: 'About 1 million people were moved in roughly 36 hours, one of the largest evacuations ever.' } },
  { id: 'c-ID', m: 'ID', e: '🌧️', title: 'City floods', needs: { infra: 2, warn: 1, health: 1, water: 1 },
    fact: 'On 1 January 2020, 377 mm of rain fell in a single day at a Jakarta station, the highest since records began in 1866.', srcName: 'BNPB (Indonesia disaster agency)', src: 'https://www.bnpb.go.id/infografis/infografis-banjir-jakarta-januari-2020',
    quiz: { q: 'How much rain fell in one day in Jakarta on 1 January 2020?', a: ['37 mm', '177 mm', '377 mm'], c: 2, why: '377 mm in one day. That is like a whole month’s rain in many places, all at once.' } },
  { id: 'c-ZA', m: 'ZA', e: '🚰', title: 'Water scarcity', needs: { water: 2, infra: 2, energy: 1 },
    fact: 'In 2018 Cape Town limited each person to 50 litres of water a day to avoid “Day Zero”, when taps would be turned off.', srcName: 'Princeton ISS case study', src: 'https://successfulsocieties.princeton.edu/publications/keeping-taps-running-how-cape-town-averted-day-zero-2017-2018',
    quiz: { q: 'In 2018, Cape Town asked each person to use at most how much water a day?', a: ['50 litres', '150 litres', '500 litres'], c: 0, why: '50 litres, about one short shower. People saved water together and Day Zero never came.' } },
  { id: 'c-BR', m: 'BR', e: '🦟', title: 'Dengue alert', needs: { health: 2, warn: 1, water: 1, infra: 1 },
    fact: '2024 was a record year for dengue in the Americas, and Brazil reported the most cases.', srcName: 'PAHO', src: 'https://www.paho.org/en/topics/dengue', verify: true,
    quiz: { q: 'Dengue spreads through mosquitoes that breed in…', a: ['standing water', 'dry sand', 'cold snow'], c: 0, why: 'Standing water in pots, tyres and coolers. Emptying it once a week helps everyone.' } },
  { id: 'c-IR', m: 'IR', e: '🌡️', title: 'Heat and water stress', needs: { water: 2, energy: 2, health: 1 },
    fact: 'Iran is among the countries with “extremely high” baseline water stress in WRI’s Aqueduct atlas.', srcName: 'World Resources Institute', src: 'https://www.wri.org/insights/highest-water-stressed-countries', verify: true,
    quiz: { q: 'Iran’s ancient underground water channels are called…', a: ['qanats', 'canals', 'stepwells'], c: 0, why: 'Qanats carry water by gravity. India’s stepwells are another clever old way to store water.' } },
  { id: 'c-RU', m: 'RU', e: '🔥', title: 'Forest-fire season', needs: { warn: 2, infra: 1, health: 1, water: 1 },
    fact: 'Forest-fire preparedness was one of the cooperation outcomes of India’s 2026 BRICS chairship.', srcName: 'MEA factsheet on 2026 outcomes', src: 'https://ipbc.infobrics.org/files/country/russia/documents/2026/BRICS_India_2026_Factsheet_on_Outcomes_and_Initiatives_under_Indias_Chairship.pdf', verify: true,
    quiz: { q: 'What helps most in the first hours of a forest fire?', a: ['Early detection and warning', 'Waiting for rain', 'Cutting more trees'], c: 0, why: 'Early detection: small fires are much easier to stop.' } },
  { id: 'c-AE', m: 'AE', e: '🚢', title: 'Food-import disruption', needs: { food: 2, infra: 2, energy: 1 },
    fact: 'The UAE imports about 90% of its food. Its National Food Security Strategy 2051 aims to diversify supply and grow more locally.', srcName: 'UAE Government portal', src: 'https://u.ae/en/about-the-uae/strategies-initiatives-and-awards/strategies-plans-and-visions/environment-and-energy/national-food-security-strategy-2051',
    quiz: { q: 'About how much of its food does the UAE import?', a: ['10%', '50%', '90%'], c: 2, why: 'About 90%, so smooth shipping and storage matter a lot.' } },
  { id: 'c-CN', m: 'CN', e: '🌊', title: 'River floods', needs: { infra: 2, warn: 1, food: 1, health: 1 },
    fact: 'In summer 2020, long monsoon rains caused severe floods across the Yangtze basin.', srcName: 'WMO State of the Climate in Asia 2020', src: 'https://library.wmo.int/records/item/57964-state-of-the-climate-in-asia-2020', verify: true,
    quiz: { q: 'The Yangtze is the longest river in which continent?', a: ['Asia', 'Africa', 'Europe'], c: 0, why: 'Asia. Hundreds of millions of people live in its basin.' } },
  { id: 'c-SA', m: 'SA', e: '⛈️', title: 'Desert flash floods', needs: { infra: 2, warn: 2, health: 1 },
    fact: 'In November 2009 sudden heavy rain caused deadly flash floods in Jeddah.', srcName: 'Wikipedia (secondary; replace with a primary source)', src: 'https://en.wikipedia.org/wiki/2009_Jeddah_floods', verify: true,
    quiz: { q: 'Why can flash floods be so dangerous in desert cities?', a: ['Hard, dry ground cannot soak up water fast', 'Deserts never get rain', 'Sand makes water disappear'], c: 0, why: 'Dry, hard ground and few drains send water rushing through streets very quickly.' } },
  { id: 'c-EG', m: 'EG', e: '🏝️', title: 'Delta and sea level', needs: { water: 2, food: 1, infra: 2 },
    fact: 'Egypt’s low-lying Nile Delta, home to much of its farmland, faces sea-level rise and salt water seeping into soils. A Green Climate Fund project supports coastal adaptation.', srcName: 'Green Climate Fund FP053', src: 'https://www.greenclimate.fund/project/fp053', verify: true,
    quiz: { q: 'What threatens low-lying delta farmland most?', a: ['Sea-level rise and salt water', 'Too many trees', 'Snowfall'], c: 0, why: 'Rising seas push salt water into the soil, which makes it harder to grow food.' } },
  // Quarters 2–4: 20 challenges. Across Q2–Q4 every confirmed member hosts exactly two (plus one in Q1). q = quarter.

  { id: 'c2-IN', q: 2, m: 'IN', e: '🗣️', title: 'Many languages online', needs: { digital: 2, skills: 2, health: 1 },
    fact: 'India’s Constitution lists 22 languages in its Eighth Schedule. The Bhashini mission builds AI translation so people can use digital services in their own language.', srcName: 'Bhashini (MeitY)', src: 'https://bhashini.gov.in/',

    quiz: { q: 'How many languages are listed in the Eighth Schedule of India’s Constitution?', a: ['8', '22', '100'], c: 1, why: '22. Digital tools that work in every language help everyone go online.' } },
  { id: 'c2-BR', q: 2, m: 'BR', e: '🏥', title: 'Health records for 200 million', needs: { digital: 2, health: 2, skills: 1 },

    quiz: { q: 'How does a shared digital health record help?', a: ['Doctors can see past tests and medicines', 'Hospitals get bigger', 'Nobody needs a doctor'], c: 0, why: 'Doctors see your history quickly, so care is safer and nothing is repeated.' } },
  { id: 'c2-RU', q: 2, m: 'RU', e: '❄️', title: 'Remote towns far from hospitals', needs: { health: 2, digital: 2, energy: 1 },

  { id: 'c2-ZA', q: 2, m: 'ZA', e: '🎓', title: 'Skills for a first job', needs: { skills: 2, digital: 2, energy: 1 },

    quiz: { q: 'What helps a young person most to get a first job?', a: ['Skills, training and a first chance', 'Waiting at home', 'Luck only'], c: 0, why: 'Skills plus a first chance, such as an apprenticeship or internship.' } },
  { id: 'c2-ET', q: 2, m: 'ET', e: '📱', title: 'Mobile money for farmers', needs: { digital: 2, food: 2, skills: 1 },

    quiz: { q: 'Why does mobile money help farmers who live far from banks?', a: ['They can be paid and save by phone', 'Phones make crops grow', 'It brings rain'], c: 0, why: 'A phone becomes a bank account, so a farmer does not travel for hours to be paid.' } },
  { id: 'c2-IR', q: 2, m: 'IR', e: '🌫️', title: 'Air-quality alerts', needs: { digital: 1, health: 2, warn: 2 },
    fact: 'Tehran sits in a mountain basin where winter air pollution has closed schools on some days.', srcName: 'Wikipedia: Air pollution in Iran (secondary)', src: 'https://en.wikipedia.org/wiki/Air_pollution_in_Iran', verify: true,
    quiz: { q: 'What helps people protect themselves on bad-air days?', a: ['Live air-quality alerts', 'Louder car horns', 'More dust'], c: 0, why: 'Live alerts tell people when to stay indoors or wear a mask.' } },
  { id: 'c2-ID', q: 2, m: 'ID', e: '🏝️', title: '17,000 islands to connect', needs: { digital: 2, skills: 1, health: 1, warn: 1 },
    fact: 'Indonesia has more than 17,000 islands. Its Palapa Ring fibre-optic network, completed in 2019, links all its provinces.', srcName: 'Wikipedia: Indonesia (secondary)', src: 'https://en.wikipedia.org/wiki/Indonesia', verify: true,
    quiz: { q: 'About how many islands does Indonesia have?', a: ['170', '1,700', 'More than 17,000'], c: 2, why: 'More than 17,000, so connecting them all is a huge task.' } },

/* ---------- the map: Natural Earth coastlines, no borders (UX_DIRECTION §5.3) ---------- */
const GEO = { BR: [-51, -10], RU: [90, 61], IN: [78, 21.5], CN: [104, 33], ZA: [25, -29], EG: [30, 26.5], ET: [39.5, 9], IR: [53, 32.5], SA: [45, 24], AE: [54.4, 24], ID: [113, -2] };
const OFF = { ZA: [8, -36], EG: [-62, -38], SA: [-36, 10], ET: [-6, 48], AE: [28, 56], IR: [22, -42], IN: [26, -6] };
const proj = ([lon, lat]) => [(lon - LAND.lon0) / (LAND.lon1 - LAND.lon0) * LAND.w, (LAND.lat1 - lat) / (LAND.lat1 - LAND.lat0) * LAND.h];
const NODE = {}; Object.keys(GEO).forEach(id => { const a = proj(GEO[id]), o = OFF[id] || [0, 0]; NODE[id] = { a, n: [a[0] + o[0], a[1] + o[1]] }; });
function arcCtl(a, b) { const [x1, y1] = NODE[a].n, [x2, y2] = NODE[b].n, d = Math.hypot(x2 - x1, y2 - y1); return [x1, y1, (x1 + x2) / 2, (y1 + y2) / 2 - Math.max(40, d * 0.32), x2, y2]; }
const f1 = n => n.toFixed(1);
function arcPath(a, b) { const [x1, y1, cx, cy, x2, y2] = arcCtl(a, b); return `M${f1(x1)},${f1(y1)} Q${f1(cx)},${f1(cy)} ${f1(x2)},${f1(y2)}`; }
function arcMid(a, b) { const [x1, y1, cx, cy, x2, y2] = arcCtl(a, b); return [.25 * x1 + .5 * cx + .25 * x2, .25 * y1 + .5 * cy + .25 * y2]; }
const pct = ([x, y]) => `left:${f1(x / LAND.w * 100)}%;top:${f1(y / LAND.h * 100)}%`;
const centroid = ids => { const p = ids.map(id => NODE[id].n); return [p.reduce((a, q) => a + q[0], 0) / p.length, p.reduce((a, q) => a + q[1], 0) / p.length]; };
/* o: { arcs:[{from,to,cls,delay}], hit, hz, lit:Set, joint:[ids], coins:[{from,to}], marks:[{m,e,name,fresh}], cap, label } */
function mapHTML(o = {}) {
  const arcs = o.arcs || [], lit = o.lit || new Set(), R = rm();
  let g = ''; for (let lat = -30; lat <= 75; lat += 15) { const y = f1(proj([0, lat])[1]); g += `<line class="grat" x1="0" x2="${LAND.w}" y1="${y}" y2="${y}"/>`; }
  for (let lon = -90; lon <= 150; lon += 30) { const x = f1(proj([lon, 0])[0]); g += `<line class="grat" y1="0" y2="${LAND.h}" x1="${x}" x2="${x}"/>`; }
  const lead = Object.keys(OFF).map(id => `<line class="lead" x1="${f1(NODE[id].a[0])}" y1="${f1(NODE[id].a[1])}" x2="${f1(NODE[id].n[0])}" y2="${f1(NODE[id].n[1])}"/><circle class="anchor" r="3.5" cx="${f1(NODE[id].a[0])}" cy="${f1(NODE[id].a[1])}"/>`).join('');
  const arcSvg = arcs.map(r => `<path class="arc ${r.cls || ''}" data-arc="${r.from}-${r.to}" d="${arcPath(r.from, r.to)}" style="animation-delay:${R ? 0 : (r.delay || 0)}ms"/>`).join('');
  // Q2 joint research: a ring through the badges of the members who lend strengths
  let ring = '', jc = '';
  if (o.joint && o.joint.length >= 3) { const [cx, cy] = centroid(o.joint), pts = o.joint.map(id => NODE[id].n).sort((p, q) => Math.atan2(p[1] - cy, p[0] - cx) - Math.atan2(q[1] - cy, q[0] - cx));
    ring = `<path class="jring" d="M${pts.map(p => f1(p[0]) + ',' + f1(p[1])).join(' L')} Z"/>`; jc = `<span class="jbadge" style="${pct([cx, cy])}" aria-hidden="true">${E('🔬')}</span>`; }
  // Q3 co-financing: coins travel along each co-financing bridge
  const coins = (o.coins || []).map((c, i) => { const [mx, my] = arcMid(c.from, c.to);
    return R ? `<g class="coin" transform="translate(${f1(mx)},${f1(my)})"><circle r="10"/><text y="4.5" text-anchor="middle">◆</text></g>`
      : `<g class="coin"><circle r="10"/><text y="4.5" text-anchor="middle">◆</text><animateMotion dur="1.8s" begin="${(0.3 + i * 0.35).toFixed(2)}s" repeatCount="indefinite" path="${arcPath(c.from, c.to)}"/></g>`; }).join('');
  const nodes = D.MEMBERS.map(m => { const gst = guest(m.id), hit = o.hit === m.id;
    return `<span class="node ${gst ? 'guest' : ''} ${hit ? 'hit' : ''} ${lit.has(m.id) ? 'lit' : ''}" data-node="${m.id}" data-act="member" data-id="${m.id}" style="${pct(NODE[m.id].n)};--c:${col(m.id)}">${m.id}${hit && o.hz ? `<span class="hz">${E(o.hz)}</span>` : ''}</span>`; }).join('');
  // Q4 lasting assets: adopted projects stay on the map as landmarks
  const marks = (o.marks || []).map((k, i) => { const [x, y] = NODE[k.m].n; return `<span class="mark ${k.fresh ? 'fresh' : ''}" style="${pct([x + 24 + (i % 2) * 8, y - 28 - Math.floor(i / 2) * 12])}" aria-hidden="true">${E(k.e)}</span>`; }).join('');
  const n = new Set(arcs.filter(a => !/ghost/.test(a.cls || '')).map(a => a.from + a.to)).size;
  const label = o.label || T('v2.mapAria', { n: nf(n) }) + ((o.marks || []).filter(k => k.name).length ? ' ' + o.marks.filter(k => k.name).map(k => T('v2.landmark', { p: k.name })).join('. ') + '.' : '');
  return `<div class="map" dir="ltr" role="img" aria-label="${esc(label)}">
    <svg viewBox="0 0 ${LAND.w} ${LAND.h}" aria-hidden="true" preserveAspectRatio="xMidYMid slice">${g}<path class="land" d="${LAND.d}"/>${lead}${ring}${arcSvg}${coins}</svg>${nodes}${jc}${marks}
    <span class="map-cap" aria-hidden="true">${esc(o.cap || T('v2.mapCap'))}</span></div>`;
}

/* ---------- GAME FLOW ---------- */
function begin(fresh) {
  const st = store.get(), resume = !fresh && !!curSave(st);
  let quarter = +st.quarter || 1; if (!playable(quarter, st)) quarter = 1;
  const go = () => {
    if (WB) { WB.setProfile(resume ? st.save.level : st.level); if (!WB.start()) return; }
    if (!resume) { const seed = Q.get('seed') ? +Q.get('seed') : undefined; S = L.newGame(st.level, seed, quarter); S.v2 = { intro: false, before: null }; store.set({ plays: (st.plays || 0) + 1 }); }
    else { S = curSave(st); S.v2 = S.v2 || { intro: true, before: null }; }
    markPlayed(); save(); route();
    if (S.phase === 'brief' || S.phase === 'help') announce(T('v2.annBoard', { q: QD(S.quarter).name, n: S.turn + 1, t: S.turns, m: M(L.cur(S).m).name }));
  };
  if (WB) WB.showFollowUp(go); else go();
}
function route() {
  if (S.phase === 'end') return done();
  if (S.phase === 'result') return celebrate(false);
  const ph = S.phase; board();
  if (ph === 'fund') projectSheet();
  else if (ph === 'consensus') council(true);
}

    case 'members': membersSheet(); return;
    case 'how': howSheet(); return;
    case 'about': aboutSheet(); return;
    case 'passport': passportSheet(); return;
    case 'year': year(); return;

    case 'new': begin(true); return;
    case 'continue': begin(false); return;
    case 'skip-tips': endCoach(); return;
    case 'intro-ok': S.v2.intro = true; save(); closeSheet(); return;
    case 'pick': if (coach >= 0 && coach < 2) { hideCoach(); } pickCard(id, el); return;
    case 'redraw': if (L.redraw(S) !== false) { sfx.tap(); save(); board(); const r = $('[data-act="redraw"]'); if (r) r.focus(); announce(T('v2.pickHint')); } return;
    case 'to-project': if (coach >= 0 && coach < 9) endCoach(); projectSheet(); return;

      const ab = $('[data-act="ask"]'); if (ab) ab.innerHTML = E('🗳️') + ' ' + esc(S.project ? T('v2.ask') : T('v2.seeResult')); } return;
    case 'ask': if (S.project) council(false); else propose(); return;
    case 'skip-vote': if (voteSkip) voteSkip(); return;
    case 'consult': L.setConsult(S, id); sfx.tap(); buzz('light'); save(); council(true); return;
    case 'change': S.phase = 'help'; save(); board(); projectSheet(); return;
    case 'propose': voteTimer.forEach(clearTimeout); propose(); return;
    case 'quiz': if (S.quizAns == null) { S.quizAns = +el.dataset.i; const ok = S.quizAns === L.cur(S).quiz.c; ok ? sfx.fill() : sfx.tap(); save();
      const y = scrollY; celebrate(false); window.scrollTo(0, y); const w = $('.quiz .why'); if (w) announce(w.textContent); const q = $('.quiz h3'); if (q) { q.setAttribute('tabindex', '-1'); q.focus({ preventScroll: true }); } } return;

}

  const ext = e.target.closest('a[target="_blank"]'); if (ext && H && H.openExternal) { e.preventDefault(); H.openExternal(ext.href); return; }
  if ($('.pop') && !e.target.closest('.pop') && !e.target.closest('[data-act="settings"]')) closePop();
  const el = e.target.closest('[data-act]'); if (!el || el.disabled || el.tagName === 'A') return; e.preventDefault(); act(el.dataset.act, el);
});
if (H && H.onBack) H.onBack(() => { if ($('.pop')) { closePop(); return true; } if (view === 'home') return false; act('home'); return true; });
addEventListener('hrs-lang-change', () => { let own = null; try { own = localStorage.getItem(I.KEY); } catch (e) {} const l = own || I.detect(); if (l !== I.lang()) loadLang(l).then(() => { applyLang(l); if (WB && WB.langChanged) WB.langChanged(); rerender(); }); });
if (osRM.addEventListener) osRM.addEventListener('change', applyMotion);
addEventListener('resize', () => { if (coach >= 0 && coach < 3) hideCoach(); });

/* ---------- boot ---------- */
(async function boot() {
  applyMotion();
  const l = Q.get('lang') ? Q.get('lang') : I.detect(); await loadLang(l);
  applyLang(Q.get('lang') ? I.set(l) : l);
  if (WB) WB.init({ gameId: 'brics-bridges', profile: store.get().level, langs: I.CODES, getLang: () => I.lang(), onExit: () => { if (H && H.home) H.home(); else { if (S) save(); S = null; home(); } } });
  home(); booted = true;
  if (Q.get('continue') === '1' && curSave(store.get())) begin(false);
  if (CFG.sw && 'serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register(CFG.sw).catch(() => {});
  document.documentElement.dataset.ready = '1';
})();
window.BB = { get state() { return S; }, get view() { return view; }, act, store, i18n: I, setLanguage, qState, home, year, route, L, D, VERSION,
  auto: { pick() { const n = L.needs(S); const id = S.hand.find(h => !S.picked.includes(h) && L.relevant(S, L.card(h))) || S.hand.find(h => !S.picked.includes(h)); return id; },
          project() { return S.options.find(p => L.netCost(S, p) <= S.budget) || null; } } };
})();
