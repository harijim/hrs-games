<style>
:root{--saf:#FF9933;--saf2:#ffe7cc;--grn:#138808;--grn2:#dff3dc;--navy:#0b1f66;--ink:#1a2238;--mut:#6b7590;--bg:#fbfaf6;--card:#fff;--line:#ece8de;--bad:#d64531;--warn:#e0931b;--r:20px;--sh:0 6px 24px rgba(20,30,70,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
html{font-size:17px;-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari","Noto Sans Gurmukhi","Nirmala UI",Mangal,Raavi,sans-serif;background:var(--bg);color:var(--ink);font-size:1rem;line-height:1.4;min-height:100vh;overscroll-behavior-y:none}
button,.tile,.pcard,[role=button],summary,a{touch-action:manipulation}
.press{transform:scale(.96)!important;filter:brightness(.96)}
.choice.press{transform:scale(.985)!important}
button{font:inherit;color:inherit;cursor:pointer}
.stripe{height:5px;background:linear-gradient(90deg,var(--saf) 0 33.3%,#fff 33.3% 66.6%,var(--grn) 66.6%)}
/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:30;padding-top:env(safe-area-inset-top);background:rgba(251,250,246,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.bar{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:8px max(14px,env(safe-area-inset-right)) 8px max(14px,env(safe-area-inset-left))}
.brand{font-weight:800;color:var(--navy);font-size:1.05rem;letter-spacing:.2px;white-space:nowrap}
.brand b{color:var(--saf)}
.year{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.05rem;background:var(--navy);color:#fff;border-radius:999px;padding:3px 12px}
.icons{margin-left:auto;display:flex;gap:6px}
.ib{width:48px;height:48px;border-radius:14px;border:0;background:#fff;box-shadow:var(--sh);font-size:1.15rem;display:grid;place-items:center;transition:transform .15s}
.ib:active{transform:scale(.9)}
/* ---------- skyline + journey ---------- */
.hero{max-width:760px;margin:0 auto;padding:0 max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left))}
.sky{position:relative;height:96px;border-radius:var(--r);overflow:hidden;background:linear-gradient(180deg,#fff3e3 0%,#fffaf2 55%,#f2f8ef 100%);box-shadow:var(--sh);transition:background 1s}
.sky.dark{background:linear-gradient(180deg,#2b3157,#46507e)}
.sun{position:absolute;top:10px;right:18px;font-size:1.4rem;transition:transform 1s}
.city{position:absolute;left:0;right:0;bottom:0;height:100%;display:flex;align-items:flex-end;gap:3px;padding:0 10px}
.bld{flex:1;border-radius:4px 4px 0 0;background-color:var(--c);height:8%;transition:height 1.4s cubic-bezier(.3,1.4,.5,1);
 background-image:repeating-linear-gradient(90deg,var(--c) 0 3px,transparent 3px 7px),repeating-linear-gradient(180deg,var(--c) 0 6px,var(--lit) 6px 9px);background-position:2px 4px;opacity:.95}
.sky{--lit:#ffd36b}.sky.dark{--lit:#545b7a}
.tree{flex:.6;font-size:.8rem;line-height:1;text-align:center;align-self:flex-end;transition:opacity 1s}
.road{position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--saf),#fff,var(--grn))}
.journey{position:relative;height:30px;margin:6px 6px 0}
.track{position:absolute;left:0;right:0;top:14px;height:4px;border-radius:2px;background:var(--line)}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:linear-gradient(90deg,var(--saf),var(--grn));transition:width 1.2s}
.node{position:absolute;top:10px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#fff;border:2px solid var(--line);transition:all .4s}
.node.done{background:var(--grn);border-color:var(--grn)}
.node.last{border-color:var(--saf);width:16px;height:16px;margin-left:-8px;top:8px}
.rider{position:absolute;top:-4px;font-size:1.45rem;margin-left:-14px;transition:left 1.2s cubic-bezier(.5,0,.3,1);filter:drop-shadow(0 2px 2px rgba(0,0,0,.15))}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 4px}
.stat{border:0;background:#fff;border-radius:16px;padding:7px 4px;box-shadow:var(--sh);text-align:center;transition:transform .2s}
.stat .v{font-weight:800;font-size:1.02rem;color:var(--navy);font-variant-numeric:tabular-nums;white-space:nowrap}
.stat{min-height:52px}.stat .l{font-size:.74rem;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.bad .v{color:var(--bad)}
.stat.up{animation:glowG 1.3s}.stat.down{animation:glowR 1.3s}
@keyframes glowG{30%{transform:scale(1.08);box-shadow:0 0 0 3px rgba(19,136,8,.45)}}
@keyframes glowR{30%{transform:scale(1.08);box-shadow:0 0 0 3px rgba(214,69,49,.45)}}
.steps{display:flex;justify-content:center;gap:6px;margin:8px 0 2px;font-size:.78rem;color:var(--mut)}
.steps span{padding:3px 10px;border-radius:999px;transition:all .3s}
.steps span.on{background:var(--navy);color:#fff;font-weight:700}
.steps span.done{color:var(--grn)}
.steps.hide{visibility:hidden}
/* ---------- screens ---------- */
main{max-width:760px;margin:0 auto;padding:6px max(14px,env(safe-area-inset-right)) calc(130px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));overflow-x:clip}
.scr{display:none}
.scr.on{display:block;animation:enter .45s cubic-bezier(.2,.9,.3,1)}
@keyframes enter{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
h1,h2,h3{margin:0;color:var(--navy)}
.card{background:var(--card);border-radius:24px;box-shadow:var(--sh);padding:22px 20px}
.center{text-align:center}
.mut{color:var(--mut);font-size:.85rem}
.big-em{font-size:4rem;line-height:1;display:inline-block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-4deg)}}
.cta{display:block;width:100%;border:0;border-radius:18px;padding:17px;font-size:1.12rem;font-weight:800;color:#fff;background:linear-gradient(90deg,var(--saf),#f57c00);box-shadow:0 8px 20px rgba(255,153,51,.35);transition:transform .12s,filter .2s}
.cta:active{transform:scale(.97)}@media (hover:hover){.cta:hover{filter:brightness(1.05)}}.cta{min-height:56px}
.cta.navy{background:linear-gradient(90deg,var(--navy),#2a3f99);box-shadow:0 8px 20px rgba(11,31,102,.3)}
.ghost{min-height:48px;border:0;background:#fff;border-radius:14px;padding:12px 16px;font-weight:700;color:var(--navy);box-shadow:var(--sh)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:12px max(14px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));background:linear-gradient(180deg,rgba(251,250,246,0),var(--bg) 35%)}
.dock>div{max-width:760px;margin:0 auto}
/* intro */
.intro{padding-top:20px}
.intro h1{font-size:2.1rem;line-height:1.1;margin:12px 0 6px}
.intro h1 b{color:var(--saf)}
.loop{display:flex;justify-content:center;gap:10px;margin:22px 0;flex-wrap:wrap}
.loop div{background:#fff;border-radius:18px;box-shadow:var(--sh);padding:12px 14px;min-width:88px;font-size:.85rem;color:var(--mut)}
.loop div b{display:block;font-size:1.7rem}
/* event */
.ev{position:relative;overflow:hidden}
.ev.fly{animation:fly .4s ease-in forwards}
@keyframes fly{to{transform:translateX(110%) rotate(12deg);opacity:0}}
.ev .tag{display:inline-block;background:var(--saf2);color:#a85a00;border-radius:999px;padding:3px 12px;font-size:.78rem;font-weight:700;letter-spacing:.3px}
.ev h2{font-size:1.6rem;margin:10px 0 6px;line-height:1.15}
.ev p{margin:0 0 6px;color:#46506a;font-size:.98rem}
.choice{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:18px;padding:14px 16px;margin:10px 0 0;transition:transform .15s,border-color .15s,box-shadow .15s;min-height:64px;position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none}
@media (hover:hover){.choice:hover{border-color:var(--saf);box-shadow:0 6px 18px rgba(255,153,51,.18);transform:translateY(-2px)}}
.choice:active{transform:scale(.98)}
.choice .k{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;font-size:.8rem;font-weight:800;margin-right:8px;vertical-align:1px}
.choice b{font-size:1.02rem;color:var(--navy)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{font-size:.74rem;background:#f4f2ec;border-radius:999px;padding:3px 9px;color:#4b5571}
.choice.picked{border-color:var(--grn);background:var(--grn2)}
/* plan */
.wallet{position:sticky;top:var(--topH,64px);z-index:20;background:#fff;border-radius:20px;box-shadow:var(--sh);padding:10px 14px;display:flex;align-items:center;gap:10px;margin-bottom:12px}
.wallet .left{font-weight:900;font-size:1.6rem;color:var(--navy);font-variant-numeric:tabular-nums;min-width:1.5em;text-align:center}
.wallet .left.zero{color:var(--grn)}
.wallet .lab{font-size:.75rem;color:var(--mut);line-height:1.15}
.coins{flex:1;display:flex;flex-wrap:wrap;gap:2px;min-height:20px;align-content:center}
.coin{width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe08a,#f5a623 60%,#c97d00);box-shadow:0 1px 1px rgba(0,0,0,.2);animation:cin .3s}
@keyframes cin{from{transform:scale(0)}}
.more{font-size:.75rem;color:var(--mut);align-self:center}
.borrow{min-height:48px;min-width:48px;border:0;background:#f4f2ec;border-radius:12px;padding:8px 10px;font-size:.85rem;font-weight:700;white-space:nowrap}
.borrow.on{background:var(--saf2)}
.auto{min-height:48px;border:0;background:var(--navy);color:#fff;border-radius:12px;padding:8px 12px;font-size:.85rem;font-weight:800;white-space:nowrap;animation:enter .3s}
.auto[hidden]{display:none}
.bpop{display:none;background:#fff;border-radius:18px;box-shadow:var(--sh);padding:12px 14px;margin:-4px 0 12px;align-items:center;gap:10px}
.bpop.on{display:flex;animation:enter .3s}
.step{display:flex;align-items:center;gap:8px;margin-left:auto}
.step button{width:48px;height:48px;border-radius:14px;border:0;background:#f4f2ec;font-size:1.3rem;font-weight:800}
.step b{min-width:1.4em;text-align:center;font-size:1.2rem}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{position:relative;-webkit-touch-callout:none;background:#fff;border-radius:20px;box-shadow:var(--sh);padding:20px 8px 10px;text-align:center;cursor:pointer;user-select:none;-webkit-user-select:none;border:2px solid transparent;transition:transform .12s,border-color .2s,background .2s;min-height:118px;outline:none}
@media (hover:hover){.tile:hover{border-color:var(--saf2)}}
.tile:focus-visible{border-color:var(--saf)}
.tile.on{background:linear-gradient(180deg,#fff,#fff8ee)}
.tile.hit{animation:hit .28s}
@keyframes hit{40%{transform:scale(.93)}75%{transform:scale(1.04)}}
.tile.shake,.wallet.shake{animation:shake .35s}

.tile .em{font-size:2rem;line-height:1.1}

.tile .num{font-size:1.35rem;font-weight:900;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1.2}
.tile .num.zero{color:#c9c4b6}
.pips{height:6px;background:#f1ede4;border-radius:3px;overflow:hidden;margin:4px 6px 0}
.pips i{display:block;height:100%;background:linear-gradient(90deg,var(--saf),var(--grn));border-radius:3px;transition:width .25s cubic-bezier(.3,1.5,.5,1)}
.minus{position:absolute;left:0;top:0;width:48px;height:48px;border:0;padding:0;background:none;display:grid;place-items:center;font-size:1.2rem;font-weight:900;line-height:1;color:#5b6480;transition:opacity .2s;z-index:1}
.minus i{font-style:normal;display:grid;place-items:center;width:34px;height:34px;border-radius:12px;background:#f4f2ec}
.minus.off{opacity:.25}
.minus:active i,.minus.press i{transform:scale(.88);background:#e8e4d8}.minus.press{transform:none!important;filter:none}

 'help.r2':'🧮 <b>योजना</b>: खाना दबाकर 🪙 सिक्का डालें; − से वापस लें; नफ़ा-नुकसान जानने के लिए दबाए रखें। ⚡ <b>बिजली</b> में ग्रिड के फ़ैसले और टैरिफ़ हैं।','help.r3':'⏳ कुछ दाँव धीमे हैं: कौशल 4 साल, ग्रिड लाइनें 3 साल, परमाणु 6 साल।',
 'help.r4':'🏆 <b>हब</b>: किसी जोड़ी में सिक्के झोंकें (जैसे भरोसेमंद ग्रिड के साथ 🏭 उद्योग + 🛣️ इंफ्रा) तो हब खुलता है। हब आख़िरी स्कोर में +15 तक जोड़ते हैं। थोड़ा-थोड़ा बाँटने से बेहतर है ध्यान लगाना!','help.r5':'🃏 हर कार्यकाल एक बोनस कार्ड (मर्ज़ी से)। 🏦 उधार से सिक्के बढ़ते हैं पर कर्ज़ विकास को धीमा करता है।',
 'help.rCol':'🔮 हर बार आगे बढ़ने से पहले एक आँकड़े का अंदाज़ा लगाइए। सही अंदाज़े से छोटा समझ बोनस मिलता है।','help.rEx':'👥 <b>गठबंधन</b>: किसान, युवा, उद्योग और पर्यावरण, हर एक का अपना मूड है। 30 से नीचे कोई भी समूह हर साल 0.8 जनसमर्थन घटाता है। बजट तंग है और झटके ज़्यादा कड़े।',
 'help.r6':'🗳️ कार्यकाल के अंत में जनसमर्थन {n}% से नीचे, तो आप बाहर।','help.r7':'🇮🇳 2047 में आपको S–D ग्रेड (S ≥{s}) मिलेगा: NITI के $30T / $18k लक्ष्य और ऊर्जा, जलवायु व शिक्षा के सरकारी लक्ष्यों के मुक़ाबले।',
 'help.model':'🧠 बिजली का मॉडल कैसे काम करता है','help.m1':'<b>पर्याप्तता</b> = तीन जाँचों में सबसे कमज़ोर: शाम की पक्की क्षमता बनाम शाम की माँग (≈ सबसे ज़्यादा माँग का 92%), दोपहर की क्षमता बनाम माँग, और साल भर की ऊर्जा। पक्की क्षमता के गुणांक (खेल की मान्यता): कोयला 0.85, गैस 0.5, परमाणु 0.85, पनबिजली 0.45, पवन 0.12, सौर शाम को 0 / दोपहर 0.55, स्टोरेज = GWh ÷ 4 घंटे।',
 'help.m2':'<b>बर्बादी (curtailment)</b> तब होती है जब सौर+पवन बिजली ग्रिड की गुंजाइश से ज़्यादा हो; ट्रांसमिशन और स्टोरेज गुंजाइश बढ़ाते हैं।','help.m3':'<b>ACS–ARR अंतर</b> AT&amp;C नुकसान, टैरिफ़, ईंधन के झटकों, बर्बादी और महँगी ख़रीद से बदलता है। 2+ साल ₹0.40/kWh से ऊपर रहे तो डिस्कॉम संकट आता है।','help.m4':'2035 से हर साल 2.5 GW कोयला बंद होता है (मान्यता)। स्टोरेज हर साल सस्ता होता है।',
 'help.sources':'📚 असली स्रोत ({n})','help.srcNote':'शुरुआती आँकड़े असली हैं (ज़्यादातर 2026 के मध्य के)। आगे का हाल खेल के लिए बनाए गए सरल नियम हैं। यह भविष्यवाणी नहीं है।','help.glossary':'📖 शब्दकोश',

 'help.r4':'🏆 <b>ਹੱਬ</b>: ਕਿਸੇ ਜੋੜੀ ਵਿੱਚ ਸਿੱਕੇ ਪਾਓ (ਜਿਵੇਂ ਭਰੋਸੇਮੰਦ ਗਰਿੱਡ ਨਾਲ 🏭 ਉਦਯੋਗ + 🛣️ ਇੰਫ਼ਰਾ) ਤਾਂ ਹੱਬ ਖੁੱਲ੍ਹਦਾ ਹੈ। ਹੱਬ ਆਖ਼ਰੀ ਸਕੋਰ ਵਿੱਚ +15 ਤੱਕ ਜੋੜਦੇ ਹਨ। ਥੋੜ੍ਹਾ-ਥੋੜ੍ਹਾ ਵੰਡਣ ਨਾਲੋਂ ਧਿਆਨ ਲਾਉਣਾ ਚੰਗਾ!','help.r5':'🃏 ਹਰ ਕਾਰਜਕਾਲ ਇੱਕ ਬੋਨਸ ਕਾਰਡ (ਮਰਜ਼ੀ ਨਾਲ)। 🏦 ਉਧਾਰ ਨਾਲ ਸਿੱਕੇ ਵਧਦੇ ਹਨ ਪਰ ਕਰਜ਼ਾ ਵਿਕਾਸ ਨੂੰ ਹੌਲੀ ਕਰਦਾ ਹੈ।',
 'help.rCol':'🔮 ਹਰ ਵਾਰ ਅੱਗੇ ਵਧਣ ਤੋਂ ਪਹਿਲਾਂ ਇੱਕ ਅੰਕੜੇ ਦਾ ਅੰਦਾਜ਼ਾ ਲਾਓ। ਸਹੀ ਅੰਦਾਜ਼ੇ ਨਾਲ ਛੋਟਾ ਸਮਝ ਬੋਨਸ ਮਿਲਦਾ ਹੈ।','help.rEx':'👥 <b>ਗੱਠਜੋੜ</b>: ਕਿਸਾਨ, ਨੌਜਵਾਨ, ਉਦਯੋਗ ਅਤੇ ਵਾਤਾਵਰਣ, ਹਰ ਇੱਕ ਦਾ ਆਪਣਾ ਮੂਡ ਹੈ। 30 ਤੋਂ ਹੇਠਾਂ ਕੋਈ ਵੀ ਸਮੂਹ ਹਰ ਸਾਲ 0.8 ਲੋਕ-ਸਮਰਥਨ ਘਟਾਉਂਦਾ ਹੈ। ਬਜਟ ਤੰਗ ਹੈ ਅਤੇ ਝਟਕੇ ਵੱਧ ਸਖ਼ਤ।',
 'help.r6':'🗳️ ਕਾਰਜਕਾਲ ਦੇ ਅੰਤ ਵਿੱਚ ਲੋਕ-ਸਮਰਥਨ {n}% ਤੋਂ ਹੇਠਾਂ, ਤਾਂ ਤੁਸੀਂ ਬਾਹਰ।','help.r7':'🇮🇳 2047 ਵਿੱਚ ਤੁਹਾਨੂੰ S–D ਗ੍ਰੇਡ (S ≥{s}) ਮਿਲੇਗਾ: NITI ਦੇ $30T / $18k ਟੀਚੇ ਅਤੇ ਊਰਜਾ, ਜਲਵਾਯੂ ਤੇ ਸਿੱਖਿਆ ਦੇ ਸਰਕਾਰੀ ਟੀਚਿਆਂ ਦੇ ਮੁਕਾਬਲੇ।',
 'help.model':'🧠 ਬਿਜਲੀ ਦਾ ਮਾਡਲ ਕਿਵੇਂ ਕੰਮ ਕਰਦਾ ਹੈ','help.m1':'<b>ਪੂਰਤੀ</b> = ਤਿੰਨ ਜਾਂਚਾਂ ਵਿੱਚੋਂ ਸਭ ਤੋਂ ਕਮਜ਼ੋਰ: ਸ਼ਾਮ ਦੀ ਪੱਕੀ ਸਮਰੱਥਾ ਬਨਾਮ ਸ਼ਾਮ ਦੀ ਮੰਗ (≈ ਸਭ ਤੋਂ ਵੱਧ ਮੰਗ ਦਾ 92%), ਦੁਪਹਿਰ ਦੀ ਸਮਰੱਥਾ ਬਨਾਮ ਮੰਗ, ਅਤੇ ਸਾਲ ਭਰ ਦੀ ਊਰਜਾ। ਪੱਕੀ ਸਮਰੱਥਾ ਦੇ ਗੁਣਾਂਕ (ਖੇਡ ਦੀ ਮਾਨਤਾ): ਕੋਲਾ 0.85, ਗੈਸ 0.5, ਪਰਮਾਣੂ 0.85, ਪਣ-ਬਿਜਲੀ 0.45, ਪੌਣ 0.12, ਸੂਰਜੀ ਸ਼ਾਮ ਨੂੰ 0 / ਦੁਪਹਿਰ 0.55, ਸਟੋਰੇਜ = GWh ÷ 4 ਘੰਟੇ।',
 'help.m2':'<b>ਬਰਬਾਦੀ (curtailment)</b> ਉਦੋਂ ਹੁੰਦੀ ਹੈ ਜਦੋਂ ਸੂਰਜੀ+ਪੌਣ ਬਿਜਲੀ ਗਰਿੱਡ ਦੀ ਗੁੰਜਾਇਸ਼ ਤੋਂ ਵੱਧ ਹੋਵੇ; ਟ੍ਰਾਂਸਮਿਸ਼ਨ ਅਤੇ ਸਟੋਰੇਜ ਗੁੰਜਾਇਸ਼ ਵਧਾਉਂਦੇ ਹਨ।','help.m3':'<b>ACS–ARR ਪਾੜਾ</b> AT&amp;C ਨੁਕਸਾਨ, ਟੈਰਿਫ਼, ਬਾਲਣ ਦੇ ਝਟਕਿਆਂ, ਬਰਬਾਦੀ ਅਤੇ ਮਹਿੰਗੀ ਖ਼ਰੀਦ ਨਾਲ ਬਦਲਦਾ ਹੈ। 2+ ਸਾਲ ₹0.40/kWh ਤੋਂ ਉੱਪਰ ਰਹੇ ਤਾਂ ਡਿਸਕੌਮ ਸੰਕਟ ਆਉਂਦਾ ਹੈ।','help.m4':'2035 ਤੋਂ ਹਰ ਸਾਲ 2.5 GW ਕੋਲਾ ਬੰਦ ਹੁੰਦਾ ਹੈ (ਮਾਨਤਾ)। ਸਟੋਰੇਜ ਹਰ ਸਾਲ ਸਸਤੀ ਹੁੰਦੀ ਹੈ।',
 'help.sources':'📚 ਅਸਲ ਸਰੋਤ ({n})','help.srcNote':'ਸ਼ੁਰੂਆਤੀ ਅੰਕੜੇ ਅਸਲ ਹਨ (ਜ਼ਿਆਦਾਤਰ 2026 ਦੇ ਅੱਧ ਦੇ)। ਅੱਗੇ ਦਾ ਹਾਲ ਖੇਡ ਲਈ ਬਣਾਏ ਸਰਲ ਨਿਯਮ ਹਨ। ਇਹ ਭਵਿੱਖਬਾਣੀ ਨਹੀਂ ਹੈ।','help.glossary':'📖 ਸ਼ਬਦਕੋਸ਼',
 'help.vibeOn':'📳 ਕੰਬਣੀ: ਚਾਲੂ','help.vibeOff':'📳 ਕੰਬਣੀ: ਬੰਦ','help.newGame':'🔄 ਨਵੀਂ ਖੇਡ','help.version':'v4 · ਇੱਕ ਫ਼ਾਈਲ · ਬਿਨਾਂ ਇੰਟਰਨੈੱਟ ਚੱਲਦੀ ਹੈ · EN / हिन्दी / ਪੰਜਾਬੀ',
 'gl.GDP':'ਕੁੱਲ ਘਰੇਲੂ ਉਤਪਾਦ: ਦੇਸ਼ ਵਿੱਚ ਇੱਕ ਸਾਲ ਵਿੱਚ ਬਣੀ ਹਰ ਚੀਜ਼ ਅਤੇ ਸੇਵਾ ਦਾ ਕੁੱਲ ਮੁੱਲ।','gl.GW':'ਗੀਗਾਵਾਟ: ਬਿਜਲੀ ਸਮਰੱਥਾ ਦੀ ਇਕਾਈ (1 GW = 1,000 MW)।','gl.GWh':'ਗੀਗਾਵਾਟ-ਘੰਟਾ: ਜਮ੍ਹਾਂ ਕੀਤੀ ਜਾਂ ਵਰਤੀ ਊਰਜਾ ਦੀ ਇਕਾਈ।',
 'gl.AT&C':'ਕੁੱਲ ਤਕਨੀਕੀ ਅਤੇ ਵਪਾਰਕ ਨੁਕਸਾਨ: ਤਾਰਾਂ ਵਿੱਚ, ਚੋਰੀ ਵਿੱਚ ਅਤੇ ਨਾ ਭਰੇ ਬਿੱਲਾਂ ਵਿੱਚ ਗਈ ਬਿਜਲੀ।','gl.ACS–ARR':'ਡਿਸਕੌਮ ਨੂੰ ਇੱਕ ਯੂਨਿਟ ਬਿਜਲੀ ਦੀ ਲਾਗਤ ਅਤੇ ਉਸ ਤੋਂ ਹੋਣ ਵਾਲੀ ਕਮਾਈ ਵਿਚਕਾਰ ਪਾੜਾ।',
 'gl.GER':'ਕੁੱਲ ਦਾਖ਼ਲਾ ਅਨੁਪਾਤ: 18–23 ਸਾਲ ਦੇ ਹਰ 100 ਨੌਜਵਾਨਾਂ ਵਿੱਚੋਂ ਕਾਲਜ ਵਿੱਚ ਪੜ੍ਹਨ ਵਾਲੇ।','gl.IMR':'ਬਾਲ ਮੌਤ ਦਰ: ਹਰ 1,000 ਜਨਮਾਂ ’ਤੇ 1 ਸਾਲ ਤੋਂ ਪਹਿਲਾਂ ਮਰਨ ਵਾਲੇ ਬੱਚੇ।','gl.NDC':'ਪੈਰਿਸ ਸਮਝੌਤੇ ਹੇਠ ਭਾਰਤ ਦਾ ਜਲਵਾਯੂ ਸੰਕਲਪ।',
 'gl.RE':'ਨਵਿਆਉਣਯੋਗ ਊਰਜਾ: ਸੂਰਜੀ, ਪੌਣ ਵਰਗੇ ਸਰੋਤ।','gl.Discom':'ਬਿਜਲੀ ਵੰਡ ਕੰਪਨੀ: ਜੋ ਘਰਾਂ ਅਤੇ ਦੁਕਾਨਾਂ ਤੱਕ ਬਿਜਲੀ ਪਹੁੰਚਾਉਂਦੀ ਹੈ।',
 'mood.lifted':'ਇਸ ਨਾਲ ਖ਼ੁਸ਼ ਹੁੰਦੇ ਹਨ:','mood.below':'30 ਤੋਂ ਹੇਠਾਂ → ਹਰ ਸਾਲ −0.8 ਲੋਕ-ਸਮਰਥਨ।',
 'moodtip.farmers':'ਖੇਤੀ ਵਿੱਚ ਸਿੱਕੇ, ਕਿਸਾਨਾਂ ਦੀ ਆਮਦਨ, ਅਨਾਜ ਅਤੇ ਸਸਤਾ ਟੈਰਿਫ਼।','moodtip.youth':'ਹੁਨਰ, ਡਿਜੀਟਲ ਅਤੇ ਤੇਜ਼ ਵਿਕਾਸ (ਨੌਕਰੀਆਂ!)।','moodtip.industry':'ਉਦਯੋਗ, ਇੰਫ਼ਰਾ, ਭਰੋਸੇਮੰਦ ਗਰਿੱਡ ਅਤੇ ਲਾਗਤ ਮੁਤਾਬਕ ਟੈਰਿਫ਼।','moodtip.env':'ਹਰਿਆਲੀ ਵਿੱਚ ਸਿੱਕੇ, ਸਾਫ਼ ਬਿਜਲੀ ਦਾ ਮਿਸ਼ਰਣ ਅਤੇ ਘੱਟ ਕੋਲਾ।',
 'note.cyberFail':'⚠️ ਪੈਚ ਟਿਕਿਆ ਨਹੀਂ। ਇੱਕ ਇਲਾਕੇ ਦੀ ਬਿਜਲੀ ਗੁੱਲ ਹੋਣ ਦੀ ਖ਼ਬਰ ਸ਼ਾਮ ਦੀਆਂ ਖ਼ਬਰਾਂ ਵਿੱਚ ਆਈ।','note.cyberOk':'✅ ਹਮਲਾ ਨਾਕਾਮ ਰਿਹਾ। ਤੁਹਾਡੀ ਸੁਰੱਖਿਆ ਟੀਮ ਨੂੰ ਸਮੋਸੇ ਮਿਲੇ।',
 'adv.short':'🔦 ਸਭ ਤੋਂ ਤੰਗ ਘੰਟੇ ਵਿੱਚ {v}% ਬਿਜਲੀ ਘੱਟ ਪਈ। ਸ਼ਾਮ ਦੀ ਮੰਗ ਲਈ ਸਟੋਰੇਜ, ਥਰਮਲ ਜਾਂ ਪਰਮਾਣੂ ਚਾਹੀਦਾ ਹੈ, ਸਿਰਫ਼ ਹੋਰ ਪੈਨਲ ਨਹੀਂ।','adv.eve':'🌆 ਸ਼ਾਮ ਦਾ ਮਾਰਜਿਨ ਪਤਲਾ ਹੈ ({v}%)। ਸੂਰਜ 6:30 ਵਜੇ ਡੁੱਬ ਜਾਂਦਾ ਹੈ; AC ਨਹੀਂ।',
 'adv.curt':'🗼 {v}% ਬਿਜਲੀ ਬਰਬਾਦ: ਸੋਲਰ ਪਾਰਕ ਐਵੇਂ ਧੁੱਪ ਸੇਕ ਰਹੇ ਹਨ। ਟ੍ਰਾਂਸਮਿਸ਼ਨ ਜਾਂ ਸਟੋਰੇਜ ਬਣਾਓ।','adv.gap':'💸 ACS–ARR ਪਾੜਾ ₹{v}/kWh। ਬਿਜਲੀ ਕੰਪਨੀਆਂ ਭੁਗਤਾਨ ਬਾਰੇ ਫ਼ਿਕਰਮੰਦ ਹਨ; ₹0.40 ਤੋਂ ਉੱਪਰ ਟਿਕਿਆ ਤਾਂ ਡਿਸਕੌਮ ਸੰਕਟ ਆਵੇਗਾ।',
 'adv.nf':'☀️ ਗੈਰ-ਜੀਵਾਸ਼ਮ {v} GW; 2030 ਤੱਕ 500 GW ਲਈ ਹਰ ਸਾਲ ~{r} GW ਚਾਹੀਦਾ ਹੈ।','adv.nuc':'⚛️ ਪਰਮਾਣੂ {v} GW ’ਤੇ। 2047 ਤੱਕ 100 GW ਲਈ ਛੇਤੀ ਦਾਅ ਲਾਓ (6 ਸਾਲ ਲੱਗਦੇ ਹਨ)।','adv.debt':'🏦 GDP ਦਾ {v}% ਕਰਜ਼ਾ ਵਿਕਾਸ ਦਾ ਗਲਾ ਘੁੱਟਣ ਲੱਗਾ ਹੈ।',
 'adv.ap':'📣 ਲੋਕ-ਸਮਰਥਨ {v}%। ਕਾਰਜਕਾਲ ਦੇ ਅੰਤ ਵਿੱਚ 20% ਤੋਂ ਹੇਠਾਂ, ਤਾਂ ਤੁਸੀਂ ਬਾਹਰ।','adv.ger':'🎓 GER {v}: NEP ਦਾ 2035 ਤੱਕ 50% ਵਾਲਾ ਟੀਚਾ ਖਿਸਕ ਰਿਹਾ ਹੈ। ਸਿੱਖਿਆ ਦਾ ਫਲ 4 ਸਾਲ ਬਾਅਦ ਮਿਲਦਾ ਹੈ।','adv.syn':'🤝 ਤਾਲਮੇਲ ਬੋਨਸ: ਇੰਫ਼ਰਾ + ਭਰੋਸੇਮੰਦ ਬਿਜਲੀ ਉਦਯੋਗ ਨੂੰ ਉੱਪਰ ਚੁੱਕ ਰਹੇ ਹਨ (+{v}% ਵਿਕਾਸ)।',
 'adv.dig':'📱 ਡਿਜੀਟਲ ਇੰਡੀਆ ਨੂੰ ਘੱਟ ਪੈਸਾ ਮਿਲਿਆ ਹੈ, ਇਸ ਲਈ ਸ਼ਾਸਨ ਦਾ ਸੁਧਾਰ ਰੁਕ ਰਿਹਾ ਹੈ।','adv.ok':'✅ ਸਭ ਠੀਕ ਚੱਲ ਰਿਹਾ ਹੈ। ਕੈਬਨਿਟ ਸਕੱਤਰ ਕੁਝ ਜ਼ਿਆਦਾ ਹੀ ਆਰਾਮ ਵਿੱਚ ਹਨ।',

function derivePower(s,init){

 const effPeak=p.peak*(1+spike), eveningPeak=effPeak*0.92*(1-s.mods.peakAdj);
 const coal=p.coal*(1-derate), vre=p.solar+p.wind;

 p.eveAdq=evening/eveningPeak; p.dayAdq=day/effPeak; p.eAdq=(nfGen+fossilMax)/p.energy;
 p.adq=Math.min(p.eveAdq,p.dayAdq,p.eAdq);

 p.nfGenShare=Math.min(0.97,nfGen/p.energy);
 p.nfCapShare=nfGW(p)/totGW(p);
}

  youth:50+20*lnq(s,'edu')+15*lnq(s,'digital')+300*(s.g-0.06),
  industry:50+20*lnq(s,'ind')+15*lnq(s,'infra')+clamp((p.adq-1)*200,-30,10)+ti,
  env:54+25*lnq(s,'sus')+80*(p.nfGenShare-0.4)-0.1*(p.coal-230)};

}

}

/* ================= TERM FLOW ================= */
function beginTerm(s){s.newHubs=[];s.lostHubs=[];s.termBudgetAdj=s.bonusCoins||0;s.bonusCoins=0;s.policy=null;s.newMs=[];s.missedMs=[];s.lastNote=null;s.lastNoteK=null;s.event=drawEvent(s);drawHand(s);}
function resolveEvent(s,idx){
 const e=s.event,c=e.c[idx]; if(e.pre) e.pre(s); c.f(s); s.log.push({year:s.year,event:e.id,choice:idx});
 if(c.heart) s.hearts++;
 if(c.who) for(const k in c.who) s.moods[k]=clamp(s.moods[k]+c.who[k],5,95);
 s.approval=clamp(s.approval,s.cfg.minApproval,97); s.event=null; fitAlloc(s);
}
function budgetTotal(s){return computeBudget(s)+s.borrow;}
function used(s){return s.cfg.groups?GROUPS.reduce((a,g)=>a+(s.galloc[g.k]||0),0):ALLK.reduce((a,k)=>a+(s.alloc[k]||0),0);}
/* School: turn group coins into the 14 underlying levers (fractional points are fine for the model). */
function applyGroups(s){if(!s.cfg.groups)return;const a=Object.fromEntries(ALLK.map(k=>[k,0]));for(const g of GROUPS)for(const k in g.w)a[k]+=(s.galloc[g.k]||0)*g.w[k];s.alloc=a;s.borrow=0;s.tariff='bal';s.policy=null;}
function recordPrediction(s,ok){s.predictions++;if(ok)s.insight++;}
function recordQuiz(s,ok){s.quizzes++;if(ok){s.quizRight++;s.bonusCoins+=1;}}
function fitAlloc(s){
 if(s.cfg.groups){let over=used(s)-budgetTotal(s);const order=['smart','nature','people','power','jobs'];while(over>0){let did=false;for(const k of order){if(over<=0)break;if(s.galloc[k]>0){s.galloc[k]--;over--;did=true;}}if(!did)break;}return;}
 let over=used(s)-budgetTotal(s); const order=['nuc','th','sus','digital','gov','dist','tx','sto','agri','health','edu','infra','ind','re'];
 while(over>0){let did=false;for(const k of order){if(over<=0)break;if(s.alloc[k]>0){s.alloc[k]--;over--;did=true;}}if(!did)break;}
}
function enactTerm(s){
 applyGroups(s);
 if(s.policy){const P=POLICIES.find(p=>p.id===s.policy);P.f(s);s.usedPolicies.push(P.id);}
 s.log.push({year:s.year,mode:s.mode,galloc:s.cfg.groups?{...s.galloc}:undefined,alloc:{...s.alloc},tariff:s.tariff,borrow:s.borrow,policy:s.policy,budget:budgetTotal(s)});
 const before=s.history[s.history.length-1];
 for(let i=0;i<TERM_YEARS;i++) stepYear(s);
 s.term++;
 if(s.approval<20&&s.year<END){s.over=true;s.lostMandate=true;}
 if(s.year>=END) s.over=true;
 return before;
}

function scoreGame(s){
 const p=s.p, f=x=>clamp(x,0,1), Y=s.year, m=id=>s.ms[id]&&s.ms[id].ok;
 const minAdq=Math.min(...s.history.slice(1).map(h=>h.adq))/100;
 const cats=[
  {k:'econ',max:20,v:20*f(Math.pow(s.gdp/30,2)),dp:{gdp:s.gdp.toFixed(1)}},
  {k:'pc',max:15,v:15*f(Math.pow(pc(s)/18000,2)),dp:{pc:nIN(pc(s)),wb:nIN(wbThreshold(Y))}},
  {k:'energy',max:20,v:(m('nf500')?3:0)+(m('nf60')?3:0)+4*f((minAdq-0.9)/0.1)+3*f((15-p.atc)/(15-7))+3*f((0.3-p.gap)/0.3)+4*f(p.nuc/100),dp:{nf:Math.round(p.nfCapShare*100),adq:(minAdq*100).toFixed(0),atc:p.atc.toFixed(1),gap:p.gap.toFixed(2),nuc:p.nuc.toFixed(0)}},
  {k:'human',max:15,v:5*f((s.ger-30)/(60-30))+5*f((24-s.imr)/(24-6))+5*f((s.le-70.3)/(80-70.3)),dp:{ger:s.ger.toFixed(0),imr:s.imr.toFixed(1),le:s.le.toFixed(1)}},
  {k:'climate',max:10,v:(m('eir45')?2:0)+(m('eir47')?3:0)+5*f((s.eir-47)/(65-47)),dp:{eir:s.eir.toFixed(0)}},
  {k:'digital',max:10,v:5*f((s.internet-75)/(105-75))+5*f((s.gov-50)/(75-50)),dp:{net:s.internet.toFixed(0),gov:s.gov.toFixed(0)}},
  {k:'farm',max:5,v:5*f((s.farm-100)/(300-100)),dp:{farm:s.farm.toFixed(0)}},
  {k:'fiscal',max:5,v:2.5*f((100-s.debt)/(100-65))+2.5*f((s.approval-30)/30),dp:{debt:s.debt.toFixed(0),ap:s.approval.toFixed(0)}}];
 for(const c of cats){c.n=t('cat.'+c.k+'.n');c.d=t('cat.'+c.k+'.d',c.dp);}
 // Hub bonus (game mechanic): rewards sustained specialisation. Up to +5 per hub held ≥9 years, max +15; total capped at 100.
 const hubBonus=Math.min(15,HUBS.reduce((a,h)=>a+5*clamp((s.hubYears[h.id]||0)/9,0,1),0));
 // Level bonus: School rewards kindness (💗 up to +5); College rewards correct predictions (🔮 +0.4 each, max +2.5).
 const modeBonus=s.mode==='school'?Math.min(5,s.hearts):s.mode==='college'?Math.min(2.5,s.insight*0.4):0;
 let total=Math.min(100,cats.reduce((a,c)=>a+c.v,0)+hubBonus+modeBonus); if(s.lostMandate) total*=0.6;
 const G=s.cfg.grades, grade=total>=G[0]?'S':total>=G[1]?'A':total>=G[2]?'B':total>=G[3]?'C':'D';
 const titleK=(s.mode==='school'?'title.kid.':'title.')+grade, title=t(titleK);
 return {cats,total,grade,title,titleK,hubBonus,modeBonus,grades:G};
}

/* ================= ADVISOR ================= */
function advisorNotes(s){return advisorNotesK(s).map(([k,p])=>t(k,p));}
function advisorNotesK(s){
 const p=s.p,n=[];
 if(p.adq<1) n.push(['adv.short',{v:((1-p.adq)*100).toFixed(1)}]);
 else if(p.eveAdq<1.03) n.push(['adv.eve',{v:(p.eveAdq*100).toFixed(0)}]);
 if(p.curt>0.05) n.push(['adv.curt',{v:(p.curt*100).toFixed(0)}]);
 if(p.gap>0.3) n.push(['adv.gap',{v:p.gap.toFixed(2)}]);
 if(nfGW(p)<500&&s.year<2030) n.push(['adv.nf',{v:nfGW(p).toFixed(0),r:((500-nfGW(p))/(2030-s.year)).toFixed(0)}]);
 if(p.nuc<20&&s.year<=2035) n.push(['adv.nuc',{v:p.nuc.toFixed(0)}]);
 if(s.debt>90) n.push(['adv.debt',{v:s.debt.toFixed(0)}]);
 if(s.approval<35) n.push(['adv.ap',{v:s.approval.toFixed(0)}]);
 if(s.ger<40&&s.year>=2032) n.push(['adv.ger',{v:s.ger.toFixed(0)}]);
 if(s.synergy>0.003) n.push(['adv.syn',{v:(s.synergy*100).toFixed(1)}]);
 if(lnq(s,'digital')<-0.3) n.push(['adv.dig',{}]);
 if(!n.length) n.push(['adv.ok',{}]);
 return n.slice(0,6);
}

function animNum(el,to,f,dur){if(!el)return;const from=el._v===undefined?to:el._v;el._v=to;if(RM||from===to||!isFinite(from)){el.textContent=f(to);return;}
 const t0=performance.now(),d=dur||900;(function step(tt){const k=Math.min(1,(tt-t0)/d),e=1-Math.pow(1-k,3);el.textContent=f(from+(to-from)*e);if(k<1)requestAnimationFrame(step);})(t0);}
function reflow(el,cls){if(!el)return;el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);}
function toast(msg,bad,ms){const x=document.createElement('div');x.className='toast'+(bad?' bad':'');x.innerHTML=msg;$('toasts').appendChild(x);setTimeout(()=>x.remove(),ms||3200);while($('toasts').children.length>3)$('toasts').firstChild.remove();}

 const cols=['#FF9933','#ffffff','#138808','#0b1f66'];const ps=Array.from({length:140},()=>({x:cv.width/2+(Math.random()-.5)*120,y:cv.height*0.35,vx:(Math.random()-.5)*14,vy:-6-Math.random()*9,r:3+Math.random()*5,c:cols[Math.floor(Math.random()*4)],a:Math.random()*6}));
 let n=0;(function f(){g.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.32;p.vx*=0.99;p.a+=.15;g.save();g.translate(p.x,p.y);g.rotate(p.a);g.fillStyle=p.c;g.fillRect(-p.r,-p.r/2,p.r*2,p.r);g.strokeStyle='rgba(0,0,0,.12)';g.strokeRect(-p.r,-p.r/2,p.r*2,p.r);g.restore();});if(++n<150)requestAnimationFrame(f);else g.clearRect(0,0,cv.width,cv.height);})();
}

 const ys=v=>Tp+ph-(v-mn)/(mx-mn)*ph;

 for(let i=0;i<=4;i++){const v=mn+(mx-mn)*i/4,y=ys(v);g.strokeStyle='#eee';g.beginPath();g.moveTo(L,y);g.lineTo(W-R,y);g.stroke();g.fillStyle='#888';g.fillText(Math.abs(v)>=1000?(v/1000).toFixed(Math.abs(v)>=10000?0:1)+'k':(Math.abs(v)<10?v.toFixed(1):v.toFixed(0)),2,y+3);}
 g.fillStyle='#888'; for(let y=START;y<=END;y+=3) g.fillText("'"+String(y).slice(2),xs(y)-7,Hh-6);

 if(d.stack){let base=hist.map(()=>0);d.stack.forEach(s=>{const top=hist.map((h,i)=>base[i]+s.f(h));g.beginPath();hist.forEach((h,i)=>{i?g.lineTo(xs(h.year),ys(top[i])):g.moveTo(xs(h.year),ys(top[i]));});for(let i=hist.length-1;i>=0;i--)g.lineTo(xs(hist[i].year),ys(base[i]));g.closePath();g.fillStyle=s.c;g.globalAlpha=.85;g.fill();g.globalAlpha=1;base=top;});}
 (d.targets||[]).forEach(tg=>{const lb=t(tg.n);g.setLineDash([4,4]);g.strokeStyle=tg.c;g.beginPath();g.moveTo(L,ys(tg.y));g.lineTo(W-R,ys(tg.y));g.stroke();g.setLineDash([]);g.fillStyle=tg.c;g.fillText(lb,W-R-g.measureText(lb).width-2,ys(tg.y)-3);});

 const line=(s,dash)=>{g.strokeStyle=s.c;g.lineWidth=2.2;if(dash)g.setLineDash([5,3]);g.beginPath();hist.forEach((h,i)=>{const x=xs(h.year),y=ys(s.f(h));i?g.lineTo(x,y):g.moveTo(x,y);});g.stroke();g.setLineDash([]);g.lineWidth=1;
  const last=hist[hist.length-1];g.fillStyle=s.c;g.beginPath();g.arc(xs(last.year),ys(s.f(last)),3.2,0,7);g.fill();};
 (d.extra||[]).forEach(s=>line(s,true)); (d.s||[]).forEach(s=>line(s));
}

const MOOD_CHARTS=[{t:'ch.49',s:[{n:'ch.50',c:COL.grn,f:h=>h.mf},{n:'ch.51',c:COL.blue,f:h=>h.my},{n:'ch.52',c:COL.navy,f:h=>h.mi},{n:'ch.53',c:COL.teal,f:h=>h.me}],targets:[{y:30,n:'ch.54',c:COL.red}],min:0},
 {t:'ch.55',s:[{n:'ch.56',c:COL.saf,f:h=>h.approval}],targets:[{y:20,n:'ch.57',c:COL.gray}],min:0}];

/* ================= WIRING ================= */
function startGame(seed,skipIntro,mode){
 $('toasts').innerHTML=''; closeSheet(); powerOpen=false; borrowOpen=false; hubSel=null; pendingPred=null; lastReveal=null; lastBefore=null;
 mode=MODES[mode]?mode:(MODES[LS.get('vb-mode')]?LS.get('vb-mode'):'college');
 S=newState(seed||Math.floor(Math.random()*1e6)+1,mode); S.quizDone={}; lastStat={};
 for(const k of ALLK) S.alloc[k]=0; // start with a full wallet; the player places every coin
 document.body.dataset.mode=mode;
 ['sv-gdp','sv-adq','sv-nf','sv-ap','hYear'].forEach(id=>{if($(id))delete $(id)._v;});
 beginTerm(S); renderTop(false);
 if(skipIntro) showEvent(); else showIntro();
}
function chooseMode(m,keepSeed){LS.set('vb-mode',m);if(keepSeed&&S&&S.mode===m&&phase==='intro'){showEvent();}else startGame(keepSeed&&S?S.seed:undefined,true,m);toast(MODES[m].i+' '+t('toast.level',{n:modeName(m),tag:t('mode.'+m+'.tag')}));}
function exportLog(){
 const data=JSON.stringify({seed:S.seed,mode:S.mode,lang:LANG,year:S.year,score:S.over?+scoreGame(S).total.toFixed(1):null,log:S.log,final:S.history[S.history.length-1]},null,1);
 const fallback=()=>openSheet(`<h2>${t('ui.runLog')}</h2><p class="mut">${t('ui.runLogNote')}</p><textarea style="width:100%;height:300px;border-radius:12px;border:1px solid var(--line);padding:8px">${data}</textarea>`);
 if(navigator.clipboard&&window.isSecureContext) navigator.clipboard.writeText(data).then(()=>toast(t('toast.copied'))).catch(fallback); else fallback();
}
/* ---- touch layer: press feedback, long-press details, swipe-to-choose ---- */
const PRESS='button,.tile,.pcard,.stat,[data-tip],summary';
let gest=null, suppressClick=false;
document.addEventListener('pointerdown',e=>{
 suppressClick=false;
 const el=e.target.closest(PRESS); if(!el||e.button>0)return;
 el.classList.add('press');
 gest={el,x:e.clientX,y:e.clientY,id:e.pointerId,t:Date.now(),moved:false,choice:el.classList.contains('choice')?el:null,lp:null};
 const tile=e.target.closest('.tile[data-k]');
 if(tile&&!e.target.closest('.minus')){gest.lp=setTimeout(()=>{if(!gest||gest.moved)return;gest.long=true;tile.classList.remove('press');longInfo(tile);buzz(10);},480);}
},{passive:true});
document.addEventListener('pointermove',e=>{
 if(!gest||e.pointerId!==gest.id)return;
 const dx=e.clientX-gest.x,dy=e.clientY-gest.y;
 if(!gest.moved&&Math.hypot(dx,dy)>10){gest.moved=true;clearTimeout(gest.lp);if(!gest.choice||Math.abs(dy)>Math.abs(dx))gest.el.classList.remove('press');}
 if(gest.choice&&gest.moved&&Math.abs(dx)>Math.abs(dy)&&dx>0){gest.swiping=true;gest.choice.style.transform=`translateX(${Math.min(dx,160)}px)`;gest.choice.classList.toggle('armed',dx>90);}
},{passive:true});
function endGesture(e,cancel){
 if(!gest)return; const g=gest; gest=null; clearTimeout(g.lp); g.el.classList.remove('press');
 if(g.long){suppressClick=true;return;}
 if(g.swiping){const dx=e.clientX-g.x; g.choice.classList.remove('armed'); suppressClick=true;
  if(!cancel&&dx>90){g.choice.style.transform='';pickChoice(+g.choice.dataset.choice,g.choice);} else {g.choice.style.transition='transform .2s';g.choice.style.transform='';setTimeout(()=>g.choice.style.transition='',220);}}
}
document.addEventListener('pointerup',e=>endGesture(e,false),{passive:true});
document.addEventListener('pointercancel',e=>endGesture(e,true),{passive:true});
document.addEventListener('contextmenu',e=>{if(e.target.closest('.tile'))e.preventDefault();});
function longInfo(tile){
 const k=tile.dataset.k, isG=kid(), x=isG?GROUPS.find(g=>g.k===k):[...SECTORS,...POWER].find(q=>q.k===k); if(!x)return;
 const nm=t((isG?'grp.':'sec.')+k+'.n'), lag=isG?'':' · '+t(S.lag[k]===1?'plan.lag1':'plan.lag',{n:S.lag[k]});
 showTipHTML(tile,`<b>${x.i} ${nm}</b><br>${t('trade.'+k)}<br><span style="opacity:.8">${isG?'':esc(t('sec.'+k+'.d'))+lag}</span>`);
 showTrade(k);
}
document.addEventListener('click',e=>{
 if(suppressClick){suppressClick=false;e.preventDefault();e.stopPropagation();return;}
 const tg=e.target.closest('button,.tile,.pcard,[data-tip],summary,#coach');
 if(!tg){hideTip();if(e.target.id==='sheet'&&!sheetModal)closeSheet();return;}
 if(tg.tagName==='SUMMARY'){hideTip();return;}
 if(tg.dataset.tip){if(tipFor===tg){hideTip();}else{showTip(tg,tg.dataset.tip);}e.stopPropagation();return;}
 hideTip();
 if(tg.dataset.lang){setLang(tg.dataset.lang,true);return;}
 if(tg.dataset.mode){if(phase==='intro')chooseMode(tg.dataset.mode,true);else if(tg.classList.contains('lvl'))chooseMode(tg.dataset.mode);return;}
 if(tg.dataset.choice!==undefined){pickChoice(+tg.dataset.choice,tg);return;}
 if(tg.dataset.k){bump(tg.dataset.k,+tg.dataset.d);return;}
 if(tg.dataset.power){togglePower();return;}
 if(tg.dataset.pred){makePrediction(tg.dataset.pred);return;}
 if(tg.dataset.quiz!==undefined){answerQuiz(tg);return;}
 if(tg.dataset.mood){const st=STAKE.find(q=>q.k===tg.dataset.mood);showTipHTML(tg,`<b>${st.i} ${stName(st)}: ${Math.round(S.moods[st.k])}/100</b><br>${t('mood.lifted')} ${t('moodtip.'+st.k)}<br><span style="opacity:.8">${t('mood.below')}</span>`);e.stopPropagation();return;}
 if(tg.dataset.hub){hubSel=hubSel===tg.dataset.hub?null:tg.dataset.hub;document.querySelectorAll('.hub').forEach(b=>b.classList.toggle('sel',b.dataset.hub===hubSel));$('hubd').classList.toggle('on',!!hubSel);if(hubSel){$('hubd').innerHTML=hubDetail(hubSel);reflow($('hubd'),'on');}return;}
 if(tg.closest&&tg.closest('#coach')){dismissCoach();return;}
 if(tg.dataset.tariff){S.tariff=tg.dataset.tariff;document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.tariff===S.tariff));$('segd').textContent=t('plan.tariff',{d:t('tariff.'+S.tariff+'.d')});updatePowerLine();return;}
 if(tg.dataset.b){const nb=clamp(S.borrow+(+tg.dataset.b),0,6);if(nb===S.borrow){reflow($('bpop'),'shake');return;}S.borrow=nb;if(+tg.dataset.b<0){fitAlloc(S);ALLK.forEach(updateTile);}$('borrowVal').textContent=S.borrow;$('bShow').textContent=S.borrow?'+'+S.borrow:'';updateWallet();updatePowerLine();return;}
 if(tg.id==='autoBtn'){autoFill();return;}
 if(tg.id==='borrowBtn'){borrowOpen=!borrowOpen;$('bpop').classList.toggle('on',borrowOpen);tg.classList.toggle('on',borrowOpen);return;}
 if(tg.classList.contains('pcard')){const id=tg.dataset.p;S.policy=S.policy===id?null:id;document.querySelectorAll('.pcard').forEach(c=>c.classList.toggle('sel',c.dataset.p===S.policy));return;}
 if(tg.id==='startBtn'){LS.set('vb-mode',S.mode);showEvent();return;}
 if(tg.id==='enactBtn'){enact();return;}
 if(tg.id==='nextBtn'){nextTerm();return;}
 if(tg.id==='againBtn'||tg.id==='newGameBtn'){startGame(undefined,true,S.mode);return;}
 if(tg.id==='sameSeedBtn'){startGame(S.seed,true,S.mode);return;}
 if(tg.id==='levelBtn'||tg.id==='modeB'){helpSheet();return;}
 if(tg.id==='vibeBtn'){vibeOn=!vibeOn;LS.set('vb-vibe',vibeOn?'1':'0');tg.textContent=t(vibeOn?'help.vibeOn':'help.vibeOff');tg.setAttribute('aria-pressed',vibeOn);buzz(20);return;}
 if(tg.id==='exportBtn'||tg.id==='exportBtn2'){exportLog();return;}
 if(tg.id==='sheetX'){if(sheetModal&&phase==='plan')pendingPred=null;closeSheet();return;}
 if(tg.id==='statsBtn'||tg.dataset.sheet==='stats'){statsSheet();return;}
 if(tg.id==='chartsBtn'||tg.dataset.sheet==='charts'){chartsSheet();return;}
 if(tg.id==='helpBtn'){helpSheet();return;}
 if(tg.dataset.ctab){chartTab=tg.dataset.ctab;chartsSheet();return;}
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if(!$('tip').classList.contains('hidden')){hideTip();return;}closeSheet();return;}
 if(!$('sheet').classList.contains('hidden'))return;
 if(phase==='event'&&/^[1-3]$/.test(e.key)){const b=document.querySelector(`.choice[data-choice="${+e.key-1}"]`);if(b)pickChoice(+e.key-1,b);return;}
 if((e.key==='Enter'||e.key===' ')&&document.activeElement&&(document.activeElement.classList.contains('tile')||document.activeElement.classList.contains('pcard'))){e.preventDefault();document.activeElement.click();return;}
 if(e.key==='Enter'&&phase==='result'&&$('nextBtn')){nextTerm();return;}
 if(e.key==='Enter'&&phase==='intro'){LS.set('vb-mode',S.mode);showEvent();}
});
/* tooltips: open on tap, close on a tap outside (no hover-only info) */
let tipFor=null;
function placeTip(el){const tip=$('tip');const r=el.getBoundingClientRect();const w=Math.min(320,innerWidth-16);tip.style.maxWidth=w+'px';const x=Math.min(innerWidth-w-8,Math.max(8,r.left));let y=r.bottom+8;if(y+tip.offsetHeight>innerHeight-8)y=Math.max(8,r.top-tip.offsetHeight-8);tip.style.left=x+'px';tip.style.top=y+'px';}
function showTipHTML(el,html){const tip=$('tip');tip.innerHTML=html+`<span class="tipx" aria-hidden="true">${t('ui.tapClose')}</span>`;tip.classList.remove('hidden');tipFor=el;placeTip(el);}
function showTip(el,key){const f=FACTS[key];if(!f)return;showTipHTML(el,`${t('fact.'+key+'.t')}<br><span style="opacity:.8">${t('ui.sourceC')} <span class="srcname">${f.u?`<a href="${f.u}" target="_blank" rel="noopener">${f.s}</a>`:f.s}</span></span>`);}
function hideTip(){$('tip').classList.add('hidden');tipFor=null;}
document.addEventListener('scroll',()=>{if(tipFor&&!$('tip').classList.contains('hidden'))placeTip(tipFor);},{passive:true,capture:true});
window.addEventListener('resize',()=>{hideTip();if(S&&$('chartgrid')&&!$('sheet').classList.contains('hidden'))renderChartSet('chartgrid',chartSet());});

 setLang:l=>setLang(l,false),get lang(){return LANG;},LANGS,t,get embedded(){return embedded;}};
