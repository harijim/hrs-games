<style>
:root{--saf:#FF9933;--saf2:#ffe7cc;--grn:#138808;--grn2:#dff3dc;--navy:#0b1f66;--ink:#1a2238;--mut:#6b7590;--bg:#fbfaf6;--card:#fff;--line:#ece8de;--bad:#d64531;--warn:#e0931b;--r:20px;--sh:0 6px 24px rgba(20,30,70,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
html{font-size:17px;-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;background:var(--bg);color:var(--ink);font-size:1rem;line-height:1.4;min-height:100vh;overscroll-behavior-y:none}
button,.tile,.pcard,[role=button],summary,a{touch-action:manipulation}
.press{transform:scale(.96)!important;filter:brightness(.96)}
.choice.press{transform:scale(.985)!important}
button{font:inherit;color:inherit;cursor:pointer}
.stripe{height:5px;background:linear-gradient(90deg,var(--saf) 0 33.3%,#fff 33.3% 66.6%,var(--grn) 66.6%)}
/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:30;padding-top:env(safe-area-inset-top);background:rgba(251,250,246,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.bar{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:8px max(14px,env(safe-area-inset-right)) 8px max(14px,env(safe-area-inset-left))}
.brand{font-weight:800;color:var(--navy);font-size:1.05rem;letter-spacing:.2px;white-space:nowrap}
.brand b{color:var(--saf)}
.year{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.05rem;background:var(--navy);color:#fff;border-radius:999px;padding:3px 12px}
.icons{margin-left:auto;display:flex;gap:6px}
.ib{width:48px;height:48px;border-radius:14px;border:0;background:#fff;box-shadow:var(--sh);font-size:1.15rem;display:grid;place-items:center;transition:transform .15s}
.ib:active{transform:scale(.9)}
/* ---------- skyline + journey ---------- */
.hero{max-width:760px;margin:0 auto;padding:0 max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left))}
.sky{position:relative;height:96px;border-radius:var(--r);overflow:hidden;background:linear-gradient(180deg,#fff3e3 0%,#fffaf2 55%,#f2f8ef 100%);box-shadow:var(--sh);transition:background 1s}
.sky.dark{background:linear-gradient(180deg,#2b3157,#46507e)}
.sun{position:absolute;top:10px;right:18px;font-size:1.4rem;transition:transform 1s}
.city{position:absolute;left:0;right:0;bottom:0;height:100%;display:flex;align-items:flex-end;gap:3px;padding:0 10px}
.bld{flex:1;border-radius:4px 4px 0 0;background-color:var(--c);height:8%;transition:height 1.4s cubic-bezier(.3,1.4,.5,1);
 background-image:repeating-linear-gradient(90deg,var(--c) 0 3px,transparent 3px 7px),repeating-linear-gradient(180deg,var(--c) 0 6px,var(--lit) 6px 9px);background-position:2px 4px;opacity:.95}
.sky{--lit:#ffd36b}.sky.dark{--lit:#545b7a}
.tree{flex:.6;font-size:.8rem;line-height:1;text-align:center;align-self:flex-end;transition:opacity 1s}
.road{position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--saf),#fff,var(--grn))}
.journey{position:relative;height:30px;margin:6px 6px 0}
.track{position:absolute;left:0;right:0;top:14px;height:4px;border-radius:2px;background:var(--line)}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:linear-gradient(90deg,var(--saf),var(--grn));transition:width 1.2s}
.node{position:absolute;top:10px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#fff;border:2px solid var(--line);transition:all .4s}
.node.done{background:var(--grn);border-color:var(--grn)}
.node.last{border-color:var(--saf);width:16px;height:16px;margin-left:-8px;top:8px}
.rider{position:absolute;top:-4px;font-size:1.45rem;margin-left:-14px;transition:left 1.2s cubic-bezier(.5,0,.3,1);filter:drop-shadow(0 2px 2px rgba(0,0,0,.15))}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 4px}
.stat{border:0;background:#fff;border-radius:16px;padding:7px 4px;box-shadow:var(--sh);text-align:center;transition:transform .2s}
.stat .v{font-weight:800;font-size:1.02rem;color:var(--navy);font-variant-numeric:tabular-nums;white-space:nowrap}
.stat{min-height:52px}.stat .l{font-size:.74rem;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.bad .v{color:var(--bad)}
.stat.up{animation:glowG 1.3s}.stat.down{animation:glowR 1.3s}
@keyframes glowG{30%{transform:scale(1.08);box-shadow:0 0 0 3px rgba(19,136,8,.45)}}
@keyframes glowR{30%{transform:scale(1.08);box-shadow:0 0 0 3px rgba(214,69,49,.45)}}
.steps{display:flex;justify-content:center;gap:6px;margin:8px 0 2px;font-size:.78rem;color:var(--mut)}
.steps span{padding:3px 10px;border-radius:999px;transition:all .3s}
.steps span.on{background:var(--navy);color:#fff;font-weight:700}
.steps span.done{color:var(--grn)}
.steps.hide{visibility:hidden}
/* ---------- screens ---------- */
main{max-width:760px;margin:0 auto;padding:6px max(14px,env(safe-area-inset-right)) calc(130px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));overflow-x:clip}
.scr{display:none}
.scr.on{display:block;animation:enter .45s cubic-bezier(.2,.9,.3,1)}
@keyframes enter{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
h1,h2,h3{margin:0;color:var(--navy)}
.card{background:var(--card);border-radius:24px;box-shadow:var(--sh);padding:22px 20px}
.center{text-align:center}
.mut{color:var(--mut);font-size:.85rem}
.big-em{font-size:4rem;line-height:1;display:inline-block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-4deg)}}
.cta{display:block;width:100%;border:0;border-radius:18px;padding:17px;font-size:1.12rem;font-weight:800;color:#fff;background:linear-gradient(90deg,var(--saf),#f57c00);box-shadow:0 8px 20px rgba(255,153,51,.35);transition:transform .12s,filter .2s}
.cta:active{transform:scale(.97)}@media (hover:hover){.cta:hover{filter:brightness(1.05)}}.cta{min-height:56px}
.cta.navy{background:linear-gradient(90deg,var(--navy),#2a3f99);box-shadow:0 8px 20px rgba(11,31,102,.3)}
.ghost{min-height:48px;border:0;background:#fff;border-radius:14px;padding:12px 16px;font-weight:700;color:var(--navy);box-shadow:var(--sh)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:12px max(14px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));background:linear-gradient(180deg,rgba(251,250,246,0),var(--bg) 35%)}
.dock>div{max-width:760px;margin:0 auto}
/* intro */
.intro{padding-top:20px}
.intro h1{font-size:2.1rem;line-height:1.1;margin:12px 0 6px}
.intro h1 b{color:var(--saf)}
.loop{display:flex;justify-content:center;gap:10px;margin:22px 0;flex-wrap:wrap}
.loop div{background:#fff;border-radius:18px;box-shadow:var(--sh);padding:12px 14px;min-width:88px;font-size:.85rem;color:var(--mut)}
.loop div b{display:block;font-size:1.7rem}
/* event */
.ev{position:relative;overflow:hidden}
.ev.fly{animation:fly .4s ease-in forwards}
@keyframes fly{to{transform:translateX(110%) rotate(12deg);opacity:0}}
.ev .tag{display:inline-block;background:var(--saf2);color:#a85a00;border-radius:999px;padding:3px 12px;font-size:.78rem;font-weight:700;letter-spacing:.3px}
.ev h2{font-size:1.6rem;margin:10px 0 6px;line-height:1.15}
.ev p{margin:0 0 6px;color:#46506a;font-size:.98rem}
.choice{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:18px;padding:14px 16px;margin:10px 0 0;transition:transform .15s,border-color .15s,box-shadow .15s;min-height:64px;position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none}
@media (hover:hover){.choice:hover{border-color:var(--saf);box-shadow:0 6px 18px rgba(255,153,51,.18);transform:translateY(-2px)}}
.choice:active{transform:scale(.98)}
.choice .k{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;font-size:.8rem;font-weight:800;margin-right:8px;vertical-align:1px}
.choice b{font-size:1.02rem;color:var(--navy)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{font-size:.74rem;background:#f4f2ec;border-radius:999px;padding:3px 9px;color:#4b5571}
.choice.picked{border-color:var(--grn);background:var(--grn2)}
/* plan */
.wallet{position:sticky;top:var(--topH,64px);z-index:20;background:#fff;border-radius:20px;box-shadow:var(--sh);padding:10px 14px;display:flex;align-items:center;gap:10px;margin-bottom:12px}
.wallet .left{font-weight:900;font-size:1.6rem;color:var(--navy);font-variant-numeric:tabular-nums;min-width:1.5em;text-align:center}
.wallet .left.zero{color:var(--grn)}
.wallet .lab{font-size:.75rem;color:var(--mut);line-height:1.15}
.coins{flex:1;display:flex;flex-wrap:wrap;gap:2px;min-height:20px;align-content:center}
.coin{width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe08a,#f5a623 60%,#c97d00);box-shadow:0 1px 1px rgba(0,0,0,.2);animation:cin .3s}
@keyframes cin{from{transform:scale(0)}}
.more{font-size:.75rem;color:var(--mut);align-self:center}
.borrow{min-height:48px;min-width:48px;border:0;background:#f4f2ec;border-radius:12px;padding:8px 10px;font-size:.85rem;font-weight:700;white-space:nowrap}
.borrow.on{background:var(--saf2)}
.auto{min-height:48px;border:0;background:var(--navy);color:#fff;border-radius:12px;padding:8px 12px;font-size:.85rem;font-weight:800;white-space:nowrap;animation:enter .3s}
.auto[hidden]{display:none}
.bpop{display:none;background:#fff;border-radius:18px;box-shadow:var(--sh);padding:12px 14px;margin:-4px 0 12px;align-items:center;gap:10px}
.bpop.on{display:flex;animation:enter .3s}
.step{display:flex;align-items:center;gap:8px;margin-left:auto}
.step button{width:48px;height:48px;border-radius:14px;border:0;background:#f4f2ec;font-size:1.3rem;font-weight:800}
.step b{min-width:1.4em;text-align:center;font-size:1.2rem}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{position:relative;-webkit-touch-callout:none;background:#fff;border-radius:20px;box-shadow:var(--sh);padding:20px 8px 10px;text-align:center;cursor:pointer;user-select:none;-webkit-user-select:none;border:2px solid transparent;transition:transform .12s,border-color .2s,background .2s;min-height:118px;outline:none}
@media (hover:hover){.tile:hover{border-color:var(--saf2)}}
.tile:focus-visible{border-color:var(--saf)}
.tile.on{background:linear-gradient(180deg,#fff,#fff8ee)}
.tile.hit{animation:hit .28s}
@keyframes hit{40%{transform:scale(.93)}75%{transform:scale(1.04)}}
.tile.shake,.wallet.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tile .em{font-size:2rem;line-height:1.1}
.tile .nm{font-size:.82rem;font-weight:700;color:#3c4664;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .num{font-size:1.35rem;font-weight:900;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1.2}
.tile .num.zero{color:#c9c4b6}
.pips{height:6px;background:#f1ede4;border-radius:3px;overflow:hidden;margin:4px 6px 0}
.pips i{display:block;height:100%;background:linear-gradient(90deg,var(--saf),var(--grn));border-radius:3px;transition:width .25s cubic-bezier(.3,1.5,.5,1)}
.minus{position:absolute;left:0;top:0;width:48px;height:48px;border:0;padding:0;background:none;display:grid;place-items:center;font-size:1.2rem;font-weight:900;line-height:1;color:#5b6480;transition:opacity .2s;z-index:1}
.minus i{font-style:normal;display:grid;place-items:center;width:34px;height:34px;border-radius:12px;background:#f4f2ec}
.minus.off{opacity:.25}
.minus:active i,.minus.press i{transform:scale(.88);background:#e8e4d8}.minus.press{transform:none!important;filter:none}
.badge2{position:absolute;right:7px;top:8px;font-size:.72rem;color:var(--mut);background:#f4f2ec;border-radius:8px;padding:1px 5px}
.boost{position:absolute;right:7px;top:30px;font-size:.72rem;color:var(--grn);font-weight:800}
.tile.power{background:linear-gradient(180deg,#f3fbf1,#fff);border-color:#cfe9c9}

<script>
"use strict";
/* ================= FACTS (real-world, sourced) ================= */
const FACTS={

 t500:{t:"Target: 500 GW of non-fossil installed capacity by 2030. India crossed 300 GW on 31 July 2026.",s:"PIB, 9 Aug 2026",u:"https://www.pib.gov.in/PressReleasePage.aspx?PRID=2296782"},
 cap:{t:"Total installed capacity 542.35 GW (31.05.2026): coal 223.5 GW (41.2%), lignite 6.6, gas 20.1, diesel 0.6 GW. ≈555 GW by Aug 2026.",s:"CEA Installed Capacity report; CREA Q2 2026 snapshot",u:"https://cea.nic.in/reports/dashboardView?headingId=107&lang=en&subHeadingId=1003&subSubHeadingId=10014&title=Installed+Capacity"},

 ndc:{t:"NDC: cut emissions intensity of GDP 45% by 2030 and 47% by 2035 (vs 2005); 60% non-fossil capacity by 2035; net zero by 2070. Achieved 37.38% intensity cut by 2022.",s:"PIB (2026); UNFCCC NDC 2031-35",u:"https://www.pib.gov.in/PressReleasePage.aspx?PRID=2299186"},
 ger:{t:"Higher-education GER 30 (AISHE 2023-24). NEP 2020 target: 50% by 2035.",s:"AISHE 2023-24",u:"https://aishe.gov.in/"},

 food:{t:"Record foodgrain production of 376.56 million tonnes in 2025-26 (3rd advance estimates).",s:"Ministry of Agriculture via PIB",u:"https://www.pib.gov.in/PressReleasePage.aspx?PRID=2265965"},
 tx:{t:"CEA's transmission plan: 335 GW of transmission to carry 280 GW of variable RE to the ISTS by 2030; 2,053 GW installed needed for a 708 GW peak by 2047.",s:"Mint (CEA transmission plan launch)",u:"https://www.livemint.com/industry/cea-power-distribution-renewable-energy-transmission-manohar-lal-power-ministry-11728888777389.html"},
 powerdesk:{t:"These six levers drive the grid model. Capacities start at real CEA/MNRE values; costs, lags and firm-capacity factors are game assumptions.",s:"See SOURCES.md",u:""},
 gov:{t:"Governance index (0–100) is a game construct, loosely inspired by ease-of-doing-business style indices. Not an official score.",s:"Game assumption",u:""},
 approval:{t:"Public approval is a game mechanic (starts at 58%).",s:"Game assumption",u:""},
 farm:{t:"Farm income index (2026 = 100) is a game construct.",s:"Game assumption",u:""}
};

/* ================= CONFIG ================= */
const START=2026, END=2047, TERM_YEARS=3, NTERMS=7, KREF=16.8;
const SECTORS=[
 {k:'ind',n:'Industry & Manufacturing',i:'🏭',lag:1,d:'Factories, PLI, exports'},
 {k:'infra',n:'Infrastructure',i:'🛣️',lag:2,d:'Roads, rail, ports, cities'},
 {k:'edu',n:'Education & Skills',i:'🎓',lag:4,d:'Slow, but compounds'},
 {k:'health',n:'Health',i:'🩺',lag:2,d:'IMR, life expectancy, resilience'},
 {k:'agri',n:'Agriculture',i:'🌾',lag:1,d:'Productivity, irrigation, markets'},
 {k:'digital',n:'Digital India',i:'📱',lag:1,d:'Connectivity, DPI; boosts governance'},
 {k:'sus',n:'Sustainability',i:'🌳',lag:1,d:'Efficiency, forests, clean air'},
 {k:'gov',n:'Governance',i:'⚖️',lag:2,d:'Courts, regulators, state capacity'}];
const POWER=[
 {k:'re',n:'Solar & Wind',i:'☀️',lag:1,d:'GW added per year'},
 {k:'sto',n:'Storage (BESS + pumped hydro)',i:'🔋',lag:1,d:'Evening peak & RE integration'},
 {k:'tx',n:'Transmission & Green Corridors',i:'🗼',lag:3,d:'Grid headroom; avoids curtailment'},
 {k:'dist',n:'Discom reform & smart meters',i:'📟',lag:2,d:'Cuts AT&C losses'},
 {k:'nuc',n:'Nuclear',i:'⚛️',lag:6,d:'Firm & clean, very slow'},
 {k:'th',n:'Thermal security (coal/gas)',i:'🪨',lag:4,d:'Firm power, more emissions'}];
const ALLK=[...SECTORS,...POWER].map(x=>x.k);
const LAG0=Object.fromEntries([...SECTORS,...POWER].map(x=>[x.k,x.lag]));
const DEFAULT_ALLOC={ind:2,infra:2,edu:2,health:2,agri:2,digital:1,sus:1,gov:2,re:4,sto:2,tx:2,dist:1,nuc:0,th:1};
const TARIFFS=[
 {k:'sub',n:'🎁 Subsidised',d:'+approval, wider ACS–ARR gap, fiscal cost'},
 {k:'bal',n:'⚖️ Balanced',d:'Small gap, neutral'},
 {k:'cost',n:'📈 Cost-reflective',d:'Healthy discoms, −approval'}];

/* ================= AGE LEVELS (v3) =================
   Each level changes difficulty knobs, which levers are shown and how it is scored.
   budgetAdj: extra coins per term · shock: multiplier on negative event effects ·
   minApproval: approval floor (School can't be voted out) · grades: [S,A,B,C] cut-offs. */
const MODES={
 school:{k:'school',i:'🎒',n:'School',age:'Ages 10–14',tag:'Big ideas, simple choices',budgetAdj:3,shock:0.5,minApproval:25,grades:[83,70,57,45],groups:true,policies:false,tariff:false,borrow:false,coalition:false,dilemmas:false,cap:20},
 college:{k:'college',i:'🎓',n:'College',age:'Ages 15–22',tag:'Trade-offs & predictions',budgetAdj:0,shock:1,minApproval:3,grades:[85,76,66,52],groups:false,policies:true,tariff:true,borrow:true,coalition:false,dilemmas:true,cap:12},
 expert:{k:'expert',i:'💼',n:'Adult / Expert',age:'Full model',tag:'Coalitions, lags & tight budgets',budgetAdj:-2,shock:1.2,minApproval:3,grades:[84,76,68,54],groups:false,policies:true,tariff:true,borrow:true,coalition:true,dilemmas:true,cap:12}};
/* School combines the 14 levers into 5 friendly groups; coins split by these weights. */
const GROUPS=[
 {k:'jobs',i:'🏭',n:'Jobs & Factories',d:'Factories, roads, trains, ports',w:{ind:0.55,infra:0.45}},
 {k:'people',i:'🏫',n:'Schools & Hospitals',d:'Teachers, doctors, clinics',w:{edu:0.5,health:0.5}},
 {k:'nature',i:'🌾',n:'Farms & Nature',d:'Crops, water, forests, clean air',w:{agri:0.55,sus:0.45}},
 {k:'smart',i:'📱',n:'Smart Government',d:'Internet, fair courts, quick services',w:{digital:0.5,gov:0.5}},
 {k:'power',i:'⚡',n:'Clean Power',d:'Sun, wind, batteries, power lines',w:{re:0.3,sto:0.25,tx:0.2,dist:0.08,nuc:0.12,th:0.05}}];
const STAKE=[{k:'farmers',i:'👨‍🌾',n:'Farmers'},{k:'youth',i:'🧑‍🎓',n:'Youth'},{k:'industry',i:'🏭',n:'Industry'},{k:'env',i:'🌳',n:'Environment'}];

/* ================= RNG & helpers ================= */
function rand(s){let t=(s.rng=(s.rng+0x6D2B79F5)|0);t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;}
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const eff=a=>a<=0?0:Math.pow(a,0.75);

/* ================= STATE ================= */
function newState(seed,mode){
 const cfg=MODES[mode]||MODES.college;
 const s={mode:cfg.k,cfg,galloc:Object.fromEntries(GROUPS.map(g=>[g.k,0])),moods:{farmers:55,youth:55,industry:55,env:50},hearts:0,insight:0,predictions:0,quizRight:0,quizzes:0,bonusCoins:0,seed,rng:seed|0,year:START,term:0,gdp:4.06,pop:1.4766,debt:83.1,approval:58,g:0.07,synergy:0,
  ger:30,imr:24,le:70.3,internet:75.5,food:376.6,foodTrend:376.6,farm:100,gov:50,eir:41,
  p:{solar:171.1,wind:59.2,hydro:57.2,bio:11.4,nuc:8.78,coal:230.1,gas:20.7,sto:9.1,head:250,peak:270.8,energy:1850,atc:15.04,gap:0.06,curt:0,adq:1,nfGenShare:0.32,gapYears:0,ic:1},
  K:{},pipe:{},lag:{...LAG0},mult:{},
  mods:{peakAdj:0,firmAdj:0,pd:0,budgetAdj:0,emisBonus:0,indG:0,atcDrift:0,gapAdj:0,coalBan:false,peakGrowth:0,reMult:1,govDrift:0,farmBonus:0},
  temp:[],alloc:{...DEFAULT_ALLOC},tariff:'bal',borrow:0,termBudgetAdj:0,policy:null,hand:[],usedPolicies:[],event:null,eventsSeen:[],
  history:[],log:[],ms:{},newMs:[],missedMs:[],over:false,lostMandate:false,hub:{},hubEver:{},hubYears:{},newHubs:[],lostHubs:[]};
 for(const x of SECTORS){s.K[x.k]=KREF;s.pipe[x.k]=Array(x.lag).fill(eff(2));}
 for(const x of POWER){s.pipe[x.k]=Array(x.lag).fill(x.k==='nuc'?eff(1):eff(DEFAULT_ALLOC[x.k]));}
 derivePower(s,true); snapshot(s); return s;
}
const lnq=(s,k)=>clamp(Math.log(Math.max(0.25,s.K[k]/KREF)),-1.4,1.6);
const pc=s=>s.gdp/s.pop*1000;
const nfGW=p=>p.solar+p.wind+p.hydro+p.bio+p.nuc;
const totGW=p=>nfGW(p)+p.coal+p.gas;
const wbThreshold=y=>14375*Math.pow(1.02,y-2026); // GAME ASSUMPTION: WB threshold drifts ~2%/yr
function computeBudget(s){return Math.max(8,Math.round(13+11*Math.sqrt(s.gdp/4.06))+s.mods.budgetAdj+s.termBudgetAdj+(s.cfg?s.cfg.budgetAdj:0));}
function tempSum(s,key){return s.temp.reduce((a,t)=>a+(t[key]||0),0);}

function derivePower(s,init){
 const p=s.p, spike=tempSum(s,'peakSpike'), derate=tempSum(s,'coalDerate'), firmT=tempSum(s,'firmAdj');
 const effPeak=p.peak*(1+spike), eveningPeak=effPeak*0.92*(1-s.mods.peakAdj);
 const coal=p.coal*(1-derate), vre=p.solar+p.wind;
 p.curt=Math.max(0,(vre-p.head)/vre);
 const stoGW=p.sto/4*0.95;
 const firmBase=(coal*0.85+p.gas*0.5+p.nuc*0.85+p.hydro*0.45+p.wind*0.12*(1-p.curt)+p.bio*0.5)*(1+s.mods.firmAdj+firmT);
 const evening=firmBase+stoGW, day=firmBase+p.solar*0.55*(1-p.curt);
 const nfGen=(p.solar*0.155+p.wind*0.21)*8.76*(1-p.curt)+p.hydro*0.33*8.76+p.nuc*0.72*8.76+p.bio*0.35*8.76;
 const fossilMax=coal*0.80*8.76+p.gas*0.25*8.76;
 p.eveAdq=evening/eveningPeak; p.dayAdq=day/effPeak; p.eAdq=(nfGen+fossilMax)/p.energy;
 p.adq=Math.min(p.eveAdq,p.dayAdq,p.eAdq);
 p.prevNf=init?0.32:p.nfGenShare;
 p.nfGenShare=Math.min(0.97,nfGen/p.energy);
 p.nfCapShare=nfGW(p)/totGW(p);
}

/* ================= SPECIALISATION HUBS (game mechanic) =================
   Threshold bonuses that reward focus: a hub switches on while its sectors are
   built well above the 2026 baseline (lnq ≥0.35–0.45 ≈ 4–5 points a year for a few terms). */
const HUBS=[
 {id:'mfg',i:'🏭',n:'Make-in-India hub',fx:'+1% growth',req:[['🏭 Industry',s=>lnq(s,'ind'),0.45],['🛣️ Infra',s=>lnq(s,'infra'),0.3],['⚡ Grid ≥100%',s=>s.p.adq,1]]},
 {id:'know',i:'🎓',n:'Knowledge economy',fx:'+0.5% growth · GER & governance up',req:[['🎓 Skills',s=>lnq(s,'edu'),0.4],['📱 Digital',s=>lnq(s,'digital'),0.25]]},
 {id:'green',i:'🔋',n:'Clean firm grid',fx:'+0.4% growth · faster CO₂ cut · discom gap −₹0.10',req:[['🌆 Evening margin ≥115%',s=>s.p.eveAdq,1.15],['🌱 Clean generation ≥55%',s=>s.p.nfGenShare,0.55]]},
 {id:'care',i:'🩺',n:'Healthy India',fx:'IMR falls faster · life expectancy up · approval up',req:[['🩺 Health',s=>lnq(s,'health'),0.35],['⚖️ Governance',s=>lnq(s,'gov'),0.15]]},
 {id:'farm',i:'🌾',n:'Agri powerhouse',fx:'Farm income +1.5%/yr · more food',req:[['🌾 Farms',s=>lnq(s,'agri'),0.35],['🌳 Green',s=>lnq(s,'sus'),0.15]]}];
function hubProgress(s,h){return Math.min(...h.req.map(([,f,t])=>clamp(f(s)/t,0,1)));}
function hubOn(s,h){return h.req.every(([,f,t])=>f(s)>=t);}
function updateHubs(s){const H={};for(const h of HUBS){H[h.id]=hubOn(s,h);if(H[h.id]&&!s.hubEver[h.id]){s.hubEver[h.id]=s.year+1;s.newHubs.push(h);}if(H[h.id])s.hubYears[h.id]=(s.hubYears[h.id]||0)+1;if(!H[h.id]&&s.hub[h.id]&&!s.lostHubs.includes(h))s.lostHubs.push(h);}s.hub=H;return H;}

function stepYear(s){
 const y=s.year+1, p=s.p, flow={};
 for(const k of ALLK){
  const a=s.alloc[k]||0; s.pipe[k].push(eff(a)*(s.mult[k]||1));
  let arrived=s.pipe[k].shift()||0;
  while(s.pipe[k].length>s.lag[k]) arrived+=s.pipe[k].shift();
  if(s.K[k]!==undefined) s.K[k]=Math.max(1,s.K[k]*0.9+arrived); else flow[k]=arrived;
 }
 // power build-out
 const ic=clamp(1-2*p.curt-0.6*Math.max(0,p.gap-0.25),0.4,1.15)*s.mods.reMult; p.ic=ic;
 const reAdd=(22+10*flow.re)*ic; p.solar+=reAdd*0.78; p.wind+=reAdd*0.22;
 const stoAdd=(4+1.8*(y-START))+8*flow.sto*(1+0.08*(y-START)); p.sto+=stoAdd;
 p.head+=12+9*flow.tx+0.3*stoAdd;
 p.nuc+=0.5+0.9*flow.nuc;
 if(!s.mods.coalBan) p.coal+=(y<=2032?3:1)+1.6*flow.th;
 if(y>=2035) p.coal=Math.max(60,p.coal-2.5);
 p.gas+=0.2; p.hydro+=0.8; p.bio+=0.3;
 const pg=0.55*s.g+0.006+s.mods.peakGrowth-0.002*lnq(s,'sus');
 p.peak*=1+pg; p.energy*=1+pg;
 derivePower(s);
 const short=Math.max(0,1-p.adq), H=updateHubs(s);
 // distribution & discom finances
 p.atc-=(0.12+0.16*flow.dist)*(p.atc-5)/10*(1+(s.gov-50)/100);
 p.atc+=s.mods.atcDrift+(s.tariff==='sub'?0.1:0); p.atc=clamp(p.atc,4,30);
 const tOff={sub:0.35,bal:0.05,cost:-0.25}[s.tariff];
 const gapT=(p.atc-13)*0.03+tOff+s.mods.gapAdj+tempSum(s,'gap')+p.curt*0.6-0.25*(p.nfGenShare-0.32)+0.4*short+(H.green?-0.1:0);
 p.gap+=(gapT-p.gap)*0.6;
 p.gapYears=p.gap>0.4?p.gapYears+1:0;
 // growth
 const skill=clamp((s.ger-30)/40,-0.2,1);
 const base=0.060-0.010*Math.log(pc(s)/2750);
 const synergy=0.016*Math.max(0,Math.min(lnq(s,'infra'),lnq(s,'ind')+0.3,clamp((p.adq-0.99)*20,-1,1)));
 let g=base+0.018*lnq(s,'ind')*(1+0.8*skill)+0.012*lnq(s,'infra')+0.006*lnq(s,'edu')+0.003*lnq(s,'health')+0.003*lnq(s,'agri')
   +0.005*lnq(s,'digital')+0.004*lnq(s,'gov')+0.0002*(s.gov-50)+synergy+s.mods.indG-short*0.3-(s.debt>85?(s.debt-85)*0.0006:0)+tempSum(s,'g')+(H.mfg?0.010:0)+(H.know?0.005:0)+(H.green?0.004:0);
 g=clamp(g,-0.07,0.115); s.g=g; s.synergy=synergy;
 s.gdp*=1+g+0.035;   // GAME ASSUMPTION: +3.5%/yr USD-terms inflation/FX drift (roughly implied by IMF nominal vs real path)
 s.pop*=1+Math.max(0.002,0.0085-0.0003*(y-START));
 // fiscal
 const gn=g+0.04;
 s.debt=s.debt*1.072/(1+gn)+0.8+s.borrow*0.3+s.mods.pd+tempSum(s,'pd')+(s.tariff==='sub'?0.25:0)+Math.max(0,p.gap-0.3)*1.0;
 s.debt=Math.max(20,s.debt);
 // people
 const tAppr={sub:0.8,bal:0,cost:-1.2}[s.tariff];
 s.approval+=0.3*(g*100-5.5)+(p.adq>=1?0.3:-short*60)+tAppr+0.6*lnq(s,'health')+0.5*lnq(s,'agri')+0.3*lnq(s,'edu')+(s.debt>95?-0.6:0)+(55-s.approval)*0.06+tempSum(s,'approval')+(H.green?0.3:0)+(H.care?0.4:0);
 s.approval=clamp(s.approval,s.cfg.minApproval,97);
 s.ger=clamp(s.ger+(0.7+1.8*lnq(s,'edu')+(H.know?0.5:0))*(s.ger<75?1:0.2),20,90);
 s.imr=Math.max(2.5,s.imr*(1-(0.035+0.03*lnq(s,'health')+(H.care?0.02:0))));
 s.le=Math.min(85,s.le+0.18+0.15*lnq(s,'health')+tempSum(s,'le')+(H.care?0.12:0));
 s.internet=clamp(s.internet+(110-s.internet)*(0.07+0.05*lnq(s,'digital')),0,110);
 s.foodTrend*=1.012+0.012*lnq(s,'agri')+(H.farm?0.005:0); s.food=s.foodTrend*(1+tempSum(s,'food'));
 s.farm*=1+0.55*g+0.02*lnq(s,'agri')+0.6*tempSum(s,'food')+s.mods.farmBonus+(H.farm?0.015:0);
 s.gov=clamp(s.gov+0.4+1.2*lnq(s,'gov')+0.6*lnq(s,'digital')+s.mods.govDrift+(H.know?0.5:0),15,95);
 const dr=0.010+0.8*Math.max(0,p.nfGenShare-p.prevNf)+0.006*lnq(s,'sus')-0.002*lnq(s,'ind')+s.mods.emisBonus+(H.green?0.004:0);
 s.eir=(1-(1-s.eir/100)*(1-dr))*100;
 updateMoods(s,y);
 s.temp.forEach(t=>t.yrs--); s.temp=s.temp.filter(t=>t.yrs>0);
 s.year=y; snapshot(s); checkMilestones(s);
}
/* Stakeholder moods (0–100, game mechanic). Shown in College dilemmas; in Expert they form a
   coalition: every group below 30 costs 0.8 approval a year. */
function updateMoods(s,y){
 const p=s.p,M=s.moods,tf={sub:8,bal:0,cost:-8}[s.tariff],ti={sub:-4,bal:0,cost:4}[s.tariff];
 const farmRel=s.farm/(100*Math.pow(1.04,y-START))-1;
 const tgt={farmers:54+25*lnq(s,'agri')+tf+30*farmRel+10*tempSum(s,'food'),
  youth:50+20*lnq(s,'edu')+15*lnq(s,'digital')+300*(s.g-0.06),
  industry:50+20*lnq(s,'ind')+15*lnq(s,'infra')+clamp((p.adq-1)*200,-30,10)+ti,
  env:54+25*lnq(s,'sus')+80*(p.nfGenShare-0.4)-0.1*(p.coal-230)};
 for(const k in M){M[k]=clamp(M[k]+(tgt[k]-M[k])*0.5,5,95); if(s.cfg.coalition&&M[k]<30) s.approval-=0.8;}
 s.approval=clamp(s.approval,s.cfg.minApproval,97);
}

 solar:p.solar,wind:p.wind,hydro:p.hydro,bio:p.bio,nuc:p.nuc,coal:p.coal,gas:p.gas,sto:p.sto,peak:p.peak,nf:nfGW(p),tot:totGW(p),nfCap:p.nfCapShare*100,nfGen:p.nfGenShare*100,adq:p.adq*100,curt:p.curt*100,atc:p.atc,gap:p.gap});}

function checkMilestones(s){

 }
}

function drawEvent(s){
 const SRC=s.cfg.groups?SCHOOL_EVENTS:(s.cfg.dilemmas&&s.term%2===1?DILEMMAS:EVENTS);
 if(!s.cfg.groups&&s.p.gapYears>=2) return DISCOM_CRISIS;
 let pool=SRC.filter(e=>!s.eventsSeen.includes(e.id));
 if(!pool.length){s.eventsSeen=s.eventsSeen.filter(id=>!SRC.some(e=>e.id===id));pool=SRC;}
 const e=pool[Math.floor(rand(s)*pool.length)]; s.eventsSeen.push(e.id); return e;
}

function drawHand(s){
 const pool=POLICIES.filter(p=>!s.usedPolicies.includes(p.id)); const hand=[];
 while(hand.length<3&&pool.length){hand.push(pool.splice(Math.floor(rand(s)*pool.length),1)[0].id);} s.hand=hand;
}

/* ================= TERM FLOW ================= */
function beginTerm(s){s.newHubs=[];s.lostHubs=[];s.termBudgetAdj=s.bonusCoins||0;s.bonusCoins=0;s.policy=null;s.newMs=[];s.missedMs=[];s.lastNote=null;s.event=drawEvent(s);drawHand(s);}
function resolveEvent(s,idx){
 const e=s.event,c=e.c[idx]; if(e.pre) e.pre(s); c.f(s); s.log.push({year:s.year,event:e.id,choice:idx});
 if(c.heart) s.hearts++;
 if(c.who) for(const k in c.who) s.moods[k]=clamp(s.moods[k]+c.who[k],5,95);
 s.approval=clamp(s.approval,s.cfg.minApproval,97); s.event=null; fitAlloc(s);
}
function budgetTotal(s){return computeBudget(s)+s.borrow;}
function used(s){return s.cfg.groups?GROUPS.reduce((a,g)=>a+(s.galloc[g.k]||0),0):ALLK.reduce((a,k)=>a+(s.alloc[k]||0),0);}
/* School: turn group coins into the 14 underlying levers (fractional points are fine for the model). */
function applyGroups(s){if(!s.cfg.groups)return;const a=Object.fromEntries(ALLK.map(k=>[k,0]));for(const g of GROUPS)for(const k in g.w)a[k]+=(s.galloc[g.k]||0)*g.w[k];s.alloc=a;s.borrow=0;s.tariff='bal';s.policy=null;}
function recordPrediction(s,ok){s.predictions++;if(ok)s.insight++;}
function recordQuiz(s,ok){s.quizzes++;if(ok){s.quizRight++;s.bonusCoins+=1;}}
function fitAlloc(s){
 if(s.cfg.groups){let over=used(s)-budgetTotal(s);const order=['smart','nature','people','power','jobs'];while(over>0){let did=false;for(const k of order){if(over<=0)break;if(s.galloc[k]>0){s.galloc[k]--;over--;did=true;}}if(!did)break;}return;}
 let over=used(s)-budgetTotal(s); const order=['nuc','th','sus','digital','gov','dist','tx','sto','agri','health','edu','infra','ind','re'];
 while(over>0){let did=false;for(const k of order){if(over<=0)break;if(s.alloc[k]>0){s.alloc[k]--;over--;did=true;}}if(!did)break;}
}
function enactTerm(s){
 applyGroups(s);
 if(s.policy){const P=POLICIES.find(p=>p.id===s.policy);P.f(s);s.usedPolicies.push(P.id);}
 s.log.push({year:s.year,mode:s.mode,galloc:s.cfg.groups?{...s.galloc}:undefined,alloc:{...s.alloc},tariff:s.tariff,borrow:s.borrow,policy:s.policy,budget:budgetTotal(s)});
 const before=s.history[s.history.length-1];
 for(let i=0;i<TERM_YEARS;i++) stepYear(s);
 s.term++;
 if(s.approval<20&&s.year<END){s.over=true;s.lostMandate=true;}
 if(s.year>=END) s.over=true;
 return before;
}

function scoreGame(s){
 const p=s.p, f=x=>clamp(x,0,1), Y=s.year, m=id=>s.ms[id]&&s.ms[id].ok;
 const minAdq=Math.min(...s.history.slice(1).map(h=>h.adq))/100;
 const cats=[
  {n:'Economy size vs US$30T (NITI)',max:20,v:20*f(Math.pow(s.gdp/30,2)),d:`US$${s.gdp.toFixed(1)}T`},
  {n:'Per capita vs US$18,000 (NITI)',max:15,v:15*f(Math.pow(pc(s)/18000,2)),d:`US$${Math.round(pc(s)).toLocaleString()} · WB high-income line (drifted, game) ≈ US$${Math.round(wbThreshold(Y)).toLocaleString()}`},
  {n:'Energy & power',max:20,v:(m('nf500')?3:0)+(m('nf60')?3:0)+4*f((minAdq-0.9)/0.1)+3*f((15-p.atc)/(15-7))+3*f((0.3-p.gap)/0.3)+4*f(p.nuc/100),d:`Non-fossil ${Math.round(p.nfCapShare*100)}% of capacity · worst-year adequacy ${(minAdq*100).toFixed(0)}% · AT&C ${p.atc.toFixed(1)}% · gap ₹${p.gap.toFixed(2)} · nuclear ${p.nuc.toFixed(0)} GW`},
  {n:'Human development',max:15,v:5*f((s.ger-30)/(60-30))+5*f((24-s.imr)/(24-6))+5*f((s.le-70.3)/(80-70.3)),d:`GER ${s.ger.toFixed(0)} · IMR ${s.imr.toFixed(1)} · life expectancy ${s.le.toFixed(1)}`},
  {n:'Climate',max:10,v:(m('eir45')?2:0)+(m('eir47')?3:0)+5*f((s.eir-47)/(65-47)),d:`Emissions intensity −${s.eir.toFixed(0)}% vs 2005`},
  {n:'Digital & governance',max:10,v:5*f((s.internet-75)/(105-75))+5*f((s.gov-50)/(75-50)),d:`Internet ${s.internet.toFixed(0)}/100 · governance ${s.gov.toFixed(0)}`},
  {n:'Farmers (income index → 300)',max:5,v:5*f((s.farm-100)/(300-100)),d:`Farm income index ${s.farm.toFixed(0)}`},
  {n:'Fiscal & social licence',max:5,v:2.5*f((100-s.debt)/(100-65))+2.5*f((s.approval-30)/30),d:`Debt ${s.debt.toFixed(0)}% of GDP · approval ${s.approval.toFixed(0)}%`}];
 // Hub bonus (game mechanic): rewards sustained specialisation. Up to +5 per hub held ≥9 years, max +15; total capped at 100.
 const hubBonus=Math.min(15,HUBS.reduce((a,h)=>a+5*clamp((s.hubYears[h.id]||0)/9,0,1),0));
 // Level bonus: School rewards kindness (💗 up to +5); College rewards correct predictions (🔮 +0.4 each, max +2.5).
 const modeBonus=s.mode==='school'?Math.min(5,s.hearts):s.mode==='college'?Math.min(2.5,s.insight*0.4):0;
 let total=Math.min(100,cats.reduce((a,c)=>a+c.v,0)+hubBonus+modeBonus); if(s.lostMandate) total*=0.6;
 const G=s.cfg.grades, grade=total>=G[0]?'S':total>=G[1]?'A':total>=G[2]?'B':total>=G[3]?'C':'D';
 const title=(s.mode==='school'?{S:'Super planner! India is developed! 🇮🇳',A:'Amazing job! India is booming 🚀',B:'Great work! Lots of progress 🌟',C:'Good start! Keep learning 📚',D:'Tough one. Try a new plan! 💪'}:{S:'Viksit Bharat achieved! 🇮🇳',A:'Developed in all but name',B:'Rising power, unfinished business',C:'Middle-income, middle of the road',D:'The trap closed in'})[grade];
 return {cats,total,grade,title,hubBonus,modeBonus,grades:G};
}

/* ================= ADVISOR ================= */
function advisorNotes(s){
 const p=s.p,n=[];
 if(p.adq<1) n.push(`🔦 Supply shortfall of ${((1-p.adq)*100).toFixed(1)}% at the tightest hour. The evening peak needs storage, thermal or nuclear, not just more panels.`);
 else if(p.eveAdq<1.03) n.push(`🌆 Evening margin is thin (${(p.eveAdq*100).toFixed(0)}%). Solar sets at 6:30 pm; the ACs don't.`);
 if(p.curt>0.05) n.push(`🗼 Curtailment ${(p.curt*100).toFixed(0)}%: solar parks are sunbathing for nothing. Build transmission or storage.`);
 if(p.gap>0.3) n.push(`💸 ACS–ARR gap ₹${p.gap.toFixed(2)}/kWh. Gencos are nervous about payments; a discom crisis brews if it stays above ₹0.40.`);
 if(nfGW(p)<500&&s.year<2030) n.push(`☀️ ${nfGW(p).toFixed(0)} GW non-fossil; 500 GW by 2030 needs ~${((500-nfGW(p))/(2030-s.year)).toFixed(0)} GW/yr.`);
 if(p.nuc<20&&s.year<=2035) n.push(`⚛️ Nuclear at ${p.nuc.toFixed(0)} GW. 100 GW by 2047 needs early bets (6-year lag).`);
 if(s.debt>90) n.push(`🏦 Debt at ${s.debt.toFixed(0)}% of GDP is starting to choke growth.`);
 if(s.approval<35) n.push(`📣 Approval ${s.approval.toFixed(0)}%. Below 20% at term end and you're out.`);
 if(s.ger<40&&s.year>=2032) n.push(`🎓 GER ${s.ger.toFixed(0)}: the NEP's 50% by 2035 is slipping. Education pays off with a 4-year lag.`);
 if(s.synergy>0.003) n.push(`🤝 Synergy bonus: infrastructure + reliable power are lifting industry (+${(s.synergy*100).toFixed(1)}% growth).`);
 if(lnq(s,'digital')<-0.3) n.push(`📱 Digital India is underfunded, so governance gains are stalling.`);
 if(!n.length) n.push('✅ Systems nominal. The cabinet secretary is suspiciously relaxed.');
 return n.slice(0,6);
}

function renderChartSet(id,defs){
 const el=$(id); if(!el)return; el.innerHTML=defs.map((d,i)=>`<div class="chart"><h4>${d.t}</h4><canvas id="${id}-${i}"></canvas><div class="legend" id="${id}-${i}-lg"></div></div>`).join('');
 defs.forEach((d,i)=>drawChart($(`${id}-${i}`),d,$(`${id}-${i}-lg`)));
}
function drawChart(cv,d,lg){
 if(lg) lg.innerHTML=[...(d.stack||[]),...(d.s||[]),...(d.extra||[])].map(s=>`<span><i style="background:${s.c}"></i>${s.n}</span>`).join('')+(d.path?`<span><i style="background:${COL.gray}"></i>${d.path.n}</span>`:'');
 if(!cv||!cv.offsetWidth) return;
 const dpr=window.devicePixelRatio||1,W=cv.offsetWidth,Hh=cv.offsetHeight; cv.width=W*dpr; cv.height=Hh*dpr;
 const g=cv.getContext('2d'); g.scale(dpr,dpr); g.clearRect(0,0,W,Hh);
 const hist=S.history, L=42,R=8,Tp=8,B=20, pw=W-L-R, ph=Hh-Tp-B;
 const xs=y=>L+(y-START)/(END-START)*pw;
 const vals=[]; (d.s||[]).forEach(s=>hist.forEach(h=>vals.push(s.f(h))));
 if(d.stack) hist.forEach(h=>vals.push(d.stack.reduce((a,s)=>a+s.f(h),0)));
 (d.targets||[]).forEach(t=>vals.push(t.y)); (d.extra||[]).forEach(s=>hist.forEach(h=>vals.push(s.f(h))));
 if(d.path) vals.push(d.path.to);
 let mn=d.min!==undefined?d.min:Math.min(0,...vals), mx=Math.max(...vals); mx=mx+(mx-mn)*0.08; if(mx-mn<1e-6) mx=mn+1;
 const ys=v=>Tp+ph-(v-mn)/(mx-mn)*ph;
 g.font='12px system-ui,sans-serif'; g.lineWidth=1;
 for(let i=0;i<=4;i++){const v=mn+(mx-mn)*i/4,y=ys(v);g.strokeStyle='#eee';g.beginPath();g.moveTo(L,y);g.lineTo(W-R,y);g.stroke();g.fillStyle='#888';g.fillText(Math.abs(v)>=1000?(v/1000).toFixed(Math.abs(v)>=10000?0:1)+'k':(Math.abs(v)<10?v.toFixed(1):v.toFixed(0)),2,y+3);}
 g.fillStyle='#888'; for(let y=START;y<=END;y+=3) g.fillText("'"+String(y).slice(2),xs(y)-7,Hh-6);
 const cur=xs(S.year); g.fillStyle='rgba(255,153,51,.07)'; g.fillRect(cur,Tp,W-R-cur,ph);
 if(d.stack){let base=hist.map(()=>0);d.stack.forEach(s=>{const top=hist.map((h,i)=>base[i]+s.f(h));g.beginPath();hist.forEach((h,i)=>{i?g.lineTo(xs(h.year),ys(top[i])):g.moveTo(xs(h.year),ys(top[i]));});for(let i=hist.length-1;i>=0;i--)g.lineTo(xs(hist[i].year),ys(base[i]));g.closePath();g.fillStyle=s.c;g.globalAlpha=.85;g.fill();g.globalAlpha=1;base=top;});}
 (d.targets||[]).forEach(t=>{g.setLineDash([4,4]);g.strokeStyle=t.c;g.beginPath();g.moveTo(L,ys(t.y));g.lineTo(W-R,ys(t.y));g.stroke();g.setLineDash([]);g.fillStyle=t.c;g.fillText(t.n,W-R-g.measureText(t.n).width-2,ys(t.y)-3);});
 if(d.path){g.setLineDash([2,3]);g.strokeStyle=COL.gray;g.beginPath();for(let y=START;y<=END;y++){const v=d.path.from*Math.pow(d.path.to/d.path.from,(y-START)/(END-START));y===START?g.moveTo(xs(y),ys(v)):g.lineTo(xs(y),ys(v));}g.stroke();g.setLineDash([]);}
 const line=(s,dash)=>{g.strokeStyle=s.c;g.lineWidth=2.2;if(dash)g.setLineDash([5,3]);g.beginPath();hist.forEach((h,i)=>{const x=xs(h.year),y=ys(s.f(h));i?g.lineTo(x,y):g.moveTo(x,y);});g.stroke();g.setLineDash([]);g.lineWidth=1;
  const last=hist[hist.length-1];g.fillStyle=s.c;g.beginPath();g.arc(xs(last.year),ys(s.f(last)),3.2,0,7);g.fill();};
 (d.extra||[]).forEach(s=>line(s,true)); (d.s||[]).forEach(s=>line(s));
}

 if(t.id==='enactBtn'){enact();return;}
 if(t.id==='nextBtn'){nextTerm();return;}
 if(t.id==='againBtn'||t.id==='newGameBtn'){startGame(undefined,true,S.mode);return;}
 if(t.id==='sameSeedBtn'){startGame(S.seed,true,S.mode);return;}
 if(t.id==='levelBtn'||t.id==='modeB'){helpSheet();return;}
 if(t.id==='vibeBtn'){vibeOn=!vibeOn;LS.set('vb-vibe',vibeOn?'1':'0');t.textContent='📳 Vibration: '+(vibeOn?'On':'Off');t.setAttribute('aria-pressed',vibeOn);buzz(20);return;}
 if(t.id==='exportBtn'||t.id==='exportBtn2'){exportLog();return;}
 if(t.id==='sheetX'){if(sheetModal&&phase==='plan')pendingPred=null;closeSheet();return;}
 if(t.id==='statsBtn'||t.dataset.sheet==='stats'){statsSheet();return;}
 if(t.id==='chartsBtn'||t.dataset.sheet==='charts'){chartsSheet();return;}
 if(t.id==='helpBtn'){helpSheet();return;}
 if(t.dataset.ctab){chartTab=t.dataset.ctab;chartsSheet();return;}
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if(!$('tip').classList.contains('hidden')){hideTip();return;}closeSheet();return;}
 if(!$('sheet').classList.contains('hidden'))return;
 if(phase==='event'&&/^[1-3]$/.test(e.key)){const b=document.querySelector(`.choice[data-choice="${+e.key-1}"]`);if(b)pickChoice(+e.key-1,b);return;}
 if((e.key==='Enter'||e.key===' ')&&document.activeElement&&(document.activeElement.classList.contains('tile')||document.activeElement.classList.contains('pcard'))){e.preventDefault();document.activeElement.click();return;}
 if(e.key==='Enter'&&phase==='result'&&$('nextBtn')){nextTerm();return;}
 if(e.key==='Enter'&&phase==='intro'){LS.set('vb-mode',S.mode);showEvent();}
});
/* tooltips: open on tap, close on a tap outside (no hover-only info) */
let tipFor=null;
function placeTip(el){const tip=$('tip');const r=el.getBoundingClientRect();const w=Math.min(320,innerWidth-16);tip.style.maxWidth=w+'px';const x=Math.min(innerWidth-w-8,Math.max(8,r.left));let y=r.bottom+8;if(y+tip.offsetHeight>innerHeight-8)y=Math.max(8,r.top-tip.offsetHeight-8);tip.style.left=x+'px';tip.style.top=y+'px';}
function showTipHTML(el,html){const tip=$('tip');tip.innerHTML=html+'<span class="tipx" aria-hidden="true">tap anywhere to close</span>';tip.classList.remove('hidden');tipFor=el;placeTip(el);}
function showTip(el,key){const f=FACTS[key];if(!f)return;showTipHTML(el,`${f.t}<br><span style="opacity:.8">Source: ${f.u?`<a href="${f.u}" target="_blank" rel="noopener">${f.s}</a>`:f.s}</span>`);}
function hideTip(){$('tip').classList.add('hidden');tipFor=null;}
document.addEventListener('scroll',()=>{if(tipFor&&!$('tip').classList.contains('hidden'))placeTip(tipFor);},{passive:true,capture:true});
window.addEventListener('resize',()=>{hideTip();if(S&&$('chartgrid')&&!$('sheet').classList.contains('hidden'))renderChartSet('chartgrid',chartSet());});
const setTopH=()=>document.documentElement.style.setProperty('--topH',$('topbar').offsetHeight+'px');
window.addEventListener('resize',setTopH);
buildTop(); setTopH();
window.VB={newState,beginTerm,resolveEvent,enactTerm,scoreGame,budgetTotal,used,startGame,chooseMode,MODES,get S(){return S;},set S(v){S=normState(v);},normState,get phase(){return phase;},get mode(){return S&&S.mode;}};
