:root{
 --space0:#030a18;--space1:#071a33;--space2:#0b2a4d;--ocean:#0d3b66;
 --g:#3df58a;--g2:#18c76a;--g3:#0e8f4c;--teal:#19d3c5;--b:#4da3ff;--b2:#2a6fe0;--gold:#ffc94a;--pink:#ff5f9e;--violet:#b28bff;--copper:#e8a25c;--red:#ff5a5f;--orange:#ff9f43;
 --ink:#eaf6ff;--mut:#9fb8cf;--dim:#6f88a3;
 --glass:rgba(16,40,70,.55);--glass2:rgba(255,255,255,.07);--line:rgba(160,220,255,.18);
 --r:18px;--sh:0 10px 40px rgba(0,0,0,.35);
 --disp:"LOTW Display","Fredoka","Baloo 2","Nunito","Segoe UI Rounded","SF Pro Rounded",system-ui,sans-serif;
 --body:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Ubuntu,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--body);color:var(--ink);background:radial-gradient(ellipse at 50% -10%,#123d6b 0%,var(--space1) 45%,var(--space0) 100%) fixed;font-size:15px;line-height:1.45;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;min-height:100vh}
h1,h2,h3,.disp{font-family:var(--disp);font-weight:700;letter-spacing:.01em;line-height:1.1;margin:.1em 0 .4em}
h2{font-size:1.7rem}h3{font-size:1.15rem}
a{color:var(--b)}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.small{font-size:.86rem}.mut{color:var(--mut)}.hidden{display:none!important}
/* Buttons */
.btn{font-family:var(--disp);font-weight:700;font-size:1.02rem;letter-spacing:.02em;border:0;border-radius:999px;padding:.72em 1.4em;cursor:pointer;color:#03210f;background:linear-gradient(180deg,#7dffb2,var(--g2));box-shadow:0 6px 0 #0b6b3a,0 10px 24px rgba(61,245,138,.35);transition:transform .12s,box-shadow .12s,filter .15s;position:relative}
.btn:hover{filter:brightness(1.08);transform:translateY(-2px)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #0b6b3a,0 4px 12px rgba(61,245,138,.3)}
.btn.blue{color:#fff;background:linear-gradient(180deg,#7cc0ff,var(--b2));box-shadow:0 6px 0 #173f8a,0 10px 24px rgba(77,163,255,.35)}
.btn.blue:active{box-shadow:0 2px 0 #173f8a}
.btn.ghost{background:rgba(255,255,255,.08);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost:hover{background:rgba(255,255,255,.14)}
.btn.big{font-size:1.5rem;padding:.7em 2.4em}
.btn.sm{font-size:.86rem;padding:.5em 1em;box-shadow:0 4px 0 #0b6b3a}
.btn.ghost.sm{box-shadow:inset 0 0 0 1.5px var(--line)}
.btn:disabled{filter:grayscale(.8) brightness(.7);cursor:not-allowed;transform:none}
.icon-btn{width:42px;height:42px;border-radius:14px;border:0;background:rgba(255,255,255,.08);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:inset 0 0 0 1.5px var(--line);transition:background .15s,transform .12s}
.icon-btn:hover{background:rgba(255,255,255,.16);transform:translateY(-1px)}
.icon-btn[aria-pressed="true"]{background:rgba(61,245,138,.2);box-shadow:inset 0 0 0 1.5px var(--g)}
.icon-btn svg{width:22px;height:22px}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,label:focus-within{outline:3px solid #ffe27a;outline-offset:3px}
.glass{background:linear-gradient(160deg,rgba(30,70,115,.62),rgba(10,30,58,.62));border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2)}
.pill{display:inline-flex;align-items:center;gap:.3em;padding:.2em .7em;border-radius:99px;font-size:.78rem;font-weight:700;background:rgba(61,245,138,.15);color:var(--g);border:1px solid rgba(61,245,138,.35)}
.pill.b{background:rgba(77,163,255,.15);color:#9fd0ff;border-color:rgba(77,163,255,.4)}
.pill.w{background:rgba(255,159,67,.15);color:#ffc58a;border-color:rgba(255,159,67,.4)}
.pill.r{background:rgba(255,90,95,.15);color:#ff9ea1;border-color:rgba(255,90,95,.4)}
/* Screens & transitions */
.screen{animation:screenIn .55s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes screenIn{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
.wrap{max-width:1100px;margin:0 auto;padding:28px 18px 60px}
.stagger>*{animation:screenIn .6s cubic-bezier(.2,.8,.2,1) both}
.stagger>*:nth-child(2){animation-delay:.08s}.stagger>*:nth-child(3){animation-delay:.16s}.stagger>*:nth-child(4){animation-delay:.24s}.stagger>*:nth-child(5){animation-delay:.32s}.stagger>*:nth-child(6){animation-delay:.4s}.stagger>*:nth-child(7){animation-delay:.48s}.stagger>*:nth-child(8){animation-delay:.56s}.stagger>*:nth-child(9){animation-delay:.64s}
/* Title */
.title{position:relative;min-height:100vh;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.title .hero{position:absolute;inset:-30px;background-size:cover;background-position:center 40%;transition:transform .25s ease-out;filter:saturate(1.15)}
.title .hero::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 35%,rgba(3,10,24,.55) 75%),linear-gradient(180deg,rgba(3,10,24,.1) 0%,rgba(3,10,24,0) 45%,rgba(3,10,24,.85) 78%,#030a18 100%)}
.title .glow{position:absolute;left:50%;top:42%;width:60vmin;height:60vmin;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(61,245,138,.28),transparent 65%);animation:breathe 5s ease-in-out infinite;pointer-events:none}
@keyframes breathe{0%,100%{opacity:.55;transform:translate(-50%,-50%) scale(.95)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}}
.title .fallback-title{position:absolute;left:0;right:0;top:20%;text-align:center;display:none}
.title.nohero .fallback-title{display:block}
.fallback-title .t1{font-family:var(--disp);font-size:clamp(2.6rem,8vw,6rem);font-weight:800;color:#7dffb2;text-shadow:0 0 30px rgba(61,245,138,.7),0 6px 0 #0b5a33}
.fallback-title .t2{font-family:var(--disp);font-size:clamp(1rem,2.6vw,1.6rem);color:#fff}
.title .bottom{position:relative;z-index:2;text-align:center;padding:0 18px 34px}
.tagline{font-family:var(--disp);letter-spacing:.14em;font-size:.95rem;color:#bfffd9;text-shadow:0 0 12px rgba(61,245,138,.5)}
.title .cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:16px 0 12px}
.title .corner{position:absolute;top:14px;right:14px;z-index:3;display:flex;gap:8px}
.play-glow{animation:playPulse 2.4s ease-in-out infinite}
@keyframes playPulse{0%,100%{box-shadow:0 6px 0 #0b6b3a,0 0 0 0 rgba(61,245,138,.55)}50%{box-shadow:0 6px 0 #0b6b3a,0 0 0 16px rgba(61,245,138,0)}}
.feature-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.feature-row span{font-size:.8rem;color:var(--mut);background:rgba(255,255,255,.06);border:1px solid var(--line);padding:.3em .8em;border-radius:99px}
.note{background:rgba(77,163,255,.12);border:1px solid rgba(77,163,255,.35);padding:10px 14px;border-radius:14px;font-size:.92rem}
.note.g{background:rgba(61,245,138,.1);border-color:rgba(61,245,138,.35)}
/* Quote slot */
.quote{position:relative;padding:14px 18px 12px 52px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid var(--line);margin:12px 0}
.quote::before{content:"“";position:absolute;left:14px;top:-6px;font-family:var(--disp);font-size:3.4rem;color:var(--g);opacity:.8}
.quote q{quotes:none;font-style:italic;font-size:1.02rem}
.quote cite{display:block;font-style:normal;font-size:.8rem;color:var(--mut);margin-top:6px}
/* Setup */
.council{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}
.member{padding:12px;text-align:center;border-radius:18px;background:rgba(255,255,255,.06);border:1.5px solid var(--line);transition:transform .2s,opacity .2s}
.member.off{opacity:.35;transform:scale(.94)}
.member input{width:100%;margin-top:8px;padding:.45em .6em;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--ink);font:inherit;text-align:center}
.avatar{width:72px;height:72px;display:block;margin:0 auto;filter:drop-shadow(0 6px 12px rgba(0,0,0,.35))}
.avatar-btn{background:none;border:0;cursor:pointer;padding:0;border-radius:50%}
.seg{display:inline-flex;background:rgba(0,0,0,.25);border-radius:99px;padding:4px;border:1px solid var(--line)}
.seg button{font-family:var(--disp);border:0;background:transparent;color:var(--ink);font-size:1.1rem;width:52px;height:40px;border-radius:99px;cursor:pointer}
.seg button.on{background:linear-gradient(180deg,#7dffb2,var(--g2));color:#03210f}
.scen{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.scen label{display:block;padding:14px;border-radius:16px;border:1.5px solid var(--line);background:rgba(255,255,255,.05);cursor:pointer}
.scen label:has(input:checked){border-color:var(--g);background:rgba(61,245,138,.1);box-shadow:0 0 24px rgba(61,245,138,.2)}
.scen input{accent-color:var(--g)}
/* Briefing */
.brief-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:14px 0}
.brief-item{padding:16px;border-radius:18px}
.brief-item .bi{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(255,90,95,.15);color:#ffb0b2;margin-bottom:8px}
.brief-item .bi svg{width:26px;height:26px}
.statrow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{padding:16px;border-radius:18px;text-align:center}
.stat .v{font-family:var(--disp);font-size:2.3rem;color:#ff9ea1;text-shadow:0 0 16px rgba(255,90,95,.45)}
.stat.good .v{color:var(--g);text-shadow:0 0 16px rgba(61,245,138,.45)}
.stat .l{font-size:.85rem;color:var(--mut)}
.media{position:relative;border-radius:18px;overflow:hidden;background:rgba(0,0,0,.25);border:1px solid var(--line);margin:0}
.media video,.media img{display:block;width:100%;height:auto}
.media .fallback{display:none;padding:22px;text-align:center;color:var(--mut)}
.media.missing video,.media.missing img{display:none}.media.missing .fallback{display:block}
.media figcaption{font-size:.78rem;color:var(--mut);padding:7px 12px;background:rgba(0,0,0,.3)}
/* ===== Game ===== */
.game{display:grid;grid-template-rows:auto 1fr auto;min-height:100vh}
#hud{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:8px 14px;background:linear-gradient(180deg,rgba(3,10,24,.92),rgba(3,10,24,.65));backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{font-family:var(--disp);font-weight:800;font-size:1.05rem;line-height:1;color:#7dffb2;text-shadow:0 0 12px rgba(61,245,138,.5);white-space:nowrap}
.logo small{display:block;color:var(--b);font-size:.62rem;letter-spacing:.18em;text-shadow:none;margin-top:3px}
.roundpath{flex:1;min-width:0;display:flex;justify-content:center}
.roundpath svg{width:100%;max-width:420px;height:46px}
.planet{transition:all .4s}
.planet.cur{filter:drop-shadow(0 0 6px #3df58a)}
.cu-gem{display:flex;align-items:center;gap:6px;font-family:var(--disp);font-size:1.25rem;padding:4px 12px 4px 6px;border-radius:99px;background:rgba(255,201,74,.12);border:1px solid rgba(255,201,74,.4);color:#ffe08f}
.cu-gem svg{width:28px;height:28px}
.chair{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--mut)}
.chair svg{width:36px;height:36px}
.chair b{display:block;color:var(--ink);font-family:var(--disp);font-size:.95rem}
.hud-btns{display:flex;gap:6px}
#board{display:grid;grid-template-columns:300px minmax(0,1fr) 350px;gap:14px;padding:14px;align-items:start;max-width:1700px;width:100%;margin:0 auto}
/* Dashboard */
#dash{padding:14px}
#dash h3{display:flex;justify-content:space-between;align-items:center;margin:0 0 8px}
.gauges{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.gauge svg{width:100%;max-width:86px;height:auto;overflow:visible}
.gauge .gv{font-family:var(--disp);font-size:20px;fill:#fff}
.gauge .lbl{font-size:.72rem;color:var(--mut);line-height:1.15;margin-top:2px}
.gauge circle.arc{transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1),stroke .6s}
.doughrow{display:grid;grid-template-columns:1fr 58px;gap:8px;align-items:center;margin-top:8px}
.dough svg{width:100%;height:auto;overflow:visible}
.wedge{transition:d .9s cubic-bezier(.2,.8,.2,1),fill .8s}
.dough .ctr{font-family:var(--disp);fill:#fff}
.costbar{position:relative;height:178px;border-radius:14px;background:rgba(0,0,0,.3);border:1px solid var(--line);overflow:hidden}
.costbar .band{position:absolute;left:0;right:0;background:repeating-linear-gradient(45deg,rgba(61,245,138,.22) 0 6px,rgba(61,245,138,.1) 6px 12px);border-top:1.5px dashed var(--g);border-bottom:1.5px dashed var(--g)}
.costbar .fill{position:absolute;left:6px;right:6px;bottom:0;border-radius:10px 10px 0 0;background:linear-gradient(180deg,#ff9f43,#ff5a5f);transition:height 1.1s cubic-bezier(.2,.8,.2,1),background .6s;box-shadow:0 0 18px rgba(255,120,80,.5)}
.costbar.ok .fill{background:linear-gradient(180deg,#7dffb2,#18c76a);box-shadow:0 0 18px rgba(61,245,138,.6)}
.costbar .cv{position:absolute;left:0;right:0;top:4px;text-align:center;font-family:var(--disp);font-size:.95rem;z-index:2;text-shadow:0 1px 3px #000}
.costlbl{font-size:.68rem;color:var(--mut);text-align:center;margin-top:4px;line-height:1.1}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.chip{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:6px 8px}
.chip .k{font-size:.68rem;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.chip .v{font-family:var(--disp);font-size:1.1rem}
.minibar{height:5px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:3px}
.minibar i{display:block;height:100%;background:linear-gradient(90deg,var(--b),var(--teal));transition:width 1s}
.blist{display:none;margin-top:8px;font-size:.74rem}
#dash.open .blist{display:block}
.blist div{display:flex;justify-content:space-between;gap:6px;padding:2px 0;border-bottom:1px dashed rgba(255,255,255,.08)}
/* Map */
#mapwrap{position:relative;padding:8px;border-radius:22px;overflow:hidden}
svg.map{display:block;width:100%;height:auto;border-radius:16px;touch-action:manipulation}
.land{fill:#16324d;stroke:#2c5578;stroke-width:.5}
.terr{fill:#1c5a52;stroke:#46c79a;stroke-width:.6;stroke-opacity:.6;cursor:pointer;transition:fill .3s,filter .3s,opacity .3s}
.terr:hover,.rg.hover .terr{fill:#24806d}
.rg.fit-best .terr{fill:#2fd67e;filter:url(#glowG)}
.rg.fit-good .terr{fill:#2f78c9}
.rg.fit-poor .terr{fill:#2a3a4c;opacity:.75}
.rg.sel .terr{fill:#3df58a;stroke:#fff;stroke-width:1.2}
.hub{cursor:pointer}
.hub .halo{fill:url(#hubGlow);opacity:.75;transform-box:fill-box;transform-origin:center;animation:hubPulse 3s ease-in-out infinite}
.rg.fit-best .hub .halo{opacity:1;animation-duration:1.2s}
@keyframes hubPulse{0%,100%{transform:scale(.85);opacity:.5}50%{transform:scale(1.15);opacity:.95}}
.hub .core{fill:#0b2340;stroke:#7dffb2;stroke-width:2}
.rg.met .hub .core{stroke:#ffc94a;stroke-width:3}
.hub .lab{font-family:var(--disp);font-size:13px;fill:#fff;paint-order:stroke;stroke:#03101f;stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.hub .cnt{font-family:var(--disp);font-size:12px;fill:#fff;pointer-events:none}
.hub .star{font-size:13px;fill:#ffc94a;pointer-events:none}
.badge-dot{stroke:#03101f;stroke-width:1.5}
.snap{transform-box:fill-box;transform-origin:center;animation:snap .8s ease-out forwards;fill:none;stroke:#7dffb2;stroke-width:3}
@keyframes snap{from{transform:scale(.4);opacity:1}to{transform:scale(3.2);opacity:0}}
.flow{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-dasharray:6 10;animation:flow 1.6s linear infinite;filter:url(#glowS)}
.flow-base{fill:none;stroke-width:6;stroke-linecap:round;opacity:.18}
@keyframes flow{to{stroke-dashoffset:-32}}
.particle{filter:url(#glowS)}
.maplegend{position:absolute;left:18px;bottom:16px;display:flex;gap:10px;flex-wrap:wrap;font-size:.72rem;color:var(--mut);background:rgba(3,10,24,.6);padding:6px 10px;border-radius:12px;border:1px solid var(--line);pointer-events:none}
.maplegend b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.maphint{position:absolute;right:18px;top:16px;font-size:.78rem;background:rgba(3,10,24,.65);border:1px solid var(--line);padding:6px 10px;border-radius:12px;pointer-events:none}
/* Side panel */
#side{padding:14px;display:flex;flex-direction:column;gap:12px}
.threat{position:relative;border-radius:16px;padding:12px 14px;background:linear-gradient(150deg,rgba(255,90,95,.18),rgba(80,20,40,.25));border:1px solid rgba(255,120,120,.35)}
.threat.safe{background:linear-gradient(150deg,rgba(61,245,138,.16),rgba(10,60,40,.25));border-color:rgba(61,245,138,.4)}
.threat .th{display:flex;align-items:center;gap:10px}
.threat .th svg{width:38px;height:38px;flex:none}
.threat .th b{font-family:var(--disp);font-size:1.05rem}
.checks{list-style:none;padding:0;margin:8px 0 2px}
.checks li{display:flex;gap:8px;align-items:flex-start;font-size:.84rem;margin:4px 0}
.checks .ck{flex:none;width:18px;height:18px;border-radius:6px;display:grid;place-items:center;font-size:.72rem;background:rgba(255,255,255,.08);border:1px solid var(--line)}
.checks .ok .ck{background:var(--g2);border-color:var(--g);color:#03210f}
.panel-title{font-size:.72rem;letter-spacing:.14em;color:var(--mut);text-transform:uppercase;font-weight:700}
.action-head{display:flex;gap:12px;align-items:center;margin:6px 0}
.action-head .art{width:62px;height:62px;flex:none;border-radius:16px;display:grid;place-items:center}
.action-head .art svg{width:44px;height:44px}
.syn,.trd{border-radius:14px;padding:10px 12px;font-size:.85rem}
.syn{background:rgba(61,245,138,.1);border:1px solid rgba(61,245,138,.32)}
.trd{background:rgba(255,159,67,.1);border:1px solid rgba(255,159,67,.35)}
.syn h4,.trd h4{margin:0 0 4px;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase}
.syn h4{color:var(--g)}.trd h4{color:#ffc58a}
.syn ul,.trd ul{margin:0;padding-left:18px}.syn li,.trd li{margin:2px 0}
.fact{font-size:.78rem;color:var(--mut);border-top:1px dashed var(--line);padding-top:8px}
.waste{border-radius:14px;padding:10px 12px;background:rgba(255,255,255,.05);border:1px solid var(--line);transition:transform .15s,border-color .15s}
.waste:hover{border-color:rgba(61,245,138,.5)}
.waste.done{background:rgba(61,245,138,.1);border-color:rgba(61,245,138,.4)}
.waste.locked{opacity:.55}
.waste .wt{display:flex;gap:10px;align-items:center;font-weight:700;font-size:.9rem}
.waste .wt svg{width:30px;height:30px;flex:none}
.waste .wt span.n{flex:1}
.waste details{font-size:.8rem;margin-top:4px;color:var(--mut)}
.waste-list{display:flex;flex-direction:column;gap:8px;max-height:56vh;overflow:auto;padding-right:4px}
/* Tray & cards */
#tray{position:sticky;bottom:0;z-index:25;padding:10px 14px 14px;background:linear-gradient(0deg,rgba(3,10,24,.95),rgba(3,10,24,.7) 70%,rgba(3,10,24,0));}
.tray-inner{max-width:1700px;margin:0 auto;display:grid;grid-template-columns:120px minmax(0,1fr) 260px;gap:14px;align-items:end}
.deck{position:relative;height:150px}
.deck .dk{position:absolute;bottom:0;left:10px;width:96px;height:132px;border-radius:14px;background:linear-gradient(150deg,#1f5f9a,#0b2a4d);border:2px solid rgba(160,220,255,.35);box-shadow:0 6px 18px rgba(0,0,0,.4)}
.deck .dk:nth-child(2){transform:translate(4px,-4px)}.deck .dk:nth-child(3){transform:translate(8px,-8px);display:grid;place-items:center}
.deck .dk svg{width:52px;height:52px;opacity:.9}
.deck .dc{position:absolute;bottom:-4px;left:10px;width:104px;text-align:center;font-size:.72rem;color:var(--mut)}
.hand{display:flex;gap:14px;justify-content:center;align-items:flex-end;min-height:236px;perspective:900px}
.card{--dc:#4da3ff;position:relative;width:170px;height:230px;flex:none;border-radius:18px;padding:0;border:0;cursor:grab;color:var(--ink);text-align:left;font:inherit;background:linear-gradient(165deg,color-mix(in srgb,var(--dc) 55%,#0b2340),#0b2340 58%);box-shadow:0 0 0 2px color-mix(in srgb,var(--dc) 80%,#fff 0%),0 12px 28px rgba(0,0,0,.45);transform-style:preserve-3d;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,opacity .3s;touch-action:pan-x;user-select:none;-webkit-user-select:none}
.card::before{content:"";position:absolute;inset:5px;border-radius:14px;border:1.5px solid rgba(255,255,255,.22);pointer-events:none}
.card:hover{transform:translateY(-14px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(1.04);box-shadow:0 0 0 2px var(--dc),0 0 30px color-mix(in srgb,var(--dc) 60%,transparent),0 22px 38px rgba(0,0,0,.5)}
.card.sel{transform:translateY(-26px) scale(1.06);box-shadow:0 0 0 3px #fff,0 0 36px var(--dc),0 24px 40px rgba(0,0,0,.5)}
.card.cant{filter:grayscale(.7) brightness(.7)}
.card.dragging{opacity:.25}
.card .art{position:absolute;left:12px;right:12px;top:30px;height:96px;border-radius:12px;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--dc) 55%,transparent),rgba(0,0,0,.25) 70%);overflow:hidden}
.card .art::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.18) 45%,transparent 60%);transform:translateX(-100%);transition:transform .6s}
.card:hover .art::after{transform:translateX(100%)}
.card .art svg{width:70px;height:70px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4))}
.card .dom{position:absolute;top:9px;left:0;right:0;text-align:center;font-size:.6rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:color-mix(in srgb,var(--dc) 70%,#fff)}
.card .nm{position:absolute;left:12px;right:12px;top:132px;font-family:var(--disp);font-size:.98rem;line-height:1.12;height:56px;display:flex;align-items:center}
.card .best{position:absolute;left:12px;right:12px;bottom:12px;font-size:.66rem;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gem{position:absolute;width:34px;height:34px;display:grid;place-items:center;font-family:var(--disp);font-size:1rem;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);z-index:2}
.gem svg{position:absolute;inset:0;width:100%;height:100%;z-index:-1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.gem.cost{top:-8px;left:-8px}.gem.out{top:-8px;right:-8px}.gem.syn{bottom:26px;right:-8px;width:30px;height:30px;font-size:.85rem}
.card.deal{animation:deal .6s cubic-bezier(.2,.9,.25,1.15) both}
@keyframes deal{from{opacity:0;transform:translate(-340px,40px) rotate(-25deg) scale(.6)}to{opacity:1;transform:none}}
.ghost-card{position:fixed;z-index:200;pointer-events:none;transform:translate(-50%,-50%) rotate(-6deg) scale(.85);transition:none;box-shadow:0 0 0 3px #fff,0 0 40px var(--dc),0 30px 60px rgba(0,0,0,.6)!important}
.tray-actions{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.steps{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-bottom:4px}
.steps span{font-size:.68rem;font-weight:700;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.06);color:var(--dim);border:1px solid transparent}
.steps span.on{background:rgba(77,163,255,.25);color:#cfe6ff;border-color:var(--b)}
.steps span.done{color:var(--g);background:rgba(61,245,138,.1)}
/* FX */
#fx{position:fixed;inset:0;pointer-events:none;z-index:300}
.floaty{position:fixed;z-index:310;pointer-events:none;font-family:var(--disp);font-size:1.3rem;font-weight:800;text-shadow:0 2px 0 rgba(0,0,0,.5),0 0 12px currentColor;animation:floaty 1.5s ease-out forwards;white-space:nowrap}
@keyframes floaty{0%{opacity:0;transform:translate(-50%,0) scale(.6)}15%{opacity:1;transform:translate(-50%,-14px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-80px) scale(1)}}
.flyer{position:fixed;z-index:305;pointer-events:none;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;transition:transform .55s cubic-bezier(.5,0,.2,1),opacity .55s}
.flyer svg{width:44px;height:44px}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:290;box-shadow:inset 0 0 160px 40px rgba(255,40,60,.65);animation:vig 1.1s ease-out forwards}
@keyframes vig{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
.shake{animation:shake .55s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
.morph{position:fixed;z-index:295;pointer-events:none;display:grid;place-items:center;transform:translate(-50%,-50%)}
.morph .from,.morph .to{grid-area:1/1;width:120px;height:120px}
.morph .from{animation:dissolve 1.1s ease-in forwards}
.morph .to{opacity:0;animation:rise 1.2s .7s cubic-bezier(.2,.9,.3,1.3) forwards;filter:drop-shadow(0 0 20px #3df58a)}
.morph .cap{grid-area:2/1;font-family:var(--disp);font-size:1.2rem;color:#7dffb2;text-shadow:0 0 12px #3df58a;opacity:0;animation:rise 1s .9s forwards;margin-top:8px;text-align:center}
@keyframes dissolve{0%{opacity:1;filter:none;transform:scale(1)}60%{opacity:.6;filter:blur(2px) grayscale(1)}100%{opacity:0;filter:blur(10px);transform:scale(1.4) translateY(-10px)}}
@keyframes rise{from{opacity:0;transform:translateY(30px) scale(.6)}to{opacity:1;transform:none}}
/* Modal */
.modal{position:fixed;inset:0;background:rgba(2,8,20,.7);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:100;padding:14px;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0}}
.modal-card{max-width:780px;width:100%;max-height:92vh;overflow:auto;padding:22px 24px;animation:pop .4s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(20px)}}
.modal-card .close{float:right}
/* Threat flip */
.flip{perspective:1200px;width:min(360px,100%);height:420px;margin:10px auto}
.flip-in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,.9,.3,1)}
.flip.flipped .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:20px;display:flex;flex-direction:column;overflow:hidden}
.face.back{background:radial-gradient(circle at 50% 40%,#1f6fb8,#0b2a4d 60%,#06162b);border:2px solid rgba(160,220,255,.4);align-items:center;justify-content:center;box-shadow:0 0 40px rgba(77,163,255,.35)}
.face.back svg{width:150px;height:150px}
.face.front{transform:rotateY(180deg);background:linear-gradient(165deg,#5a1a2e,#2a0f22 50%,#160a1a);border:2px solid rgba(255,120,120,.55);box-shadow:0 0 40px rgba(255,90,95,.4)}
.face.front.calm{background:linear-gradient(165deg,#145a44,#0b2a33 55%,#071a24);border-color:rgba(61,245,138,.5);box-shadow:0 0 40px rgba(61,245,138,.35)}
.face.front .ti{width:86px;height:86px;margin:4px auto 6px}
.face.front h3{text-align:center;font-size:1.3rem}
.face.front p{font-size:.88rem;margin:4px 0}
/* Summary rows */
.kv{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed rgba(255,255,255,.1);font-size:.92rem}
.kv b{font-family:var(--disp);font-variant-numeric:tabular-nums}
.up{color:var(--g)}.down{color:#ffb27a}
/* End */
.compare{display:grid;grid-template-columns:1fr 70px 1fr;gap:12px;align-items:stretch}
.compare .side-a{padding:16px;border-radius:20px;background:linear-gradient(160deg,rgba(90,100,115,.35),rgba(30,35,45,.45));border:1px solid rgba(200,210,220,.2)}
.compare .side-b{padding:16px;border-radius:20px;background:linear-gradient(160deg,rgba(61,245,138,.22),rgba(10,60,50,.4));border:1px solid rgba(61,245,138,.45);box-shadow:0 0 40px rgba(61,245,138,.18)}
.compare .arrow{display:grid;place-items:center}
.compare .arrow svg{width:64px;height:64px;filter:drop-shadow(0 0 12px #3df58a)}
.compare .icons{display:flex;gap:8px;margin:6px 0 8px}.compare .icons svg{width:34px;height:34px}
.medal{width:160px;height:160px;margin:0 auto;display:block;filter:drop-shadow(0 0 30px rgba(61,245,138,.55));animation:medal 1s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes medal{from{transform:scale(.3) rotate(-30deg);opacity:0}}
.bigstats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.bigstats .stat .v{color:var(--g);text-shadow:0 0 16px rgba(61,245,138,.45)}
.pledge{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.06);border:1.5px solid var(--line);margin:10px 0;cursor:pointer;transition:all .2s}

const QUOTES=[{"text": "The interdependence is the reality, the competition is the sentiment.", "author": "S. Jaishankar", "role": "External Affairs Minister of India", "source": "Remarks at Asia Society, New York, during UN General Assembly week (video by CRUX/News18, c. 3:18)", "year": 2026, "url": "https://youtu.be/oyRbYwQymIs", "theme": "interdependence"}, {"text": "We are caught in an inescapable network of mutuality, tied in a single garment of destiny. Whatever affects one directly, affects all indirectly.", "author": "Martin Luther King Jr.", "role": "Civil-rights leader; Nobel Peace laureate 1964", "source": "Letter from Birmingham Jail (16 April 1963)", "year": 1963, "url": "https://www.africa.upenn.edu/Articles_Gen/Letter_Birmingham.html", "theme": "interdependence"}, {"text": "Interdependence obliges us to think of one world with a common plan.", "author": "Pope Francis", "role": "Head of the Catholic Church (2013–2025)", "source": "Encyclical Laudato si', para. 164", "year": 2015, "url": "https://www.vatican.va/content/francesco/en/encyclicals/documents/papa-francesco_20150524_enciclica-laudato-si.html", "theme": "interdependence"}, {"text": "For, in the final analysis, our most basic common link is that we all inhabit this small planet. We all breathe the same air. We all cherish our children's future. And we are all mortal.", "author": "John F. Kennedy", "role": "35th President of the United States", "source": "Commencement Address at American University ('A Strategy of Peace'), Washington DC, 10 June 1963", "year": 1963, "url": "https://www.jfklibrary.org/archives/other-resources/john-f-kennedy-speeches/american-university-19630610", "theme": "interdependence"}, {"text": "Peace has been said to be indivisible, so is freedom, so is prosperity now, and so also is disaster in this one world that can no longer be split into isolated fragments.", "author": "Jawaharlal Nehru", "role": "First Prime Minister of India", "source": "'A Tryst with Destiny', speech to the Constituent Assembly, 14–15 August 1947", "year": 1947, "url": "https://nehruarchive.in/documents/a-tryst-with-destiny-aug-14-15-1947-j9le4z", "theme": "resilience"}, {"text": "No substantial famine has ever occurred in any independent country with a democratic form of government and a relatively free press.", "author": "Amartya Sen", "role": "Economist; Nobel laureate in Economic Sciences 1998", "source": "Development as Freedom (Knopf, 1999), ch. 7", "year": 1999, "url": "https://www.gdrc.org/sustdev/poverty/sen-development_as_freedom.pdf", "theme": "resilience"}, {"text": "It has been said that the United Nations was not created in order to bring us to heaven, but in order to save us from hell.", "author": "Dag Hammarskjöld", "role": "2nd UN Secretary-General", "source": "Address at University of California Convocation, Berkeley, 13 May 1954 (UN press release SG/382)", "year": 1954, "url": "https://ask.un.org/faq/14623", "theme": "resilience"}, {"text": "The Earth is one but the world is not.", "author": "Gro Harlem Brundtland / World Commission on Environment and Development", "role": "Commission chaired by Brundtland (former Prime Minister of Norway)", "source": "Our Common Future (UN A/42/427), ch. 1 'A Threatened Future', para. 1", "year": 1987, "url": "http://www.un-documents.net/ocf-01.htm", "theme": "one-family"}, {"text": "To me, it underscores our responsibility to deal more kindly with one another, and to preserve and cherish the pale blue dot, the only home we've ever known.", "author": "Carl Sagan", "role": "Astronomer and science communicator", "source": "Pale Blue Dot: A Vision of the Human Future in Space (1994)", "year": 1994, "url": "https://www.planetary.org/worlds/pale-blue-dot", "theme": "one-family"}, {"text": "'This one is kin, that one is not' – so reckon the small-minded; for those of noble conduct, the whole earth is one family (vasudhaiva kutumbakam).", "author": "Maha Upanishad", "role": "Ancient Sanskrit text", "source": "Maha Upanishad 6.71 (English translation of the Sanskrit)", "url": "https://sanskritdocuments.org/doc_upanishhat/maha.html", "theme": "one-family"}, {"text": "Vasudhaiva Kutumbakam – One Earth · One Family · One Future", "author": "India's G20 Presidency", "role": "Theme of India's G20 Presidency (2022–23)", "source": "Press Information Bureau, Govt. of India: 'Unveiling of the Logo, Theme and Website of India's G20 Presidency' (Nov 2022)", "year": 2022, "url": "https://www.pib.gov.in/PressReleseDetailm.aspx?PRID=1874524", "theme": "one-family"}, {"text": "My humanity is caught up, is inextricably bound up, in yours. We belong in a bundle of life. We say, 'A person is a person through other persons.'", "author": "Desmond Tutu", "role": "Archbishop; Nobel Peace laureate 1984; chair of South Africa's Truth and Reconciliation Commission", "source": "No Future Without Forgiveness (Doubleday, 1999), p. 31 (on Ubuntu)", "year": 1999, "url": "https://cepreaching.org/preaching-connections/reading/no-future-without-forgiveness-2/", "theme": "one-family"}, {"text": "Where the world has not been broken up into fragments by narrow domestic walls", "author": "Rabindranath Tagore", "role": "Poet; Nobel laureate in Literature 1913", "source": "Gitanjali (Song Offerings), poem 35 (English edition 1912)", "year": 1912, "url": "https://www.gutenberg.org/ebooks/7164", "theme": "one-family"}, {"text": "We are all members of the Earth family, and our first and highest duty is to take care of Mother Earth: Prithvi, Gaia, Pachamama – however you name her.", "author": "Vandana Shiva", "role": "Physicist, ecologist, founder of Navdanya", "source": "'Earth Rights' (essay), Bhoomi Magazine, 30 June 2011 (also in Resurgence)", "year": 2011, "url": "https://bhoomimagazine.org/2011/06/30/earth-rights/", "theme": "one-family"}, {"text": "then all within the four seas will be his brothers.", "author": "Zixia (Tsze-hsiâ), disciple of Confucius", "role": "Confucian scholar", "source": "The Analects 12.5, tr. James Legge", "url": "http://wengu.tartarie.com/wg/?l=Lunyu&lang=en&no=298", "theme": "one-family"}, {"text": "We appeal, as human beings, to human beings: Remember your humanity, and forget the rest.", "author": "Bertrand Russell & Albert Einstein", "role": "Philosopher; physicist", "source": "Russell–Einstein Manifesto (London, 9 July 1955)", "year": 1955, "url": "https://pugwash.org/1955/07/09/statement-manifesto/", "theme": "one-family"}, {"text": "Make the world work, for 100% of humanity, in the shortest possible time, through spontaneous cooperation, without ecological offense or the disadvantage of anyone.", "author": "R. Buckminster Fuller", "role": "Architect, systems theorist; coined 'Spaceship Earth'", "source": "Stated objective of Fuller's World Game, as published by the Buckminster Fuller Institute", "url": "https://www.bfi.org/about-fuller/big-ideas/world-game/", "theme": "cooperation"}, {"text": "States can serve the interests of their citizens by recognizing common interests and pursuing them in unity.", "author": "Kofi Annan", "role": "7th UN Secretary-General; Nobel Peace laureate 2001", "source": "Nobel Lecture, Oslo, 10 December 2001", "year": 2001, "url": "https://www.nobelprize.org/prizes/peace/2001/annan/lecture/", "theme": "cooperation"}, {"text": "We have a choice. Collective action or collective suicide. It is in our hands.", "author": "António Guterres", "role": "9th UN Secretary-General", "source": "Video message to the Petersberg Climate Dialogue, Berlin, 18 July 2022", "year": 2022, "url": "https://press.un.org/en/2022/sgsm21376.doc.htm", "theme": "cooperation"}, {"text": "In the face of isolationism, protectionism, racism – the simple concept of looking outwardly and beyond ourselves, of kindness and collectivism, might just be as good a starting point as any.", "author": "Jacinda Ardern", "role": "40th Prime Minister of New Zealand", "source": "New Zealand National Statement to the UN General Assembly, 27 September 2018", "year": 2018, "url": "https://newsroom.co.nz/2018/09/27/full-text-pms-speech-to-the-united-nations/", "theme": "cooperation"}, {"text": "A core goal of public policy should be to facilitate the development of institutions that bring out the best in humans.", "author": "Elinor Ostrom", "role": "Political economist; Nobel laureate in Economic Sciences 2009", "source": "Prize Lecture 'Beyond Markets and States: Polycentric Governance of Complex Economic Systems', Stockholm, 8 December 2009", "year": 2009, "url": "https://www.nobelprize.org/uploads/2018/06/ostrom_lecture.pdf", "theme": "commons"}, {"text": "Traditional forms of national sovereignty raise particular problems in managing the 'global commons' and their shared ecosystems - the oceans, outer space, and Antarctica.", "author": "Gro Harlem Brundtland / World Commission on Environment and Development", "role": "Commission chaired by Brundtland", "source": "Our Common Future (UN A/42/427), Overview, para. 82 'Managing the Commons'", "year": 1987, "url": "http://www.un-documents.net/ocf-ov.htm", "theme": "commons"}, {"text": "Between social and planetary boundaries lies an environmentally safe and socially just space in which humanity can thrive.", "author": "Kate Raworth", "role": "Economist, creator of Doughnut Economics", "source": "'What on Earth is the Doughnut?', kateraworth.com", "url": "https://www.kateraworth.com/doughnut/", "theme": "planetary-boundaries"}, {"text": "What are the planetary boundaries within which we can safely operate?", "author": "Johan Rockström", "role": "Earth-system scientist; led the 2009 planetary boundaries framework", "source": "TED talk 'Let the environment guide our development' (TEDGlobal 2010)", "year": 2010, "url": "https://www.ted.com/talks/johan_rockstrom_let_the_environment_guide_our_development", "theme": "planetary-boundaries"}, {"text": "1.5 is what we need to survive. Two degrees is a death sentence", "author": "Mia Amor Mottley", "role": "Prime Minister of Barbados", "source": "Address to the World Leaders Summit, COP26, Glasgow, 1 November 2021", "year": 2021, "url": "https://barbadostoday.bb/2021/11/01/pm-says-sids-do-not-need-death-sentence/", "theme": "planetary-boundaries"}, {"text": "There is no Plan B because we do not have planet B.", "author": "Ban Ki-moon", "role": "8th UN Secretary-General", "source": "Remarks at the People's Climate March, New York, 21 September 2014", "year": 2014, "url": "https://media.un.org/unifeed/en/asset/d117/d1175986", "theme": "planetary-boundaries"}, {"text": "Nature produces enough for our wants from day-to-day, and if only everybody took enough for himself and nothing more, there would be no pauperism in this world.", "author": "Mahatma Gandhi", "role": "Leader of India's independence movement", "source": "Speech 'Does Economic Progress Clash with Real Progress?', Muir Central College Economic Society, Allahabad, 22 December 1916 (in Speeches and Writings of Mahatma Gandhi, 4th edn, pp. 384–85)", "year": 1916, "url": "https://www.mkgandhi.org/trusteeship/chap01.php", "theme": "planetary-boundaries"}, {"text": "Today we have economies that need to grow, whether or not they make us thrive. What we need are economies that make us thrive, whether or not they grow.", "author": "Kate Raworth", "role": "Economist, creator of Doughnut Economics", "source": "Doughnut Economics: Seven Ways to Think Like a 21st-Century Economist (2017)", "year": 2017, "url": "https://www.resilience.org/stories/2017-04-06/doughnut-economics/", "theme": "social-foundation"}, {"text": "Development can be seen, it is argued here, as a process of expanding the real freedoms that people enjoy.", "author": "Amartya Sen", "role": "Economist; Nobel laureate in Economic Sciences 1998", "source": "Development as Freedom (Knopf, 1999), Introduction", "year": 1999, "url": "https://www.gdrc.org/sustdev/poverty/sen-development_as_freedom.pdf", "theme": "social-foundation"}, {"text": "I believe that we can create a poverty-free world because poverty is not created by poor people.", "author": "Muhammad Yunus", "role": "Founder of Grameen Bank; Nobel Peace laureate 2006", "source": "Nobel Lecture, Oslo, 10 December 2006", "year": 2006, "url": "https://www.nobelprize.org/prizes/peace/2006/yunus/lecture/", "theme": "social-foundation"}, {"text": "Overcoming poverty is not a gesture of charity. It is an act of justice.", "author": "Nelson Mandela", "role": "First President of democratic South Africa; Nobel Peace laureate 1993", "source": "Address for the 'Make Poverty History' campaign, Trafalgar Square, London, 3 February 2005", "year": 2005, "url": "http://www.mandela.gov.za/mandela_speeches/2005/050203_poverty.htm", "theme": "social-foundation"}, {"text": "What value is being created, and is it good for people and the planet?", "author": "Mariana Mazzucato", "role": "Economist, UCL Institute for Innovation and Public Purpose", "source": "Mission Economy: A Moonshot Guide to Changing Capitalism (Allen Lane, 2021), Acknowledgements", "year": 2021, "url": "https://static.fnac-static.com/multimedia/PT/pdf/9780241419731.pdf", "theme": "social-foundation"}, {"text": "This world in arms is not spending money alone. It is spending the sweat of its laborers, the genius of its scientists, the hopes of its children.", "author": "Dwight D. Eisenhower", "role": "34th President of the United States", "source": "'The Chance for Peace' address, American Society of Newspaper Editors, 16 April 1953", "year": 1953, "url": "https://www.eisenhowerlibrary.gov/eisenhowers/quotes", "theme": "peace-dividend", "note": "shorter cut from the same speech (quotes_review.md)"}, {"text": "The world is spending far more on waging war than on building peace.", "author": "António Guterres", "role": "9th UN Secretary-General", "source": "Press briefing launching his report on military expenditure, UN HQ, 9 September 2025", "year": 2025, "url": "https://media.un.org/unifeed/en/asset/d344/d3445539", "theme": "peace-dividend"}, {"text": "Under a system of perfectly free commerce, each country naturally devotes its capital and labour to such employments as are most beneficial to each.", "author": "David Ricardo", "role": "Political economist; formulated comparative advantage", "source": "On the Principles of Political Economy and Taxation (1817), ch. 7 'On Foreign Trade'", "year": 1817, "url": "https://www.gutenberg.org/ebooks/33310", "theme": "specialisation"}, {"text": "It is the maxim of every prudent master of a family, never to attempt to make at home what it will cost him more to make than to buy.", "author": "Adam Smith", "role": "Moral philosopher and political economist", "source": "An Inquiry into the Nature and Causes of the Wealth of Nations (1776), Book IV, ch. II", "year": 1776, "url": "https://www.gutenberg.org/ebooks/3300", "theme": "specialisation"}, {"text": "In the course of history, there comes a time when humanity is called to shift to a new level of consciousness, to reach a higher moral ground.", "author": "Wangari Maathai", "role": "Founder of the Green Belt Movement; Nobel Peace laureate 2004", "source": "Nobel Lecture, Oslo, 10 December 2004", "year": 2004, "url": "https://www.nobelprize.org/prizes/peace/2004/maathai/lecture/", "theme": "hope-action"}, {"text": "Impossible is not a fact, it's an attitude.", "author": "Christiana Figueres", "role": "Executive Secretary of the UNFCCC (2010–2016), architect of the Paris Agreement", "source": "TED2016 talk 'The inside story of the Paris climate agreement', Vancouver", "year": 2016, "url": "https://blog.ted.com/impossible-isnt-a-fact-its-an-attitude-christiana-figueres-at-ted2016/", "theme": "hope-action"}, {"text": "The time to end poverty has arrived, although hard work lies ahead.", "author": "Jeffrey D. Sachs", "role": "Economist; Director, UN Sustainable Development Solutions Network", "source": "The End of Poverty: Economic Possibilities for Our Time (2005), 'Our Next Steps'", "year": 2005, "url": "https://www.spiritualityandpractice.com/book-reviews/excerpts/view/24545", "theme": "hope-action"}, {"text": "At first I thought I was fighting to save rubber trees, then I thought I was fighting to save the Amazon rainforest. Now I realise I am fighting for humanity.", "author": "Chico Mendes", "role": "Brazilian rubber-tapper, union leader and environmentalist (1944–1988)", "source": "As quoted in The Guardian, 'Brazil salutes Chico Mendes 25 years after his murder' (20 Dec 2013)", "url": "https://www.theguardian.com/world/2013/dec/20/brazil-salutes-chico-mendes-25-years-after-murder", "theme": "hope-action"}];

vez joué {0} jours sur les {1} derniers. Les jours de repos font partie du plan ; aucune série à perdre.", "{0} CU": "{0} CU", "{0} has a contract": "{0} a un contrat", "{0} in deck": "{0} dans la pioche", "{0} of {1}": "{0} sur {1}", "{0} Planetary Health Check": "Bilan de santé planétaire {0}", "{0} pressure {1}": "Pression sur « {0} » : {1}", "{0} pressure {1} (trade-off)": "Pression sur « {0} » : {1} (compromis)", "{0} prosperity": "{0} prospérité", "{0} protection missing": "{0} protection manquante", "{0} protections missing": "{0} protections manquantes", "{0} resilience": "{0} résilience", "{0} would be the only region in {1}: a single point of failure for now": "{0} serait la seule région en {1} : un point de défaillance unique pour l’instant", "{0} · A Tough World": "{0} · Un monde difficile", "{0} · Score at round {1}": "{0} · Score à la manche {1}", "{0} · Super El Niño Year": "{0} · Année Super El Niño", "{0}% cost": "{0} % de coûts", "{0}% system cost": "{0} % de coûts du système", "{0}% to {1}%": "{0} % à {1} %", "{0}+ regions contributing (a shared stake in peace)": "Au moins {0} régions contributrices (un intérêt commun pour la paix)", "{0}. Competitive National Model": "{0}. Modèle national compétitif", "{0}. Coordinated Specialisation": "{0}. Spécialisation coordonnée", "{0}. {1}. Cost {2}, output {3}, {4} synergy links. Best in {5}.": "{0}. {1}. Coût {2}, production {3}, {4} liens de synergie. Meilleur choix : {5}.", "{0}: {1} contracts": "{0} : {1} contrats", "{0}: {1} contracts, best fit for the held card": "{0} : {1} contrats, meilleur choix pour la carte en main", "{0}: {1} contracts, best fit for the held card, target met": "{0} : {1} contrats, meilleur choix pour la carte en main, objectif atteint", "{0}: {1} contracts, good fit for the held card": "{0} : {1} contrats, bon choix pour la carte en main", "{0}: {1} contracts, good fit for the held card, target met": "{0} : {1} contrats, bon choix pour la carte en main, objectif atteint", "{0}: {1} contracts, poor fit for the held card": "{0} : {1} contrats, mauvais choix pour la carte en main", "{0}: {1} contracts, poor fit for the held card, target met": "{0} : {1} contrats, mauvais choix pour la carte en main, objectif atteint", "{0}: {1} contracts, target met": "{0} : {1} contrats, objectif atteint", "~${0}T": "~{0} T$", "~{0} GW vs ~{1} GW": "~{0} GW contre ~{1} GW", "~{0}% of essential APIs (USP); large drug master file base; Aadhaar & UPI digital public infrastructure": "~{0} % des principes actifs essentiels (USP) ; large base de dossiers permanents de médicaments ; infrastructure publique numérique Aadhaar et UPI", "~{0}–{1}% of solar PV manufacturing capacity; ~{2}–{3}% of lithium-ion batteries; major EV and wind exporter": "~{0}–{1} % de la capacité de fabrication solaire ; ~{2}–{3} % des batteries lithium-ion ; grand exportateur de véhicules électriques et d’éolien", "– A Planetary Family Strategy Game": "– Un jeu de stratégie de la Planetary Family", "← Back to cards": "← Retour aux cartes", "↶ Undo": "↶ Annuler", "▶ PLAY": "▶ JOUER", "▶ Tap to begin": "▶ Touchez pour commencer", "♻ Choose one waste to eliminate →": "♻ Choisissez un gaspillage à éliminer →", "⚖ Trade-offs": "⚖ Compromis", "✓ The family is protected": "✓ La famille est protégée", "✔ Council agrees: sign contract": "✔ Le conseil est d’accord : signer le contrat", "✦ Synergies": "✦ Synergies", "🌿 {0} rounds · about {1}–{2} min": "🌿 {0} manches · environ {1} à {2} min", "🎬 Watch trailer": "🎬 Voir la bande-annonce", "🔒 Offline · data stays on this device": "🔒 Hors ligne · les données restent sur cet appareil", "🔗 Synergy network formed! ({0} new)": "🔗 Réseau de synergie formé ! ({0} nouveau)", "🚫 No timers, ads or loot boxes": "🚫 Pas de minuteur, de publicité ni de coffres à butin", "🤝 Cooperative, {0}–{1} players": "🤝 Coopératif, {0} à {1} joueurs", "A narrow sea lane carries much of the world’s oil. When it is threatened, fuel prices jump everywhere at once. Choke points also exist in finance (sanctions) and in market access.": "Un étroit passage maritime transporte une grande partie du pétrole mondial. Quand il est menacé, les prix des carburants bondissent partout à la fois. Des points d’étranglement existent aussi dans la finance (sanctions) et l’accès aux marchés.", "China holds ~{0}–{1}% of global solar PV manufacturing capacity; module prices fell from ~${2}/kW ({3}) to ~${4}/kW ({5}).": "La Chine détient ~{0}–{1} % de la capacité mondiale de fabrication solaire ; le prix des modules est passé d’environ {2} $/kW ({3}) à environ {4} $/kW ({5}).", "Dependencies have become leverage. Choke points are used to coerce: a narrow strait for oil, sanctions for finance, controls on market access.": "Les dépendances sont devenues des leviers. Les points d’étranglement servent à contraindre : un détroit pour le pétrole, des sanctions pour la finance, des restrictions d’accès aux marchés.", "Develop utility-scale solar/wind toward a substantial share of technical potential; export power, green hydrogen, or processed materials under sustainable rules; meet domestic access + surplus": "Développer le solaire et l’éolien à grande échelle vers une part substantielle du potentiel technique ; exporter électricité, hydrogène vert ou matériaux transformés selon des règles durables ; assurer l’accès national + un excédent", "Energy, food, medicines and data cross every border. The world has never been more interdependent, yet nations still act like rivals, duplicating each other’s industries and racing each other’s arsenals.": "L’énergie, l’alimentation, les médicaments et les données traversent toutes les frontières. Le monde n’a jamais été aussi interdépendant, et pourtant les nations agissent encore en rivales, dupliquant les industries des unes et des autres et rivalisant d’arsenaux.", "Everything stays in this browser (localStorage): the days you played, finished scenarios, chosen real-world actions and these settings. No accounts, no tracking, nothing sent anywhere.": "Tout reste dans ce navigateur (localStorage) : les jours où vous avez joué, les scénarios terminés, les actions concrètes choisies et ces paramètres. Pas de compte, pas de suivi, rien n’est envoyé nulle part.", "Expand high-quality essential API/generic capacity as a global public-good supplier; pre-agreed pandemic surge protocols; share open digital public infrastructure models": "Développer une capacité de qualité en principes actifs essentiels et génériques comme fournisseur de bien public mondial ; protocoles de crise pandémique convenus à l’avance ; partager des modèles ouverts d’infrastructure publique numérique", "Expand sustainable food and bioenergy while protecting remaining forests; contribute to global food security and nature-based solutions": "Développer une alimentation et une bioénergie durables tout en protégeant les forêts restantes ; contribuer à la sécurité alimentaire mondiale et aux solutions fondées sur la nature", "Figures are approximate and taken from Harpreet Raj Singh’s Planetary Family Framework research notes, attributed as they appear there; check the original sources before quoting them. Redundancy, Resilience and boundary “pressure” are game indices, not measurements.": "Les chiffres sont approximatifs et proviennent des notes de recherche du Planetary Family Framework de Harpreet Raj Singh, attribués tels qu’ils y figurent ; vérifiez les sources originales avant de les citer. Redondance, Résilience et « pression » sur les limites sont des indices de jeu, pas des mesures.", "Focus on high-value specialty APIs, advanced components, circular design, and regulatory standards; reduce full vertical duplication where others have scale": "Se concentrer sur les principes actifs de spécialité à forte valeur, les composants avancés, l’écoconception et les normes réglementaires ; réduire la duplication verticale complète là où d’autres ont l’échelle", "Food, fuel, fertiliser and finance shocks are arriving together, and they hit the Global South hardest. Progress on the development goals is slipping backwards.": "Les chocs sur l’alimentation, l’énergie, les engrais et la finance arrivent ensemble et frappent d’abord les pays du Sud. Les progrès vers les objectifs de développement reculent.", "Food, fuel, fertiliser and finance shocks hit the Global South hardest, and progress on the Sustainable Development Goals is slipping.": "Les chocs sur l’alimentation, l’énergie, les engrais et la finance frappent d’abord les pays du Sud, et les progrès vers les Objectifs de développement durable reculent.", "How many people are playing on this device? Pass it around. The chair rotates each round, and every decision is talked through together. Tap a portrait to change your advisor.": "Combien de personnes jouent sur cet appareil ? Faites-le passer. La présidence tourne à chaque manche et chaque décision est discutée ensemble. Touchez un portrait pour changer de conseiller.", "In an interdependent world every dependency can become leverage. Trade, finance and technology are being turned into weapons.": "Dans un monde interdépendant, chaque dépendance peut devenir un levier. Le commerce, la finance et la technologie deviennent des armes.", "India ~{0}% of essential APIs (USP); China large bulk API volume; US/EU biologics — managed specialisation with surge protocols.": "Inde ~{0} % des principes actifs essentiels (USP) ; Chine, gros volumes de principes actifs en vrac ; États-Unis/UE, biologiques — une spécialisation organisée avec des protocoles de crise.", "Lead or co-lead high-end biologics, advanced materials, AI tools for optimization, and dual-use resilience tech; open selected research; contribute to Dashboard design": "Diriger ou codiriger les biologiques de pointe, les matériaux avancés, les outils d’IA pour l’optimisation et les technologies de résilience à double usage ; ouvrir une partie de la recherche ; contribuer à la conception du tableau de bord", "Military leads breed impatience. Restraint gives way to a “use it or lose it” mindset, and a regional conflict threatens to spill over.": "Les avantages militaires engendrent l’impatience. La retenue cède la place à une logique du « s’en servir ou les perdre », et un conflit régional menace de déborder.", "No shock this first round. Use it to lay foundations: sign contracts where each region is strongest, and link them into networks.": "Pas de choc pendant cette première manche. Profitez-en pour poser les bases : signez des contrats là où chaque région est la plus forte et reliez-les en réseaux.", "Replicating China-linked supply chains in the US, Eurozone and UK would cost ~${0}T by {1} (~${2}T in manufacturing, mining, power/utilities).": "Reproduire les chaînes d’approvisionnement liées à la Chine aux États-Unis, dans la zone euro et au Royaume-Uni coûterait ~{0} T$ d’ici {1} (~{2} T$ dans l’industrie, les mines et l’énergie/services publics).", "Scale sustainable extraction/processing of battery and clean-tech minerals; develop renewable generation and green export capacity (hydrogen or direct power)": "Développer l’extraction et la transformation durables des minerais pour batteries et technologies propres ; développer la production renouvelable et une capacité d’export verte (hydrogène ou électricité directe)", "Share models for high-renewable grids, balancing, and inclusive transition; maintain near-{0}% low-carbon electricity in key systems; export design templates for universal services": "Partager des modèles de réseaux à forte part renouvelable, d’équilibrage et de transition inclusive ; maintenir près de {0} % d’électricité bas carbone dans les systèmes clés ; exporter des modèles pour les services universels", "Shared trade rules are giving way to one-to-one deals. The United Nations was designed for {0} members {1} years ago, and today it must serve a very different world.": "Les règles commerciales communes cèdent la place aux accords bilatéraux. Les Nations unies ont été conçues pour {0} membres il y a {1} ans, et doivent aujourd’hui servir un monde très différent.", "Shifting {0}–{1}% of military spending to energy transition, health surge and adaptation frees hundreds of billions per year.": "Réorienter {0} à {1} % des dépenses militaires vers la transition énergétique, les crises sanitaires et l’adaptation libère des centaines de milliards par an.", "Solar manufacturing capacity is ~{0}× demand in some assessments; matching it with high-irradiance generation (“powershoring”) uses what already exists.": "La capacité de fabrication solaire atteint ~{0}× la demande selon certaines évaluations ; l’associer à une production à fort ensoleillement (« powershoring ») valorise ce qui existe déjà.", "Specialize in high-precision components, next-gen materials, and quality/assurance systems for clean tech and health; contribute process excellence knowledge": "Se spécialiser dans les composants de haute précision, les matériaux de nouvelle génération et les systèmes qualité pour les technologies propres et la santé ; partager l’excellence des procédés", "Sustain {0}–{1}%+ share of global solar PV modules/cells/wafers and battery manufacturing; license or open surplus process knowledge; support resilience via diversified partners": "Maintenir une part de {0} à {1} % ou plus des modules, cellules et plaquettes solaires et de la fabrication de batteries ; licencier ou ouvrir le savoir-faire excédentaire ; soutenir la résilience par des partenaires diversifiés", "The world is deeply interdependent, yet it is run on rivalry. Trillions go into recreating what already exists, while billions of people fall short of the basics and the planet moves past its limits.": "Le monde est profondément interdépendant, mais il fonctionne sur la rivalité. Des milliers de milliards servent à recréer ce qui existe déjà, tandis que des milliards de personnes manquent de l’essentiel et que la planète dépasse ses limites.", "Time to throw away the old playbook and write a new one, together. This game is one draft of that playbook: interdependence as the operating principle, with countries as administrative units contributing their best to one family.": "Il est temps de jeter le vieux manuel et d’en écrire un nouveau, ensemble. Ce jeu est une ébauche de ce manuel : l’interdépendance comme principe de fonctionnement, avec des pays comme unités administratives qui apportent le meilleur d’eux-mêmes à une seule famille.", "Welcome back. You’ve dropped in on {0} of the last {1} days, and rest days count too. · Scenario {2} “Super El Niño Year”: unlocks tomorrow": "Bon retour. Vous êtes passé {0} jours sur les {1} derniers, et les jours de repos comptent aussi. · Scénario {2} « Année Super El Niño » : se débloque demain", "World military spending reached ~${0}T in {1}, the {2}th consecutive annual real rise (~{3}% of world GDP); the top {4} spend ~{5}%.": "Les dépenses militaires mondiales ont atteint ~{0} T$ en {1}, {2}e hausse réelle annuelle consécutive (~{3} % du PIB mondial) ; les {4} premiers pays en représentent ~{5} %.", "You’ve been playing for a while. Stand up, stretch, drink some water, look at something far away. The planet and your game will wait right here; nothing is lost.": "Vous jouez depuis un moment. Levez-vous, étirez-vous, buvez un peu d’eau, regardez au loin. La planète et votre partie vous attendent ici ; rien n’est perdu.", "“The Efficiency Case for a Planetary Family Framework”: competitive national model vs coordinated specialisation (SuperGrok Imagine). Muted; press play.": "« L’efficacité d’un Planetary Family Framework » : modèle national compétitif ou spécialisation coordonnée (SuperGrok Imagine). Son coupé ; appuyez sur lecture.", "<b style=\"color:var(--goldtx)\">{0} CU<\/b> · {1} cards dealt": "<b style=\"color:var(--goldtx)\">{0} CU<\/b> · {1} cartes distribuées", "<b>Draw:<\/b> each round you’re dealt {0} specialization cards and Contribution Units (<b>CU<\/b>, the gold gem).": "<b>Piocher :<\/b> à chaque manche, vous recevez {0} cartes de spécialisation et des Unités de contribution (<b>CU<\/b>, la gemme dorée).", "<b>Score:<\/b> after {0} rounds, see how far the family moved from competition to contribution.": "<b>Score :<\/b> après {0} manches, voyez jusqu’où la famille est passée de la compétition à la contribution.", "<b>Signed here:<\/b> none yet": "<b>Signé ici :<\/b> rien pour l’instant", "<b>System costs cut by {0}–{1}%<\/b> (the bar falls into the green band).": "<b>Coûts du système réduits de {0} à {1} %<\/b> (la barre descend dans la zone verte).", "<b>What protects the family<\/b> (it hits at the end of the round):": "<b>Ce qui protège la famille<\/b> (la menace frappe en fin de manche) :", "A higher <b>Flourishing Index<\/b>: close social shortfalls and turn the planetary-boundary ring green.": "Un <b>Indice d’épanouissement<\/b> plus élevé : comblez les manques sociaux et faites passer l’anneau des limites planétaires au vert.", "Africa’s onshore wind potential vs installed capacity (<{0}%).": "Potentiel éolien terrestre de l’Afrique comparé à la capacité installée (<{0} %).", "Africa’s onshore wind technical potential is ~{0} GW, with only ~{1} GW installed (<{2}%).": "Le potentiel technique éolien terrestre de l’Afrique est d’environ {0} GW, pour seulement ~{1} GW installés (<{2} %).", "Drop or tap a <b style=\"color:var(--mint)\">glowing green<\/b> region": "Déposez ou touchez une région <b style=\"color:var(--mint)\">en vert lumineux<\/b>", "Fair <b>Contribution Balance<\/b> and regional <b>contract targets ★<\/b>.": "Un <b>Équilibre des contributions<\/b> juste et des <b>objectifs de contrat ★<\/b> régionaux.", "High <b>Resilience<\/b>: don’t rely on a single region for a whole domain.": "Une <b>Résilience<\/b> élevée : ne dépendez pas d’une seule région pour tout un domaine.", "Now <b>drop or tap a glowing region<\/b>. Green is the best fit.": "Maintenant, <b>déposez ou touchez une région lumineuse<\/b>. Le vert indique le meilleur choix.", "Redundancy<br><span style=\"font-size:.{0}rem\">lower is better<\/span>": "Redondance<br><span style=\"font-size:.{0}rem\">plus bas = mieux<\/span>", "System cost<br>goal {0} to {1}%": "Coût du système<br>objectif {0} à {1} %", "<b>Assign:<\/b> <b>drag<\/b> a card onto a glowing region, or <b>tap<\/b> a card and then a region. Green is best fit, blue is fine, grey is a poor fit. The action panel shows the <b>synergies<\/b> and <b>trade-offs<\/b> before you sign a voluntary <b>Contribution Contract<\/b>, which the council proposes and agrees together. It is never a mandate.": "<b>Attribuer :<\/b> <b>glissez<\/b> une carte sur une région lumineuse, ou <b>touchez<\/b> une carte puis une région. Vert = meilleur choix, bleu = correct, gris = mauvais choix. Le panneau d’action montre les <b>synergies<\/b> et les <b>compromis<\/b> avant de signer un <b>Contrat de contribution<\/b> volontaire, que le conseil propose et accepte ensemble. Ce n’est jamais une obligation.", "<b>Drag<\/b> a card onto the map, or <b>tap<\/b> a card and then a region. You’ll see the synergies and trade-offs before signing anything.": "<b>Glissez<\/b> une carte sur la carte du monde, ou <b>touchez<\/b> une carte puis une région. Vous verrez les synergies et les compromis avant de signer quoi que ce soit.", "<b>Eliminate waste:<\/b> once per round, retire duplication or redirect military overspend. Some options unlock only once enough regions contribute.": "<b>Éliminer le gaspillage :<\/b> une fois par manche, supprimez un doublon ou réorientez des dépenses militaires excessives. Certaines options ne se débloquent qu’avec assez de régions contributrices.", "<b>Shared threat:<\/b> from round {0}, a threat card is revealed. Its checklist shows what protects you, and it hits at the end of the round.": "<b>Menace commune :<\/b> à partir de la manche {0}, une carte de menace est révélée. Sa liste indique ce qui vous protège, et elle frappe en fin de manche.", "<b>Synergy networks:<\/b> linked cards light up animated energy lines between regions. Links across regions are worth the most.": "<b>Réseaux de synergie :<\/b> les cartes liées allument des lignes d’énergie animées entre les régions. Les liens entre régions rapportent le plus.", "<b>You are the family council.<\/b> Everyone plays together against the planet’s problems, not against each other. {0}–{1} people can share one device; the chair rotates each round, but every decision is shared.": "<b>Vous êtes le conseil familial.<\/b> Tout le monde joue ensemble contre les problèmes de la planète, pas les uns contre les autres. De {0} à {1} personnes peuvent partager un appareil ; la présidence tourne à chaque manche, mais chaque décision est commune.", "<b>Your mission:<\/b> make interdependence the operating principle. Treat countries as administrative units of one planetary family: specialise, cut waste, build resilience. Aim for <b>{0}–{1}% lower system costs<\/b> and a flourishing, safer planet within {2} rounds.": "<b>Votre mission :<\/b> faire de l’interdépendance le principe de fonctionnement. Traitez les pays comme les unités administratives d’une seule famille planétaire : spécialisez-vous, réduisez le gaspillage, renforcez la résilience. Visez <b>{0} à {1} % de coûts du système en moins<\/b> et une planète épanouie et plus sûre en {2} manches.", "Choose up to <b>one<\/b> this round (<b style=\"color:var(--goldtx)\">{0} CU<\/b> left). Locked options show what trust they need first.": "Choisissez <b>une<\/b> option au maximum cette manche (<b style=\"color:var(--goldtx)\">{0} CU<\/b> restantes). Les options verrouillées indiquent la confiance requise.", "Each card shows its <b>cost<\/b> (blue gem), <b>output<\/b> (gold) and <b>synergy links<\/b> (green). Drag one up onto the map, or tap it to pick it up.": "Chaque carte affiche son <b>coût<\/b> (gemme bleue), sa <b>production<\/b> (dorée) et ses <b>liens de synergie<\/b> (verte). Faites-en glisser une vers la carte du monde, ou touchez-la pour la prendre.", "Grow Flourishing and Resilience, and shrink Redundancy. Turn the boundary ring green and push the system-cost bar down into the <b>{0} to {1}%<\/b> band.": "Faites croître l’Épanouissement et la Résilience, et réduisez la Redondance. Faites passer l’anneau des limites au vert et descendez la barre des coûts dans la zone <b>{0} à {1} %<\/b>.", "The planetary family starts at home. Pick <b>one to three<\/b> of these, linked to what your council focused on today. It’s your choice, and no reminders will nag you.": "La famille planétaire commence à la maison. Choisissez <b>une à trois<\/b> de ces actions, liées à ce sur quoi votre conseil s’est concentré aujourd’hui. C’est votre choix, et aucun rappel ne viendra vous harceler.", "The threat checklist shows what protects you. The action panel shows <b>synergies and trade-offs<\/b> before you sign. Then eliminate one waste and end the round.": "La liste de la menace indique ce qui vous protège. Le panneau d’action montre les <b>synergies et compromis<\/b> avant de signer. Ensuite, éliminez un gaspillage et terminez la manche.", "This is how far your family council moved the world, from the <b>Competitive National Model<\/b> to <b>Coordinated Specialisation<\/b>.": "Voici jusqu’où votre conseil familial a fait avancer le monde, du <b>Modèle national compétitif<\/b> vers la <b>Spécialisation coordonnée<\/b>.", "While you hold a card, regions glow: <b style=\"color:var(--mint)\">green is the best fit<\/b>, blue is fine, grey is a poor fit. Linked contracts light up flowing energy networks.": "Quand vous tenez une carte, les régions s’illuminent : <b style=\"color:var(--mint)\">le vert est le meilleur choix<\/b>, le bleu convient, le gris est un mauvais choix. Les contrats liés allument des réseaux d’énergie animés.", "Wind technical potential ~{0} GW (only ~{1} GW installed, <{2}%); high solar irradiation (>{3} kWh/m²/year in many areas); Namibia among top global PV potential": "Potentiel technique éolien ~{0} GW (seulement ~{1} G ance ask costs {0} CU": "Chaque demande de financement ultérieure coûte {0} CU", "Costs {0} CU now": "Coûte {0} CU maintenant", "Open Technology & Patent Pool": "Pool ouvert de technologies et de brevets", "Every later tech-transfer ask costs {0} CU": "Chaque demande de transfert de technologie ultérieure coûte {0} CU", "Early movers share their edge": "Les pionniers partagent leur avance", "Just Transition Compact": "Pacte pour une transition juste", "Every later transition ask costs {0} CU": "Chaque demande de transition ultérieure coûte {0} CU", "Shared Emergency Reserves & Early Warning": "Réserves d’urgence partagées et alerte précoce", "The next shared threat counts one missing protection as covered": "La prochaine menace commune compte une protection manquante comme couverte", "Arms Restraint Pact": "Pacte de modération des armements", "Social shortfall {0} while defence jobs move": "Déficit social {0} le temps que les emplois de défense se reconvertissent", "Fair Carbon Pricing with Dividends": "Tarification carbone équitable avec dividendes", "Climate pressure {0}": "Pression climatique {0}", "Free to adopt": "Gratuit à adopter", "Social shortfall {0} from higher prices ({1} with a Just Transition Compact)": "Déficit social {0} à cause de la hausse des prix ({1} avec un Pacte pour une transition juste)", "Universal Health Surge Pledge": "Engagement universel de capacité sanitaire d’urgence", "Oceans & Forests Commons Treaty": "Traité sur les océans et les forêts comme biens communs", "Biosphere and ocean pressure {0}, land {1}": "Pression sur la biosphère et les océans {0}, sur les sols {1}", "Costs {0} CU now and {1} CU less next round": "Coûte {0} CU maintenant et {1} CU de moins à la prochaine manche", "Gentle: the full CU budget each round and softer shocks. Good for a first game or younger players.": "Doux : le budget complet en CU à chaque manche et des chocs atténués. Idéal pour une première partie ou de jeunes joueurs.", "Standard: {0} CU less each  l’ONU a permis d’exporter environ {2} millions de tonnes de denrées depuis l’Ukraine, dont plus de la moitié vers des pays en développement (Centre de coordination conjoint de l’ONU). Puis il a pris fin.", "A new variant arrives while vaccines are still scarce. When doses were pooled through COVAX, nearly {0} billion reached {1} economies (Gavi, WHO). When countries hoard, the poorest wait longest.": "Un nouveau variant arrive alors que les vaccins sont encore rares. Quand les doses ont été mises en commun via COVAX, près de {0} milliards ont atteint {1} économies (Gavi, OMS). Quand les pays accaparent, les plus pauvres attendent le plus longtemps.", "{0} agreed · {1} declined · {2} lapsed": "{0} acceptées · {1} refusées · {2} expirées", "<b style=\"color:var(--goldtx)\">{0} CU<\/b> · {1} cards dealt · {2} regions asking": "<b style=\"color:var(--goldtx)\">{0} CU<\/b> · {1} cartes distribuées · {2} régions en demande", "<b>Chair: {0}<\/b>. Talk it through together; the chair taps. · <b style=\"color:var(--goldtx)\">{1} CU<\/b> · {2} cards dealt · {3} regions asking": "<b>Présidence : {0}<\/b>. Discutez-en ensemble ; la présidence valide. · <b style=\"color:var(--goldtx)\">{1} CU<\/b> · {2} cartes distribuées · {3} régions en demande", "<b>Difficulty:<\/b> Gentle gives the full CU budget and softer shocks. Standard has {0} CU less each round and harder shocks; a careful council reaches the top rating about half the time. Challenging is for experienced councils. Five scenarios unlock one a day.": "<b>Difficulté :<\/b> Doux donne le budget complet en CU et des chocs atténués. Standard retire {0} CU à chaque manche avec des chocs plus durs ; un conseil attentif obtient la meilleure note environ une fois sur deux. Difficile s’adresse aux conseils expérimentés. Cinq scénarios se débloquent, un par jour.", "<b>Negotiate:<\/b> each round a few regions (gold badge on the map) ask for <b>finance<\/b>, <b>tech transfer<\/b> or <b>transition support<\/b> in return for a contra
