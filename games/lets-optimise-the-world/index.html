 batteries; major EV and wind exporter": "~{0}–{1}% de la capacidad de fabricación solar fotovoltaica; ~{2}–{3}% de las baterías de iones de litio; gran exportador de vehículos eléctricos y eólica", "– A Planetary Family Strategy Game": "– Un juego de estrategia de la Familia Planetaria", "← Back to cards": "← Volver a las cartas", "↶ Undo": "↶ Deshacer", "▶ PLAY": "▶ JUGAR", "▶ Tap to begin": "▶ Toca para empezar", "♻ Choose one waste to eliminate →": "♻ Elige un despilfarro que eliminar →", "⚖ Trade-offs": "⚖ Contrapartidas", "✓ The family is protected": "✓ La familia está protegida", "✔ Council agrees: sign contract": "✔ El consejo está de acuerdo: firmar contrato", "✦ Synergies": "✦ Sinergias", "🌿 {0} rounds · about {1}–{2} min": "🌿 {0} rondas · unos {1}–{2} min", "🎬 Watch trailer": "🎬 Ver tráiler", "🔒 Offline · data stays on this device": "🔒 Sin conexión · los datos se quedan en este dispositivo", "🔗 Synergy network formed! ({0} new)": "🔗 ¡Red de sinergia formada! ({0} nueva)", "🚫 No timers, ads or loot boxes": "🚫 Sin temporizadores, anuncios ni cajas de botín", "🤝 Cooperative, {0}–{1} players": "🤝 Cooperativo, {0}–{1} jugadores", "A narrow sea lane carries much of the world’s oil. When it is threatened, fuel prices jump everywhere at once. Choke points also exist in finance (sanctions) and in market access.": "Una estrecha ruta marítima transporta gran parte del petróleo mundial. Cuando se ve amenazada, los precios del combustible suben en todas partes a la vez. También hay cuellos de botella en las finanzas (sanciones) y en el acceso a los mercados.", "China holds ~{0}–{1}% of global solar PV manufacturing capacity; module prices fell from ~${2}/kW ({3}) to ~${4}/kW ({5}).": "China tiene ~{0}–{1}% de la capacidad mundial de fabricación solar fotovoltaica; el precio de los módulos bajó de ~{2} $/kW ({3}) a ~{4} $/kW ({5}).", "Dependencies have become leverage. Choke points are used to coerce: a narrow strait for oil, sanctions for finance, controls on market access.": "Las dependencias se han convertido en palanca. Los cuellos de botella se usan para coaccionar: un estrecho para el petróleo, sanciones para las finanzas, controles de acceso a los mercados.", "Develop utility-scale solar/wind toward a substantial share of technical potential; export power, green hydrogen, or processed materials under sustainable rules; meet domestic access + surplus": "Desarrollar solar y eólica a gran escala hacia una parte sustancial del potencial técnico; exportar electricidad, hidrógeno verde o materiales procesados con reglas sostenibles; cubrir el acceso interno y generar excedente", "Energy, food, medicines and data cross every border. The world has never been more interdependent, yet nations still act like rivals, duplicating each other’s industries and racing each other’s arsenals.": "La energía, los alimentos, los medicamentos y los datos cruzan todas las fronteras. El mundo nunca ha sido tan interdependiente, y aun así las naciones actúan como rivales, duplicando las industrias de las demás y compitiendo en arsenales.", "Everything stays in this browser (localStorage): the days you played, finished scenarios, chosen real-world actions and these settings. No accounts, no tracking, nothing sent anywhere.": "Todo se queda en este navegador (localStorage): los días que jugaste, los escenarios terminados, las acciones reales elegidas y estos ajustes. Sin cuentas, sin rastreo, sin enviar nada a ningún sitio.", "Expand high-quality essential API/generic capacity as a global public-good supplier; pre-agreed pandemic surge protocols; share open digital public infrastructure models": "Ampliar la capacidad de principios activos y genéricos esenciales de alta calidad como proveedor de bien público mundial; protocolos de respuesta pandémica acordados de antemano; compartir modelos abiertos de infraestructura pública digital", "Expand sustainable food and bioenergy while protecting remaining forests; contribute to global food security and nature-based solutions": "Ampliar la alimentación y la bioenergía sostenibles protegiendo los bosques que quedan; contribuir a la seguridad alimentaria mundial y a soluciones basadas en la naturaleza", "Figures are approximate and taken from Harpreet Raj Singh’s Planetary Family Framework research notes, attributed as they appear there; check the original sources before quoting them. Redundancy, Resilience and boundary “pressure” are game indices, not measurements.": "Las cifras son aproximadas y proceden de las notas de investigación del Planetary Family Framework de Harpreet Raj Singh, con la atribución que allí figura; consulta las fuentes originales antes de citarlas. Redundancia, Resiliencia y la «presión» sobre los límites son índices del juego, no mediciones.", "Focus on high-value specialty APIs, advanced components, circular design, and regulatory standards; reduce full vertical duplication where others have scale": "Centrarse en principios activos especializados de alto valor, componentes avanzados, diseño circular y normas regulatorias; reducir la duplicación vertical completa donde otros tienen escala", "Food, fuel, fertiliser and finance shocks are arriving together, and they hit the Global South hardest. Progress on the development goals is slipping backwards.": "Los choques de alimentos, combustible, fertilizantes y finanzas llegan a la vez y golpean con más fuerza al Sur Global. El avance hacia los objetivos de desarrollo está retrocediendo.", "Food, fuel, fertiliser and finance shocks hit the Global South hardest, and progress on the Sustainable Development Goals is slipping.": "Los choques de alimentos, combustible, fertilizantes y finanzas golpean con más fuerza al Sur Global, y el avance hacia los Objetivos de Desarrollo Sostenible se está frenando.", "How many people are playing on this device? Pass it around. The chair rotates each round, and every decision is talked through together. Tap a portrait to change your advisor.": "¿Cuántas personas juegan en este dispositivo? Pasadlo de mano en mano. La presidencia rota cada ronda y cada decisión se habla entre todos. Toca un retrato para cambiar de asesor.", "In an interdependent world every dependency can become leverage. Trade, finance and technology are being turned into weapons.": "En un mundo interdependiente, cada dependencia puede convertirse en palanca. El comercio, las finanzas y la tecnología se están convirtiendo en armas.", "India ~{0}% of essential APIs (USP); China large bulk API volume; US/EU biologics — managed specialisation with surge protocols.": "India ~{0}% de los principios activos esenciales (USP); China, gran volumen de principios activos a granel; EE. UU./UE, biológicos: especialización gestionada con protocolos de respuesta.", "Lead or co-lead high-end biologics, advanced materials, AI tools for optimization, and dual-use resilience tech; open selected research; contribute to Dashboard design": "Liderar o coliderar biológicos de alta gama, materiales avanzados, herramientas de IA para la optimización y tecnología de resiliencia de doble uso; abrir parte de la investigación; contribuir al diseño del Panel", "Military leads breed impatience. Restraint gives way to a “use it or lose it” mindset, and a regional conflict threatens to spill over.": "La ventaja militar genera impaciencia. La contención da paso a una mentalidad de «úsalo o piérdelo», y un conflicto regional amenaza con extenderse.", "No shock this first round. Use it to lay foundations: sign contracts where each region is strongest, and link them into networks.": "No hay choque en esta primera ronda. Úsala para poner los cimientos: firma contratos donde cada región es más fuerte y conéctalos en redes.", "Replicating China-linked supply chains in the US, Eurozone and UK would cost ~${0}T by {1} (~${2}T in manufacturing, mining, power/utilities).": "Replicar las cadenas de suministro vinculadas a China en EE. UU., la eurozona y el Reino Unido costaría ~{0} billones $ hasta {1} (~{2} billones $ en manufactura, minería y energía/servicios públicos).", "Scale sustainable extraction/processing of battery and clean-tech minerals; develop renewable generation and green export capacity (hydrogen or direct power)": "Ampliar la extracción y el procesamiento sostenibles de minerales para baterías y tecnologías limpias; desarrollar generación renovable y capacidad de exportación verde (hidrógeno o electricidad directa)", "Share models for high-renewable grids, balancing, and inclusive transition; maintain near-{0}% low-carbon electricity in key systems; export design templates for universal services": "Compartir modelos de redes con muchas renovables, equilibrio y transición inclusiva; mantener una electricidad casi al {0}% baja en carbono en sistemas clave; exportar plantillas de diseño para servicios universales", "Shared trade rules are giving way to one-to-one deals. The United Nations was designed for {0} members {1} years ago, and today it must serve a very different world.": "Las reglas comerciales compartidas están dando paso a acuerdos bilaterales. Las Naciones Unidas se diseñaron para {0} miembros hace {1} años, y hoy deben servir a un mundo muy distinto.", "Shifting {0}–{1}% of military spending to energy transition, health surge and adaptation frees hundreds of billions per year.": "Destinar el {0}–{1}% del gasto militar a la transición energética, la respuesta sanitaria y la adaptación libera cientos de miles de millones al año.", "Solar manufacturing capacity is ~{0}× demand in some assessments; matching it with high-irradiance generation (“powershoring”) uses what already exists.": "La capacidad de fabricación solar es ~{0}× la demanda según algunas evaluaciones; combinarla con generación de alta irradiación («powershoring») aprovecha lo que ya existe.", "Specialize in high-precision components, next-gen materials, and quality/assurance systems for clean tech and health; contribute process excellence knowledge": "Especializarse en componentes de alta precisión, materiales de nueva generación y sistemas de calidad para tecnologías limpias y salud; aportar conocimiento de excelencia en procesos", "Sustain {0}–{1}%+ share of global solar PV modules/cells/wafers and battery manufacturing; license or open surplus process knowledge; support resilience via diversified partners": "Mantener una cuota del {0}–{1}%+ de la fabricación mundial de módulos, células y obleas fotovoltaicas y de baterías; licenciar o abrir el conocimiento excedente de procesos; reforzar la resiliencia con socios diversificados", "The world is deeply interdependent, yet it is run on rivalry. Trillions go into recreating what already exists, while billions of people fall short of the basics and the planet moves past its limits.": "El mundo es profundamente interdependiente, y aun así funciona a base de rivalidad. Se gastan billones en recrear lo que ya existe, mientras miles de millones de personas carecen de lo básico y el planeta sobrepasa sus límites.", "Time to throw away the old playbook and write a new one, together. This game is one draft of that playbook: interdependence as the operating principle, with countries as administrative units contributing their best to one family.": "Es hora de tirar el viejo manual y escribir uno nuevo, juntos. Este juego es un borrador de ese manual: la interdependencia como principio rector, con los países como unidades administrativas que aportan lo mejor de sí a una sola familia.", "Welcome back. You’ve dropped in on {0} of the last {1} days, and rest days count too. · Scenario {2} “Super El Niño Year”: unlocks tomorrow": "Bienvenido de nuevo. Has pasado por aquí {0} de los últimos {1} días, y los días de descanso también cuentan. · Escenario {2} «Super El Niño»: se desbloquea mañana", "World military spending reached ~${0}T in {1}, the {2}th consecutive annual real rise (~{3}% of world GDP); the top {4} spend ~{5}%.": "El gasto militar mundial alcanzó ~{0} billones $ en {1}, el {2}.º aumento real anual consecutivo (~{3}% del PIB mundial); los {4} mayores gastan ~{5}%.", "You’ve been playing for a while. Stand up, stretch, drink some water, look at something far away. The planet and your game will wait right here; nothing is lost.": "Llevas un rato jugando. Levántate, estírate, bebe agua, mira algo lejano. El planeta y tu partida te esperan aquí mismo; no se pierde nada.", "“The Efficiency Case for a Planetary Family Framework”: competitive national model vs coordinated specialisation (SuperGrok Imagine). Muted; press play.": "«El argumento de eficiencia a favor de un Planetary Family Framework»: modelo nacional competitivo frente a especialización coordinada (SuperGrok Imagine). Silenciado; pulsa reproducir.", "<b style=\"color:var(--goldtx)\">{0} CU<\/b> · {1} cards dealt": "<b style=\"color:var(--goldtx)\">{0} CU<\/b> · {1} cartas repartidas", "<b>Draw:<\/b> each round you’re dealt {0} specialization cards and Contribution Units (<b>CU<\/b>, the gold gem).": "<b>Robar:<\/b> cada ronda recibes {0} cartas de especialización y Unidades de Contribución (<b>CU<\/b>, la gema dorada).", "<b>Score:<\/b> after {0} rounds, see how far the family moved from competition to contribution.": "<b>Puntuación:<\/b> tras {0} rondas, mira cuánto avanzó la familia de la competencia a la contribución.", "<b>Signed here:<\/b> none yet": "<b>Firmado aquí:<\/b> nada todavía", "<b>System costs cut by {0}–{1}%<\/b> (the bar falls into the green band).": "<b>Costes del sistema reducidos un {0}–{1}%<\/b> (la barra baja hasta la franja verde).", "<b>What protects the family<\/b> (it hits at the end of the round):": "<b>Qué protege a la familia<\/b> (golpea al final de la ronda):", "A higher <b>Flourishing Index<\/b>: close social shortfalls and turn the planetary-boundary ring green.": "Un <b>Índice de Florecimiento<\/b> más alto: cierra los déficits sociales y vuelve verde el anillo de límites planetarios.", "Africa’s onshore wind potential vs installed capacity (<{0}%).": "Potencial eólico terrestre de África frente a la capacidad instalada (<{0}%).", "Africa’s onshore wind technical potential is ~{0} GW, with only ~{1} GW installed (<{2}%).": "El potencial técnico eólico terrestre de África es de ~{0} GW, con solo ~{1} GW instalados (<{2}%).", "Drop or tap a <b style=\"color:var(--mint)\">glowing green<\/b> region": "Suelta o toca una región <b style=\"color:var(--mint)\">verde brillante<\/b>", "Fair <b>Contribution Balance<\/b> and regional <b>contract targets ★<\/b>.": "Un <b>Equilibrio de contribución<\/b> justo y las <b>metas de contrato ★<\/b> regionales.", "High <b>Resilience<\/b>: don’t rely on a single region for a whole domain.": "Alta <b>Resiliencia<\/b>: no dependas de una sola región para todo un ámbito.", "Now <b>drop or tap a glowing region<\/b>. Green is the best fit.": "Ahora <b>suelta o toca una región iluminada<\/b>. El verde es el mejor encaje.", "Redundancy<br><span style=\"font-size:.{0}rem\">lower is better<\/span>": "Redundancia<br><span style=\"font-size:.{0}rem\">cuanto más baja, mejor<\/span>", "System cost<br>goal {0} to {1}%": "Coste del sistema<br>meta {0} a {1}%", "<b>Assign:<\/b> <b>drag<\/b> a card onto a glowing region, or <b>tap<\/b> a card and then a region. Green is best fit, blue is fine, grey is a poor fit. The action panel shows the <b>synergies<\/b> and <b>trade-offs<\/b> before you sign a voluntary <b>Contribution Contract<\/b>, which the council proposes and agrees together. It is never a mandate.": "<b>Asignar:<\/b> <b>arrastra<\/b> una carta a una región iluminada, o <b>toca<\/b> una carta y luego una región. Verde es el mejor encaje, azul está bien, gris es un mal encaje. El panel de acción muestra las <b>sinergias<\/b> y <b>contrapartidas<\/b> antes de firmar un <b>Contrato de Contribución<\/b> voluntario, que el consejo propone y acuerda en conjunto. Nunca es una imposición.", "<b>Drag<\/b> a card onto the map, or <b>tap<\/b> a card and then a region. You’ll see the synergies and trade-offs before signing anything.": "<b>Arrastra<\/b> una carta al mapa, o <b>toca<\/b> una carta y luego una región. Verás las sinergias y contrapartidas antes de firmar nada.", "<b>Eliminate waste:<\/b> once per round, retire duplication or redirect military overspend. Some options unlock only once enough regions contribute.": "<b>Eliminar despilfarro:<\/b> una vez por ronda, retira duplicaciones o redirige el exceso de gasto militar. Algunas opciones solo se desbloquean cuando contribuyen suficientes regiones.", "<b>Shared threat:<\/b> from round {0}, a threat card is revealed. Its checklist shows what protects you, and it hits at the end of the round.": "<b>Amenaza compartida:<\/b> desde la ronda {0} se revela una carta de amenaza. Su lista muestra lo que te protege, y golpea al final de la ronda.", "<b>Synergy networks:<\/b> linked cards light up animated energy lines between regions. Links across regions are worth the most.": "<b>Redes de sinergia:<\/b> las cartas vinculadas encienden líneas de energía animadas entre regiones. Los enlaces entre regiones son los que más valen.", "<b>You are the family council.<\/b> Everyone plays together against the planet’s problems, not against each other. {0}–{1} people can share one device; the chair rotates each round, but every decision is shared.": "<b>Vosotros sois el consejo familiar.<\/b> Todos juegan juntos contra los problemas del planeta, no unos contra otros. De {0} a {1} personas pueden compartir un dispositivo; la presidencia rota cada ronda, pero cada decisión es compartida.", "<b>Your mission:<\/b> make interdependence the operating principle. Treat countries as administrative units of one planetary family: specialise, cut waste, build resilience. Aim for <b>{0}–{1}% lower system costs<\/b> and a flourishing, safer planet within {2} rounds.": "<b>Vuestra misión:<\/b> hacer de la interdependencia el principio rector. Tratad a los países como unidades administrativas de una sola familia planetaria: especializaos, recortad el despilfarro, construid resiliencia. Apuntad a unos <b>costes del sistema un {0}–{1}% más bajos<\/b> y a un planeta próspero y más seguro en {2} rondas.", "Choose up to <b>one<\/b> this round (<b style=\"color:var(--goldtx)\">{0} CU<\/b> left). Locked options show what trust they need first.": "Elige hasta <b>una<\/b> esta ronda (te quedan <b style=\"color:var(--goldtx)\">{0} CU<\/b>). Las opciones bloqueadas muestran qué confianza necesitan antes.", "Each card shows its <b>cost<\/b> (blue gem), <b>output<\/b> (gold) and <b>synergy links<\/b> (green). Drag one up onto the map, or tap it to pick it up.": "Cada carta muestra su <b>coste<\/b> (gema azul), su <b>producción<\/b> (dorada) y sus <b>enlaces de sinergia<\/b> (verde). Arrastra una hacia arriba al mapa, o tócala para cogerla.", "Grow Flourishing and Resilience, and shrink Redundancy. Turn the boundary ring green and push the system-cost bar down into the <b>{0} to {1}%<\/b> band.": "Haz crecer la Prosperidad y la Resiliencia, y reduce la Redundancia. Pon en verde el anillo de límites y baja la barra de costes del sistema hasta la franja del <b>{0} al {1}%<\/b>.", "The planetary family starts at home. Pick <b>one to three<\/b> of these, linked to what your council focused on today. It’s your choice, and no reminders will nag you.": "La familia planetaria empieza en casa. Elige <b>de una a tres<\/b> de estas acciones, ligadas a lo que vuestro consejo trabajó hoy. Tú decides, y ningún recordatorio te insistirá.", "The threat checklist shows what protects you. The action panel shows <b>synergies and trade-offs<\/b> before you sign. Then eliminate one waste and end the round.": "La lista de la amenaza muestra lo que os protege. El panel de acción muestra <b>sinergias y contrapartidas<\/b> antes de firmar. Luego eliminad un despilfarro y terminad la ronda.", "This is how far your family council moved the world, from the <b>Competitive National Model<\/b> to <b>Coordinated Specialisation<\/b>.": "Esto es lo que vuestro consejo familiar movió el mundo, del <b>Modelo Nacional Competitivo<\/b> a la <b>Especialización Coordinada<\/b>.", "While you hold a card, regions glow: <b style=\"color:var(--mint)\">green is the best fit<\/b>, blue is fine, grey is a poor fit. Linked contracts light up flowing energy networks.": "Mientras sostienes una carta, las regiones brillan: <b style=\"color:var(--mint)\">verde es la mejor opción<\/b>, azul está bien, gris es una mala opción. Los contratos vinculados encienden redes de energía en movimiento.", "Wind technical potential ~{0} GW (only ~{1} GW installed, <{2}%); high solar irradiation (>{3} kWh/m²/year in many areas); Namibia among top global PV potential": "Potencial técnico eólico ~{0} GW (solo ~{1} GW instalados, <{2}%); alta irradiación solar (>{3} kWh/m²/año en muchas zonas); Namibia entre los mayores potenciales FV del mundo", "🔗 New synergy network with: {0}": "🔗 Nueva red de sinergia con: {0}", "{0} ({1}) · same region": "{0} ({1}) · misma región", "{0} ({1})": "{0} ({1})", "★ Completes {0}’s contract target ({1})": "★ Completa el objetivo de contratos de {0} ({1})", "★ {0} target met!": "★ ¡Objetivo de {0} cumplido!", "★ Best: {0}": "★ Mejor: {0}", "⚠️ {0} ({1} of {2} protections missing)": "⚠️ {0} (faltan {1} de {2} protecciones)", "✅ {0} ({1} prosperity)": "✅ {0} ({1} de prosperidad)", "Waste eliminated: {0}": "Despilfarro eliminado: {0}", "Round {0}: {1}": "Ronda {0}: {1}", "<b>Role:<\/b> {0}": "<b>Papel:<\/b> {0}", "<b>Illustrative target:<\/b> {0}": "<b>Objetivo ilustrativo:<\/b> {0}", "<b>In-game contract target:<\/b> {0}": "<b>Objetivo de contratos en el juego:<\/b> {0}", "{0} <i>({1})<\/i>": "{0} <i>({1})<\/i>", "{0}<br><span class=\"small mut\">{1}<\/span>": "{0}<br><span class=\"small mut\">{1}<\/span>", "{0}<br><span class=\"mut\">{1}<\/span>": "{0}<br><span class=\"mut\">{1}<\/span>", "<span class=\"ck\"><\/span>{0}": "<span class=\"ck\"><\/span>{0}", "<span class=\"ck\">✓<\/span>{0}": "<span class=\"ck\">✓<\/span>{ s y la entrega digital llegaron a todos rápidamente.", "A war closes the sea lanes that carry a large share of the world’s wheat and maize. In {0}–{1} a UN-brokered corridor moved about {2} million tonnes of food out of Ukraine, more than half of it to developing countries (UN Joint Coordination Centre). Then it ended.": "Una guerra cierra las rutas marítimas que transportan gran parte del trigo y el maíz del mundo. En {0}–{1}, un corredor negociado por la ONU sacó de Ucrania unos {2} millones de toneladas de alimentos, más de la mitad hacia países en desarrollo (Centro de Coordinación Conjunta de la ONU). Después terminó.", "A new variant arrives while vaccines are still scarce. When doses were pooled through COVAX, nearly {0} billion reached {1} economies (Gavi, WHO). When countries hoard, the poorest wait longest.": "Llega una nueva variante cuando las vacunas aún escasean. Cuando las dosis se pusieron en común a través de COVAX, casi {0} mil millones llegaron a {1} economías (Gavi, OMS). Cuando los países acaparan, los más pobres esperan más.", "{0} agreed · {1} declined · {2} lapsed": "{0} aceptadas · {1} rechazadas · {2} caducadas", "<b style=\"color:var(--goldtx)\">{0} CU<\/b> · {1} cards dealt · {2} regions asking": "<b style=\"color:var(--goldtx)\">{0} CU<\/b> · {1} cartas repartidas · {2} regiones piden algo", "<b>Chair: {0}<\/b>. Talk it through together; the chair taps. · <b style=\"color:var(--goldtx)\">{1} CU<\/b> · {2} cards dealt · {3} regions asking": "<b>Preside: {0}<\/b>. Habladlo juntos; quien preside toca. · <b style=\"color:var(--goldtx)\">{1} CU<\/b> · {2} cartas repartidas · {3} regiones piden algo", "<b>Difficulty:<\/b> Gentle gives the full CU budget and softer shocks. Standard has {0} CU less each round and harder shocks; a careful council reaches the top rating about half the time. Challenging is for experienced councils. Five scenarios unlock one a day.": "<b>Dificultad:<\/b> Suave da el presupuesto completo de CU y crisis más leves. Est or oil, sanctions for finance, controls on market access.": "أصبحت التبعيات أوراق ضغط. تُستخدم نقاط الاختناق للإكراه: مضيق ضيق للنفط، وعقوبات للتمويل، وقيود على الوصول إلى الأسواق.", "Develop utility-scale solar/wind toward a substantial share of technical potential; export power, green hydrogen, or processed materials under sustainable rules; meet domestic access + surplus": "تطوير الطاقة الشمسية وطاقة الرياح على نطاق المرافق نحو حصة كبيرة من الإمكانات التقنية؛ وتصدير الكهرباء أو الهيدروجين الأخضر أو المواد المعالجة وفق قواعد مستدامة؛ وتلبية الحاجة المحلية مع فائض", "Energy, food, medicines and data cross every border. The world has never been more interdependent, yet nations still act like rivals, duplicating each other’s industries and racing each other’s arsenals.": "الطاقة والغذاء والأدوية والبيانات تعبر كل الحدود. لم يكن العالم يومًا أكثر ترابطًا، ومع ذلك ما زالت الدول تتصرف كمتنافسين، تكرر صناعات بعضها وتتسابق في التسلح.", "Everything stays in this browser (localStorage): the days you played, finished scenarios, chosen real-world actions and these settings. No accounts, no tracking, nothing sent anywhere.": "كل شيء يبقى في هذا المتصفح (localStorage): الأيام التي لعبت فيها، والسيناريوهات المكتملة، والإجراءات الواقعية المختارة، وهذه الإعدادات. بلا حسابات ولا تتبع، ولا يُرسل أي شيء إلى أي مكان.", "Expand high-quality essential API/generic capacity as a global public-good supplier; pre-agreed pandemic surge protocols; share open digital public infrastructure models": "توسيع قدرة إنتاج المكونات الصيدلانية الفعالة والأدوية الجنيسة الأساسية عالية الجودة كمورّد لمنفعة عامة عالمية؛ وبروتوكولات طوارئ للأوبئة متفق عليها مسبقًا؛ ومشاركة نماذج مفتوحة للبنية الرقمية العامة", "Expand sustainable food and bioenergy while protecting remaining forests; contribute to global food security and nature-based solutions": "توسيع الغذاء والطاقة الحيوية المستدامين مع حماية ما تبقى من الغابات؛ والمساهمة في الأمن الغذائي العالمي والحلول القائمة على الطبيعة", "Figures are approximate and taken from Harpreet Raj Singh’s Planetary Family Framework research notes, attributed as they appear there; check the original sources before quoting them. Redundancy, Resilience and boundary “pressure” are game indices, not measurements.": "الأرقام تقريبية ومأخوذة من ملاحظات أبحاث Planetary Family Framework لهاربريت راج سينغ، منسوبة كما وردت فيها؛ راجع المصادر الأصلية قبل الاقتباس منها. الازدواجية والصمود و«ضغط» الحدود مؤشرات خاصة باللعبة، وليست قياسات.", "Focus on high-value specialty APIs, advanced components, circular design, and regulatory standards; reduce full vertical duplication where others have scale": "التركيز على المكونات الصيدلانية المتخصصة عالية القيمة والمكونات المتقدمة والتصميم الدائري والمعايير التنظيمية؛ وتقليل التكرار الرأسي الكامل حيث يملك الآخرون الحجم", "Food, fuel, fertiliser and finance shocks are arriving together, and they hit the Global South hardest. Progress on the development goals is slipping backwards.": "صدمات الغذاء والوقود والأسمدة والتمويل تصل معًا، وتضرب الجنوب العالمي بأشد قوة. والتقدم نحو أهداف التنمية يتراجع.", "Food, fuel, fertiliser and finance shocks hit the Global South hardest, and progress on the Sustainable Development Goals is slipping.": "صدمات الغذاء والوقود والأسمدة والتمويل تضرب الجنوب العالمي بأشد قوة، والتقدم نحو أهداف التنمية المستدامة يتعثر.", "How many people are playing on this device? Pass it around. The chair rotates each round, and every decision is talked through together. Tap a portrait to change your advisor.": "كم شخصًا يلعب على هذا الجهاز؟ مرّروه بينكم. تتناوب الرئاسة كل جولة، وكل قرار يُناقش معًا. انقر صورة لتغيير مستشارك.", "In an interdependent world every dependency can become leverage. Trade, finance and technology are being turned into weapons.": "في عالم مترابط، يمكن لكل تبعية أن تصبح ورقة ضغط. تتحول التجارة والتمويل والتكنولوجيا إلى أسلحة.", "India ~{0}% of essential APIs (USP); China large bulk API volume; US/EU biologics — managed specialisation with surge protocols.": "الهند نحو {0}% من ال  الأنظمة الرئيسية؛ وتصدير نماذج تصميم للخدمات الشاملة", "Shared trade rules are giving way to one-to-one deals. The United Nations was designed for {0} members {1} years ago, and today it must serve a very different world.": "تفسح قواعد التجارة المشتركة المجال لصفقات ثنائية. صُممت الأمم المتحدة لـ{0} عضوًا قبل {1} عامًا، وعليها اليوم أن تخدم عالمًا مختلفًا تمامًا.", "Shifting {0}–{1}% of military spending to energy transition, health surge and adaptation frees hundreds of billions per year.": "تحويل {0}–{1}% من الإنفاق العسكري إلى تحول الطاقة وطوارئ الصحة والتكيف يحرر مئات المليارات سنويًا.", "Solar manufacturing capacity is ~{0}× demand in some assessments; matching it with high-irradiance generation (“powershoring”) uses what already exists.": "قدرة تصنيع الطاقة الشمسية تقارب {0} أضعاف الطلب وفق بعض التقييمات؛ ومواءمتها مع توليد عالي الإشعاع («powershoring») تستفيد مما هو موجود بالفعل.", "Specialize in high-precision components, next-gen materials, and quality/assurance systems for clean tech and health; contribute process excellence knowledge": "التخصص في المكونات عالية الدقة ومواد الجيل التالي وأنظمة الجودة والضمان للتقنيات النظيفة والصحة؛ والمساهمة بمعرفة التميز في العمليات", "Sustain {0}–{1}%+ share of global solar PV modules/cells/wafers and battery manufacturing; license or open surplus process knowledge; support resilience via diversified partners": "الحفاظ على حصة {0}–{1}%+ من التصنيع العالمي للوحدات والخلايا والرقائق الشمسية والبطاريات؛ وترخيص المعرفة الفائضة بالعمليات أو فتحها؛ ودعم الصمود عبر شركاء متنوعين", "The world is deeply interdependent, yet it is run on rivalry. Trillions go into recreating what already exists, while billions of people fall short of the basics and the planet moves past its limits.": "العالم مترابط بعمق، ومع ذلك يُدار بالتنافس. تُنفق تريليونات لإعادة إنشاء ما هو موجود أصلًا، بينما يفتقر مليارات البشر إلى الأساسيات ويتجاوز الكوكب حدوده.", "Time to throw away the old playbook and write a new one, together. This game is one draft of  "← Back to cards": "← 返回卡牌", "↶ Undo": "↶ 撤销", "▶ PLAY": "▶ 开始游戏", "▶ Tap to begin": "▶ 点击开始", "♻ Choose one waste to eliminate →": "♻ 选择一项要消除的浪费 →", "⚖ Trade-offs": "⚖ 取舍", "✓ The family is protected": "✓ 家庭受到保护", "✔ Council agrees: sign contract": "✔ 理事会同意：签署合同", "✦ Synergies": "✦ 协同效应", "🌿 {0} rounds · about {1}–{2} min": "🌿 {0} 轮 · 约 {1}–{2} 分钟", "🎬 Watch trailer": "🎬 观看预告片", "🔒 Offline · data stays on this device": "🔒 离线 · 数据只留在本设备", "🔗 Synergy network formed! ({0} new)": "🔗 形成协同网络！（新增 {0} 个）", "🚫 No timers, ads or loot boxes": "🚫 没有计时器、广告或开箱", "🤝 Cooperative, {0}–{1} players": "🤝 合作模式，{0}–{1} 名玩家", "A narrow sea lane carries much of the world’s oil. When it is threatened, fuel prices jump everywhere at once. Choke points also exist in finance (sanctions) and in market access.": "一条狭窄的海上通道承载着世界大量石油。一旦受到威胁，各地燃料价格会同时飙升。金融（制裁）和市场准入同样存在咽喉要道。", "China holds ~{0}–{1}% of global solar PV manufacturing capacity; module prices fell from ~${2}/kW ({3}) to ~${4}/kW ({5}).": "中国拥有全球约 {0}–{1}% 的光伏制造产能；组件价格从约 {2} 美元/kW（{3} 年）降至约 {4} 美元/kW（{5} 年）。", "Dependencies have become leverage. Choke points are used to coerce: a narrow strait for oil, sanctions for finance, controls on market access.": "依赖已经变成筹码。咽喉要道被用来施压：石油靠一条窄海峡，金融靠制裁，市场准入靠管控。", "Develop utility-scale solar/wind toward a substantial share of technical potential; export power, green hydrogen, or processed materials under sustainable rules; meet domestic access + surplus": "把公用事业规模的光伏/风电发展到技术潜力的相当比例；按可持续规则出口电力、绿氢或加工材料；满足本地用能并形成盈余", "Energy, food, medicines and data cross every border. The world has never been more interdependent, yet nations still act like rivals, duplicating each other’s industries and racing each other’s arsenals.": "能源、粮食、药品和数据跨越每一道国界。世界从未如此相互依存，各国却仍像对手一样行事，彼此重复建设产业，竞相扩充军备。", "Everything stays in this browser (localStorage): the days you played, finished scenarios, chosen real-world actions and these settings. No accounts, no tracking, nothing sent anywhere.": "一切都留在这个浏览器里（localStorage）：你玩过的日子、完成的情景、选择的现实行动和这些设置。没有账号，没有追踪，不会发送任何数据。", "Expand high-quality essential API/generic capacity as a global public-good supplier; pre-agreed pandemic surge protocols; share open digital public infrastructure models": "扩大高质量基本原料药/仿制药产能，作为全球公共产品供应方；预先约定大流行应急协议；分享开放的数字公共基础设施模式", "Expand sustainable food and bioenergy while protecting remaining forests; contribute to global food security and nature-based solutions": "扩大可持续粮食和生物能源，同时保护剩余森林；为全球粮食安全和基于自然的解决方案作出贡献", "Figures are approximate and taken from Harpreet Raj Singh’s Planetary Family Framework research notes, attributed as they appear there; check the original sources before quoting them. Redundancy, Resilience and boundary “pressure” are game indices, not measurements.": "数据为近似值，取自 Harpreet Raj Singh 的 Planetary Family Framework 研究笔记，并按其中的出处标注；引用前请核对原始来源。冗余、韧性和边界“压力”是游戏指数，而非实测值。", "Focus on high-value specialty APIs, advanced components, circular design, and regulatory standards; reduce full vertical duplication where others have scale": "专注于高价值特种原料药、先进部件、循环设计和监管标准；在别人已有规模的领域减少完整的纵向重复建设", "Food, fuel, fertiliser and finance shocks are arriving together, and they hit the Global South hardest. Progress on the development goals is slipping backwards.": "粮食、燃料、化肥和金融冲击接踵而至，对全球南方打击最重。发展目标的进展正在倒退。", "Food, fuel, fertiliser and finance shocks hit the Global South hardest, and progress on the Sustainable Development Goals is slipping.": "粮食、燃料、化肥和金融冲击对全球南方打击最重，可持续发展目标的进展正在放缓。", "How many people are playing on this device? Pass it around. The chair rotates each round, and every decision is talked through together. Tap a portrait to change your advisor.": "这台设备上有几个人在玩？轮流传递吧。主席每轮轮换，每个决定都一起商量。点击头像可更换你的顾问。", "In an interdependent world every dependency can become leverage. Trade, finance and technology are being turned into weapons.": "在相互依存的世界里，每一种依赖都可能变成筹码。贸易、金融和技术正被武器化。", "India ~{0}% of essential APIs (USP); China large bulk API volume; US/EU biologics — managed specialisation with surge protocols.": "印度约占基本原料药的 {0}%（USP）；中国大宗原料药产量大；美欧擅长生物制品——在应急协议下进行有管理的专业分工。", "Lead or co-lead high-end biologics, advanced materials, AI tools for optimization, and dual-use resilience tech; open selected research; contribute to Dashboard design": "牵头或联合牵头高端生物制品、先进材料、用于优化的 AI 工具和军民两用的韧性技术；开放部分研究；参与仪表板设计", "Military leads breed impatience. Restraint gives way to a “use it or lose it” mindset, and a regional conflict threatens to spill over.": "军事优势滋生急躁。克制让位于“不用就作废”的心态，地区冲突有外溢之势。", "No shock this first round. Use it to lay foundations: sign contracts where each region is strongest, and link them into networks.": "第一轮没有冲击。用它打好基础：在每个区域最擅长的地方签合同，并把它们连成网络。", "Replicating China-linked supply chains in the US, Eurozone and UK would cost ~${0}T by {1} (~${2}T in manufacturing, mining, power/utilities).": "在美国、欧元区和英国复制与中国相关的供应链，到 {1} 年将耗资约 {0} 万亿美元（其中约 {2} 万亿美元在制造、采矿、电力/公用事业）。", "Scale sustainable extraction/processing of battery and clean-tech minerals; develop renewable generation and green export capacity (hydrogen or direct power)": "扩大电池和清洁技术矿产的可持续开采/加工；发展可再生能源发电和绿色出口能力（氢能或直接输电）", "Share models for high-renewable grids, balancing, and inclusive transition; maintain near-{0}% low-carbon electricity in key systems; export design templates for universal services": "分享高比例可再生能源电网、调峰和包容性转型的模式；在关键系统中保持近 {0}% 的低碳电力；输出普惠服务的设计模板", "Shared trade rules are giving way to one-to-one deals. The United Nations was designed for {0} members {1} years ago, and today it must serve a very different world.": "共同的贸易规则正让位于一对一交易。联合国在 {1} 年前为 {0} 个成员设计，如今必须服务一个截然不同的世界。", "Shifting {0}–{1}% of military spending to energy transition, health surge and adaptation frees hundreds of billions per year.": "把 {0}–{1}% 的军费转向能源转型、卫生应急和适应，每年可释放数千亿资金。", "Solar manufacturing capacity is ~{0}× demand in some assessments; matching it with high-irradiance generation (“powershoring”) uses what already exists.": "据部分评估，光伏制造产能约为需求的 {0} 倍；将其与高辐照地区的发电相匹配（“powershoring”），就能用好已有的产能。", "Specialize in high-precision components, next-gen materials, and quality/assurance systems for clean tech and health; contribute process excellence knowledge": "专注于清洁技术和卫生领域的高精度部件、新一代材料和质量/保障体系；贡献工艺卓越的知识", "Sustain {0}–{1}%+ share of global solar PV modules/cells/wafers and battery manufacturing; license or open surplus process knowledge; support resilience via diversified partners": "保持全球光伏组件/电池片/硅片和电池制造 {0}–{1}%+ 的份额；授权或开放富余的工艺知识；通过多元化伙伴增强韧性", "The world is deeply interdependent, yet it is run on rivalry. Trillions go into recreating what already exists, while billions of people fall short of the basics and the planet moves past its limits.": "世界深度相互依存，却靠竞争运转。数万亿资金被用于重建早已存在的东西，而数十亿人缺乏基本所需，地球也在越过它的极限。", "Time to throw away the old playbook and write a new one, together. This game is one draft of that playbook: interdependence as the operating principle, with countries as administrative units contributing their best to one family.": "是时候扔掉旧剧本，一起写一份新的了。这款游戏就是这份剧本的一份草稿：以相互依存为运行原则，把各国看作行政单位，为同一个家庭贡献所长。", "Welcome back. You’ve dropped in on {0} of the last {1} days, and rest days count too. · Scenario {2} “Super El Niño Year”: unlocks tomorrow": "欢迎回来。过去 {1} 天里你来过 {0} 天，休息日也算数。· 情景 {2}“超强厄尔尼诺之年”：明天解锁", "World military spending reached ~${0}T in {1}, the {2}th consecutive annual real rise (~{3}% of world GDP); the top {4} spend ~{5}%.": "{1} 年全球军费达到约 {0} 万亿美元，连续第 {2} 年实际增长（约占全球 GDP 的 {3}%）；前 {4} 名约占 {5}%。", "You’ve been playing for a while. Stand up, stretch, drink some water, look at something far away. The planet and your game will wait right here; nothing is lost.": "你已经玩了一阵子。站起来伸伸腰，喝点水，看看远处。地球和你的游戏都会在这里等你，什么都不会丢。", "“The Efficiency Case for a Planetary Family Framework”: competitive national model vs coordinated specialisation (SuperGrok Imagine). Muted; press play.": "《支持 Planetary Family Framework 的效率论证》：竞争性国家模式 vs 协调式专业分工（SuperGrok Imagine）。已静音；请按播放。", "<b style=\"color:var(--goldtx)\">{0} CU<\/b> · {1} cards dealt": "<b style=\"color:var(--goldtx)\">{0} CU<\/b> · 发了 {1} 张牌", "<b>Draw:<\/b> each round you’re dealt {0} specialization cards a nk Redundancy. Turn the boundary ring green and push the system-cost bar down into the <b>{0} to {1}%<\/b> band.": "提升繁荣与韧性，压低冗余。让边界环变绿，把系统成本条压到 <b>{0} 至 {1}%<\/b> 区间。", "The planetary family starts at home. Pick <b>one to three<\/b> of these, linked to what your council focused on today. It’s your choice, and no reminders will nag you.": "行星家庭从自己家开始。从中挑选<b>一到三项<\/b>，与你们理事会今天关注的内容相关。由你决定，也不会有提醒来催你。", "The threat checklist shows what protects you. The action panel shows <b>synergies and trade-offs<\/b> before you sign. Then eliminate one waste and end the round.": "威胁清单显示什么能保护你们。签署前，行动面板会显示<b>协同效应和取舍<\/b>。然后消除一项浪费并结束本轮。", "This is how far your family council moved the world, from the <b>Competitive National Model<\/b> to <b>Coordinated Specialisation<\/b>.": "这就是你们的家庭理事会推动世界走过的距离：从<b>竞争性国家模式<\/b>走向<b>协调式专业分工<\/b>。", "While you hold a card, regions glow: <b style=\"color:var(--mint)\">green is the best fit<\/b>, blue is fine, grey is a poor fit. Linked contracts light up flowing energy networks.": "拿着卡牌时，各区域会发光：<b style=\"color:var(--mint)\">绿色是最佳匹配<\/b>，蓝色可以，灰色较差。相互关联的合同会点亮流动的能量网络。", "Wind technical potential ~{0} GW (only ~{1} GW installed, <{2}%); high solar irradiation (>{3} kWh/m²/year in many areas); Namibia among top global PV potential": "风电技术潜力约 {0} GW（已装机仅约 {1} GW，<{2}%）；太阳辐照高（许多地区 >{3} kWh/m²/年）；纳米比亚的光伏潜力位居全球前列", "🔗 New synergy network with: {0}": "🔗 新的协同网络，连接：{0}", "{0} ({1}) · same region": "{0}（{1}）· 同一区域", "{0} ({1})": "{0}（{1}）", "★ Completes {0}’s contract target ({1})": "★ 完成{0}的合同目标（{1}）", "★ {0} target met!": "★ {0}目标达成！", "★ Best: {0}": "★ 最佳：{0}", "⚠️ {0} ({1} of {2} protections missing)": "⚠️ {0}（{2} 项保护缺少 {1} 项）", "✅ {0} ({1} prosperity)": "✅ {0}（繁荣 {1}）", "Waste eliminated: {0}": "已消除浪费：{0}", "Round {0}: {1}": "第 {0} 轮：{1}", "<b>Role:<\/b> {0}": "<b>角色：<\/b>{0}", "<b>Illustrative target:<\/b> {0}": "<b>示意目标：<\/b>{0}", "<b>In-game contract target:<\/b> {0}": "<b>游戏内合同目标：<\/b>{0}", "{0} <i>({1})<\/i>": "{0} <i>（{1}）<\/i>", "{0}<br><span class=\" } г.: {1}-й подряд год реального роста, ~{2}% мирового ВВП.", "You can close this tab now.": "Теперь эту вкладку можно закрыть.", "Your specialization cards": "Ваши карты специализаций", "Your starting Planetary Dashboard": "Ваша стартовая Планетарная панель", "You’ve played on {0} of the last {1} days. Rest days are part of a healthy rhythm; nothing is lost by taking them.": "Вы играли {0} из последних {1} дней. Дни отдыха — часть здорового ритма; пропуская их, вы ничего не теряете.", "You’ve played on {0} of the last {1} days. Rest days are part of the plan; there’s no streak to lose.": "Вы играли {0} из последних {1} дней. Дни отдыха входят в план; серии, которую можно потерять, нет.", "{0} CU": "{0} CU", "{0} has a contract": "У региона {0} есть контракт", "{0} in deck": "{0} в колоде", "{0} of {1}": "{0} из {1}", "{0} Planetary Health Check": "Planetary Health Check {0}", "{0} pressure {1}": "Давление: {0} {1}", "{0} pressure {1} (trade-off)": "Давление: {0} {1} (компромисс)", "{0} prosperity": "{0} процветания", "{0} protection missing": "Не хватает защит: {0}", "{0} protections missing": "Не хватает защит: {0}", "{0} resilience": "{0} устойчивости", "{0} would be the only region in {1}: a single point of failure for now": "{0} будет единственным регионом в сфере «{1}»: пока это единая точка отказа", "{0} · A Tough World": "{0} · Трудный мир", "{0} · Score at round {1}": "{0} · Подсчёт в раунде {1}", "{0} · Super El Niño Year": "{0} · Год супер-Эль-Ниньо", "{0}% cost": "{0}% затрат", "{0}% system cost": "{0}% системных затрат", "{0}% to {1}%": "от {0}% до {1}%", "{0}+ regions contributing (a shared stake in peace)": "{0}+ регионов вносят вклад (общая заинтересованность в мире)", "{0}. Competitive National Model": "{0}. Конкурентная национальная модель", "{0}. Coordinated Specialisation": "{0}. Скоординированная специализация", "{0}. {1}. Cost {2}, output {3}, {4} synergy links. Best in {5}.": "{0}. {1}. Стоимость {2}, отдача {3}, синергетических связей: {4}. Лучше всего: {5}.", "{0}: {1} contracts": "{0}: контрактов {1}", "{0}: {1} contracts, best fit for the held card": "{0}: контрактов {1}, лучший выбор для карты в руке", "{0}: {1} contracts, best fit for the held card, target met": "{0}: контрактов {1}, лучший выбор для карты в руке, цель достигнута", "{0}: {1} contracts, good fit for the held card": "{0}: контрактов {1}, хороший выбор для карты в руке", "{0}: {1} contracts, good fit for the held card, target met": "{0}: контрактов {1}, хороший выбор для карты в руке, цель достигнута", "{0}: {1} contracts, poor fit for the held card": "{0}: контрактов {1}, плохой выбор для карты в руке", "{0}: {1} contracts, poor fit for the held card, target met": "{0}: контрактов {1}, плохой выбор для карты в руке, цель достигнута", "{0}: {1} contracts, target met": "{0}: контрактов {1}, цель достигнута", "~${0}T": "~${0} трлн", "~{0} GW vs ~{1} GW": "~{0} ГВт против ~{1} ГВт", "~{0}% of essential APIs (USP); large drug master file base; Aadhaar & UPI digital public infrastructure": "~{0}% основных фармсубстанций (USP); большая база мастер-файлов лекарств; цифровая общественная инфраструктура Aadhaar и UPI", "~{0}–{1}% of solar PV manufacturing capacity; ~{2}–{3}% of lithium-ion batteries; major EV and wind exporter": "~{0}–{1}% мощностей по производству солнечных панелей; ~{2}–{3}% литий-ионных аккумуляторов; крупный экспортёр электромобилей и ветроэнергетики", "– A Planetary Family Strategy Game": "– стратегическая игра о планетарной семье", "← Back to cards": "← Назад к картам", "↶ Undo": "↶ Отменить", "▶ PLAY": "▶ ИГРАТЬ", "▶ Tap to begin": "▶ Нажмите, чтобы начать", "♻ Choose one waste to eliminate →": "♻ Выберите одну потерю для устранения →", "⚖ Trade-offs": "⚖ Компромиссы", "✓ The family is protected": "✓ Семья защищена", "✔ Council agrees: sign contract": "✔ Совет согласен: подписать контракт", "✦ Synergies": "✦ Синергии", "🌿 {0} rounds · about {1}–{2} min": "🌿 {0} раундов · около {1}–{2} мин", "🎬 Watch trailer": "🎬 Смотреть трейлер", "🔒 Offline · data stays on this device": "🔒 Офлайн · данные остаются на этом устройстве", "🔗 Synergy network formed! ({0} new)": "🔗 Образовалась синергетическая сеть! (новых: {0})", "🚫 No timers, ads or loot boxes": "🚫 Без таймеров, рекламы и лутбоксов", "🤝 Cooperative, {0}–{1} players": "🤝 Кооператив, {0}–{1} игрока", "A narrow sea lane carries much of the world’s oil. When it is threatened, fuel prices jump everywhere at once. Choke points also exist in finance (sanctions) and in market access.": "Узкий морской путь перевозит большую часть мировой нефти. Когда ему что-то угрожает, цены на топливо подскакивают везде одновременно. Узкие места есть и в финансах (санкции), и в доступе к рынкам.", "China holds ~{0}–{1}% of global solar PV manufacturing capacity; module prices fell from ~${2}/kW ({3}) to ~${4}/kW ({5}).": "На Китай приходится ~{0}–{1}% мировых мощностей по производству солнечных панелей; цены модулей упали с ~${2}/кВт ({3}) до ~${4}/кВт ({5}).", "Dependencies have become leverage. Choke points are used to coerce: a narrow strait for oil, sanctions for finance, controls on market access.": "Зависимости стали рычагами. Узкие места используют для давления: узкий пролив для нефти, санкции для финансов, ограничения доступа к рынкам.", "Develop utility-scale solar/wind toward a substantial share of technical potential; export power, green hydrogen, or processed materials under sustainable rules; meet domestic access + surplus": "Развивать промышленную солнечную и ветровую генерацию до значительной доли технического потенциала; экспортировать электроэнергию, зелёный водород или переработанные материалы по устойчивым правилам; обеспечить внутренний доступ и излишек", "Energy, food, medicines and data cross every border. The world has never been more interdependent, yet nations still act like rivals, duplicating each other’s industries and racing each other’s arsenals.": "Энергия, продовольствие, лекарства и данные пересекают все границы. Мир никогда не был так взаимозависим, и всё же страны ведут себя как соперники: дублируют чужие отрасли и соревнуются в вооружениях.", "Everything stays in this browser (localStorage): the days you played, finished scenarios, chosen real-world actions and these settings. No accounts, no tracking, nothing sent anywhere.": "Всё хранится в этом браузере (localStorage): дни игры, пройденные сценарии, выбранные реальные действия и эти настройки. Никаких аккаунтов, никакого отслеживания, ничего никуда не отправляется.", "Expand high-quality essential API/generic capacity as a global public-good supplier; pre-agreed pandemic surge protocols; share open digital public infrastructure models": "Расширять производство качественных основных фармсубстанций и дженериков как поставщик глобального общественного блага; заранее согласованные протоколы на случай пандемии; делиться открытыми моделями цифровой общественной инфраструктуры", "Expand sustainable food and bioenergy while protecting remaining forests; contribute to global food security and nature-based solutions": "Расширять устойчивое производство продовольствия и биоэнергии, защищая оставшиеся леса; вносить вклад в мировую продовольственную безопасность и природные решения", "Figures are approximate and taken from Harpreet Raj Singh’s Planetary Family Framework research notes, attributed as they appear there; check the original sources before quoting them. Redundancy, Resilience and boundary “pressure” are game indices, not measurements.": "Цифры приблизительные и взяты из исследовательских заметок Planetary Family Framework Харприта Раджа Сингха с указанием источников, как там приведено; перед цитированием сверяйтесь с первоисточниками. Избыточность, Устойчивость и «давление» на границы — игровые индексы, а не измерения.", "Focus on high-value specialty APIs, advanced components, circular design, and regulatory standards; reduce full vertical duplication where others have scale": "Сосредоточиться на ценных специальных фармсубстанциях, передовых компонентах, циркулярном дизайне и регуляторных стандартах; сократить полное вертикальное дублирование там, где у других есть масштаб", "Food, fuel, fertiliser and finance shocks are arriving together, and they hit the Global South hardest. Progress on the development goals is slipping backwards.": "Шоки продовольствия, топлива, удобрений и финансов приходят одновременно и сильнее всего бьют по Глобальному Югу. Продвижение к целям развития идёт вспять.", "Food, fuel, fertiliser and finance shocks hit the Global South hardest, and progress on the Sustainable Development Goals is slipping.": "Шоки продовольствия, топлива, удобрений и финансов сильнее всего бьют по Глобальному Югу, а продвижение к Целям устойчивого развития замедляется.", "How many people are playing on this device? Pass it around. The chair rotates each round, and every decision is talked through together. Tap a portrait to change your advisor.": "Сколько человек играет на этом устройстве? Передавайте его по кругу. Председатель меняется каждый раунд, а каждое решение обсуждается вместе. Нажмите на портрет, чтобы сменить советника.", "In an interdependent world every dependency can become leverage. Trade, finance and technology are being turned into weapons.": "Во взаимозависимом мире любая зависимость может стать рычагом. Торговлю, финансы и технологии превращают в оружие.", "India ~{0}% of essential APIs (USP); China large bulk API volume; US/EU biologics — managed specialisation with surge protocols.": "Индия ~{0}% основных фармсубстанций (USP); Китай — большие объёмы массовых субстанций; США/ЕС — биопрепараты: управляемая специализация с протоколами на случай кризиса.", "Lead or co-lead high-end biologics, advanced materials, AI tools for optimization, and dual-use resilience tech; open selected research; contribute to Dashboard design": "Возглавлять или совместно возглавлять направления высококлассных биопрепаратов, передовых материалов, инструментов ИИ для оптимизации и технологий устойчивости двойного назначения; открыть часть исследований; участвовать в разработке Панели", "Military leads breed impatience. Restraint gives way to a “use it or lose it” mindset, and a regional conflict threatens to spill over.": "Военное превосходство порождает нетерпение. Сдержанность уступает логике «используй или потеряешь», и региональный конфликт грозит перекинуться дальше.", "No shock this first round. Use it to lay foundations: sign contracts where each region is strongest, and link them into networks.": "В первом раунде шока нет. Используйте его, чтобы заложить основу: подписывайте контракты там, где каждый регион сильнее всего, и связывайте их в сети.", "Replicating China-linked supply chains in the US, Eurozone and UK would cost ~${0}T by {1} (~${2}T in manufacturing, mining, power/utilities).": "Дублирование связанных с Китаем цепочек поставок в США, еврозоне и Великобритании обошлось бы в ~${0} трлн к {1} г. (~${2} трлн — в промышленности, добыче, энергетике и ЖКХ).", "Scale sustainable extraction/processing of battery and clean-tech minerals; develop renewable generation and green export capacity (hydrogen or direct power)": "Наращивать устойчивую добычу и переработку минералов для аккумуляторов и чистых технологий; развивать возобновляемую генерацию и зелёный экспорт (водород или прямые поставки электроэнергии)", "Share models for high-renewable grids, balancing, and inclusive transition; maintain near-{0}% low-carbon electricity in key systems; export design templates for universal services": "Делиться моделями сетей с высокой долей ВИЭ, балансировки и инклюзивного перехода; поддерживать почти {0}% низкоуглеродной электроэнергии в ключевых системах; экспортировать шаблоны всеобщих услуг", "Shared trade rules are giving way to one-to-one deals. The United Nations was designed for {0} members {1} years ago, and today it must serve a very different world.": "Общие торговые правила уступают место двусторонним сделкам. ООН создавалась для {0} членов {1} лет назад, а сегодня должна служить совсем другому миру.", "Shifting {0}–{1}% of military spending to energy transition, health surge and adaptation frees hundreds of billions per year.": "Перевод {0}–{1}% военных расходов на энергопереход, экстренное здравоохранение и адаптацию высвобождает сотни миллиардов в год.", "Solar manufacturing capacity is ~{0}× demand in some assessments; matching it with high-irradiance generation (“powershoring”) uses what already exists.": "По некоторым оценкам, мощности по производству солнечных панелей в ~{0} раза превышают спрос; сочетание их с генерацией в районах высокой инсоляции («powershoring») использует то, что уже есть.", "Specialize in high-precision components, next-gen materials, and quality/assurance systems for clean tech and health; contribute process excellence knowledge": "Специализироваться на высокоточных компонентах, материалах нового поколения и системах качества для чистых технологий и здравоохранения; делиться знаниями о совершенстве процессов", "Sustain {0}–{1}%+ share of global solar PV modules/cells/wafers and battery manufacturing; license or open surplus process knowledge; support resilience via diversified partners": "Сохранять долю {0}–{1}%+ мирового производства солнечных модулей, ячеек, пластин и аккумуляторов; лицензировать или открывать избыточные технологические знания; повышать устойчивость через разнообразие партнёров", "The world is deeply interdependent, yet it is run on rivalry. Trillions go into recreating what already exists, while billions of people fall short of the basics and the planet moves past its limits.": "Мир глубоко взаимозависим, но живёт по законам соперничества. Триллионы уходят на воссоздание того, что уже существует, а миллиарды людей лишены самого необходимого, и планета выходит за свои пределы.", "Time to throw away the old playbook and write a new one, together. This game is one draft of that playbook: interdependence as the operating principle, with countries as administrative units contributing their best to one family.": "Пора выбросить старые правила игры и вместе написать новые. Эта игра — один из черновиков таких правил: взаимозависимость как основной принцип, а страны — административные единицы, вносящие лучшее в одну семью.", "Welcome back. You’ve dropped in on {0} of the last {1} days, and rest days count too. · Scenario {2} “Super El Niño Year”: unlocks tomorrow": "С возвращением. Вы заглядывали {0} из последних {1} дней, и дни отдыха тоже считаются. · Сценарий {2} «Год супер-Эль-Ниньо»: откроется завтра", "World military spending reached ~${0}T in {1}, the {2}th consecutive annual real rise (~{3}% of world GDP); the top {4} spend ~{5}%.": "Мировые военные расходы достигли ~${0} трлн в {1} г. — {2}-й подряд год реального роста (~{3}% мирового ВВП); на первую {4}-ку приходится ~{5}%.", "You’ve been playing for a while. Stand up, stretch, drink some water, look at something far away. The planet and your game will wait right here; nothing is lost.": "Вы играете уже довольно долго. Встаньте, потянитесь, выпейте воды, посмотрите вдаль. Планета и ваша игра подождут здесь; ничего не пропадёт.", "“The Efficiency Case for a Planetary Family Framework”: competitive national model vs coordinated specialisation (SuperGrok Imagine). Muted; press play.": "«Аргументы эффективности в пользу Planetary Family Framework»: конкурентная национальная модель против скоординированной специализации (SuperGrok Imagine). Звук выключен; нажмите «воспроизвести».", "<b style=\"color:var(--goldtx)\">{0} CU<\/b> · {1} cards dealt": "<b style=\"color:var(--goldtx)\">{0} CU<\/b> · роздано карт: {1}", "<b>Draw:<\/b> each round you’re dealt {0} specialization cards and Contribution Units (<b>CU<\/b>, the gold gem).": "<b>Набор:<\/b> каждый раунд вы получаете {0} карты специализаций и Единицы вклада (<b>CU<\/b>, золотой кристалл).", "<b>Score:<\/b> after {0} rounds, see how far the family moved from competition to contribution.": "<b>Подсчёт:<\/b> после {0} раундов посмотрите, насколько семья продвинулась от конкуренции к вкладу.", "<b>Signed here:<\/b> none yet": "<b>Подписано здесь:<\/b> пока ничего", "<b>System costs cut by {0}–{1}%<\/b> (the bar falls into the green band).": "<b>Системные затраты снижены на {0}–{1}%<\/b> (столбец опускается в зелёную полосу).", "<b>What protects the family<\/b> (it hits at the end of the round):": "<b>Что защищает семью<\/b> (удар — в конце раунда):", "A higher <b>Flourishing Index<\/b>: close social shortfalls and turn the planetary-boundary ring green.": "Выше <b>Индекс процветания<\/b>: закрывайте социальные дефициты и сделайте кольцо планетарных границ зелёным.", "Africa’s onshore wind potential vs installed capacity (<{0}%).": "Наземный ветровой потенциал Африки против установленной мощности (<{0}%).", "Africa’s onshore wind technical potential is ~{0} GW, with only ~{1} GW installed (<{2}%).": "Технический потенциал наземной ветроэнергетики Африки ~{0} ГВт, установлено лишь ~{1} ГВт (<{2}%).", "Drop or tap a <b style=\"color:var(--mint)\">glowing green<\/b> region": "Отпустите карту или нажмите на <b style=\"color:var(--mint)\">светящийся зелёным<\/b> регион", "Fair <b>Contribution Balance<\/b> and regional <b>contract targets ★<\/b>.": "Справедливый <b>Баланс вкладов<\/b> и региональные <b>цели контрактов ★<\/b>.", "High <b>Resilience<\/b>: don’t rely on a single region for a whole domain.": "Высокая <b>Устойчивость<\/b>: не полагайтесь на один регион во всей сфере.", "Now <b>drop or tap a glowing region<\/b>. Green is the best fit.": "Теперь <b>отпустите карту или нажмите на светящийся регион<\/b>. Зелёный — лучший выбор.", "Redundancy<br><span style=\"font-size:.{0}rem\">lower is better<\/span>": "Избыточность<br><span style=\"font-size:.{0}rem\">чем ниже, тем лучше<\/span>", "System cost<br>goal {0} to {1}%": "Системные затраты<br>цель от {0} до {1}%", "<b>Assign:<\/b> <b>drag<\/b> a card onto a glowing region, or <b>tap<\/b> a card and then a region. Green is best fit, blue is fine, grey is a poor fit. The action panel shows the <b>synergies<\/b> and <b>trade-offs<\/b> before you sign a voluntary <b>Contribution Contract<\/b>, which the council proposes and agrees together. It is never a mandate.": "<b>Распределение:<\/b> <b>перетащите<\/b> карту на светящийся регион или <b>нажмите<\/b> карту, а затем регион. Зелёный — лучший выбор, синий — нормально, серый — плохой выбор. Панель действий показывает <b>синергии<\/b> и <b>компромиссы<\/b> до подписания добровольного <b>Контракта о вкладе<\/b>, который совет предлагает и согласует вместе. Это никогда не приказ.", "<b>Drag<\/b> a card onto the map, or <b>tap<\/b> a card and then a region. You’ll see the synergies and trade-offs before signing anything.": "<b>Перетащите<\/b> карту на карту мира или <b>нажмите<\/b> карту, а затем регион. Вы увидите синергии и компромиссы до того, как что-то подпишете.", "<b>Eliminate waste:<\/b> once per round, retire duplication or redirect military overspend. Some options unlock only once enough regions contribute.": "<b>Устранение потерь:<\/b> раз в раунд закрывайте дублирование или перенаправляйте избыточные военные расходы. Некоторые варианты открываются, только когда вклад вносят достаточно регионов.", "<b>Shared threat:<\/b> from round {0}, a threat card is revealed. Its checklist shows what protects you, and it hits at the end of the round.": "<b>Общая угроза:<\/b> начиная с раунда {0} открывается карта угрозы. Её список показывает, что вас защищает, а удар приходится на конец раунда.", "<b>Synergy networks:<\/b> linked cards light up animated energy lines between regions. Links across regions are worth the most.": "<b>Синергетические сети:<\/b> связанные карты зажигают анимированные линии энергии между регионами. Связи между разными регионами ценнее всего.", "<b>You are the family council.<\/b> Everyone plays together against the planet’s problems, not against each other. {0}–{1} people can share one device; the chair rotates each round, but every decision is shared.": "<b>Вы — семейный совет.<\/b> Все играют вместе против проблем планеты, а не друг против друга. {0}–{1} человека могут играть на одном устройстве; председатель меняется каждый раунд, но каждое решение общее.", "<b>Your mission:<\/b> make interdependence the operating principle. Treat countries as administrative units of one planetary family: specialise, cut waste, build resilience. Aim for <b>{0}–{1}% lower system costs<\/b> and a flourishing, safer planet within {2} rounds.": "<b>Ваша миссия:<\/b> сделать взаимозависимость основным принципом. Относитесь к странам как к административным единицам одной планетарной семьи: специализируйтесь, сокращайте потери, укрепляйте устойчивость. Цель — <b>снизить системные затраты на {0}–{1}%<\/b> и сделать планету процветающей и безопасной за {2} раундов.", "Choose up to <b>one<\/b> this round (<b style=\"color:var(--goldtx)\">{0} CU<\/b> left). Locked options show what trust they need first.": "Выберите не больше <b>одного<\/b> варианта в этом раунде (осталось <b style=\"color:var(--goldtx)\">{0} CU<\/b>). Закрытые варианты показывают, какое доверие им нужно сначала.", "Each card shows its <b>cost<\/b> (blue gem), <b>output<\/b> (gold) and <b>synergy links<\/b> (green). Drag one up onto the map, or tap it to pick it up.": "На каждой карте показаны её <b>стоимость<\/b> (синий кристалл), <b>отдача<\/b> (золотой) и <b>синергетические связи<\/b> (зелёный). Перетащите карту вверх на карту мира или нажмите, чтобы взять её.", "Grow Flourishing and Resilience, and shrink Redundancy. Turn the boundary ring green and push the system-cost bar down into the <b>{0} to {1}%<\/b> band.": "Повышайте Процветание и Устойчивость и снижайте Избыточность. Сделайте кольцо границ зелёным и опустите столбец системных затрат в полосу <b>от {0} до {1}%<\/b>.", "The planetary family starts at home. Pick <b>one to three<\/b> of these, linked to what your council focused on today. It’s your choice, and no reminders will nag you.": "Планетарная семья начинается дома. Выберите <b>от одного до трёх<\/b> действий, связанных с тем, чем сегодня занимался ваш совет. Выбор за вами, и никаких назойливых напоминаний.", "The threat checklist shows what protects you. The action panel shows <b>synergies and trade-offs<\/b> before you sign. Then eliminate one waste and end the round.": "Список угрозы показывает, что вас защищает. Панель действий показывает <b>синергии и компромиссы<\/b> до подписания. Затем устраните одну потерю и завершите раунд.", "This is how far your family council moved the world, from the <b>Competitive National Model<\/b> to <b>Coordinated Specialisation<\/b>.": "Вот насколько ваш семейный совет продвинул мир — от <b>Конкурентной национальной модели<\/b> к <b>Скоординированной специализации<\/b>.", "While you hold a card, regions glow: <b style=\"color:var(--mint)\">green is the best fit<\/b>, blue is fine, grey is a poor fit. Linked contracts light up flowing energy networks.": "Пока вы держите карту, регионы светятся: <b style=\"color:var(--mint)\">зелёный — лучший выбор<\/b>, синий — нормально, серый — плохой выбор. Связанные контракты зажигают потоки энергетических сетей.", "Wind technical potential ~{0} GW (only ~{1} GW installed, <{2}%); high solar irradiation (>{3} kWh/m²/year in many areas); Namibia among top global PV potential": "Технический потенциал ветра ~{0} ГВт (установлено лишь ~{1} ГВт, <{2}%); высокая солнечная инсоляция (>{3} кВт·ч/м²/год во многих районах); Намибия — среди лидеров мира по потенциалу солнечной энергетики", "🔗 New synergy network with: {0}": "🔗 Новая синергетическая сеть с: {0}", "{0} ({1}) · same region": "{0} ({1}) · тот же регион", "{0} ({1})": "{0} ({1})", "★ Completes {0}’s contract target ({1})": "★ Выполняет цель контрактов для {0} ({1})", "★ {0} target met!": "★ Цель для {0} выполнена!", "★ Best: {0}": "★ Лучше всего: {0}", "⚠️ {0} ({1} of {2} protections missing)": "⚠️ {0} (не хватает {1} из {2} защит)", "✅ {0} ({1} prosperity)": "✅ {0} ({1} процветания)", "Waste eliminated: {0}": "Устранённая потеря: {0}", "Round {0}: {1}": "Раунд {0}: {1}", "<b>Role:<\/b> {0}": "<b>Роль:<\/b> {0}", "<b>Illustrative target:<\/b> {0}": "<b>Ориентировочная цель:<\/b> {0}", "<b>In-game contract target:<\/b> {0}": "<b>Цель контрактов в игре:<\/b> {0}", "{0} <i>({1})<\/i>": "{0} <i>({1})<\/i>", "{0}<br><span class=\"small mut\">{1}<\/span>": "{0}<br><span class=\"small mut\">{1}<\/span>", "{0}<br><span class=\"mut\">{1}<\/span>": "{0}<br><span class=\"mut\">{1}<\/span>", "<span class=\"ck\"><\/span>{0}": "<span class=\"ck\"><\/span>{0}", "<span class=\"ck\">✓<\/span>{0}": "<span class=\"ck\">✓<\/span>{0}", "{0} <span class=\"pill\" style=\"color:var(--goldtx);border-color:#ffc94a\">★ target met<\/span>": "{0} <span class=\"pill\" style=\"color:var(--goldtx);border-color:#ffc94a\">★ цель выполнена<\/span>", "in <b>{0}<\/b>": "в <b>{0}<\/b>", "Chair<b>{0}<\/b>": "Председатель<b>{0}<\/b>", "Advisor<b>{0}<\/b>": "Советник<b>{0}<\/b>", "Member {0}": "Участник {0}", "Output <b>{0}<\/b> shared prosperity ({1} ×{2})": "Отдача <b>{0}<\/b> общего процветания ({1} ×{2})", "<b>Chair: {0}<\/b>. Talk it through together; the chair taps. · <b style=\"color:var(--goldtx)\">{1} CU<\/b> · {2} cards dealt": "<b>Председатель: {0}<\/b>. Обсудите вместе; нажимает председатель. · <b style=\"color:var(--goldtx)\">{1} CU<\/b> · роздано карт: {2}", "<b style=\"background:{0}\"><\/b>{1}": "<b style=\"background:{0}\"><\/b>{1}", "{0}, council advisor": "{0}, советник совета", "Duplication waste {0}%": "Потери от дублирования {0}%", "Military overspend redirected {0}%": "Перенаправлено избыточных военных расходов {0}%", "Peace dividend: {0} CU every later round": "Дивиденд мира: {0} CU в каждом следующем раунде", "Social shortfall {0}": "Социальный дефицит {0}", "Resilience {0}": "Устойчивость {0}", "System costs {0}%": "Системные затраты {0}%", "Resilience {0} (rules everyone signs up to)": "Устойчивость {0} (правила, которые принимают все)", "Cont (function stars(){
 const cv=document.createElement('canvas');cv.id='stars';document.body.prepend(cv);const x=cv.getContext('2d');let st=[],w=0,h=0,last=0;
 function size(){w=cv.width=innerWidth*devicePixelRatio;h=cv.height=innerHeight*devicePixelRatio;cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';
  st=Array.from({length:Math.round(innerWidth*innerHeight/7000)},()=>({x:Math.random()*w,y:Math.random()*h,r:(Math.random()*1.3+.3)*devicePixelRatio,p:Math.random()*6.3,s:.5+Math.random()*1.5,v:.02+Math.random()*.08}));draw(0);}
 function draw(t){x.clearRect(0,0,w,h);if(isLight())return;for(const s of st){const a=reduced()?.6:.35+.65*Math.abs(Math.sin(s.p+t/1000*s.s));x.globalAlpha=a;x.fillStyle=s.r>1.3?'#cfefff':'#ffffff';x.beginPath();x.arc(s.x,s.y,s.r,0,6.283);x.fill();if(!reduced()){s.y-=s.v;if(s.y<0)s.y=h;}}x.globalAlpha=1;}
 function loop(t){requestAnimationFrame(loop);if(document.hidden||reduced())return;if(t-last<50)return;last=t;draw(t);}
 addEventListener('resize',size);size();requestAnimationFrame(loop);
})();

/* ---- FX: confetti, floating numbers, shakes ---- */
const FX=(()=>{const cv=document.createElement('canvas');cv.id='fx';document.body.appendChild(cv);const x=cv.getContext('2d');let P=[],run=false;
 function size(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';}
 addEventListener('resize',size);size();
 function step(){x.clearRect(0,0,cv.width,cv.height);P=P.filter(p=>p.l>0);for(const p of P){p.l--;p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.globalAlpha=Math.min(1,p.l/30);x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;if(p.k==='spark'){x.beginPath();x.arc(0,0,p.s,0,6.283);x.fill();}else x.fillRect(-p.s,-p.s/2,p.s*2,p.s);x.restore();}
  if(P.length)requestAnimationFrame(step);else{run=false;x.clearRect(0,0,cv.width,cv.height);}}
 return {burst(px,py,n,cols,kind){if(reduced())return;const d=devicePixelRatio;cols=cols||['#3df58a','#4da3ff','#ffc94a','#ff5f9e','#b28bff','#ffffff'];
   for(let i=0;i<(n||40);i++){const a=Math.random()*6.283,v=(kind==='spark'?2:4)+Math.random()*6;P.push({x:px*d,y:py*d,vx:Math.cos(a)*v*d,vy:(Math.sin(a)*v-(kind==='spark'?1:4))*d,g:(kind==='spark'?.05:.18)*d,s:(kind==='spark'?2+Math.random()*2.5:3+Math.random()*4)*d,c:cols[i%cols.length],a:Math.random()*6,va:(Math.random()-.5)*.3,l:60+Math.random()*50,k:kind||'conf'});}
   if(!run){run=true;requestAnimationFrame(step);}},
  float(px,py,text,col,delay){const el=document.createElement('div');el.className='floaty';el.textContent=text;el.style.left=px+'px';el.style.top=py+'px';el.style.color=col||PAL().mint;el.style.animationDelay=(delay||0)+'ms';document.body.appendChild(el);setTimeout(()=>el.remove(),1700+(delay||0));},
  shake(sel){const el=$(sel);if(!el||reduced())return;el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');setTimeout(()=>el.classList.remove('shake'),600);},
  vignette(){if(reduced())return;const v=document.createElement('div');v.className='vignette';document.body.appendChild(v);setTimeout(()=>v.remove(),1200);}};
})();
function countUp(el,to,dur){if(!el)return;const from=parseFloat(el.dataset.v||'0');el.dataset.v=to;if(reduced()||from===to){el.textContent=Math.round(to);return;}
 const t0=performance.now();dur=dur||900;(function f(t){const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=Math.round(from+(to-from)*e);if(k<1)requestAnimationFrame(f);})(t0);}

/* ---- Quotes (loaded from quotes.json at build time; slot hidden if none) ---- */
const QUOTES_SAFE=(typeof QUOTES!=='undefined'&&Array.isArray(QUOTES))?QUOTES.filter(q=>q&&q.text&&q.author):[];
const usedQuotes=new Set();
function pickQuote(keys){
 if(!QUOTES_SAFE.length)return null;
 const norm=q=>[].concat(q.theme||[]).join(' ').toLowerCase();
 const sc=QUOTES_SAFE.map((q,i)=>{const th=norm(q);let s=0;for(const k of keys||[])if(th.includes(k)||k.includes(th)&&th)s++;return {q,i,s};});
 const day=Math.floor(Date.now()/864e5);
 const pool=sc.filter(o=>!usedQuotes.has(o.i));
 const use=pool.length?pool:sc;
 const best=Math.max(...use.map(o=>o.s));
 const cand=use.filter(o=>o.s===best);
 const pick=cand[(day+usedQuotes.size)%cand.length];
 usedQuotes.add(pick.i);return pick.q;
}
function quoteHTML(keys){const q=pickQuote(keys);if(!q)return '';
 const meta=[q.role,q.source,q.year&&!String(q.source||'').includes(String(q.year))?q.year:''].filter(Boolean).map(esc).join(' · ');
 return `<figure class="quote" style="margin:12px 0"><span class="qorig">Original quote in English<\/span><q lang="en" dir="ltr">${esc(q.text)}<\/q><cite lang="en" dir="ltr">— <b>${esc(q.author)}<\/b>${meta?', '+meta:''}${q.url?` · <a href="${esc(q.url)}" target="_blank" rel="noopener noreferrer">source<\/a>`:''}<\/cite><\/figure>`;}

/* ---- Media with graceful fallback ---- */
function wireMedia(root){
 (root||document).querySelectorAll('.media').forEach(m=>{
  const fail=()=>m.classList.add('missing');
  m.querySelectorAll('img').forEach(i=>{i.addEventListener('error',fail);if(i.complete&&i.naturalWidth===0&&i.getAttribute('src'))fail();});
  m.querySelectorAll('video').forEach(v=>{
   const pst=v.getAttribute('poster');
   if(pst){const im=new Image();im.onerror=()=>{v.removeAttribute('poster');v.preload='metadata';v.load();};im.src=pst;}
   const srcs=v.querySelectorAll('source');if(srcs.length)srcs[srcs.length-1].addEventListener('error',()=>{v.removeAttribute('poster');fail();});
   v.addEventListener('error',fail);});
 });
}

const imgBlock=(src,alt,cap,fb)=>`<figure class="media"><img src="${A(src)}" alt="${esc(alt)}" loading="lazy"><div class="fallback">${fb||''}<\/div>${cap?`<figcaption>${cap}<\/figcaption>`:''}<\/figure>`;

/* ===================== i18n: the six UN official languages via one string table =====================
   English is the source. build/i18n/<code>.json maps each English UI string to its translation
   ("{0}"-style placeholders carry numbers and names through unchanged). Translation is applied to the
   rendered DOM (text nodes + aria-label/title/placeholder/alt), so game logic never depends on language.
   Quotes are NEVER translated: they stay in their original verified English with attribution. */
const LANGS=[['en','English'],['fr','Français'],['es','Español'],['ar','العربية'],['zh','中文（简体）'],['ru','Русский']];
const LCODES=LANGS.map(l=>l[0]);
const I18N_COLLECT=QS.get('i18nCollect')==='1';
(function(){const q=QS.get('lang');if(q&&LCODES.includes(q)){store.lang=q;saveStore();return;}
 if(!store.lang||!LCODES.includes(store.lang)){const n=String((navigator.languages&&navigator.languages[0])||navigator.language||'en').toLowerCase().slice(0,2);store.lang=LCODES.includes(n)?n:'en';saveStore();}})();
let TX=null,TP=[],_KEEP=null;const I18N_KEEP=()=>_KEEP||(_KEEP=new Set([...REGIONS.flatMap(r=>[r.name,r.short]),'SIPRI','EY-Parthenon','USP','Planetary Family Framework','Nova','Terra','Aqua','Sol','CU']));const MISS=new Set();window.__miss=MISS;
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function loadLang(){const d=store.lang==='en'?null:(I18N[store.lang]||null);
 TX=d?new Map():(I18N_COLLECT?new Map():null);TP=[];
 if(d)for(const [k,v] of Object.entries(d)){if(!v)continue;if(/\{\d\}/.test(k)){const parts=k.split(/\{(\d)\}/);let src='^';const order=[];parts.forEach((p,i)=>{if(i%2){src+='([\\s\\S]+?)';order.push(+p);}else src+=reEsc(p);});TP.push({re:new RegExp(src+'$'),order,v,len:k.replace(/\{\d\}/g,'').length,html:/<[a-z]/i.test(k)});}else TX.set(k,v);}
 TP.sort((a,b)=>b.len-a.len);
 const h=document.documentElement;h.lang=store.lang;h.dir=store.lang==='ar'?'rtl':'ltr';}
const NONWORD=/^[\s\d.,:;%+\-−–—×/·★✓✔✕→←▶◀⏭()\[\]$€£¥~#&'"“”‘’!?…|<>=^*_@]*$/u;
function look(key,d){
 if(TX.has(key))return TX.get(key);
 if(NONWORD.test(key)||!/\p{L}/u.test(key))return key;
 if(key.length>2&&key[0]==='“'&&key.endsWith('”')){const r=look(key.slice(1,-1),d+1);if(r!==key.slice(1,-1))return (store.lang==='fr'?'« ':store.lang==='ru'?'«':'“')+r+(store.lang==='fr'?' »':store.lang==='ru'?'»':'”');}
 for(const p of TP){const m=key.match(p.re);if(p.len<8||!m||m.slice(1).some(c=>c.includes(' · ')))continue;if(m)return p.v.replace(/\{(\d)\}/g,(_,i)=>{const c=m[p.order.indexOf(+i)+1];if(c===undefined)return '';if(d>=3)return c;const t=look(c,d+1);if(I18N_COLLECT&&t===c&&/\p{L}{3}/u.test(c))MISS.add('{cap} '+c);return t;});}
 const pm=key.match(/^([^\p{L}\p{N}"“(]+)([\s\S]+)$/u);if(pm){const r=look(pm[2],d+1);if(r!==pm[2])return pm[1]+r;}
 const sm=key.match(/^([\s\S]+?)([.:!?)]+)$/u);if(sm&&TX.has(sm[1]))return TX.get(sm[1])+sm[2];
 for(const p of TP){const m=key.match(p.re);if(p.len>=8||!m||(d<3&&m.slice(1).some(c=>/; | · /.test(c)||/\p{L}/u.test(c)&&!TX.has(c)&&!I18N_KEEP().has(c.replace(/^[^\p{L}]+/u,''))&&look(c,3)===c)))continue;if(m)return p.v.replace(/\{(\d)\}/g,(_,i)=>{const c=m[p.order.indexOf(+i)+1];if(c===undefined)return '';if(d>=3)return c;const t=look(c,d+1);if(I18N_COLLECT&&t===c&&/\p{L}{3}/u.test(c))MISS.add('{cap} '+c);return t;});}
 for(const sep of [' · ','; ',' — ',' – ',', ']){if(key.includes(sep)){const ps=key.split(sep);const t=ps.map(x=>look(x,d+1));if(t.some((x,i)=>x!==ps[i]))return t.join(store.lang==='zh'?(sep==='; '?'；':sep===', '?'，':sep):store.lang==='ar'?(sep==='; '?'؛ ':sep===', '?'، ':sep):sep);}}
 if(I18N_COLLECT&&d===0)MISS.add(key);
 return key;}
function tr(s){if(!TX||s==null)return s;s=String(s);const m=s.match(/^(\s*)([\s\S]*?)(\s*)$/);if(!m[2])return s;const r=look(m[2],0);return r===m[2]?s:m[1]+r+m[3];}
const TATTR=['aria-label','title','placeholder','alt'];
/* Mixed-content elements (text + simple inline tags) are translated as ONE sentence (tags kept) so word order can change. */
const INLINE=/^(B|I|EM|STRONG|SPAN|A|BR|SMALL|SUP|SUB|CODE|KBD|U)$/;
function isMixed(el){if(!el||el.nodeType!==1||skipEl(el))return false;let txt=false,inl=false;
 for(const c of el.childNodes){if(c.nodeType===3){if(/\p{L}/u.test(c.data))txt=true;}else if(c.nodeType===1){if(!INLINE.test(c.nodeName))return false;for(const g of c.querySelectorAll('*'))if(!INLINE.test(g.nodeName))return false;inl=true;}}
 return txt&&inl;}
const normH=h=>h.replace(/\s+/g,' ').trim();
function txMixed(el){if(!isMixed(el))return false;const h=normH(el.innerHTML);if(el.__hx===h)return true;
 const r=lookH(h);if(r===null){return false;}
 el.__hx=normH(r);if(r!==h)el.innerHTML=r;el.__hx=normH(el.innerHTML);return true;}
function lookH(h){if(TX.has(h))return TX.get(h);
 for(const p of TP){if(!p.html)continue;const m=h.match(p.re);if(m)return p.v.replace(/\{(\d)\}/g,(_,i)=>{const c=m[p.order.indexOf(+i)+1];if(c===undefined)return '';if(/<[a-z]/i.test(c))return lookH(c)??c;const dec=c.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&amp;/g,'&');const t=look(dec,1);if(I18N_COLLECT&&t===dec&&/\p{L}{3}/u.test(dec))MISS.add('{cap} '+dec);return esc(t);});}
 if(I18N_COLLECT){MISS.add(h);return h;}
 return null;}
const inHx=n=>{for(let p=n.parentNode,i=0;p&&i<4;p=p.parentNode,i++)if(p.__hx!==undefined&&p.__hx===normH(p.innerHTML))return true;return false;};
function skipEl(el){return !el||el.nodeType!==1||/^(SCRIPT|STYLE|TEXTAREA|Q|CITE|VIDEO|SOURCE)$/i.test(el.nodeName)||(el.closest&&el.closest('[data-noi18n]'));}
function txText(n){if(n.__t===n.data)return;const p=n.parentNode;if(p&&!skipEl(p)&&!inHx(n)){if(txMixed(p)){n.__t=n.data;return;}const o=tr(n.data);if(o!==n.data)n.data=o;}n.__t=n.data;}
function txAttrs(el){if(skipEl(el))return;el.__ta=el.__ta||{};for(const a of TATTR){const v=el.getAttribute(a);if(v&&el.__ta[a]!==v){const o=tr(v);el.__ta[a]=o;if(o!==v)el.setAttribute(a,o);}}}
function txTree(root){if(!TX||!root)return;if(root.nodeType===3){txText(root);return;}if(root.nodeType!==1&&root.nodeType!==11)return;
 if(root.nodeType===1){if(skipEl(root))return;txAttrs(root);if(txMixed(root)){root.querySelectorAll('*').forEach(txAttrs);return;}}
 const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT,{acceptNode:n=>{if(n.nodeType!==1)return NodeFilter.FILTER_ACCEPT;if(skipEl(n))return NodeFilter.FILTER_REJECT;txAttrs(n);if(txMixed(n)){n.querySelectorAll('*').forEach(txAttrs);return NodeFilter.FILTER_REJECT;}return NodeFilter.FILTER_SKIP;}});

const i18nObs=new MutationObserver(ms=>{if(!TX)return;for(const m of ms){if(m.type==='childList'){if(m.addedNodes.length&&txMixed(m.target))continue;m.addedNodes.forEach(txTree);}else if(m.type==='characterData')txText(m.target);else if(m.type==='attributes')txAttrs(m.target);}});

/* ===================== Gentle break reminder (~25 min active; no visible timer) ===================== */
const BREAK_MS=(+QS.get('breakAfterSec')||25*60)*1000;
let lastTick=Date.now();
setInterval(()=>{const now=Date.now();if(!document.hidden&&(UI.screen==='game'||UI.screen==='end'))UI.activeMs+=now-lastTick;lastTick=now;
 if(!UI.breakShown&&UI.activeMs>=BREAK_MS){UI.breakShown=true;
  const showB=()=>openModal(`<div style="text-align:center">${avatarSVG(1,'avatar')}<h2>Time for a short break? 🌿<\/h2><p>You’ve been playing for a while. Stand up, stretch, drink some water, look at something far away. The planet and your game will wait right here; nothing is lost.<\/p><button class="btn" onclick="closeModal()" data-autofocus>Thanks, back in a moment<\/button><\/div>`);
  if(!$('#modal').classList.contains('hidden')){const t=setInterval(()=>{if($('#modal').classList.contains('hidden')){clearInterval(t);showB();}},1000);}else showB();}
},1000);

/* ===================== HRS Games app layer (tools/patch_lotw.py) ===================== */
function hrsInPlay(){return !!S&&(UI.screen==='game'||UI.screen==='briefing');}
function hrsLeave(e){
 if(!hrsInPlay())return true;
 if(e&&e.preventDefault)e.preventDefault();
 openModal(`<div style="text-align:center"><h2>Leave this game?</h2><p>A game in progress is not saved. If you go back to all games now, this council's progress will be lost. Your finished scenarios and settings stay on this device.<\/p><div class="cta" style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn ghost" onclick="closeModal()" data-autofocus>Keep playing<\/button><a class="btn" href="../../index.html" style="text-decoration:none">All games<\/a><\/div><\/div>`);
 return false;
}
if(window.HRS){
 // Android back: skip the trailer, close a dialog, step back from setup, ask before leaving a game, then the launcher
 HRS.onBack(()=>{
  const tr=document.getElementById('trailer');if(tr){const b=document.getElementById('btnSkip');if(b)b.click();return true;}
  if(!$('#modal').classList.contains('hidden')){if(!$('#modalCard').dataset.sticky)closeModal();return true;}
  if(UI.screen==='setup'){renderTitle();return true;}
  if(hrsInPlay()){hrsLeave();return true;}
  return false;});
 // hrs-common sets <html lang> from the app language; the game keeps its own (6 UN languages, Arabic right to left)
 window.addEventListener('hrs-lang-change',()=>{const h=document.documentElement;h.lang=store.lang;h.dir=store.lang==='ar'?'rtl':'ltr';});
 window.addEventListener('storage',e=>{if(e.key==='hrs_settings_v1')applyTheme();});
}
