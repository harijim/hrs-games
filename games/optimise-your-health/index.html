/* Optimise Your Health v3: visual-first. Botanical teal + sunrise coral on cream; one focus per screen; big visuals centre stage. */
:root{--bg:#fbf7ef;--bg2:#f3eee3;--card:#fffdf9;--ink:#1d2a26;--mut:#6a766f;--teal:#1f7f70;--teal-d:#15604f;--teal2:#e3f1ec;--coral:#ef7b5f;--coral-d:#c75a40;--coral2:#fdebe4;--sun:#f4b740;--sun2:#fdf3dc;--sky:#eef4fb;--sky-d:#3d6fb0;--red:#c4483a;--good:#257d5a;
 --sh:0 1px 2px rgba(29,42,38,.04),0 8px 24px -12px rgba(29,42,38,.16);--sh2:0 2px 6px rgba(29,42,38,.06),0 18px 40px -18px rgba(29,42,38,.26);
 --display:"OYH Display","Iowan Old Style","Palatino Linotype",Georgia,serif;--ui:system-ui,-apple-system,"Segoe UI",Roboto,"HRS Devanagari","HRS Gurmukhi","Noto Sans Devanagari","Noto Sans Gurmukhi",sans-serif;
 --r:22px;--s:var(--hrs-scale,1);--dockH:0px;--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1)}

.bar .sp{flex:1}
main{padding:4px 0 20px}

/* ===== plant ===== */
.plant{display:block;overflow:visible}
.plant .grow{transform-origin:50px 108px;transform:scale(var(--g,.8));transition:transform 1.1s var(--spring)}
.plant .sway{transform-origin:50px 108px;animation:sway 6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
.plant .lf{transform:scale(var(--s,.6));transition:transform .9s var(--spring) .1s}
.plant .lf:nth-of-type(2n){transition-delay:.18s}
.plant .flower{transform-origin:50px 22px;transform:scale(0) rotate(-40deg);transition:transform 1s var(--spring) .35s}
.plant.bloom .flower{transform:scale(1) rotate(0)}
.plant .bud{transform-origin:50px 23px;transform:scale(0);transition:transform .7s var(--spring) .2s}
.plant.budding .bud{transform:scale(1)}
.plant.wilt .sway{animation-duration:9s}
.plant.wilt .stem{stroke:#8aa37a}

#scr-title{text-align:center;padding-top:2px}
.hero{width:150px;height:192px;margin:0 auto -2px;position:relative}

@keyframes glow{50%{transform:scale(1.08);opacity:.75}}
.hero .plant{position:relative;width:100%;height:100%}
.sub{margin:0 0 12px;color:var(--coral-d);font:500 calc(17px*var(--s))/1.3 var(--display);font-style:italic}

.cta:hover:not([disabled]){filter:brightness(1.06);transform:translateY(-1px)}
.cta:active:not([disabled]){transform:scale(.97)}
.cta::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);transform:translateX(-120%);animation:shine 4.5s ease-in-out infinite 1.5s}
@keyframes shine{0%,70%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.cta[disabled]{background:#d9ddd6;color:#5d6862;box-shadow:none;cursor:default}
.cta[disabled]::after{display:none}
.cta.green{background:linear-gradient(135deg,#f08a68,#d9603f);box-shadow:0 10px 24px -10px rgba(199,90,64,.7)}
.cta.cont{margin:0 0 16px}
.ghost{min-height:52px;padding:10px 18px;border-radius:999px;border:1.5px solid rgba(31,127,112,.28);background:transparent;color:var(--teal-d);font-weight:700;cursor:pointer;transition:background .2s,transform .2s var(--spring)}
.ghost:hover{background:var(--teal2)}
.ghost:active{transform:scale(.96)}
.langs{display:inline-flex;gap:2px;padding:3px;margin:0 auto 2px;border-radius:999px;background:var(--bg2)}
.lang{border:0;background:none;border-radius:999px;padding:6px 14px;min-height:48px;font-weight:650;cursor:pointer;color:var(--mut)}
.lang[aria-checked="true"]{background:#fff;color:var(--teal-d);box-shadow:var(--sh)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mode{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:150px;padding:16px 6px 12px;border-radius:var(--r);border:0;background:var(--card);box-shadow:var(--sh);cursor:pointer;transition:transform .25s var(--spring),box-shadow .25s;animation:rise .5s var(--ease) both}
.mode:nth-child(2){animation-delay:.06s}
.mode:nth-child(3){animation-delay:.12s}
.mode:hover{transform:translateY(-4px);box-shadow:var(--sh2)}
.mode:active{transform:scale(.96)}
.me{display:grid;place-items:center;width:62px;height:62px;border-radius:20px;background:var(--sun2);font-size:32px;margin-bottom:6px;transition:transform .3s var(--spring)}
.mode:hover .me{transform:rotate(-8deg) scale(1.1)}
.mode:nth-child(2) .me{background:var(--teal2)}
.mode:nth-child(3) .me{background:var(--coral2)}
.mode b{font:650 calc(16px*var(--s))/1.15 var(--display)}
.mb{margin-top:3px;font-size:.74em;font-weight:800;color:var(--good);background:var(--teal2);border-radius:999px;padding:1px 8px}
.mode.last::after{content:"";position:absolute;top:10px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--teal)}
.link{margin:12px auto 0;display:block;background:none;border:0;color:var(--teal);font-weight:700;cursor:pointer;min-height:48px;padding:0 12px}
details.disc{margin:6px auto;max-width:440px;font-size:.8em;color:var(--mut);text-align:center}

.hrs-links{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 16px;margin:2px 0;font-size:.82em}

/* tokens & effect chips (visual{display:flex;flex-wrap:wrap;gap:4px;align-items:center}

@keyframes nudge{50%{transform:translateX(5px)}}

/* dock: basket + single primary action */
