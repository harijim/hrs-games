<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--sky1:#bdeeff;--sky2:#eafff3;--ink:#16323f;--soft:rgba(22,50,63,.6);--card:#fff;--r:18px}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--sky1),var(--sky2));overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid #2b8cff;outline-offset:2px}
#app{position:fixed;top:0;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;display:flex;flex-direction:column;padding:max(8px,env(safe-area-inset-top)) 10px max(4px,env(safe-area-inset-bottom))}
#app.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(4px,-2px)}30%,50%,70%{transform:translate(-7px,3px) rotate(-.5deg)}40%,60%{transform:translate(7px,-3px) rotate(.5deg)}}
#top{display:flex;align-items:center;gap:8px;height:38px;flex:none}
#date{font-weight:800;font-size:17px;letter-spacing:.2px;min-width:86px;transition:transform .3s}
#date.bump{animation:bump .5s}
#timeline{flex:1;display:flex;gap:3px;align-items:center}
#timeline i{flex:1;height:6px;border-radius:3px;background:rgba(22,50,63,.14);transition:background .4s}
#timeline i.done{background:rgba(22,50,63,.55)}
#timeline i.now{background:#ffb703;box-shadow:0 0 0 2px rgba(255,183,3,.35)}
.ibtn{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.7);font-size:16px;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.08)}
#meters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;height:34px;flex:none;align-items:center}
.meter{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.62);border-radius:14px;padding:4px 8px;position:relative}
.meter .ic{font-size:17px;line-height:1}
.meter .bar{flex:1;height:8px;border-radius:4px;background:rgba(22,50,63,.12);overflow:hidden}
.meter .bar i{display:block;height:100%;width:50%;border-radius:4px;background:#3cc66a;transition:width .6s cubic-bezier(.2,.9,.3,1.2),background .4s}
.meter.mid .bar i{background:#f4b400}.meter.low .bar i{background:#e8463a}
.meter.low{animation:pulse 1s infinite}
.meter b{font-size:11px;min-width:18px;text-align:right;opacity:.7}
.meter.hit{animation:bump .45s}
@keyframes pulse{50%{box-shadow:0 0 0 3px rgba(232,70,58,.35)}}
@keyframes bump{30%{transform:scale(1.15)}60%{transform:scale(.95)}}
#stage{position:relative;flex:1;min-height:200px;display:flex;align-items:center;justify-content:center}
#world{position:absolute;display:block}
#ring{position:absolute;pointer-events:none}
.dot{position:absolute;width:var(--d,24px);height:var(--d,24px);margin:calc(var(--d,24px)/-2) 0 0 calc(var(--d,24px)/-2);border-radius:50%;pointer-events:auto;
  background:linear-gradient(to top,var(--c) var(--f),rgba(255,255,255,.75) var(--f));box-shadow:0 0 0 2px var(--c) inset,0 2px 5px rgba(0,0,0,.15);
  font-size:10px;font-weight:800;color:rgba(0,0,0,.45);display:grid;place-items:center;transition:transform .25s}
.dot.ok{background:var(--c);color:#fff;box-shadow:0 0 0 2px #fff inset,0 0 12px var(--c);transform:scale(1.12)}
.dot.ok::after{content:"✓";position:absolute;right:-4px;top:-5px;width:13px;height:13px;border-radius:50%;background:#fff;color:#2a9d4b;font-size:9px;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.dot.ping{animation:ping .6s}
@keyframes ping{40%{transform:scale(1.5)}}
#tip{position:absolute;top:4px;left:50%;transform:translate(-50%,-6px);background:rgba(22,50,63,.92);color:#fff;font-size:13px;padding:7px 12px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;max-width:92%;text-align:center;z-index:5}
#tip.show{opacity:1;transform:translate(-50%,0)}
#toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;background:rgba(255,255,255,.95);border-radius:22px;padding:14px 18px;text-align:center;box-shadow:0 12px 34px rgba(0,0,0,.22);max-width:86%;min-width:200px;transition:transform .35s cubic-bezier(.2,1.4,.4,1),opacity .2s;z-index:6}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
#toast.bad{background:#2b2d3a;color:#fff}#toast.good{background:#eafff0}
#toast .te{font-size:46px;line-height:1.1}
#toast .tt{font-weight:800;font-size:19px;margin-top:2px}
#toast .tc{font-size:12.5px;opacity:.75;margin-top:3px}
#toast .tfx{margin-top:7px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.fxc{font-size:12px;font-weight:800;padding:2px 7px;border-radius:9px;background:rgba(0,0,0,.07)}
.bad .fxc{background:rgba(255,255,255,.12)}
.fxc.n{color:#d8352a}.bad .fxc.n{color:#ff8a80}.fxc.p{color:#1f9a4b}.bad .fxc.p{color:#7dffa6}
#future{height:28px;flex:none;display:flex;gap:6px;justify-content:center;align-items:center}
.chip{height:24px;padding:0 9px;border-radius:12px;font-size:13px;display:flex;align-items:center;gap:3px;box-shadow:0 2px 5px rgba(0,0,0,.1);animation:pin .4s cubic-bezier(.2,1.5,.4,1)}
.chip b{font-size:11px}
.chip.st{background:#30323f;color:#fff}.chip.sd{background:#dcf8e3;color:#1c6b37}
.chip.soon{animation:pin .4s,tick 1s infinite .4s}
@keyframes pin{from{transform:scale(0)}}
@keyframes tick{50%{transform:rotate(-6deg) scale(1.08)}}
#hand{flex:none;height:186px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-top:14px;position:relative}
.card{position:relative;background:var(--card);border-radius:var(--r);padding:12px 7px 8px;display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:0 6px 16px rgba(22,50,63,.14),0 1px 0 rgba(255,255,255,.9) inset;transition:transform .18s,box-shadow .18s,opacity .3s;touch-action:none;animation:deal .5s cubic-bezier(.2,1.3,.4,1) backwards}
.card:nth-child(2){animation-delay:.07s}.card:nth-child(3){animation-delay:.14s}
@keyframes deal{from{transform:translateY(120px) rotate(8deg);opacity:0}}
@media (hover:hover){.card:hover{transform:translateY(-6px) rotate(-1deg);box-shadow:0 12px 24px rgba(22,50,63,.2)}}
.card.b{background:linear-gradient(170deg,#fff6e6,#ffe3c2)}
.card .tag{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:10.5px;font-weight:800;white-space:nowrap;padding:2px 8px;border-radius:9px;background:#ff8a00;color:#fff;box-shadow:0 2px 5px rgba(255,138,0,.35)}
.card.g .tag{background:#2fb35a;box-shadow:0 2px 5px rgba(47,179,90,.35)}
.card .em{font-size:38px;line-height:1.15;filter:drop-shadow(0 3px 3px rgba(0,0,0,.12))}
.card .ti{font-weight:800;font-size:14px;line-height:1.15;margin-top:3px}
.card .hi{font-size:11.5px;opacity:.65;line-height:1.2;margin-top:3px}
.card .fx{margin-top:auto;display:flex;gap:3px;flex-wrap:wrap;justify-content:center;align-items:center;font-size:11px;font-weight:800}
.card .fx .s{width:9px;height:9px;border-radius:50%;background:var(--c);display:inline-block}
.card .fx .s.n{box-shadow:0 0 0 1.5px #fff inset;opacity:.55;position:relative}
.card .fx .s.n::after{content:"";position:absolute;left:1px;right:1px;top:4px;height:1.5px;background:#fff}
.card .later{font-size:10.5px;font-weight:800;margin-top:4px;padding:1px 7px;border-radius:8px;background:#30323f;color:#fff}
.card .later.g{background:#dcf8e3;color:#1c6b37}
.card.locked{opacity:.5;filter:grayscale(.7)}
.card.locked .lk{position:absolute;inset:auto 6px 40%;font-size:12px;font-weight:800;background:#fff;border-radius:8px;padding:2px}
.card.nope{animation:nope .35s}
@keyframes nope{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.card.fly{transition:transform .45s cubic-bezier(.5,-0.3,.6,1),opacity .45s;opacity:0;pointer-events:none}
.card.drop{transition:transform .35s ease-in,opacity .3s;transform:translateY(140px) rotate(6deg);opacity:0;pointer-events:none}
#hand.off .card{pointer-events:none}
.kbd{position:absolute;bottom:5px;right:7px;font-size:9px;opacity:.35;font-weight:800}
@media (hover:none){.kbd{display:none}}
#foot{flex:none;height:16px;text-align:center;font-size:10.5px;letter-spacing:.3px;opacity:.55;font-weight:600}
.pop{position:fixed;z-index:30;font-weight:900;font-size:16px;pointer-events:none;transform:translate(-50%,-50%);animation:popup 1.1s ease-out forwards;text-shadow:0 1px 0 #fff,0 0 6px rgba(255,255,255,.8);white-space:nowrap}
.pop.n{color:#d8352a}.pop.p{color:#169447}.pop.k{color:#30323f;font-size:14px;background:#fff;padding:3px 9px;border-radius:10px;text-shadow:none;box-shadow:0 3px 10px rgba(0,0,0,.15)}
@keyframes popup{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-260%) scale(1)}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:25}
.ov{position:absolute;left:10px;right:10px;bottom:22px;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border-radius:26px;padding:20px 18px 16px;text-align:center;box-shadow:0 14px 40px rgba(22,50,63,.25);transition:transform .45s cubic-bezier(.2,1.2,.4,1),opacity .3s}
.ov.hide{transform:translateY(120%);opacity:0;pointer-events:none}
.brand{font-size:11px;letter-spacing:2.2px;text-transform:uppercase;font-weight:800;opacity:.6}
.logo{font-size:64px;font-weight:900;line-height:1;letter-spacing:-2px;margin-top:6px;background:linear-gradient(90deg,#E5243B,#FCC30B,#56C02B,#26BDE2,#19486A);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:15px;font-weight:700;margin-top:4px}
.sub2{font-size:12.5px;opacity:.6;margin-top:4px}
.big{display:inline-block;margin-top:14px;padding:14px 40px;border-radius:30px;background:linear-gradient(180deg,#36c46b,#1f9a4b);color:#fff;font-size:20px;font-weight:900;box-shadow:0 6px 0 #167a3a,0 10px 20px rgba(31,154,75,.35);transition:transform .1s}
.big:focus-visible{outline:3px solid rgba(255,255,255,.9);outline-offset:-6px}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #167a3a}
.big.pulse{animation:bigp 1.6s infinite}
@keyframes bigp{50%{transform:scale(1.05)}}
.link{margin-top:10px;font-size:13px;font-weight:700;opacity:.6;text-decoration:underline}
.best{font-size:12.5px;font-weight:700;margin-top:8px;opacity:.75}
.badge{font-size:72px;line-height:1;animation:badge 1s cubic-bezier(.2,1.6,.4,1)}
@keyframes badge{from{transform:scale(0) rotate(-30deg)}}
.etitle{font-size:28px;font-weight:900;margin-top:4px}
.eline{font-size:13.5px;opacity:.7;margin-top:3px}
.score{font-size:40px;font-weight:900;margin-top:8px}.score small{font-size:16px;opacity:.6;font-weight:800}
.estats{display:flex;justify-content:center;gap:12px;font-size:12.5px;font-weight:700;margin-top:4px;opacity:.8;flex-wrap:wrap}
.newbest{display:inline-block;margin-top:6px;background:#ffb703;color:#fff;font-weight:900;font-size:12px;padding:3px 10px;border-radius:10px;animation:bigp 1s infinite}
#coach{position:absolute;left:12px;right:12px;bottom:206px;z-index:9;background:#30323f;color:#fff;border-radius:16px;padding:10px 14px;font-size:13.5px;line-height:1.35;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:.3s;animation:pin .5s cubic-bezier(.2,1.4,.4,1)}

#help .he{font-size:56px}#help .ht{font-weight:900;font-size:19px;margin-top:6px}#help .hb{font-size:14px;opacity:.75;margin-top:6px;line-height:1.4}

<script id="engine">
/* SDG 2030 v2 — pure game engine (no DOM). Exposes SDG2.
   Meters: m Money, h Happiness, p Planet, w Peace (0..100; money may dip below 0). */
(function (root) {
  'use strict';
  const SDG = [
    ['No Poverty', '#E5243B', '🤲', 'Nobody lives on less than they need'],
    ['Zero Hunger', '#DDA63A', '🌾', 'Enough good food for everyone'],
    ['Good Health', '#4C9F38', '❤️', 'Healthy lives at every age'],
    ['Quality Education', '#C5192D', '📚', 'Every child in a good school'],
    ['Gender Equality', '#FF3A21', '👭', 'Equal rights for women and girls'],
    ['Clean Water', '#26BDE2', '💧', 'Safe water and toilets for all'],
    ['Clean Energy', '#FCC30B', '⚡', 'Affordable, clean power'],
    ['Decent Work', '#A21942', '💼', 'Good jobs and fair growth'],
    ['Industry & Innovation', '#FD6925', '🏗️', 'Modern, green infrastructure'],
    ['Reduced Inequalities', '#DD1367', '🤝', 'A fairer share for everyone'],
    ['Sustainable Cities', '#FD9D24', '🏙️', 'Safe, clean, liveable towns'],
    ['Responsible Consumption', '#BF8B2E', '♻️', 'Less waste, smarter use'],
    ['Climate Action', '#3F7E44', '🌡️', 'Cut emissions, adapt to heat'],
    ['Life Below Water', '#0A97D9', '🐟', 'Healthy seas and coasts'],
    ['Life on Land', '#56C02B', '🌳', 'Forests and wildlife thrive'],
    ['Peace & Justice', '#00689D', '🕊️', 'Peace, fair courts, no corruption'],
    ['Partnerships', '#19486A', '🌐', 'Nations working together'],
  ];
  const METERS = { m: ['💰', 'Money'], h: ['😊', 'Happiness'], p: ['🌍', 'Planet'], w: ['🕊️', 'Peace'] };
  const T = 20, GOAL = 70;
  const MONTHS = ['Jan', 'Apr', 'Jul', 'Oct'];
  const when = t => MONTHS[t % 4] + ' ' + (2026 + Math.floor(t / 4));
  // which meter feeds each SDG's natural drift
  const FEED = ['h', 'p', 'h', 'w', 'h', 'p', 'm', 'h', 'm', 'h', 'w', 'p', 'p', 'p', 'p', 'w', 'w'];

  const G = (id, e, t, h, fx, s, later) => ({ id, e, t, h, k: 'g', fx, s, later });
  const B = (id, e, t, h, fx, s, later) => ({ id, e, t, h, k: 'b', fx, s, later });
  const GOOD = [
    G('solar', '☀️', 'Solar for all', 'Sunshine powers homes', { m: -14, p: 5 }, { 7: 16, 13: 8 }, { in: 3, e: '☀️', t: 'Solar pays off', fx: { m: 14 }, s: { 8: 4 } }),
    G('school', '📚', 'Free schools', 'Every child learns', { m: -12, h: 3 }, { 4: 18, 5: 6, 10: 4 }, { in: 4, e: '🎓', t: 'Graduates join the workforce', fx: { m: 10 }, s: { 8: 6, 9: 5 } }),
    G('clinic', '🏥', 'Clinics everywhere', 'Healthy people, strong nation', { m: -12, h: 6 }, { 3: 18, 1: 5 }),
    G('forest', '🌳', 'Replant forests', 'Trees cool the planet', { m: -8, p: 7 }, { 15: 16, 13: 6 }, { in: 3, e: '🌲', t: 'Forests return', fx: { p: 6 }, s: { 15: 5, 6: 4 } }),
    G('water', '🚰', 'Clean water', 'Taps in every village', { m: -10, h: 4 }, { 6: 18, 3: 5 }),
    G('transit', '🚲', 'Green transit', 'Bikes, trams, clean air', { m: -12, h: 3, p: 4 }, { 11: 16, 13: 6 }),
    G('farm', '🌾', 'Smart farms', 'More food, less waste', { m: -10, h: 2 }, { 2: 18, 12: 6, 15: 3 }),
    G('equal', '👩‍🔬', 'Equal rights', 'Unlock half the talent', { m: -5, h: 2 }, { 5: 18, 10: 6 }, { in: 3, e: '👩‍💼', t: 'Women-led firms boom', fx: { m: 8 }, s: { 8: 5 } }),
    G('talks', '🕊️', 'Peace talks', 'Turn rivals into partners', { m: -4, w: 14 }, { 16: 12, 17: 8 }),
    G('ocean', '🐠', 'Protect oceans', 'Let the fish come back', { m: -6, p: 5, h: -2 }, { 14: 20 }, { in: 3, e: '🐟', t: 'Fish stocks recover', fx: { m: 6 }, s: { 14: 6, 2: 4 } }),
    G('taxrich', '💎', 'Tax the super-rich', 'Billionaires pay their share', { m: 16, h: 1 }, { 10: 12, 1: 5 }),
    G('carbon', '🏷️', 'Carbon price', 'Make polluters pay', { m: 14, h: -5, p: 5 }, { 13: 10, 12: 6 }),
    G('allies', '🤝', 'Green partners', 'Allies co-fund your plans', { m: 12 }, { 17: 14, 9: 4 }),
    G('jobs', '👷', 'Green jobs', 'Build the clean economy', { m: -14, h: 6 }, { 8: 14, 9: 8, 1: 5 }, { in: 3, e: '🏭', t: 'New industries pay taxes', fx: { m: 12 } }),
    G('honest', '🧹', 'Fight corruption', 'Stop the theft', { m: -4, h: 3, w: 3 }, { 16: 16 }, { in: 2, e: '💰', t: 'Stolen money returns', fx: { m: 10 } }),
    G('recycle', '♻️', 'Zero-waste cities', 'Repair, reuse, recycle', { m: -8, p: 4 }, { 12: 18, 11: 5, 14: 3 }),
    G('safety', '🏠', 'Safety net', 'No one left behind', { m: -12, h: 8 }, { 1: 18, 2: 5, 10: 5 }),
    G('labs', '🔬', 'Innovation labs', 'Ideas become industries', { m: -12 }, { 9: 18, 8: 4 }, { in: 3, e: '🚀', t: 'Start-up boom', fx: { m: 12 }, s: { 8: 4 } }),
    G('welcome', '🫂', 'Welcome refugees', 'Shelter today, talent tomorrow', { m: -8, h: -3, w: 4 }, { 10: 12, 16: 6, 17: 6 }, { in: 4, e: '🧑‍🍳', t: 'Newcomers open businesses', fx: { m: 10 }, s: { 8: 4 } }),
  ];
  const BAD = [
    B('oil', '🛢️', 'Drill for oil', 'Fast cash. Hot future.', { m: 24, h: 3, p: -6 }, { 13: -8, 14: -4 }, { in: 3, clim: 1, e: '🌀', t: 'Megastorm', fx: { m: -18, h: -8, p: -6 }, s: { 11: -8, 1: -5, 13: -4 } }),
    B('chop', '🪓', 'Sell the rainforest', 'Timber money now', { m: 20, p: -8 }, { 15: -14, 13: -5 }, { in: 2, clim: 1, e: '🌊', t: 'Floods & landslides', fx: { h: -10, m: -10 }, s: { 6: -8, 2: -8, 11: -4 } }),
    B('war', '⚔️', 'Border war', 'Rally the nation!', { h: 12, w: -25 }, { 16: -12, 3: -5 }, { in: 2, e: '💥', t: 'The war drags on', fx: { m: -24, w: -12, h: -16 }, s: { 1: -8, 4: -8, 3: -8, 17: -6 } }),
    B('crack', '🚔', 'Crush the protests', 'Quiet streets, fast', { w: 6 }, { 16: -12, 10: -5, 5: -3 }, { in: 3, e: '🔥', t: 'Uprising', fx: { h: -20, w: -14, m: -6 } }),
    B('stadium', '🏟️', 'Debt megaproject', 'A shiny stadium!', { h: 14 }, { 9: 2 }, { in: 3, e: '📉', t: 'Debt crisis', fx: { m: -28, h: -8 }, s: { 1: -6, 8: -8 } }),
    B('fuel', '⛽', 'Cheap petrol', 'Voters love it', { m: -6, h: 10, p: -4 }, { 13: -6, 7: -4 }, { in: 2, clim: 1, e: '🥵', t: 'Killer heatwave', fx: { h: -10, p: -5 }, s: { 3: -8, 2: -6 } }),
    B('dereg', '🏭', 'Scrap pollution rules', 'Factories boom', { m: 16, p: -6 }, { 3: -6, 6: -8, 14: -5 }, { in: 2, e: '☠️', t: 'Toxic smog', fx: { h: -12, m: -8 }, s: { 3: -10, 11: -6 } }),
    B('fish', '🎣', 'Sell fishing rights', 'Foreign fleets pay well', { m: 18, p: -4 }, { 14: -16 }, { in: 3, e: '🦴', t: 'Fisheries collapse', fx: { m: -10, h: -8 }, s: { 14: -10, 2: -8, 8: -4 } }),
    B('crony', '💼', 'Contracts for friends', 'Deals done fast', { m: 14, h: 2 }, { 16: -12, 10: -4 }, { in: 2, e: '📰', t: 'Corruption scandal', fx: { h: -16, m: -10 }, s: { 16: -8, 17: -5 } }),
    B('arms', '🪖', 'Arms race', 'Feel safe, buy tanks', { m: -10, h: 5, w: 4 }, { 16: -4, 4: -4 }, { in: 2, e: '🚀', t: 'Neighbours arm too', fx: { w: -22, m: -8 }, s: { 16: -6, 17: -6 } }),
    B('cuts', '✂️', 'Cut schools & clinics', 'Balance the books', { m: 22, h: -4 }, { 3: -10, 4: -10, 1: -4 }, { in: 3, e: '🦠', t: 'Epidemic spreads', fx: { h: -14, m: -12 }, s: { 3: -12, 8: -5 } }),
    B('coal', '⚫', 'New coal plant', 'Cheap power today', { m: 14, h: 4, p: -8 }, { 7: 4, 13: -10, 3: -4 }, { in: 3, clim: 1, e: '🔥', t: 'Wildfires', fx: { p: -10, h: -8, m: -8 }, s: { 15: -10, 13: -4 } }),
    B('walls', '🧱', 'Close the borders', 'Keep them out!', { h: 8 }, { 10: -10, 17: -8, 16: -4 }, { in: 2, e: '📦', t: 'Trade partners walk away', fx: { m: -14, w: -8 }, s: { 17: -6, 8: -5 } }),
  ];
  const CARD = {}; GOOD.concat(BAD).forEach(c => (CARD[c.id] = c));

  // World events: w(S) = weight, run(S) => {fx, s, why}
  const EVENTS = [
    { id: 'cyclone', e: '🌪️', t: 'Cyclone!', bad: 1, clim: 1, w: S => (100 - S.p) / 28, run: () => ({ fx: { h: -6, m: -8 }, s: { 11: -5, 1: -3 }, why: 'a hotter planet breeds storms' }) },
    { id: 'drought', e: '🏜️', t: 'Drought', bad: 1, clim: 1, w: S => (100 - S.p) / 34, run: () => ({ fx: { h: -5 }, s: { 2: -8, 6: -5 }, why: 'the climate is heating up' }) },
    { id: 'pandemic', e: '🦠', t: 'Pandemic', bad: 1, w: () => 0.5, run: S => ({ fx: { h: -Math.max(3, Math.round(14 - S.sdg[2] / 8)), m: -6 }, s: { 3: -6, 8: -4 }, why: S.sdg[2] >= 60 ? 'your clinics softened the blow' : 'weak health care made it worse' }) },
    { id: 'recession', e: '📉', t: 'Global recession', bad: 1, w: () => 0.5, run: () => ({ fx: { m: -10 }, s: { 8: -5 }, why: 'markets crashed worldwide' }) },
    { id: 'riots', e: '😡', t: 'Riots', bad: 1, w: S => (S.h < 35 ? 2 : 0), run: () => ({ fx: { w: -10, m: -5 }, s: { 16: -4 }, why: 'people are unhappy' }) },
    { id: 'tech', e: '💡', t: 'Clean-tech breakthrough', w: () => 0.45, run: () => ({ fx: { m: 6, p: 4 }, s: { 7: 6, 9: 4 }, why: 'scientists everywhere shared it' }) },
    { id: 'investors', e: '🌍', t: 'Green investors arrive', w: S => (S.p > 60 ? 1.2 : 0), run: () => ({ fx: { m: 14 }, s: { 17: 4 }, why: 'your planet looks healthy' }) },
    { id: 'tourism', e: '🏝️', t: 'Tourism boom', w: S => (S.p > 65 && S.w > 60 ? 1 : 0), run: () => ({ fx: { m: 10, h: 4 }, s: { 8: 4 }, why: 'clean, peaceful places attract visitors' }) },
    { id: 'treaty', e: '📜', t: 'Neighbours offer a treaty', w: S => (S.w > 65 ? 0.8 : 0), run: () => ({ fx: { w: 6 }, s: { 17: 6, 16: 4 }, why: 'you kept the peace' }) },
  ];

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  function rnd(S) { let t = (S.rs = (S.rs + 0x6D2B79F5) | 0); t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
  const pick = (S, arr) => arr[Math.floor(rnd(S) * arr.length)];
  const snap = S => ({ m: S.m, h: S.h, p: S.p, w: S.w, sdg: S.sdg.slice(), turn: S.turn, pending: S.pending.map(x => ({ ...x })) });
  const goals = S => S.sdg.filter(v => v >= GOAL).length;
  const avg = S => S.sdg.reduce((a, b) => a + b, 0) / 17;

  function newGame(seed) {
    const S = {
      rs: (seed >>> 0) || 1, turn: 0, T, m: 40, h: 55, p: 55, w: 60,
      sdg: [38, 40, 45, 42, 36, 44, 35, 40, 34, 30, 38, 32, 28, 30, 34, 36, 33],
      hand: [], pending: [], played: {}, over: false, ending: null,
      stats: { good: 0, quick: 0, storms: 0, blooms: 0, events: 0 },
    };
    deal(S);
    return S;
  }

  function apply(S, fx, s, mult = 1, smult = 1) {
    const d = { fx: {}, s: {} };
    for (const k in fx || {}) {
      const v = Math.round(fx[k] * (fx[k] < 0 ? mult : (k === 'm' ? smult : 1)));
      const before = S[k];
      S[k] = k === 'm' ? clamp(S[k] + v, -60, 120) : clamp(S[k] + v, 0, 100);
      if (S[k] !== before) d.fx[k] = Math.round(S[k] - before);
    }
    for (const k in s || {}) {
      const i = k - 1, v = s[k] * (s[k] < 0 ? mult : smult);
      const before = S.sdg[i];
      S.sdg[i] = clamp(S.sdg[i] + v, 0, 100);
      const dd = Math.round(S.sdg[i] - before);
      if (dd) d.s[k] = dd;
    }
    return d;
  }

  const cost = c => Math.max(0, -(c.fx.m || 0));
  const canPlay = (S, id) => cost(CARD[id]) <= Math.max(0, S.m) || (cost(CARD[id]) === 0);

  function deal(S) {
    const nb = S.turn === 0 ? 1 : (rnd(S) < 0.3 ? 2 : 1);
    const prev = new Set(S.hand);
    const draw = (pool, n) => { const out = []; let guard = 0; while (out.length < n && guard++ < 200) { const c = pick(S, pool); if (!prev.has(c.id) && !out.includes(c.id)) out.push(c.id); } return out; };
    const goods = draw(GOOD, 3 - nb), bads = draw(BAD, nb);
    if (!goods.some(id => canPlay(S, id))) {
      const rich = GOOD.filter(c => (c.fx.m || 0) >= 0 && !goods.includes(c.id));
      goods[0] = pick(S, rich).id;
    }
    const hand = goods.concat(bads);
    for (let i = hand.length - 1; i > 0; i--) { const j = Math.floor(rnd(S) * (i + 1)); [hand[i], hand[j]] = [hand[j], hand[i]]; }
    S.hand = hand;
  }

  function checkOver(S) {
    if (S.over) return true;
    let e = null;
    if (S.w <= 0) e = 'war'; else if (S.p <= 0) e = 'hothouse'; else if (S.h <= 0) e = 'toppled'; else if (S.m < -25) e = 'broke';
    if (e) { S.over = true; S.ending = e; }
    return !!e;
  }

  // Play hand[i]. Returns events.
  function play(S, i) {
    if (S.over) return [];
    const id = S.hand[i]; const c = CARD[id];
    if (!c || !canPlay(S, id)) return [];
    const times = S.played[id] || 0;
    S.played[id] = times + 1;
    let d, ev = { type: 'play', card: id };
    if (c.k === 'g') {
      S.stats.good++;
      const sm = Math.max(0.5, 1 - 0.2 * times);
      const mm = (c.fx.m || 0) > 0 ? Math.max(0.4, 1 - 0.25 * times) : 1;
      d = apply(S, c.fx, null, 1, mm);
      const d2 = apply(S, null, c.s, 1, sm); d.s = d2.s;
      if (c.later) { S.pending.push({ kind: 'seed', id, at: S.turn + c.later.in, from: S.turn }); ev.seed = c.later.in; }
    } else {
      S.stats.quick++;
      d = apply(S, c.fx, c.s);
      S.pending.push({ kind: 'storm', id, at: S.turn + c.later.in, from: S.turn, mult: 0.85 + 0.25 * times });
      ev.storm = c.later.in;
    }
    ev.d = d; ev.snap = snap(S);
    const evs = [ev];
    if (checkOver(S)) evs.push({ type: 'over', ending: S.ending, snap: snap(S) });
    return evs;
  }

  function landPending(S, list, evs) {
    for (const x of list) {
      const c = CARD[x.id], L = c.later;
      S.pending = S.pending.filter(y => y !== x);
      if (x.kind === 'storm') {
        const mult = x.mult * (L.clim ? clamp(1.6 - S.p / 100, 0.75, 1.4) : 1);
        const d = apply(S, L.fx, L.s, mult);
        S.stats.storms++;
        evs.push({ type: 'storm', card: x.id, from: x.from, d, snap: snap(S) });
      } else {
        const d = apply(S, L.fx, L.s);
        S.stats.blooms++;
        evs.push({ type: 'bloom', card: x.id, from: x.from, d, snap: snap(S) });
      }
      if (checkOver(S)) return true;
    }
    return false;
  }

  function endTurn(S) {
    if (S.over) return [];
    const evs = [];
    // natural drift: society, nature and politics respond to the goals
    const g = idx => idx.reduce((a, i) => a + S.sdg[i - 1], 0) / idx.length;
    const social = g([1, 2, 3, 4, 5, 10]), env = g([6, 12, 13, 14, 15]), econ = g([7, 8, 9, 11, 17]);
    const before = { m: S.m, h: S.h, p: S.p, w: S.w };
    for (let i = 0; i < 17; i++) S.sdg[i] = clamp(S.sdg[i] + clamp((S[FEED[i]] - 50) / 20, -2, 2.5) - 0.2, 0, 100);
    S.h = clamp(S.h + (social + 20 - S.h) * 0.1 + (econ - 45) * 0.04, 0, 100);
    S.p = clamp(S.p + (env + 18 - S.p) * 0.08, 0, 100);
    S.w = clamp(S.w + (S.sdg[15] + 25 - S.w) * 0.1, 0, 100);
    S.m = clamp(S.m + 5 + econ / 15, -60, 120);
    const dd = {}; for (const k in before) { const v = Math.round(S[k] - before[k]); if (v) dd[k] = v; }
    evs.push({ type: 'drift', d: { fx: dd, s: {} }, snap: snap(S) });
    if (checkOver(S)) { evs.push({ type: 'over', ending: S.ending, snap: snap(S) }); return evs; }
    S.turn++;
    if (S.turn >= T) {
      // 2030: every outstanding bill (and reward) lands before the final verdict
      const rest = S.pending.slice();
      if (rest.length) evs.push({ type: 'reckoning', n: rest.length, snap: snap(S) });
      landPending(S, rest, evs);
      if (!S.over) { S.over = true; S.ending = finalEnding(S); }
      evs.push({ type: 'over', ending: S.ending, snap: snap(S) });
      return evs;
    }
    const due = S.pending.filter(x => x.at <= S.turn);
    if (landPending(S, due, evs)) { evs.push({ type: 'over', ending: S.ending, snap: snap(S) }); return evs; }
    if (S.turn >= 2 && rnd(S) < 0.42) {
      const list = EVENTS.map(e => [e, Math.max(0, e.w(S))]).filter(x => x[1] > 0);
      let tot = list.reduce((a, x) => a + x[1], 0), r = rnd(S) * tot, ev = list[0][0];

    $('#hand').innerHTML = ''; $('#future').innerHTML = '';
    const demo = E.newGame(42); setDisp({ ...demo, pending: [], turn: 0 }, null, true); renderTop();
    setTimeout(() => $('#playBtn').focus({ preventScroll: true }), 50);
  }
  function start() {
    Snd.init(); if (Snd.ctx && Snd.ctx.state === 'suspended') Snd.ctx.resume();
    S = E.newGame((Date.now() ^ (Math.random() * 1e9)) >>> 0);
    window.__sdg2 = { get S() { return S; }, E, ready: true };
    $('#title').classList.add('hide'); $('#end').classList.add('hide');
    phase = 'play'; disp = null; setDisp({ ...S, pending: [] }, null, true); renderTop(); renderHand(); busy = false; Snd.good();
    if (!store.get(KEY_SEEN, false)) showCoach();
    saveGame();
  }
  function showCoach() {
    const c = $('#coach'); c.innerHTML = '👆 <b>Tap a card</b> (or swipe it up) — one choice per season.<br>⚡ Quick wins pay now… ⛈️ storms land later.<br>🎯 Fill the <b>17 coloured dots</b> by 2030!';
    c.classList.remove('hide');
    dots.forEach((d, i) => setTimeout(() => { d.classList.remove('ping'); void d.offsetWidth; d.classList.add('ping'); }, 300 + i * 60));
  }
  function hideCoach() { const c = $('#coach'); if (!c.classList.contains('hide')) { c.classList.add('hide'); store.set(KEY_SEEN, true); } }

  async function showEnd() {
    phase = 'end'; busy = true; renderTop(); $('#hand').innerHTML = ''; $('#hand').classList.add('off');
    const r = E.result(S);
    const prev = store.get(KEY_BEST, null), isBest = !prev || r.score > prev.score;
    if (isBest) store.set(KEY_BEST, { goals: r.goals, score: r.score, title: r.title });
    HRS.store.del(SAVE_KEY); recordBest(r); HRS.buzz(r.win ? 'success' : 'warning');
    await wait(400);
    const el = $('#end');
    el.innerHTML = `<div class="brand">A game by Harpreet Raj Singh™</div>
      <div class="badge">${r.emoji}</div><div class="etitle">${r.title}</div><div class="eline">${r.early ? `Game over in ${E.when(Math.min(S.turn, E.T - 1))}. ` : ''}${r.line}</div>
      <div class="score">${r.goals}<small> / 17 goals</small></div>
      <div class="estats"><span>🌱 ${S.stats.good} sustainable</span><span>⚡ ${S.stats.quick} shortcuts</span><span>⛈️ ${S.stats.storms} storms</span></div>
      ${isBest ? '<div class="newbest">★ New best!</div>' : `<div class="best">${bestText()}</div>`}
      <div><button class="big pulse" id="againBtn">↻ Play again</button></div>`;
    el.classList.remove('hide');
    $('#againBtn').addEventListener('click', start);
    setTimeout(() => $('#againBtn').focus({ preventScroll: true }), 60);
    Snd.end(r.win);
    const [sx, sy] = stageCenter();
    if (r.win) { for (let k = 0; k < 4; k++) setTimeout(() => fxBurst(innerWidth * (0.2 + k * 0.2), innerHeight * 0.25, 70, E.SDG.map(g => g[1]), { speed: 420, up: true, life: 2.4 }), k * 260); }
    else { shake(); fxBurst(sx, sy - W.R, 60, ['#6b6b6b', '#3a3a3a', '#ff7b2f'], { speed: 120, g: 60, life: 2.6, size: 4 }); }
  }

  // ---------------- help (3 slides) ----------------
  const HELP = [
    ['🌍', 'Heal your world', 'You have 20 seasons until 2030. Each season, pick one card and watch your little planet change.'],
    ['⚡ → ⛈️', 'Shortcuts bite back', 'Quick wins give instant money or applause, but plant a storm that lands a few seasons later. 🌱 Sustainable cards cost now and pay back later.'],
    ['🎯', 'Fill all 17 goals', 'Each coloured dot is one UN Goal; 70% fills it. Keep 💰 😊 🌍 🕊️ above zero or your term ends early.'],
  ];
  let helpI = 0;
  function showHelp(i = 0) {
    helpI = i; const h = HELP[i];
    $('#helpBox').innerHTML = `<div class="he">${h[0]}</div><div class="ht">${h[1]}</div><div class="hb">${h[2]}</div><div class="dots">${HELP.map((_, j) => `<i class="${j === i ? 'on' : ''}"></i>`).join('')}</div><button class="big" id="helpNext">${i < 2 ? 'Next' : 'Got it'}</button>`;
    $('#help').classList.remove('hide'); $('#helpNext').focus({ preventScroll: true });
    $('#helpNext').onclick = () => (i < 2 ? showHelp(i + 1) : closeHelp());
  }
  const closeHelp = () => { $('#help').classList.add('hide'); $('#helpBox').removeAttribute('aria-label'); };
  $('#help').addEventListener('click', e => { if (e.target.id === 'help') closeHelp(); });

  // ---------------- controls ----------------
  function setSnd(on) { Snd.on = on; HRS.setSetting('sound', on); $('#sndBtn').textContent = on ? '🔊' : '🔇'; if (on) { Snd.init(); if (Snd.ctx && Snd.ctx.state === 'suspended') Snd.ctx.resume(); Snd.pop(); } }
  $('#sndBtn').addEventListener('click', () => setSnd(!Snd.on));
  $('#helpBtn').addEventListener('click', () => showHelp(0));
  $('#howBtn').addEventListener('click', () => showHelp(0));
  $('#playBtn').addEventListener('click', start);
  $('#stage').addEventListener('click', () => toastDone && toastDone());
  addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key;
    if (!$('#help').classList.contains('hide')) { if (k === 'Escape') closeHelp(); return; }
    if (k === 'm' || k === 'M') return setSnd(!Snd.on);
    if (k === '?' || k === 'h' || k === 'H') return showHelp(0);
    if (phase === 'play') {
      const map = { '1': 0, '2': 1, '3': 2, ArrowLeft: 0, ArrowUp: 1, ArrowDown: 1, ArrowRight: 2 };
      if (k in map) { e.preventDefault(); choose(map[k]); }
      else if ((k === ' ' || k === 'Enter') && toastDone) { e.preventDefault(); toastDone(); }
    } else if ((k === 'Enter' || k === ' ') && document.activeElement === document.body && phase === 'title') { e.preventDefault(); const r = loadSave(); r ? resume(r) : start(); }
  });

  $('#sndBtn').textContent = Snd.on ? '🔊' : '🔇';
  // ---------------- HRS app layer: save/resume, best score, dialogs, back button ----------------
  const SAVE_KEY = 'hrs_save_sdg_v2', BEST_HRS = 'hrs_best_sdg_v2';
  function saveGame() { if (S && !S.over && phase === 'play') HRS.store.set(SAVE_KEY, { v: 2, t: Date.now(), phase: 'play', S }); }
  function loadSave() { const r = HRS.store.get(SAVE_KEY); return r && r.v === 2 && r.S && !r.S.over && Array.isArray(r.S.hand) ? r : null; }
  function recordBest(r) {
    const b = HRS.store.get(BEST_HRS), plays = ((b && b.plays) || 0) + 1;
    const rec = { score: r.goals, max: 17, title: r.title, emoji: r.emoji, raw: r.score, date: new Date().toISOString().slice(0, 10), plays };
    HRS.store.set(BEST_HRS, !b || r.score > (b.raw || 0) ? rec : Object.assign(b, { plays }));
  }
  function resume(rec) {
    S = rec.S; window.__sdg2 = { get S() { return S; }, E, ready: true };
    $('#title').classList.add('hide'); $('#end').classList.add('hide'); closeHelp();
    phase = 'play'; disp = null; setDisp({ ...S }, null, true); renderTop(); renderHand(); busy = false;
    tip(`💾 Welcome back! ${E.when(Math.min(S.turn, E.T - 1))}, season ${S.turn + 1} of ${E.T}`, 2400);
  }
  function confirmNew(onOk) {
    const r = loadSave(); if (!r) return onOk();
    $('#helpBox').setAttribute('aria-label', 'Start a new game?');
    $('#helpBox').innerHTML = `<div class="he">🌍</div><div class="ht">Start a new game?</div><div class="hb">Your saved game (${E.when(Math.min(r.S.turn, E.T - 1))}) will be replaced.</div><div class="row"><button class="ghostb" id="cnNo">Cancel</button><button class="big" id="cnYes">Start new</button></div>`;
    $('#help').classList.remove('hide'); $('#cnNo').focus({ preventScroll: true });
    $('#cnNo').onclick = closeHelp; $('#cnYes').onclick = () => { closeHelp(); HRS.store.del(SAVE_KEY); onOk(); };
  }
  const _showTitle = showTitle;
  showTitle = function () {
    _showTitle(); const r = loadSave(), c = $('#contBtn');
    c.classList.toggle('hide', !r); $('#playBtn').classList.toggle('pulse', !r); c.classList.toggle('pulse', !!r);
    if (r) { c.textContent = `⏯ Continue · ${E.when(Math.min(r.S.turn, E.T - 1))}`; $('#playBtn').textContent = '▶ New'; setTimeout(() => c.focus({ preventScroll: true }), 60); } else $('#playBtn').textContent = '▶ Play';
  };
  $('#playBtn').removeEventListener('click', start);
  $('#playBtn').addEventListener('click', () => confirmNew(start));
  $('#contBtn').addEventListener('click', () => { const r = loadSave(); if (r) resume(r); else start(); });
  HRS.dialog({ overlay: $('#help'), box: $('#helpBox'), isOpen: () => !$('#help').classList.contains('hide'), isDismissible: () => true, close: closeHelp });
  $('#helpBox').tabIndex = -1;
  HRS.onBack(() => { if ($('#tip').classList.contains('show')) { $('#tip').classList.remove('show'); return true; } return false; });
  document.addEventListener('visibilitychange', () => { if (document.hidden && !busy) saveGame(); });
  $('#fx').setAttribute('aria-hidden', 'true');
  window.__sdg2ui = { choose: i => choose(i), get phase() { return phase; }, get busy() { return busy; }, saveGame, loadSave, SAVE_KEY, BEST_HRS };

  layout(); showTitle(); requestAnimationFrame(frame);
  { const q = new URLSearchParams(location.search);
    if (q.get('new')) { HRS.store.del(SAVE_KEY); showTitle(); }
    else if (q.get('continue')) { const r = loadSave(); if (r) resume(r); } }
  setTimeout(layout, 300);
})();

</script>
</body>
</html>
