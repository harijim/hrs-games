  background:linear-gradient(to top,var(--c) var(--f),rgba(255,255,255,.75) var(--f));box-shadow:0 0 0 2px var(--c) inset,0 2px 5px rgba(0,0,0,.15);
  font-size:10px;font-weight:800;color:rgba(0,0,0,.45);display:grid;place-items:center;transition:transform .25s}

.fxc.n{color:#d8352a}.bad .fxc.n{color:#ff8a80}.fxc.p{color:#1f9a4b}.bad .fxc.p{color:#7dffa6}

  $('#hapBtn').addEventListener('click', () => setHap(!Hap.on));
  $('#helpBtn').addEventListener('click', () => showHelp(0));
  $('#howBtn').addEventListener('click', () => showHelp(0));
  $('#playBtn').addEventListener('click', start);
  $('#stage').addEventListener('click', () => toastDone && toastDone());
  addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key;
    if (!$('#help').classList.contains('hide')) { if (k === 'Escape') closeHelp(); return; }
    if (k === 'm' || k === 'M') return setSnd(!Snd.on);
    if (k === '?' || k === 'h' || k === 'H') return showHelp(0);
    if (k === 'Escape') return hideTip();
    if (phase === 'play') {
      const map = { '1': 0, '2': 1, '3': 2, ArrowLeft: 0, ArrowUp: 1, ArrowDown: 1, ArrowRight: 2 };
      if (k in map) { e.preventDefault(); let i = map[k]; const n = S.moment ? E.moment(S).opts.length : S.hand.length; if (n === 2 && k.startsWith('Arrow')) i = k === 'ArrowLeft' ? 0 : 1; if (i >= n) return; S.moment ? answerMoment(i) : choose(i); }
      else if ((k === ' ' || k === 'Enter') && toastDone) { e.preventDefault(); toastDone(); }
    } else if (phase === 'title' && ['1', '2', '3'].includes(k)) { setMode(E.MODE_KEYS[+k - 1]); } else if ((k === 'Enter' || k === ' ') && document.activeElement === document.body && phase === 'title') { e.preventDefault(); const r = loadSave(); r ? resume(r) : start(); }
  });
  // no pinch/double-tap zoom or pull-to-refresh while playing (iOS ignores user-scalable=no)
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('touchmove', e => { if (e.touches.length > 1 || !e.target.closest('.ov,.box')) e.preventDefault(); }, { passive: false });

  $('#sndBtn').textContent = Snd.on ? '🔊' : '🔇';
  if (Hap.ok && !window.HRS) { $('#hapBtn').hidden = false; setHap(Hap.on, true); }

  // ---------------- language: apply / live switch / picker / HRS text shim ----------------
  const LANG_UI = !window.HRS; // inside HRS Games the host owns language (same rule as the haptics button): no picker, follow hrs-lang
  const saveTag = st => (['kids', 'college', 'adults'].includes(st.mode) ? ` · ${E.MODES[st.mode].e} ${modeName(st.mode)}` : '');
  const saveWhen = st => whenFor(Math.min(st.turn, (st.T || E.T) - 1), st.mode);
  function hrsLang() { // HRS layer text (title buttons, links, confirm dialog) follows the language too
    const ui = window.__sdg2ui, rec = ui && ui.loadSave ? ui.loadSave() : null, cont = $('#contBtn');
    if (cont && rec) { cont.textContent = `${t('hrs.continue')} · ${saveWhen(rec.S)}${saveTag(rec.S)}`; $('#playBtn').textContent = t('hrs.new'); } else $('#playBtn').textContent = t('play');
    if (!(window.HRS && typeof HRS.translateOverlay === 'function')) { // a host that translates its own overlay (links, home button) keeps doing so
      const a = document.querySelectorAll('#title .tlinks a');
      ['hrs.allgames', 'hrs.classic', 'hrs.about', 'hrs.privacy'].forEach((k, i) => { if (a[i]) a[i].textContent = t(k); });
      const hb = $('#homeBtn'); if (hb) { hb.setAttribute('aria-label', t('hrs.home')); hb.title = t('hrs.allgames').replace(/^\S+\s+/, ''); }
    }
    const disc = $('#title .disc'); if (disc) { disc.textContent = t('hrs.disc'); disc.lang = L.lang; }
    const yes = $('#cnYes');
    if (yes) {
      const r = rec || (ui && ui.loadSave && ui.loadSave()), box = $('#helpBox');
      box.setAttribute('aria-label', t('hrs.startq')); box.querySelector('.ht').textContent = t('hrs.startq');
      if (r) box.querySelector('.hb').textContent = t('hrs.replaced', { d: saveWhen(r.S) + saveTag(r.S) });
      $('#cnNo').textContent = t('hrs.cancel'); yes.textContent = t('hrs.startnew'); yes.dataset.l = L.lang;
    }
  }
  if (window.HRS && window.MutationObserver) new MutationObserver(() => { const y = $('#cnYes'); if (y && y.dataset.l !== L.lang) hrsLang(); }).observe($('#helpBox'), { childList: true });
  function applyLang() {
    const l = L.lang, md = document.querySelector('meta[name="description"]');
    document.documentElement.lang = l;
    document.body.classList.remove('lang-en', 'lang-hi', 'lang-pa'); document.body.classList.add('lang-' + l);
    if (md) md.setAttribute('content', t('doc.desc'));
    $('#title .brand').textContent = t('brand.presents'); $('#title .sub').textContent = t('sub'); $('#foot').textContent = t('foot'); $('#howBtn').textContent = t('how');
    $('#modes').setAttribute('aria-label', t('aria.modes')); $('#hapBtn').setAttribute('aria-label', t('aria.hap')); $('#sndBtn').setAttribute('aria-label', t('aria.snd'));
    $('#helpBtn').setAttribute('aria-label', t('aria.help')); $('#world').setAttribute('aria-label', t('aria.world'));
    if (!$('#hapBtn').hidden) $('#hapBtn').title = t(Hap.on ? 'hap.on' : 'hap.off');
    dots.forEach((b, i) => b.setAttribute('aria-label', t('aria.goal', { n: i + 1, name: sdgName(i) })));
    for (const k of ['m', 'h', 'p', 'w']) meterEls[k].setAttribute('aria-label', metName(k));
    const lb = $('#langBtn'); lb.textContent = t('lang.' + l); lb.setAttribute('aria-label', `${t('aria.lang')}: ${t('lang.' + l + '.n')}`);
    $('#langs').setAttribute('aria-label', t('aria.lang')); $('#langMenu').setAttribute('aria-label', t('aria.lang'));
    document.querySelectorAll('#langs button,#langMenu button').forEach(b => { const on = b.dataset.lang === l; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
    hrsLang();
  }
  function relang() { // redraw visible text in the new language; never touches S
    if (phase === 'title') renderModes();
    if (disp) renderFuture();
    $('#date').textContent = when(Math.min(disp ? disp.turn : 0, CFG().T - 1));
    if (phase === 'play' && S && !busy) renderHand(true);
    else if (busy && $('#hand').dataset.mo) document.querySelectorAll('#hand .card.opt').forEach(b => { const ti = b.querySelector('.ti'); if (ti) ti.textContent = t(`m.${$('#hand').dataset.mo}.o${b.dataset.i}`); }); // answer still animating
    if (toastFn && $('#toast').classList.contains('show')) $('#toast').innerHTML = toastFn();
    if ($('#tip').classList.contains('show')) { if (tipFn) $('#tip').innerHTML = tipFn(); else hideTip(); }
    if ($('#coach').innerHTML) renderCoach(); // hidden bubbles too (aria-label)
    if (phase === 'end' && S && !$('#end').classList.contains('hide')) renderEnd();
    if (!$('#help').classList.contains('hide') && $('#helpNext')) { const f = document.activeElement && document.activeElement.id === 'helpNext'; showHelp(helpAt); if (!f) $('#helpNext').blur(); }
  }
  function setLang(l, fromPicker) {
    l = normLang(l); if (!l) return;
    const changed = l !== L.lang; L.lang = l;
    if (fromPicker) try { localStorage.setItem(LANG_KEY, l); } catch (e) { /* private mode */ }
    applyLang(); if (changed) relang();
    if (fromPicker && changed) dispatchEvent(new CustomEvent('hrs-lang-change', { detail: { lang: l, source: 'sdg-2030' } }));
  }
  addEventListener('hrs-lang-change', e => setLang(e.detail && e.detail.lang));
  document.addEventListener('hrs-lang-change', e => { if (e.target === document) setLang(e.detail && e.detail.lang); });
  addEventListener('storage', e => { if (e.key === LANG_KEY) setLang(normLang(e.newValue) || 'en'); });
  function langMenu(open) { const m = $('#langMenu'); m.classList.toggle('hide', !open); $('#langBtn').setAttribute('aria-expanded', open); }
  if (LANG_UI) {
    document.body.classList.add('has-lang');
    const mk = (l, full) => { const b = document.createElement('button'); b.dataset.lang = l; b.lang = l; b.innerHTML = full ? `<b>${t('lang.' + l)}</b><span>${t('lang.' + l + '.n')}</span>` : t('lang.' + l); if (!full) b.title = t('lang.' + l + '.n'); b.addEventListener('click', e => { e.stopPropagation(); langMenu(false); setLang(l, true); Snd.pop(); Hap.buzz(10); }); return b; };
    I18N.LANGS.forEach(l => { $('#langs').appendChild(mk(l)); $('#langMenu').appendChild(mk(l, true)); });
    $('#langs').hidden = false; $('#langBtn').hidden = false;
    $('#langBtn').addEventListener('click', e => { e.stopPropagation(); langMenu($('#langMenu').classList.contains('hide')); });
    document.addEventListener('pointerdown', e => { if (!e.target.closest('#langMenu,#langBtn')) langMenu(false); }, true);
    addEventListener('keydown', e => { if (e.key === 'Escape') langMenu(false); });
  }
  window.__sdg2i18n = { get lang() { return L.lang; }, langs: I18N.LANGS.slice(), t, tn, has: L.has, setLang: (l, opts) => setLang(l, !!(opts && opts.persist)), picker: LANG_UI };
  applyLang();
  addEventListener('orientationchange', () => setTimeout(layout, 250));
  if (window.ResizeObserver) new ResizeObserver(() => layout()).observe($('#stage'));
  if (window.visualViewport) visualViewport.addEventListener('resize', layout);
  // ---------------- HRS app layer: save/resume, best score, dialogs, back button ----------------
  const SAVE_KEY = 'hrs_save_sdg_v2', BEST_HRS = 'hrs_best_sdg_v2';
  function saveGame() { if (S && !S.over && phase === 'play') HRS.store.set(SAVE_KEY, { v: 2, t: Date.now(), phase: 'play', S }); }
  function loadSave() { const r = HRS.store.get(SAVE_KEY); return r && r.v === 2 && r.S && !r.S.over && Array.isArray(r.S.hand) ? r : null; }
  // per-mode best: College (default) and pre-modes saves keep 'hrs_best_sdg_v2'; Kids/Adults get a suffix
  const MODE3 = ['kids', 'college', 'adults'];
  const bestKeyHRS = m => BEST_HRS + (m === 'kids' || m === 'adults' ? '_' + m : '');
  function recordBest(r) {
    const m = r.mode === 'kids' || r.mode === 'adults' ? r.mode : 'college', key = bestKeyHRS(m);
    const b = HRS.store.get(key), plays = ((b && b.plays) || 0) + 1;
    const rec = { score: r.goals, max: 17, title: r.title, emoji: r.emoji, raw: r.score, mode: m, date: new Date().toISOString().slice(0, 10), plays };
    HRS.store.set(key, !b || r.score > (b.raw || 0) ? rec : Object.assign(b, { plays }));
  }
  const sT = st => st.T || E.T, sWhen = st => E.when(Math.min(st.turn, sT(st) - 1), st.mode);
  const unit = st => st.mode === 'kids' ? 'turn' : 'season';
  const modeTag = st => MODE3.includes(st.mode) ? ` · ${E.MODES[st.mode].e} ${E.MODES[st.mode].name}` : '';
  function resume(rec) {
    S = rec.S; window.__sdg2 = { get S() { return S; }, E, ready: true, get mode() { return mode; }, setMode };  // renderHand() -> syncMode() adopts the saved game's mode
    $('#title').classList.add('hide'); $('#end').classList.add('hide'); closeHelp();
    phase = 'play'; disp = null; setDisp({ ...S }, null, true); renderTop(); renderHand(); busy = false;
    tip(`💾 Welcome back! ${sWhen(S)}, ${unit(S)} ${S.turn + 1} of ${sT(S)}`, 2400);
  }
  function confirmNew(onOk) {
    const r = loadSave(); if (!r) return onOk();
    $('#helpBox').setAttribute('aria-label', 'Start a new game?');
    $('#helpBox').innerHTML = `<div class="he">🌍</div><div class="ht">Start a new game?</div><div class="hb">Your saved game (${sWhen(r.S)}${modeTag(r.S)}) will be replaced.</div><div class="row"><button class="ghostb" id="cnNo">Cancel</button><button class="big" id="cnYes">Start new</button></div>`;
    $('#help').classList.remove('hide'); $('#cnNo').focus({ preventScroll: true });
    $('#cnNo').onclick = closeHelp; $('#cnYes').onclick = () => { closeHelp(); HRS.store.del(SAVE_KEY); onOk(); };
  }
  const _showTitle = showTitle;
  showTitle = function () {
    _showTitle(); const r = loadSave(), c = $('#contBtn');
    c.classList.toggle('hide', !r); $('#playBtn').classList.toggle('pulse', !r); c.classList.toggle('pulse', !!r);
    if (r) { c.textContent = `⏯ Continue · ${sWhen(r.S)}${modeTag(r.S)}`; $('#playBtn').textContent = '▶ New'; setTimeout(() => c.focus({ preventScroll: true }), 60); } else $('#playBtn').textContent = '▶ Play';
  };
  $('#playBtn').removeEventListener('click', start);
  $('#playBtn').addEventListener('click', () => confirmNew(start));
  $('#contBtn').addEventListener('click', () => { const r = loadSave(); if (r) resume(r); else start(); });
  HRS.dialog({ overlay: $('#help'), box: $('#helpBox'), isOpen: () => !$('#help').classList.contains('hide'), isDismissible: () => true, close: closeHelp });
  $('#helpBox').tabIndex = -1;
  HRS.onBack(() => { if ($('#tip').classList.contains('show')) { $('#tip').classList.remove('show'); return true; } return false; });
  document.addEventListener('visibilitychange', () => { if (document.hidden && !busy) saveGame(); });
  $('#fx').setAttribute('aria-hidden', 'true');
  window.__sdg2ui = { choose: i => choose(i), answer: i => answerMoment(i), get phase() { return phase; }, get busy() { return busy; }, saveGame, loadSave, SAVE_KEY, BEST_HRS, bestKeyHRS, get mode() { return mode; }, setMode };

  layout(); showTitle(); requestAnimationFrame(frame);
  { const q = new URLSearchParams(location.search);
    if (q.get('new')) { HRS.store.del(SAVE_KEY); showTitle(); }
    else if (q.get('continue')) { const r = loadSave(); if (r) resume(r); } }
  setTimeout(layout, 300);
})();
