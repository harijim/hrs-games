<style>/* BRICS Bridges · posh light house style. Accent: teal #0f766e, saffron #f59e0b, navy #1e3a5f */
:root{--bg:#fbf8f3;--card:#fff;--ink:#1f2328;--muted:#5b6168;--line:#e7e1d6;--acc:#0f766e;--acc2:#f59e0b;--navy:#1e3a5f;--ok:#15803d;--bad:#b42318;--warn:#b45309;--r:16px;--sh:0 4px 18px rgba(31,35,40,.07);
  --head:Fraunces,'Fraunces',Georgia,'Times New Roman',serif;--body:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans','Noto Sans Devanagari','Noto Sans Arabic','Noto Sans Ethiopic','Noto Serif Ethiopic','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-text-size-adjust:100%}
body{min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--head);font-weight:600;line-height:1.2;margin:.3em 0}
button{font:inherit;color:inherit}
a{color:var(--acc)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.muted{color:var(--muted)} .small{font-size:.85rem}
.mech{display:inline-block;font:600 .66rem/1.4 var(--body);letter-spacing:.02em;text-transform:uppercase;color:#6b5a2e;background:#f6edd6;border-radius:6px;padding:1px 6px;vertical-align:middle;white-space:nowrap}
.src{display:inline-block;font-size:.78rem;color:var(--acc);background:#e8f4f2;border-radius:999px;padding:1px 8px;text-decoration:none;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.note{background:#f4f1ea;border-radius:12px;padding:10px 12px;font-size:.92rem}
.disc{font-size:.75rem;color:var(--muted);margin-top:18px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px;margin:12px 0}
.okbox,.warnbox,.badbox{border-radius:12px;padding:10px 12px;margin:8px 0;font-size:.95rem}
.okbox{background:#e9f7ef;color:#14532d}.warnbox{background:#fff4e0;color:#7c3d06}.badbox{background:#fdecea;color:#7a1a12}
/* buttons */
.cta{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:10px;justify-content:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,rgba(251,248,243,0))}
.btn{border:0;border-radius:999px;min-height:48px;padding:12px 22px;background:var(--acc);color:#fff;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(15,118,110,.25);flex:0 1 auto;max-width:420px}
.cta .btn:last-child{flex:1 1 auto}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line);flex:0 0 auto}
.btn.warn{background:var(--warn)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.lnk:focus-visible,.scard:focus-visible,.proj:focus-visible,g[data-act]:focus-visible,.consult:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.lnk{background:none;border:0;color:var(--acc);text-decoration:underline;padding:10px 6px;min-height:44px;cursor:pointer;font-size:.92rem}
.icon{border:0;background:#fff;box-shadow:var(--sh);width:44px;height:44px;border-radius:50%;font-size:1.6rem;line-height:1;cursor:pointer}
/* title */
.title,.endq{max-width:760px;margin:0 auto;padding:22px 16px 8px}
.hero{text-align:center}.logo{width:120px;height:60px}
.hero h1{font-size:2.3rem;margin:.1em 0 0}.sub{margin:0;color:var(--acc);font-family:var(--head);font-size:1.2rem}
.pitch{max-width:560px;margin:10px auto;color:var(--muted)}
.quarters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:10px}
@media (max-width:480px){.quarters{grid-template-columns:repeat(2,minmax(0,1fr))}}
.q{display:flex;flex-direction:column;align-items:center;text-align:center;border-radius:12px;padding:8px 4px;font-size:.85rem;gap:1px;min-width:0;overflow-wrap:anywhere;hyphens:auto}
.q.ready{background:#e8f4f2}.q.locked{opacity:.6;background:#f4f1ea}.q .qe{font-size:1.3rem}.q small{color:var(--muted);font-size:.72rem}
.levels{border:0;padding:0;margin:14px 0;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.levels legend{font-family:var(--head);font-weight:600;font-size:1.1rem;margin-bottom:8px}
.lv{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:12px 8px;cursor:pointer;border:2px solid transparent;min-height:44px}
.lv.on{border-color:var(--acc);background:#f2faf8}.lv input{position:absolute;opacity:0;pointer-events:none}
.lv:focus-within{outline:3px solid var(--acc2);outline-offset:2px}
.lve{font-size:1.6rem}.lv small{color:var(--muted);font-size:.78rem}.lv .bl{font-size:.72rem;line-height:1.3}
.best{font-size:.72rem;background:#fff4e0;color:#7c3d06;border-radius:999px;padding:0 8px;margin-top:4px}
.rhythm{list-style:none;padding:0;margin:8px 0;color:var(--muted);font-size:.9rem;text-align:center}
.links{display:flex;flex-wrap:wrap;justify-content:center;gap:2px}
#parent-slot .hrswb-link{font-size:.92rem}
/* game bar */
.bar{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(251,248,243,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.bar-t{flex:1;display:flex;flex-direction:column;line-height:1.2;min-width:0}.bar-t b{font-family:var(--head)}.bar-t small{color:var(--muted);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{background:#fff;border-radius:999px;padding:6px 10px;box-shadow:var(--sh);font-weight:700;font-size:.9rem;white-space:nowrap}.chip.res{color:var(--acc)}
.steps{display:flex;list-style:none;margin:0;padding:6px 12px;gap:4px;overflow-x:auto;font-size:.74rem;color:var(--muted)}
.steps li{flex:1;text-align:center;padding:3px 4px;border-bottom:3px solid var(--line);white-space:nowrap}
.steps li.done{border-color:#99d5cc}.steps li.now{border-color:var(--acc);color:var(--ink);font-weight:700}
.game{max-width:1180px;margin:0 auto;padding:6px 12px;display:grid;gap:12px}
@media (min-width:900px){.game{grid-template-columns:minmax(320px,430px) 1fr;align-items:start}.left{position:sticky;top:110px}}
.left{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:8px 10px}
/* council */
.council{display:block;width:100%;max-width:400px;margin:0 auto;max-height:38vh}
@media (min-width:900px){.council{max-height:none}}
.council .node{cursor:pointer}.council .disc{stroke:#fff;stroke-width:3}
.council .code{fill:#fff;font:700 12px var(--body);pointer-events:none}
.council .ring{fill:none;stroke:var(--acc2);stroke-width:3;stroke-dasharray:4 3}
.council .pick .disc{stroke:var(--acc);stroke-width:4}
.council .block .disc{stroke:var(--bad);stroke-width:4}
.council .obs{opacity:.75}
.council .von{fill:var(--acc)}.council .voff{fill:#dcd5c8}
.council .br-old{fill:none;stroke:var(--acc2);stroke-width:3;opacity:.75;stroke-linecap:round}
.council .br-new{fill:none;stroke:var(--acc);stroke-width:3;stroke-dasharray:6 5;stroke-linecap:round;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-22}}
.council .c-e{font-size:34px}.council .c-t{font:600 13px var(--head);fill:var(--ink)}.council .c-s{font-size:11px;fill:var(--muted)}
.strip{border-top:1px solid var(--line);margin-top:4px;padding-top:6px;font-size:.82rem}
.strip-h{display:flex;align-items:center;gap:6px;justify-content:space-between}
.meters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0}
.meter span{font-size:.74rem;color:var(--muted)}.meter .mbar{height:7px;background:#efe9de;border-radius:9px;overflow:hidden}
.meter .mbar i{display:block;height:100%;background:linear-gradient(90deg,#f59e0b,#15803d);border-radius:9px;transition:width .6s}
.strip-real{margin:4px 0 2px;font-size:.74rem;color:var(--muted)}
/* panel */
.panel{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px;min-width:0}
.ph{font-size:1.25rem;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}.ph small{font:500 .82rem var(--body);color:var(--muted)}
.badge{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;font:700 .72rem var(--body);flex:0 0 auto;position:relative}
.badge.lg{width:44px;height:44px;font-size:.9rem}.badge i{font-style:normal;position:absolute;top:-2px;inset-inline-end:-2px;font-size:.8rem}
.tag{display:inline-flex;align-items:center;gap:2px;background:#f4f1ea;border-radius:999px;padding:1px 7px;font-size:.85rem;white-space:nowrap}
.tag b{font-size:.78rem}.tag.hit{background:#e8f4f2;box-shadow:inset 0 0 0 1.5px #99d5cc}
.challenge .ch-h{display:flex;gap:12px;align-items:center}.challenge h2{font-size:1.45rem;margin:0}.challenge small{color:var(--muted)}
.lead{margin:12px 0 8px}
.needs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.need{display:inline-flex;align-items:center;gap:4px;background:#faf7f1;border:1.5px solid var(--line);border-radius:12px;padding:3px 8px}
.need b{font-size:.85rem}.need.part{border-color:#f5c26b;background:#fff8ea}.need.full{border-color:#86d0a5;background:#effaf3}
.need .carry{font-size:.68rem;color:var(--warn)}
.fact{background:#f7f5ef;border-inline-start:4px solid var(--acc2);border-radius:8px;padding:8px 12px}
.india{background:#fff6e8;border-radius:8px;padding:8px 12px}
.hint{color:var(--acc);font-weight:600}
.agenda{margin:10px 0}.agenda summary{cursor:pointer;color:var(--acc);font-weight:600;min-height:32px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:8px}
.scard,.proj{display:flex;flex-direction:column;gap:6px;text-align:start;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;min-height:44px;transition:border-color .15s,box-shadow .15s}
.scard.on,.proj.on{border-color:var(--acc);box-shadow:0 0 0 3px rgba(15,118,110,.15);background:#f6fbfa}
.scard.glow{box-shadow:0 0 0 3px rgba(245,158,11,.25)}
.scard.on.glow{box-shadow:0 0 0 3px rgba(15,118,110,.2)}
.sc-h{display:flex;align-items:center;gap:8px}.sc-h>span:nth-child(2){flex:1;display:flex;flex-direction:column;line-height:1.25;min-width:0}.sc-h small{color:var(--muted);font-size:.75rem}
.sc-tags{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end}
.sc-f{font-size:.84rem;color:#3d434a;line-height:1.4}
.warnline{font-size:.8rem;color:var(--warn);font-weight:600}
.projects{display:grid;gap:10px;margin-top:8px}
@media (min-width:640px){.projects{grid-template-columns:1fr 1fr}}
.proj:disabled{opacity:.55;cursor:default}
.pj-h{display:flex;align-items:center;gap:8px}.pj-h b{flex:1}.pe{font-size:1.4rem}.cost{font-weight:800;color:var(--navy);white-space:nowrap}
.pj-m{display:flex;flex-wrap:wrap;gap:4px;align-items:center}.sdg{font-size:.76rem;background:#e8eef7;color:var(--navy);border-radius:6px;padding:1px 6px}
.pj-f{font-size:.82rem;color:var(--muted)}.fnote{display:block;font-size:.76rem;margin-top:2px}.pj-n{font-size:.78rem;color:#3d434a;background:#f7f5ef;border-radius:8px;padding:4px 8px}
.proj.save{border-style:dashed}
.voters{list-style:none;padding:0;margin:8px 0;display:grid;gap:6px}
@media (min-width:1100px){.voters{grid-template-columns:1fr 1fr}}
.voters li{display:grid;grid-template-columns:auto auto 1fr auto;grid-template-areas:"m v w c";align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:12px;padding:6px 8px}
.voters li.up{border-color:#bfe6d2}.voters li.down{border-color:#f5d39b}.voters li.bad{border-color:var(--bad);background:#fff5f4}
.mrow{grid-area:m;display:flex;align-items:center;gap:6px;background:none;border:0;padding:0;cursor:pointer;min-height:40px}.mn{font-weight:600;font-size:.9rem;white-space:nowrap}
.vv{grid-area:v;display:flex;align-items:center;gap:4px}.vv small{font-weight:700;font-size:.78rem;min-width:22px}
.why{grid-area:w;font-size:.76rem;color:var(--muted);min-width:0}
.consult{grid-area:c;border:1.5px solid var(--acc);background:#fff;color:var(--acc);border-radius:999px;padding:6px 12px;min-height:40px;font-size:.8rem;font-weight:700;cursor:pointer}
.consult.on{background:var(--acc);color:#fff}.consult:disabled{opacity:.35;cursor:default}
@media (max-width:420px){.voters li{grid-template-columns:auto 1fr auto;grid-template-areas:"m v c" "w w w"}.mn{font-size:.85rem}}
.pips{display:inline-flex;gap:2px;vertical-align:middle}.pips i{width:8px;height:8px;border-radius:50%;background:#dcd5c8}.pips i.on{background:var(--acc)}
.sdgs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0}.sdgc{background:#e8eef7;color:var(--navy);border-radius:8px;padding:2px 8px;font-size:.82rem;font-weight:600}
.stamp{display:flex;flex-direction:column;align-items:center;gap:2px;border:3px double #b45309;color:#7c3d06;border-radius:14px;padding:10px;margin:12px auto;max-width:260px;transform:rotate(-2deg);background:#fffaf0}
.quiz{background:#f2faf8;border-radius:12px;padding:10px 12px;margin-top:10px}.qa{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.qopt{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;min-height:44px;cursor:pointer}
.qopt.right{border-color:var(--ok);background:#e9f7ef}.qopt.wrong{border-color:#f5c26b;background:#fff8ea}.qopt:disabled{cursor:default}
.quiz .why{font-size:.92rem;margin:8px 0 0}
/* end */
.endq h1{text-align:center;font-size:2rem}.endq .sub{text-align:center}
.big{display:flex;flex-direction:column;align-items:center;margin:10px 0}.big span{color:var(--muted)}.big b{font:700 3.2rem var(--head);color:var(--acc)}.big em{color:#7c3d06;background:#fff4e0;border-radius:999px;padding:2px 10px;font-style:normal;font-weight:700}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.grid3>div{background:#fff;border-radius:12px;box-shadow:var(--sh);padding:10px 4px;display:flex;flex-direction:column}.grid3 b{font-size:1.4rem}.grid3 small{color:var(--muted)}
.endq .left{margin:12px 0}
.passport{background:#fffaf0;border:2px dashed #e7c48a;border-radius:14px;padding:10px;margin:12px 0}.passport>div{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.stampmini{display:flex;flex-direction:column;align-items:center;font-size:.72rem}
/* sheet */
.bb-sheet{position:fixed;inset:0;z-index:50;background:rgba(20,24,28,.45);display:flex;align-items:flex-end;justify-content:center}
.bb-sheet-box{position:relative;background:#fff;width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));outline:none}
.bb-sheet-box.wide{max-width:760px}
@media (min-width:700px){.bb-sheet{align-items:center}.bb-sheet-box{border-radius:20px}}
.bb-sheet .x{position:absolute;top:8px;inset-inline-end:8px;width:44px;height:44px;border:0;background:#f4f1ea;border-radius:50%;cursor:pointer}
.bb-sheet h2{padding-inline-end:44px}
.mini{border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:6px 0}.mini p{margin:4px 0;font-size:.9rem}
.how li{margin:6px 0}.srcs{font-size:.8rem;padding-inline-start:18px}.srcs a{word-break:break-all}
img.emoji{height:1.1em;width:1.1em;vertical-align:-.15em}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
html.hrs-reduce-motion *{animation:none!important;transition:none!important}

/* ---------- v0.2: languages, right-to-left, invited guest ---------- */
/* Fonts: system fonts only (works offline). Fraunces/Georgia have no Devanagari, CJK, Arabic or Ethiopic glyphs, so each script gets its own stack. */
html:lang(hi){--head:'Noto Serif Devanagari','Noto Sans Devanagari','Nirmala UI','Kohinoor Devanagari',Mangal,serif;--body:'Noto Sans Devanagari','Nirmala UI','Kohinoor Devanagari',Mangal,system-ui,sans-serif}
html:lang(zh-Hans){--head:'Noto Serif CJK SC','Songti SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',serif;--body:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB','Source Han Sans SC',system-ui,sans-serif}
html:lang(ar){--head:'Noto Naskh Arabic','Noto Sans Arabic','Segoe UI',Tahoma,'Geeza Pro',serif;--body:'Noto Sans Arabic','Noto Naskh Arabic','Segoe UI',Tahoma,'Geeza Pro',sans-serif}
html:lang(fa){--head:Vazirmatn,'Noto Naskh Arabic','Noto Sans Arabic',Tahoma,serif;--body:Vazirmatn,'Noto Sans Arabic','Noto Naskh Arabic','Segoe UI',Tahoma,sans-serif}
html:lang(am){--head:'Noto Serif Ethiopic','Noto Sans Ethiopic',Nyala,Ebrima,'Abyssinica SIL',serif;--body:'Noto Sans Ethiopic','Noto Serif Ethiopic',Nyala,Ebrima,'Abyssinica SIL',system-ui,sans-serif}
html:lang(ru) body,html:lang(pt) body,html:lang(id) body{hyphens:auto}
html:lang(ar) body,html:lang(fa) body,html:lang(am) body,html:lang(hi) body{line-height:1.65}
html:lang(zh-Hans) .mech,html:lang(ar) .mech,html:lang(fa) .mech{letter-spacing:0;text-transform:none}
.council text{font-family:var(--body)}
[dir=rtl] .icon.back{transform:scaleX(-1)}
[dir=rtl] .meter .mbar i{background:linear-gradient(270deg,#f59e0b,#15803d)} /* RTL: bars and pips fill from the right */
[dir=rtl] .fact{border-inline-start:4px solid var(--acc2)}
.src{unicode-bidi:isolate}
.verbanner{margin:0 0 10px;padding:10px 14px;border-radius:12px;background:#fff8ea;border:1.5px solid #ecd9b0;color:var(--ink);font-size:.92rem;line-height:1.45}
.verbanner a{color:#0d5c56;font-weight:700;text-decoration:underline;text-underline-offset:2px;display:inline-block;min-height:24px;padding:2px 0}
.verbanner a:focus-visible{outline:3px solid var(--acc2);outline-offset:2px;border-radius:4px}
.topline{display:flex;justify-content:flex-end;margin:-4px 0 4px}
.langpick{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:2px 4px 2px 10px;box-shadow:var(--sh)}
[dir=rtl] .langpick{padding:2px 10px 2px 4px}
.langpick select{appearance:auto;border:0;background:transparent;font:500 .95rem var(--body);color:var(--ink);min-height:40px;padding:0 4px;cursor:pointer;max-width:60vw}
.langpick:focus-within{outline:3px solid var(--acc2);outline-offset:2px}
.count{margin:.2em 0 0}.countbtn{font-size:.88rem;color:var(--muted);padding:4px 6px;min-height:36px}
.mt{text-align:center;margin:6px 0}
/* Saudi Arabia: invited guest, membership not confirmed */
.council .guest .disc{stroke:var(--muted);stroke-width:2.5;stroke-dasharray:4 3;fill-opacity:.55}
.council .inv{font:600 9.5px var(--body);fill:var(--muted);pointer-events:none}
.council .br-guest{stroke-dasharray:3 5;opacity:.6}
.badge.guest{opacity:.75;outline:2px dashed var(--muted);outline-offset:1px}
.guestcard{border-style:dashed}
.guestline{font-size:.78rem;color:var(--muted);font-weight:600}
.guestnote{font-size:.88rem}
.guestcons{display:flex;gap:8px;align-items:center;margin-top:10px}

/* country codes stay LTR inside RTL layouts (SA* not *SA) */
.council .code,.badge{direction:ltr;unicode-bidi:isolate}
/* v0.3: quarter picker, twists, extra strip meter, year summary */
.title h1 .ed{font-weight:600;color:var(--muted);font-size:.62em;white-space:nowrap}
button.q{font:inherit;color:inherit;border:2px solid transparent;cursor:pointer}
button.q:disabled{cursor:default}
.q.open{background:#e8f4f2}.q.done,.q.doneToday{background:#eef6e9}.q.tomorrow{background:#fdf3e2;opacity:.85}
.q.sel{border-color:#0f766e;box-shadow:0 0 0 2px rgba(15,118,110,.15)}
.q.open:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
.yearline{text-align:center;margin:8px 0}
.btn.small{padding:8px 14px;font-size:.92rem;min-height:40px}
.twist{background:#f3f0ff;border:1px solid #d9d0fb;border-radius:12px;padding:8px 12px;margin:10px 0}.twist p{margin:4px 0}
.twl{font-size:.85rem;margin:6px 0;padding:6px 10px;border-radius:10px;background:#f4f1ea;color:#57534e}.twl.on{background:#e8f4f2;color:#115e59;font-weight:600}
.xmeter{margin-top:6px}.xmeter .mbar i{background:linear-gradient(90deg,#6d28d9,#0f766e)}
.gw{margin:4px 0}.gw .mbar{height:7px;background:#efe9de;border-radius:9px;overflow:hidden}.gw .mbar i{display:block;height:100%;background:#15803d;border-radius:9px}.gw small{font-size:.72rem;color:var(--muted)}
.para{color:var(--muted);font-size:.75em;unicode-bidi:isolate}
.year .yq h3{margin:0 0 6px}.ycols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ycols h4{margin:0 0 4px;font-size:.85rem;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.ycols p{margin:3px 0}.ycols ul{margin:0;padding-inline-start:18px}
@media (max-width:520px){.ycols{grid-template-columns:1fr}}
.proj .cost s{color:var(--muted);font-weight:400}
[dir=rtl] .xmeter .mbar i{background:linear-gradient(270deg,#6d28d9,#0f766e)}
[dir=rtl] .gw .mbar i{margin-inline-start:0}
</style>
</head>

<script>/* BRICS Bridges: data (facts + sources). Facts are real and cited; mechanics are labelled in the UI.
   Items with verify:true must be re-checked against a primary source before release (DESIGN.md §10). */
(function (root) {
'use strict';
// Saudi Arabia: 'invited' (default, Harpreet's decision 23 Oct 2026): shown as an invited guest whose cards can help,
// with no Voice, no focus and no challenge turn, and not part of the consensus check. 'member' restores a full seat (DESIGN.md §4.3).
const SAUDI_SEAT = 'invited';

const TAGS = {
  water:  { e: '💧', n: 'Water',          sdg: [6] },
  food:   { e: '🌾', n: 'Food',           sdg: [2] },
  health: { e: '🩺', n: 'Health',         sdg: [3] },
  warn:   { e: '📡', n: 'Early warning',  sdg: [13] },
  infra:  { e: '🏗️', n: 'Infrastructure', sdg: [9, 11] },
  energy: { e: '⚡', n: 'Energy',         sdg: [7] },
  digital:{ e: '💻', n: 'Digital',        sdg: [9] },
  skills: { e: '🎓', n: 'Skills',         sdg: [4] },
  trade:  { e: '🚢', n: 'Trade links',    sdg: [17] },
  nature: { e: '🌳', n: 'Nature',         sdg: [15] },
};
const TAG_KEYS = Object.keys(TAGS);

// Official order: founders, then 2024 and 2025 joiners (brics2026.gov.in). Colours are neutral, not flag colours.
const MEMBERS = [
  { id: 'BR', name: 'Brazil',       joined: 'Founder (2009)', col: '#2f855a', ndb: true },
  { id: 'RU', name: 'Russia',       joined: 'Founder (2009)', col: '#3b5b92', ndb: true, ndbNote: 'The NDB put new transactions in Russia on hold on 3 March 2022.', ndbSrc: 'https://www.ndb.int/news/a-statement-by-the-new-development-bank/' },
  { id: 'IN', name: 'India',        joined: 'Founder (2009) · Chair 2026', col: '#d97706', ndb: true },
  { id: 'CN', name: 'China',        joined: 'Founder (2009)', col: '#b4443c', ndb: true },
  { id: 'ZA', name: 'South Africa', joined: '2010',           col: '#7c5c2e', ndb: true },
  { id: 'EG', name: 'Egypt',        joined: '2024',           col: '#a16207', ndb: true },
  { id: 'ET', name: 'Ethiopia',     joined: '2024',           col: '#4d7c0f', ndb: false, ndbStatus: 'a prospective NDB member' },
  { id: 'IR', name: 'Iran',         joined: '2024',           col: '#0e7490', ndb: false, ndbStatus: 'not an NDB member' },
  { id: 'SA', name: 'Saudi Arabia', joined: 'Invited (2023) · membership not confirmed', col: '#15803d', ndb: false, ndbStatus: 'not an NDB member', footnote: true },
  { id: 'AE', name: 'UAE',          joined: '2024',           col: '#6d28d9', ndb: true },
  { id: 'ID', name: 'Indonesia',    joined: '2025',           col: '#be185d', ndb: false, ndbStatus: 'not an NDB member' },
];
const SAUDI_NOTE = 'Saudi Arabia was invited to join BRICS in 2023. Indian and BRICS official sources, such as India’s 2026 chairship website, list it among the members. Saudi Arabia has not publicly confirmed its membership and took part in the 2026 summit as an invited country. This game shows it as an invited guest: its strengths can help, but it is not part of the consensus check.';
const SAUDI_SRC = [{ srcName: 'brics2026.gov.in', src: 'https://www.brics2026.gov.in/about-us/' }, { srcName: 'Indian Express explainer', src: 'https://indianexpress.com/article/explained/saudi-arabia-brics-membership-status-10878467/' }, { srcName: 'Arab News, Sep 2026', src: 'https://www.arabnews.com/saudi-arabia/how-saudi-arabia-benefited-from-engaging-with-brics-at-india-summit-3001498' }];

// Two neutral, shareable strengths per member. tags give 1 need point each.
const CARDS = [
  { id: 'BR1', m: 'BR', title: 'Tropical farm science', tags: ['food'], qt: { 3: ['food', 'trade'] }, fact: 'Brazil’s farm research agency Embrapa developed the soil and crop methods that made the Cerrado savanna one of the world’s big farming regions.', srcName: 'Embrapa Cerrados', src: 'https://www.embrapa.br/web/cerrados/apresentacao' },
  { id: 'BR2', m: 'BR', title: 'Hydropower and bio-ethanol', tags: ['energy', 'water'], fact: 'Brazil gets most of its electricity from renewables, led by hydropower reservoirs, and is a pioneer of sugarcane ethanol fuel.', srcName: 'IEA: Brazil', src: 'https://www.iea.org/countries/brazil', verify: true },
  { id: 'RU1', m: 'RU', title: 'Wheat for the world', tags: ['food'], qt: { 3: ['food', 'trade'] }, fact: 'Russia is the world’s largest wheat exporter: about 43–45 million tonnes, roughly a fifth of global wheat trade, forecast for 2025/26.', srcName: 'USDA ERS Wheat Outlook, Sep 2025', src: 'https://www.ers.usda.gov/media/10752/whs-25i.pdf' },
  { id: 'RU2', m: 'RU', title: 'Power-plant builders', tags: ['energy', 'infra'], fact: 'Russian engineers build nuclear plants abroad, including the Kudankulam plant in Tamil Nadu, India.', srcName: 'World Nuclear Association: India', src: 'https://world-nuclear.org/information-library/country-profiles/countries-g-n/india' },
  { id: 'IN1', m: 'IN', title: 'Affordable medicines', tags: ['health'], qt: { 3: ['health', 'trade'] }, fact: 'India supplies about 20% of the world’s generic medicines by volume, earning it the name “pharmacy of the world”.', srcName: 'PIB', src: 'https://pib.gov.in/PressNoteDetails.aspx?ModuleId=3&NoteId=157889' },
  { id: 'IN2', m: 'IN', title: 'Cyclone warning and shelters', tags: ['warn', 'infra'], fact: 'Before Cyclone Phailin (2013), Odisha moved about 1 million people to shelters. 44 people died, compared with about 10,000 in the 1999 super cyclone.', srcName: 'Govt of Odisha, ADB and World Bank damage assessment (Dec 2013)', src: 'https://documents1.worldbank.org/curated/en/168471468257979992/pdf/838860WP0P14880Box0382116B00PUBLIC0.pdf' },
  { id: 'CN1', m: 'CN', title: 'Solar panel manufacturing', tags: ['energy'], fact: 'China’s share of every main stage of solar PV manufacturing is above 80%, which has made solar panels much cheaper worldwide.', srcName: 'IEA: Solar PV Global Supply Chains', src: 'https://www.iea.org/reports/solar-pv-global-supply-chains/executive-summary' },
  { id: 'CN2', m: 'CN', title: 'Rail and big construction', tags: ['infra'], qt: { 3: ['infra', 'trade'] }, fact: 'By December 2025 China’s high-speed rail network passed 50,000 km, more than the rest of the world combined.', srcName: 'Xinhua / Ministry of Transport, Dec 2025', src: 'https://english.news.cn/20251226/558786c99de5428b98a84c3ff93300e3/c.html' },
  { id: 'ZA1', m: 'ZA', title: 'Public-health programmes', tags: ['health'], fact: 'South Africa runs the world’s largest HIV treatment programme, with about 6.3 million people on antiretroviral therapy in 2024.', srcName: 'UNAIDS: South Africa', src: 'https://www.unaids.org/en/regionscountries/countries/southafrica' },
  { id: 'ZA2', m: 'ZA', title: 'Water-saving know-how', tags: ['water'], fact: 'In the 2018 drought Cape Town cut its water use by more than half, from about 1.2 billion to about 0.5 billion litres a day, and avoided “Day Zero”.', srcName: 'Princeton ISS case study', src: 'https://successfulsocieties.princeton.edu/publications/keeping-taps-running-how-cape-town-averted-day-zero-2017-2018' },
  { id: 'EG1', m: 'EG', title: 'Suez Canal shipping', tags: ['infra', 'food'], qt: { 3: ['trade', 'food'] }, fact: 'About 12% of world trade, including grain and fertiliser, passes through Egypt’s Suez Canal.', srcName: 'UNCTAD (2024)', src: 'https://unctad.org/system/files/non-official-document/cimem7-2024-ppt05ahmedelshazly_en.pdf' },
  { id: 'EG2', m: 'EG', title: 'Desert solar parks', tags: ['energy'], fact: 'Egypt’s Benban solar park near Aswan, about 1.65 GW, is one of the largest solar parks in the world.', srcName: 'IFC', src: 'https://www.ifc.org/en/stories/2010/benban-solar-park-egypt' },
  { id: 'ET1', m: 'ET', title: 'Green Legacy tree planting', tags: ['water', 'food'], qt: { 4: ['nature', 'water'] }, fact: 'Ethiopia’s Green Legacy Initiative reports more than 48 billion seedlings planted since 2019 to restore land and watersheds.', srcName: 'Green Legacy Initiative (official)', src: 'https://www.ethio-greenlegacy.et/' },
  { id: 'ET2', m: 'ET', title: 'Humanitarian air hub', tags: ['health', 'infra'], qt: { 3: ['trade', 'health'] }, fact: 'In 2020 an Addis Ababa air hub, run with the UN World Food Programme and Ethiopian Airlines, carried COVID-19 supplies to all 54 African countries.', srcName: 'WFP', src: 'https://www.wfp.org/news/wfp-launches-ethiopian-government-supported-air-hub-covid-19-response' },
  { id: 'IR1', m: 'IR', title: 'Qanat water engineering', tags: ['water'], fact: 'Iran’s qanats are ancient underground channels that carry water by gravity. The Persian Qanat is a UNESCO World Heritage site (2016).', srcName: 'UNESCO', src: 'https://whc.unesco.org/en/list/1506' },
  { id: 'IR2', m: 'IR', title: 'Earthquake engineering', tags: ['infra', 'warn'], fact: 'Iran’s International Institute of Earthquake Engineering and Seismology (IIEES, founded 1989) researches safer buildings and quake monitoring.', srcName: 'IIEES', src: 'https://www.iiees.ac.ir/en/', verify: true },
  { id: 'SA1', m: 'SA', title: 'Desalination at scale', tags: ['water'], fact: 'Saudi Arabia is the world’s largest producer of desalinated water: more than 16 million cubic metres a day.', srcName: 'Arab News', src: 'https://www.arabnews.com/business/saudi-arabia-leads-world-with-16m-cubic-meters-of-desalinated-water-daily-2647115' },
  { id: 'SA2', m: 'SA', title: 'Large solar plants', tags: ['energy'], fact: 'The 1.5 GW Sudair solar plant has been fully operating since January 2024.', srcName: 'Zawya / ACWA Power', src: 'https://www.zawya.com/en/projects/utilities/saudis-1.5gw-sudair-solar-pv-ipp-is-fully-operational-acwa-power-statement-441761' },
  { id: 'AE1', m: 'AE', title: 'Clean nuclear power', tags: ['energy'], fact: 'The UAE’s Barakah nuclear plant supplies about a quarter of the country’s electricity.', srcName: 'World Nuclear Association: UAE', src: 'https://world-nuclear.org/information-library/country-profiles/countries-t-z/united-arab-emirates' },
  { id: 'AE2', m: 'AE', title: 'Humanitarian logistics hub', tags: ['health', 'food'], qt: { 3: ['trade', 'food'] }, fact: 'Dubai Humanitarian, formerly International Humanitarian City, describes itself as the world’s largest humanitarian hub, with about 80 UN, NGO and other members.', srcName: 'Dubai Humanitarian', src: 'https://dubaihumanitarian.ae/about/' },
  { id: 'ID1', m: 'ID', title: 'Tsunami early warning', tags: ['warn'], fact: 'Indonesia’s InaTEWS, launched in 2008, can issue a tsunami warning about 5 minutes after a strong earthquake.', srcName: 'ReliefWeb / Govt of Indonesia', src: 'https://reliefweb.int/report/indonesia/indonesia-tsunami-early-warning-system-launched' },
  { id: 'ID2', m: 'ID', title: 'Geothermal power', tags: ['energy'], fact: 'Indonesia has the world’s second-largest geothermal power capacity, about 2,744 MW.', srcName: 'Antara', src: 'https://en.antaranews.com/news/380545/indonesia-ranks-second-globally-in-geothermal-energy-capacity' },
  // Quarters 2–4: new strengths. qt on a Q1 card above re-tags it for a later quarter (the fact stays the same).
  { id: 'BRd', m: 'BR', title: 'Pix instant payments', tags: ['digital'], fact: 'Brazil’s central bank launched Pix, a free instant-payment system, in November 2020. By 2025 it had more than 170 million users.', srcName: 'Banco Central do Brasil: Pix', src: 'https://www.bcb.gov.br/en/financialstability/pix_en', verify: true },
  { id: 'RUd', m: 'RU', title: 'GLONASS satellite navigation', tags: ['digital', 'warn'], fact: 'Russia runs GLONASS, one of the world’s four global satellite navigation systems, with full global coverage since 2011.', srcName: 'GLONASS information centre', src: 'https://www.glonass-iac.ru/en/about_glonass/', verify: true },
  { id: 'INd', m: 'IN', title: 'UPI and digital public infrastructure', tags: ['digital'], fact: 'India’s UPI lets anyone send money instantly from a phone. In 2025 it handled more than 20 billion payments in a single month.', srcName: 'NPCI UPI statistics', src: 'https://www.npci.org.in/what-we-do/upi/product-statistics', verify: true },
  { id: 'CNs', m: 'CN', title: 'Patents and research labs', tags: ['skills', 'digital'], fact: 'China receives more patent applications than any other country: about 1.6 million in 2023.', srcName: 'WIPO IP statistics', src: 'https://www.wipo.int/ipstats/en/', verify: true },
  { id: 'ZAs', m: 'ZA', title: 'Radio astronomy (MeerKAT)', tags: ['skills', 'digital'], fact: 'South Africa’s MeerKAT, 64 radio dishes in the Karoo, is a precursor of the Square Kilometre Array telescope, which South Africa co-hosts with Australia.', srcName: 'SARAO: MeerKAT', src: 'https://www.sarao.ac.za/science/meerkat/about-meerkat/' },
  { id: 'EGs', m: 'EG', title: 'Egyptian Knowledge Bank', tags: ['skills'], fact: 'The Egyptian Knowledge Bank, launched in 2016, gives everyone in Egypt free online access to research journals and learning resources.', srcName: 'Wikipedia (secondary; official site ekb.eg)', src: 'https://en.wikipedia.org/wiki/Egyptian_Knowledge_Bank', verify: true },
  { id: 'IRs', m: 'IR', title: 'Fertility and stem-cell research', tags: ['health', 'skills'], fact: 'Iran’s Royan Institute, founded in 1991, is known for research on fertility treatment and stem cells.', srcName: 'Royan Institute', src: 'https://royan.org/', verify: true },
  { id: 'AEs', m: 'AE', title: 'Hope Mars mission', tags: ['skills', 'digital'], fact: 'The UAE’s Hope probe reached orbit around Mars in February 2021, the first interplanetary mission by an Arab country.', srcName: 'Wikipedia: Emirates Mars Mission (secondary)', src: 'https://en.wikipedia.org/wiki/Emirates_Mars_Mission', verify: true },
  { id: 'IDd', m: 'ID', title: 'QRIS: one QR code for all', tags: ['digital'], fact: 'Indonesia’s QRIS, launched by Bank Indonesia in 2019, lets any shop accept payments from any app through one standard QR code.', srcName: 'Bank Indonesia: QRIS', src: 'https://www.bi.go.id/QRIS/default.aspx', verify: true },
  { id: 'SAs', m: 'SA', title: 'Research university (KAUST)', tags: ['skills', 'water'], fact: 'King Abdullah University of Science and Technology (KAUST), opened in 2009, researches desalination, solar energy and Red Sea science.', srcName: 'KAUST', src: 'https://www.kaust.edu.sa/en/about' },
  { id: 'INt', m: 'IN', title: 'ITEC training partnerships', tags: ['skills'], fact: 'Since 1964 India’s ITEC programme has trained more than 200,000 officials and professionals from about 160 partner countries.', srcName: 'ITEC, Ministry of External Affairs', src: 'https://www.itecgoi.in/', verify: true },
  { id: 'ZAt', m: 'ZA', title: 'Port of Durban', tags: ['trade', 'infra'], fact: 'Durban is one of Africa’s busiest container ports and a gateway for southern Africa’s trade.', srcName: 'Wikipedia: Port of Durban (secondary; Transnet)', src: 'https://en.wikipedia.org/wiki/Port_of_Durban', verify: true },
  { id: 'IRt', m: 'IR', title: 'North–South Transport Corridor', tags: ['trade', 'infra'], fact: 'In 2000 Iran, India and Russia agreed to build the International North–South Transport Corridor, a ship, rail and road route linking the Indian Ocean to Russia.', srcName: 'Wikipedia: INSTC (secondary)', src: 'https://en.wikipedia.org/wiki/International_North%E2%80%93South_Transport_Corridor', verify: true },
  { id: 'IDt', m: 'ID', title: 'Regional trade hub (ASEAN)', tags: ['trade', 'skills'], fact: 'Indonesia is a founding member of ASEAN (1967), and Jakarta hosts the ASEAN Secretariat.', srcName: 'ASEAN', src: 'https://asean.org/about-us/' },
  { id: 'INe', m: 'IN', title: 'International Solar Alliance', tags: ['energy', 'skills'], fact: 'India and France launched the International Solar Alliance in 2015. It is based in Gurugram and has more than 100 signatory countries.', srcName: 'International Solar Alliance', src: 'https://isa.int/', verify: true },

mundo.","c.CN2.t":"Ferrovias e grandes obras","c.CN2.f":"Em dezembro de 2025 a rede ferroviária de alta velocidade da China passou de 50.000 km, mais do que todo o resto do mundo junto.","c.ZA1.t":"Programas de saúde pública","c.ZA1.f":"A África do Sul mantém o maior programa de tratamento de HIV do mundo, com cerca de 6,3 milhões de pessoas em terapia antirretroviral em 2024.","c.ZA2.t":"Saber economizar água","c.ZA2.f":"Na seca de 2018, a Cidade do Cabo reduziu o uso de água em mais da metade, de cerca de 1,2 bilhão para cerca de 0,5 bilhão de litros por dia, e evitou o “Dia Zero”.","c.EG1.t":"Navegação pelo Canal de Suez","c.EG1.f":"Cerca de 12% do comércio mundial, incluindo grãos e fertilizantes, passa pelo Canal de Suez, no Egito.","c.EG2.t":"Parques solares no deserto","c.EG2.f":"O parque solar de Benban, perto de Assuã, no Egito, com cerca de 1,65 GW, é um dos maiores parques solares do mundo.","c.ET1.t":"Plantio de árvores Green Legacy","c.ET1.f":"A Iniciativa Green Legacy da Etiópia relata mais de 48 bilhões de mudas plantadas desde 2019 para recuperar terras e bacias hidrográficas.","c.ET2.t":"Polo aéreo humanitário","c.ET2.f":"Em 2020 um polo aéreo em Adis Abeba, operado com o Programa Mundial de Alimentos da ONU e a Ethiopian Airlines, levou suprimentos contra a COVID-19 aos 54 países africanos.","c.IR1.t":"Engenharia hídrica dos qanats","c.IR1.f":"Os qanats do Irã são antigos canais subterrâneos que levam água pela gravidade. O Qanat Persa é Patrimônio Mundial da UNESCO (2016).","c.IR2.t":"Engenharia sísmica","c.IR2.f":"O Instituto Internacional de Engenharia Sísmica e Sismologia do Irã (IIEES, fundado em 1989) pesquisa edifícios mais seguros e o monitoramento de terremotos.","c.SA1.t":"Dessalinização em grande escala","c.SA1.f":"A Arábia Saudita é o maior produtor mundial de água dessalinizada: mais de 16 milhões de metros cúbicos por dia.","c.SA2.t":"Grandes usinas solares","c.SA2.f":"A usina solar de Sudair, de 1,5 GW, opera plenamente desde janeiro de 2024.","c.AE1.t":"Energia nuclear limpa","c.AE1.f":"A usina nuclear de Barakah, nos EAU, fornece cerca de um quarto da eletricidade do país.","c.AE2.t":"Polo de logística humanitária","c.AE2.f":"A Dubai Humanitarian, antiga International Humanitarian City, apresenta-se como o maior polo humanitário do mundo, com cerca de 80 membros da ONU, ONGs e outros.","c.ID1.t":"Alerta precoce de tsunami","c.ID1.f":"O InaTEWS da Indonésia, lançado em 2008, pode emitir um alerta de tsunami cerca de 5 minutos após um terremoto forte.","c.ID2.t":"Energia geotérmica","c.ID2.f":"A Indonésia tem a segunda maior capacidade geotérmica do mundo, cerca de 2.744 MW.","ch.ET.t":"Seca prolongada","ch.ET.f":"Do fim de 2020 a 2022, o Chifre da África, incluindo a Etiópia, teve cinco estações chuvosas fracassadas seguidas.","ch.ET.q":"Quantas estações chuvosas seguidas fracassaram na seca do Chifre da África?","ch.ET.a0":"2","ch.ET.a1":"3","ch.ET.a2":"5","ch.ET.w":"Cinco estações fracassaram, do fim de 2020 a 2022. Por isso foi preciso ajuda com água e alimentos ao mesmo tempo.","ch.IN.t":"Temporada de ciclones","ch.IN.f":"O ciclone Phailin (2013) afetou cerca de 13,2 milhões de pessoas em Odisha. Alertas precoces e abrigos limitaram as mortes a 44.","ch.IN.i":"A abordagem de “zero vítimas” de Odisha é hoje um modelo que a Índia compartilha com outros.","ch.IN.q":"Antes do ciclone Phailin, cerca de quantas pessoas Odisha levou para locais seguros?","ch.IN.a0":"10.000","ch.IN.a1":"100.000","ch.IN.a2":"Cerca de 1 milhão","ch.IN.w":"Cerca de 1 milhão de pessoas foram retiradas em umas 36 horas, uma das maiores evacuações já feitas.","ch.ID.t":"Enchentes urbanas","ch.ID.f":"Em 1º de janeiro de 2020 caíram 377 mm de chuva num único dia numa estação de Jacarta, o maior volume desde o início dos registros em 1866.","ch.ID.q":"Quanta chuva caiu num dia em Jacarta em 1º de janeiro de 2020?","ch.ID.a0":"37 mm","ch.ID.a1":"177 mm","ch.ID.a2":"377 mm","ch.ID.w":"377 mm num dia. É como a chuva de um mês inteiro em muitos lugares, de uma só vez.","ch.ZA.t":"Escassez de água","ch.ZA.f":"Em 2018 a Cidade do Cabo limitou cada pessoa a 50 litros de água por dia para evitar o “Dia Zero”, quando as torneiras seriam fechadas.","ch.ZA.q":"Em 2018, a Cidade do Cabo pediu que cada pessoa usasse no máximo quanta água por dia?","ch.ZA.a0":"50 litros","ch.ZA.a1":"150 litros","ch.ZA.a2":"500 litros","ch.ZA.w":"50 litros, mais ou menos um banho curto. As pessoas economizaram água juntas e o Dia Zero nunca chegou.","ch.BR.t":"Alerta de dengue","ch.BR.f":"2024 foi um ano recorde de dengue nas Américas, e o Brasil registrou o maior número de casos.","ch.BR.q":"A dengue é transmitida por mosquitos que se reproduzem em…","ch.BR.a0":"água parada","ch.BR.a1":"areia seca","ch.BR.a2":"neve fria","ch.BR.w":"Água parada em vasos, pneus e coolers. Esvaziá-los uma vez por semana ajuda todo mundo.","ch.IR.t":"Calor e estresse hídrico","ch.IR.f":"O Irã está entre os países com estresse hídrico de base “extremamente alto” no atlas Aqueduct do WRI.","ch.IR.q":"Os antigos canais subterrâneos de água do Irã se chamam…","ch.IR.a0":"qanats","ch.IR.a1":"canais","ch.IR.a2":"poços em degraus","ch.IR.w":"Os qanats levam água pela gravidade. Os poços em degraus da Índia são outra forma antiga e engenhosa de guardar água.","ch.RU.t":"Temporada de incêndios florestais","ch.RU.f":"A preparação para incêndios florestais foi um dos resultados de cooperação da presidência indiana do BRICS em 2026.","ch.RU.q":"O que mais ajuda nas primeiras horas de um incêndio florestal?","ch.RU.a0":"Detecção e alerta precoces","ch.RU.a1":"Esperar a chuva","ch.RU.a2":"Cortar mais árvores","ch.RU.w":"Detecção precoce: incêndios pequenos são muito mais fáceis de apagar.","ch.AE.t":"Interrupção na importação de alimentos","ch.AE.f":"Os EAU importam cerca de 90% dos alimentos. Sua Estratégia Nacional de Segurança Alimentar 2051 busca diversificar o abastecimento e produzir mais localmente.","ch.AE.q":"Mais ou menos quanto dos alimentos os EAU importam?","ch.AE.a0":"10%","ch.AE.a1":"50%","ch.AE.a2":"90%","ch.AE.w":"Cerca de 90%, por isso transporte e armazenamento sem falhas importam muito.","ch.CN.t":"Cheias de rios","ch.CN.f":"No verão de 2020, longas chuvas de monção causaram cheias graves em toda a bacia do Yangtzé.","ch.CN.q":"O Yangtzé é o rio mais longo de qual continente?","ch.CN.a0":"Ásia","ch.CN.a1":"África","ch.CN.a2":"Europa","ch.CN.w":"Ásia. Centenas de milhões de pessoas vivem na sua bacia.","ch.SA.t":"Enxurradas no deserto","ch.SA.f":"Em novembro de 2009, chuvas fortes e repentinas causaram enxurradas mortais em Jidá.","ch.SA.q":"Por que as enxurradas podem ser tão perigosas em cidades do deserto?","ch.SA.a0":"O solo duro e seco não absorve água depressa","ch.SA.a1":"Nunca chove no deserto","ch.SA.a2":"A areia faz a água sumir","ch.SA.w":"Solo seco e duro e poucos bueiros fazem a água correr pelas ruas muito depressa.","ch.EG.t":"Delta e nível do mar","ch.EG.f":"O baixo Delta do Nilo, onde fica boa parte das terras agrícolas do Egito, enfrenta a subida do nível do mar e a infiltração de água salgada no solo. Um projeto do Fundo Verde para o Clima apoia a adaptação costeira.","ch.EG.q":"O que mais ameaça as terras agrícolas baixas de um delta?","ch.EG.a0":"Subida do mar e água salgada","ch.EG.a1":"Árvores demais","ch.EG.a2":"Neve","ch.EG.w":"O mar mais alto empurra água salgada para o solo, o que dificulta produzir alimentos.","p.p-water.n":"Captação de água da chuva e reparo de reservatórios","p.p-food.n":"Armazenagem de grãos e cadeia de frio","p.p-health.n":"Capacidade de emergência em saúde e estoques de remédios","p.p-warn.n":"Alerta precoce de múltiplos riscos até a última milha","p.p-warn.note":"Um aviso de 24 horas sobre uma tempestade ou onda de calor pode reduzir os danos em cerca de 30% (Global Commission on Adaptation, 2019).","p.p-infra.n":"Drenagem e estradas resilientes ao clima","p.p-solar.n":"Energia solar e baterias para clínicas e abrigos","p.p-irrig.n":"Irrigação que poupa água","p.p-shelter.n":"Abrigos comunitários seguros contra enchentes","lv.school.name":"Escola","lv.school.age":"10–14","lv.school.blurb":"Sem derrota · dicas · carimbos de passaporte · quiz rápido","lv.college.name":"Faculdade","lv.college.age":"15–22","lv.college.blurb":"O quebra-cabeça completo do consenso","lv.expert.name":"Especialista","lv.expert.age":"Adultos","lv.expert.blurb":"4 rodadas · orçamento mais curto · necessidades não atendidas passam adiante","q.1.name":"Resiliência","q.1.o0":"Integração de dados de alerta precoce de múltiplos riscos","q.1.o1":"Princípios voluntários para infraestrutura urbana resiliente ao clima","q.1.o2":"Subgrupo de alerta precoce de doenças infecciosas","q.1.o3":"Preparação para incêndios florestais","q.1.o4":"Rede de centros de agroecologia e agricultura regenerativa","q.2.name":"Inovação","q.3.name":"Cooperação","q.4.name":"Sustentabilidade","strip.garib.n":"Garib","strip.garib.d":"os pobres","strip.yuva.n":"Yuva","strip.yuva.d":"jovens","strip.annadata.n":"Annadata","strip.annadata.d":"agricultores","strip.nari.n":"Nari","strip.nari.d":"mulheres","strip.real":"Real: a capacidade de energia não fóssil da Índia chegou a 300,5 GW (31 jul. 2026), rumo a 500 GW até 2030.","act.plan":"🗺️ Faça um plano de emergência da família: um ponto de encontro e telefones importantes escritos em papel","act.water":"💧 Economize água hoje: use um balde ou conserte uma torneira pingando com um adulto","act.alert":"📲 Com um adulto, descubra como sua região recebe alertas do tempo (por ex. a Defesa Civil ou, na Índia, NDMA “Sachet” e IMD)","act.kit":"🩹 Confiram juntos o kit de primeiros socorros de casa e anotem o que falta","act.tree":"🌳 Regue uma árvore ou plante algo na sua rua ou varanda","about.0":"O BRICS tem 10 membros confirmados: Brasil, Rússia, Índia, China, África do Sul, Egito, Etiópia, Irã, EAU e Indonésia. A Arábia Saudita foi convidada em 2023; a presidência indiana de 2026 a lista como membro, mas a Arábia Saudita não confirmou publicamente a adesão. Há também 10 países parceiros. O BRICS não tem tratado, orçamento nem secretariado permanente; as decisões são tomadas por consenso.","about.1":"A Índia preside o BRICS em 2026 (pela 4ª vez) com o tema “Construindo para Resiliência, Inovação, Cooperação e Sustentabilidade”. A 18ª Cúpula foi realizada em Nova Délhi em 12–13 de setembro de 2026.","about.2":"O Novo Banco de Desenvolvimento (Xangai, desde 2015) tem 10 membros: Brasil, Rússia, Índia, China, África do Sul, Bangladesh, EAU, Egito, Argélia e Uzbequistão. Ele associa cada projeto a metas dos ODS.","about.3":"“Não há, por enquanto, nenhuma proposta no BRICS de uma moeda do BRICS.” (MEA, setembro de 2026)","disc":"BRICS Bridges é um jogo educativo da Harpreet Raj Singh Games. Não é afiliado nem endossado pelo BRICS, pelo Ministério das Relações Exteriores da Índia, pelo Novo Banco de Desenvolvimento nem por nenhum governo. Os fatos são citados com datas. Forças e necessidades foram simplificadas para o jogo. Pontuações, Voz, foco e créditos são mecânicas de jogo, não avaliações de nenhum país.","saudi":"A Arábia Saudita foi convidada a entrar no BRICS em 2023. Fontes oficiais indianas e do BRICS, como o site da presidência indiana de 2026, a listam entre os membros. A Arábia Saudita não confirmou publicamente sua adesão e participou da cúpula de 2026 como país convidado. Este jogo a mostra como convidada: suas forças podem ajudar, mas ela não faz parte da verificação de consenso.","idx.1":"Índice de Resiliência","edition":"Primeira versão","firstBanner":"Você está jogando a primeira versão de BRICS Bridges.","playLatest":"Jogar a versão mais recente","done":"Concluído ✓","lockedQ":"Depois do Trimestre {n}","playQ":"Jogar o Trimestre {n} · {q}","contQ":"Continuar o Trimestre {q} · Rodada {n}","qDone":"Trimestre {n} concluído","idx.2":"Índice de inovação","idx.3":"Índice de cooperação","idx.4":"Índice de sustentabilidade","idxTip":"{i} (mecânica do jogo)","agendaQ":"A agenda real de 2026 para {q}","realAgreedQ":"O que a presidência real de 2026 acordou sobre {q}","agendaSrcNdd":"Da Declaração de Nova Délhi dos líderes do BRICS (12 de setembro de 2026). ¶ = número do parágrafo.","doneTodayQ":"Você concluiu o Trimestre {n} hoje. {next} Você pode jogar de novo qualquer trimestre aberto, mas a vida real também está chamando 🌿","nextQN":"Próximo: o Trimestre {n} · {q} {e} abre amanhã. Pular dias não tem problema: nada se perde.","nextYear":"Esse foi o último trimestre do ano. O resumo do seu ano compara suas escolhas com o que o BRICS realmente acordou.","doneLineQ":"Você construiu {b} pontes e chegou a {r} no {i}.","tagline.1":"A resiliência começa em casa.","tagline.2":"Toda ideia nova começa com curiosidade.","tagline.3":"A cooperação começa com uma mão estendida.","tagline.4":"Um futuro sustentável começa com pequenos hábitos diários.","howTwist":"Os Trimestres 2, 3 e 4 acrescentam, cada um, uma regra extra a esses passos. Ela é explicada no início do trimestre.","tw.joint.name":"Regra extra: chamada de pesquisa conjunta","tw.joint.rule":"Escolha pontos fortes de pelo menos {cap} membros diferentes e a equipe ganha 1 ponto de necessidade bônus.","tw.joint.expert":"Especialista: os três pontos fortes precisam atender a uma necessidade.","tw.joint.on":"🔬 Bônus de pesquisa conjunta: +1","tw.joint.off":"🔬 Bônus de pesquisa conjunta: pontos fortes de {n} de 3 membros até agora","tw.cofi.name":"Regra extra: cofinanciamento","tw.cofi.rule":"Cada membro diferente que empresta um ponto forte cofinancia 1 crédito do projeto (até {cap} neste nível). Créditos são unidades do jogo, não dinheiro.","tw.cofi.live":"🏦 Os ajudantes vão cofinanciar {n} crédito(s) de um projeto (até {cap})","tw.cofi.share":"Cofinanciado pelos ajudantes: −{n} ◆","tw.lasting.name":"Regra extra: bens duradouros","tw.lasting.rule":"Os projetos que você adota continuam ajudando: nas rodadas seguintes deste trimestre, eles somam +1 às necessidades correspondentes (até {cap} por rodada neste nível).","tw.lasting.on":"🏛️ Projetos duradouros somam +{n} nesta rodada","tw.lasting.none":"🏛️ Ainda não há projetos duradouros: um adotado agora ajuda nas próximas rodadas.","tw.lasting.added":"Este projeto agora é um bem duradouro e vai ajudar nas próximas rodadas.","gwBar":"{now} de {goal} GW (real)","passLink":"🛂 Passaporte","passTitle":"Seu passaporte do BRICS","passEmpty":"Jogue um trimestre para ganhar carimbos no passaporte.","passNone":"Ainda sem carimbos","passQ":"{e} Trimestre {n}","yearBtn":"📜 Seu ano em revisão","yearTitle":"Seu ano na presidência","yearSub":"Seus quatro trimestres, lado a lado com o que o BRICS realmente acordou na Declaração de Nova Délhi.","yearYou":"No seu jogo","yearReal":"Na vida real (2026)","yearNotPlayed":"Ainda não jogado.","yearStats":"Necessidades atendidas por completo: {m}/{t} · pontes: {b}","yearProj":"Projetos adotados:","yearNone":"Nenhum projeto adotado.","yearTw.joint":"Bônus de pesquisa conjunta: {n}","yearTw.cofi":"Créditos cofinanciados pelos ajudantes: {n}","yearTw.lasting":"Pontos de projetos duradouros: {n}","yearProposals":"Ainda são propostas, não decisões","yearProposalsNote":"Essas ideias foram discutidas em 2026, mas não decididas. Um jogo pode testar uma ideia; só governos podem chegar a um acordo sobre ela.","yearNote":"Os projetos e pontos do jogo são mecânicas simplificadas. Os resultados reais são acordos entre governos, muitas vezes voluntários, e levam anos para serem implementados.","yearBack":"Voltar à tela inicial","rampNote":"O ano fica mais intenso: neste nível, cada desafio deste trimestre precisa de 1 ponto a mais.","tag.digital":"Digital","tag.skills":"Habilidades","tag.trade":"Laços comerciais","tag.nature":"Natureza","c.BRd.t":"Pagamentos instantâneos Pix","c.BRd.f":"O Banco Central do Brasil lançou o Pix, um sistema gratuito de pagamentos instantâneos, em novembro de 2020. Em 2025 ele tinha mais de 170 milhões de usuários.","c.RUd.t":"Navegação por satélite GLONASS","c.RUd.f":"A Rússia opera o GLONASS, um dos quatro sistemas globais de navegação por satélite do mundo, com cobertura global completa desde 2011.","c.INd.t":"UPI e infraestrutura pública digital","c.INd.f":"O UPI da Índia permite que qualquer pessoa envie dinheiro na hora pelo celular. Em 2025, processou mais de 20 bilhões de pagamentos em um único mês.","c.CNs.t":"Patentes e laboratórios de pesquisa","c.CNs.f":"A China recebe mais pedidos de patente do que qualquer outro país: cerca de 1,6 milhão em 2023.","c.ZAs.t":"Radioastronomia (MeerKAT)","c.ZAs.f":"O MeerKAT da África do Sul, com 64 antenas de rádio no Karoo, é um precursor do radiotelescópio Square Kilometre Array, que a África do Sul sedia junto com a Austrália.","c.EGs.t":"Banco do Conhecimento Egípcio","c.EGs.f":"O Banco do Conhecimento Egípcio, lançado em 2016, dá a todos no Egito acesso on-line gratuito a revistas científicas e materiais de estudo.","c.IRs.t":"Pesquisa em fertilidade e células-tronco","c.IRs.f":"O Instituto Royan, do Irã, fundado em 1991, é conhecido por pesquisas sobre tratamento de fertilidade e células-tronco.","c.AEs.t":"Missão Hope a Marte","c.AEs.f":"A sonda Hope, dos Emirados Árabes Unidos, entrou na órbita de Marte em fevereiro de 2021, a primeira missão interplanetária de um país árabe.","c.IDd.t":"QRIS: um QR code para todos","c.IDd.f":"O QRIS da Indonésia, lançado pelo Bank Indonesia em 2019, permite que qualquer loja receba pagamentos de qualquer aplicativo com um único QR code padrão.","c.SAs.t":"Universidade de pesquisa (KAUST)","c.SAs.f":"A Universidade de Ciência e Tecnologia Rei Abdullah (KAUST), aberta em 2009, pesquisa dessalinização, energia solar e ciências do Mar Vermelho.","c.INt.t":"Parcerias de capacitação ITEC","c.INt.f":"Desde 1964, o programa ITEC da Índia capacitou mais de 200 mil servidores e profissionais de cerca de 160 países parceiros.","c.ZAt.t":"Porto de Durban","c.ZAt.f":"Durban é um dos portos de contêineres mais movimentados da África e uma porta de entrada para o comércio do sul do continente.","c.IRt.t":"Corredor de Transporte Norte–Sul","c.IRt.f":"Em 2000, Irã, Índia e Rússia concordaram em construir o Corredor Internacional de Transporte Norte–Sul, uma rota por navio, trem e estrada que liga o Oceano Índico à Rússia.","c.IDt.t":"Polo comercial regional (ASEAN)","c.IDt.f":"A Indonésia é membro fundador da ASEAN (1967), e Jacarta abriga o Secretariado da ASEAN.","c.INe.t":"Aliança Solar Internacional","c.INe.f":"Índia e França lançaram a Aliança Solar Internacional em 2015. Ela tem sede em Gurugram e mais de 100 países signatários.","c.BRn.t":"Monitoramento de florestas por satélite","c.BRn.f":"O INPE, instituto brasileiro de pesquisas espaciais, mede o desmatamento da Amazônia por satélite todos os anos desde 1988 (projeto PRODES).","c.RUn.t":"As maiores florestas do mundo","c.RUn.f":"A Rússia tem a maior área florestal de todos os países, cerca de um quinto de todas as florestas do mundo.","c.CNe.t":"Ônibus elétricos urbanos","c.CNe.f":"Em 2017, Shenzhen se tornou a primeira grande cidade a operar toda a sua frota de ônibus públicos, mais de 16 mil ônibus, com eletricidade.","c.ZAe.t":"Leilões de energia renovável","c.ZAe.f":"Desde 2011, o programa de leilões de energia renovável da África do Sul (REIPPPP) conectou à rede usinas eólicas e solares construídas pelo setor privado.","ch.c2-IN.t":"Muitas línguas na internet","ch.c2-IN.f":"A Constituição da Índia lista 22 línguas no seu Oitavo Anexo. A missão Bhashini desenvolve tradução por IA para que as pessoas usem serviços digitais na própria língua.","ch.c2-IN.i":"Na Cúpula de Impacto da IA, em fevereiro de 2026, a Índia recebeu líderes para discutir IA para todos (Declaração de Nova Délhi ¶81).","ch.c2-IN.q":"Quantas línguas estão no Oitavo Anexo da Constituição da Índia?","ch.c2-IN.w":"22. Ferramentas digitais que funcionam em todas as línguas ajudam todos a entrar na internet.","ch.c2-BR.t":"Prontuários de saúde para 200 milhões","ch.c2-BR.f":"O sistema público de saúde do Brasil, o SUS, oferece atendimento gratuito a todos no país, cerca de 200 milhões de pessoas.","ch.c2-BR.q":"Como um prontuário digital compartilhado ajuda?","ch.c2-BR.a0":"Os médicos veem exames e remédios anteriores","ch.c2-BR.a1":"Os hospitais ficam maiores","ch.c2-BR.a2":"Ninguém precisa de médico","ch.c2-BR.w":"Os médicos veem seu histórico rápido, então o atendimento é mais seguro e nada é repetido.","ch.c2-RU.t":"Cidades distantes de hospitais","ch.c2-RU.f":"A Rússia abrange 11 fusos horários, por isso muitas cidades ficam a milhares de quilômetros de grandes hospitais.","ch.c2-RU.q":"Quantos fusos horários a Rússia abrange?","ch.c2-RU.w":"11. A telemedicina permite que um especialista distante ajude uma clínica local.","ch.c2-ZA.t":"Habilidades para o primeiro emprego","ch.c2-ZA.f":"Em 2024, cerca de 6 em cada 10 jovens sul-africanos de 15 a 24 anos que procuravam trabalho não conseguiam emprego.","ch.c2-ZA.q":"O que mais ajuda um jovem a conseguir o primeiro emprego?","ch.c2-ZA.a0":"Habilidades, formação e uma primeira chance","ch.c2-ZA.a1":"Esperar em casa","ch.c2-ZA.a2":"Só sorte","ch.c2-ZA.w":"Habilidades mais uma primeira chance, como aprendizagem ou estágio.","ch.c2-ET.t":"Dinheiro no celular para agricultores","ch.c2-ET.f":"A Ethio Telecom lançou o serviço de dinheiro móvel telebirr em maio de 2021, para que pessoas longe de bancos possam pagar e poupar pelo celular.","ch.c2-ET.q":"Por que o dinheiro móvel ajuda agricultores que vivem longe de bancos?","ch.c2-ET.a0":"Eles podem receber e poupar pelo celular","ch.c2-ET.a1":"Celulares fazem a lavoura crescer","ch.c2-ET.a2":"Ele traz chuva","ch.c2-ET.w":"O celular vira uma conta bancária, então o agricultor não viaja horas para receber.","ch.c2-IR.t":"Alertas de qualidade do ar","ch.c2-IR.f":"Teerã fica numa bacia cercada de montanhas, onde a poluição do ar no inverno já fechou escolas em alguns dias.","ch.c2-IR.q":"O que ajuda as pessoas a se protegerem em dias de ar ruim?","ch.c2-IR.a0":"Alertas de qualidade do ar em tempo real","ch.c2-IR.a1":"Buzinas mais altas","ch.c2-IR.a2":"Mais poeira","ch.c2-IR.w":"Alertas em tempo real dizem quando ficar em casa ou usar máscara.","ch.c2-ID.t":"17 mil ilhas para conectar","ch.c2-ID.f":"A Indonésia tem mais de 17 mil ilhas. Sua rede de fibra óptica Palapa Ring, concluída em 2019, liga todas as províncias.","ch.c2-ID.q":"Mais ou menos quantas ilhas a Indonésia tem?","ch.c2-ID.a1":"1.700","ch.c2-ID.a2":"Mais de 17 mil","ch.c2-ID.w":"Mais de 17 mil, então conectar todas é uma tarefa enorme.","ch.c3-RU.t":"Levar cargas por 9 mil km","ch.c3-RU.f":"A Ferrovia Transiberiana, com cerca de 9.289 km de Moscou a Vladivostok, é a linha ferroviária mais longa do mundo.","ch.c3-RU.q":"Qual é o comprimento aproximado da Transiberiana?","ch.c3-RU.a0":"900 km","ch.c3-RU.a1":"9.289 km","ch.c3-RU.a2":"29.000 km","ch.c3-RU.w":"Cerca de 9.289 km, atravessando 8 fusos horários.","ch.c3-IN.t":"Pequenas empresas no mundo","ch.c3-IN.f":"Em 2026, os líderes do BRICS observaram que o acesso a crédito acessível é o principal gargalo das micro, pequenas e médias empresas (MPMEs).","ch.c3-IN.i":"A Índia realizou o primeiro Fórum de PMEs do BRICS em Agra, em 2026 (Declaração de Nova Délhi ¶71).","ch.c3-IN.q":"O que significa a sigla MPME (em inglês, MSME)?","ch.c3-IN.a0":"Micro, pequenas e médias empresas","ch.c3-IN.a1":"Muitos pequenos motores de máquinas","ch.c3-IN.a2":"Mercados para principiantes","ch.c3-IN.w":"Micro, pequenas e médias empresas: oficinas, lojas e pequenas fábricas.","ch.c3-CN.t":"Alta no preço dos fertilizantes","ch.c3-CN.f":"Em 2022, os preços mundiais dos fertilizantes bateram recordes, aumentando os custos dos agricultores em toda parte. A China é o maior usuário de fertilizantes do mundo.","ch.c3-CN.q":"Por que o preço dos fertilizantes importa para todos?","ch.c3-CN.a0":"Ele muda o custo de produzir alimentos","ch.c3-CN.a1":"Ele muda o clima","ch.c3-CN.a2":"Só importa para fábricas","ch.c3-CN.w":"Fertilizante mais caro significa comida mais cara para todas as famílias.","ch.c3-EG.t":"Pão e importação de trigo","ch.c3-EG.f":"O Egito é um dos maiores importadores de trigo do mundo, e o pão é central nas refeições diárias.","ch.c3-EG.q":"Qual cultura é o principal ingrediente da maioria dos pães?","ch.c3-EG.a0":"Trigo","ch.c3-EG.a1":"Algodão","ch.c3-EG.a2":"Chá","ch.c3-EG.w":"Trigo. Comércio fluido e bom armazenamento mantêm o pão acessível.","ch.c3-ET.t":"Comércio sem litoral","ch.c3-ET.f":"A Etiópia não tem saída para o mar. A maior parte do seu comércio marítimo passa pelo porto de Djibuti.","ch.c3-ET.q":"O que significa “sem saída para o mar”?","ch.c3-ET.a0":"Não ter litoral","ch.c3-ET.a1":"Não ter rios","ch.c3-ET.a2":"Não ter montanhas","ch.c3-ET.w":"Não ter litoral, então as mercadorias precisam atravessar um vizinho para chegar a um porto.","ch.c3-IR.t":"Levar o açafrão ao mercado","ch.c3-IR.f":"O Irã produz a maior parte do açafrão do mundo, uma especiaria cara colhida à mão das flores de crocus.","ch.c3-IR.q":"De que parte da flor de crocus vem o açafrão?","ch.c3-IR.a0":"Dos seus finos estigmas vermelhos","ch.c3-IR.a1":"Das raízes","ch.c3-IR.a2":"Das folhas","ch.c3-IR.w":"Dos finos estigmas vermelhos, colhidos à mão. A Caxemira também produz açafrão.","ch.c3-AE.t":"Muitas nacionalidades, uma força de trabalho","ch.c3-AE.f":"Pessoas de cerca de 200 nacionalidades vivem e trabalham nos Emirados Árabes Unidos.","ch.c3-AE.q":"Por que reconhecer habilidades entre países ajuda os trabalhadores?","ch.c3-AE.a0":"A formação deles vale onde quer que trabalhem","ch.c3-AE.a1":"Fica mais difícil conseguir emprego","ch.c3-AE.a2":"Interrompe o comércio","ch.c3-AE.w":"Um certificado reconhecido no exterior permite que um trabalhador qualificado continue no seu nível.","ch.c4-BR.t":"Pastagens degradadas","ch.c4-BR.f":"Em 2023, o Brasil lançou um programa para recuperar até 40 milhões de hectares de pastagens degradadas para agricultura e florestas.","ch.c4-BR.q":"Recuperar terras degradadas ajuda a…","ch.c4-BR.a0":"produzir alimentos sem desmatar","ch.c4-BR.a1":"criar desertos","ch.c4-BR.a2":"elevar o nível do mar","ch.c4-BR.w":"Terra saudável produz mais alimento, então as florestas podem continuar de pé.","ch.c4-CN.t":"Tempestades de areia e poeira","ch.c4-CN.f":"Tempestades de areia e poeira atingem o norte da China na maioria das primaveras. Desde 1978, o programa Cinturão de Proteção dos Três Nortes planta árvores para conter o deserto.","ch.c4-CN.q":"O que ajuda a segurar a areia no lugar?","ch.c4-CN.a0":"Raízes de árvores e gramíneas","ch.c4-CN.a1":"Vento seco","ch.c4-CN.a2":"Solo descoberto","ch.c4-CN.w":"As raízes seguram o solo. O projeto indiano Muralha Verde de Aravalli usa a mesma ideia.","ch.c4-ZA.t":"Cortes de energia em rodízio","ch.c4-ZA.f":"A África do Sul teve cortes de energia em rodízio, chamados load-shedding, na maioria dos dias de 2023.","ch.c4-ZA.q":"O que uma grande bateria faz por uma rede elétrica?","ch.c4-ZA.a0":"Armazena energia até ela ser necessária","ch.c4-ZA.a1":"Produz carvão","ch.c4-ZA.a2":"Esfria o sol","ch.c4-ZA.w":"Ela guarda energia solar e eólica para o pico da noite.","ch.c4-EG.t":"Abaixo da linha de escassez de água","ch.c4-EG.f":"O Egito tem menos água doce renovável por pessoa do que os 1.000 metros cúbicos por ano muitas vezes usados como linha de escassez hídrica.","ch.c4-EG.q":"Qual forma de irrigar plantações economiza mais água?","ch.c4-EG.a0":"Irrigação por gotejamento","ch.c4-EG.a1":"Inundar os campos","ch.c4-EG.a2":"Regar ao meio-dia","ch.c4-EG.w":"O gotejamento leva a água direto às raízes, muitas vezes economizando um terço ou mais.","ch.c4-AE.t":"Refrigeração no calor extremo","ch.c4-AE.f":"No verão, as temperaturas nos Emirados muitas vezes passam de 45 °C, então a refrigeração consome boa parte da eletricidade. Os Emirados sediaram a conferência do clima COP28 em 2023.","ch.c4-AE.q":"O que mantém um prédio fresco gastando menos energia?","ch.c4-AE.a0":"Sombra, isolamento e refrigeração eficiente","ch.c4-AE.a1":"Deixar as portas abertas","ch.c4-AE.a2":"Telhados escuros","ch.c4-AE.w":"Sombra, isolamento e telhados claros reduzem a refrigeração necessária.","ch.c4-ID.t":"Manguezais desaparecendo","ch.c4-ID.f":"A Indonésia tem os maiores manguezais do mundo, cerca de um quinto do total mundial, e um programa nacional para recuperá-los.","ch.c4-ID.q":"Como os manguezais protegem o litoral?","ch.c4-ID.a0":"Suas raízes freiam as ondas e seguram o solo","ch.c4-ID.a1":"Eles atraem tempestades","ch.c4-ID.a2":"Eles derretem o gelo","ch.c4-ID.w":"Suas raízes entrelaçadas acalmam as ondas e abrigam peixes jovens.","p.p-dpi.n":"Piloto aberto de infraestrutura pública digital","p.p-tele.n":"Rede de telemedicina para clínicas remotas","p.p-skill.n":"Academias de habilidades digitais","p.p-lab.n":"Laboratório de pesquisa conjunto e bolsas","p.p-agri.n":"Serviço digital de assistência técnica rural","p.p-sensor.n":"Rede aberta de sensores e app de alertas","p.p-corr.n":"Melhoria logística do corredor comercial","p.p-std.n":"Normas e laboratórios de testes compartilhados","p.p-seed.n":"Rede de informações sobre sementes e insumos","p.p-msme.n":"Balcão de apoio ao comércio para MPMEs (digital)","p.p-exch.n":"Programa de intercâmbio profissional","p.p-cold.n":"Câmaras frias compartilhadas nas fronteiras","p.p-grid.n":"Rede inteligente e baterias","p.p-roof.n":"Energia solar nos telhados de escolas e clínicas","p.p-restore.n":"Restauração de terras e florestas","p.p-mangr.n":"Restauração de manguezais e áreas úmidas","p.p-reuse.n":"Estação de reúso de água","p.p-green.n":"Capacitação para empregos verdes","q.2.o0":"Criada a Rede de Incubadoras do BRICS","q.2.o1":"Programa-Quadro de CTI faz 10 anos: primeira Chamada de Inovação e 7ª chamada de pesquisa","q.2.o2":"Consenso de Chennai dos ministros de ciência","q.2.o3":"Compêndio sobre arquitetura de saúde digital, incluindo atendimento em áreas remotas","q.2.o4":"Rede BRICS de Agricultura Digital","q.3.o0":"Acordada a rede AGRIN d д циклоном «Пайлин» (2013) Одиша переселила в убежища около 1 млн человек. Погибли 44 человека, а во время суперциклона 1999 года — около 10 000.","c.CN1.t":"Производство солнечных панелей","c.CN1.f":"Доля Китая на каждом основном этапе производства солнечных фотоэлектрических панелей превышает 80%, что сильно удешевило панели во всём мире.","c.CN2.t":"Железные дороги и большие стройки","c.CN2.f":"К декабрю 2025 года сеть высокоскоростных железных дорог Китая превысила 50 000 км — больше, чем во всём остальном мире вместе взятом.","c.ZA1.t":"Программы общественного здравоохранения","c.ZA1.f":"В ЮАР действует крупнейшая в мире программа лечения ВИЧ: в 2024 году антиретровирусную терапию получали около 6,3 млн человек.","c.ZA2.t":"Умение экономить воду","c.ZA2.f":"Во время засухи 2018 года Кейптаун сократил потребление воды более чем вдвое, примерно с 1,2 млрд до 0,5 млрд литров в день, и избежал «Дня ноль».","c.EG1.t":"Судоходство по Суэцкому каналу","c.EG1.f":"Около 12% мировой торговли, включая зерно и удобрения, проходит через Суэцкий канал в Египте.","c.EG2.t":"Солнечные парки в пустыне","c.EG2.f":"Солнечный парк Бенбан в Египте, около Асуана, мощностью около 1,65 ГВт — один из крупнейших в мире.","c.ET1.t":"Посадка деревьев «Зелёное наследие»","c.ET1.f":"По данным эфиопской инициативы «Зелёное наследие», с 2019 года посажено более 48 млрд саженцев для восстановления земель и водосборов.","c.ET2.t":"Гуманитарный авиахаб","c.ET2.f":"В 2020 году авиахаб в Аддис-Абебе, работавший со Всемирной продовольственной программой ООН и Ethiopian Airlines, доставил грузы против COVID-19 во все 54 страны Африки.","c.IR1.t":"Водная инженерия канатов","c.IR1.f":"Иранские канаты — древние подземные каналы, по которым вода течёт самотёком. Персидский канат — объект Всемирного наследия ЮНЕСКО (2016).","c.IR2.t":"Сейсмостойкое строительство","c.IR2.f":"Иранский Международный институт сейсмостойкого строительства и сейсмологии (IIEES, основан в 1989 году) изучает безопасные здания и мониторинг землетрясений.","c.SA1.t":"Опреснение в больших масштабах","c.SA1.f":"Саудовская Аравия — крупнейший в мире производитель опреснённой воды: более 16 млн кубометров в сутки.","c.SA2.t":"Крупные солнечные станции","c.SA2.f":"Солнечная станция Судаир мощностью 1,5 ГВт работает на полную мощность с января 2024 года.","c.AE1.t":"Чистая атомная энергия","c.AE1.f":"АЭС «Барака» в ОАЭ даёт около четверти электроэнергии страны.","c.AE2.t":"Хаб гуманитарной логистики","c.AE2.f":"Dubai Humanitarian, ранее International Humanitarian City, называет себя крупнейшим гуманитарным хабом в мире: около 80 участников из ООН, НКО и других организаций.","c.ID1.t":"Раннее оповещение о цунами","c.ID1.f":"Индонезийская система InaTEWS, запущенная в 2008 году, может выпустить предупреждение о цунами примерно через 5 минут после сильного землетрясения.","c.ID2.t":"Геотермальная энергия","c.ID2.f":"У Индонезии вторая в мире геотермальная мощность — около 2744 МВт.","ch.ET.t":"Долгая засуха","ch.ET.f":"С конца 2020 по 2022 год на Африканском Роге, включая Эфиопию, пять сезонов дождей подряд не принесли дождей.","ch.ET.q":"Сколько сезонов дождей подряд провалилось во время засухи на Африканском Роге?","ch.ET.a0":"2","ch.ET.a1":"3","ch.ET.a2":"5","ch.ET.w":"Пять сезонов, с конца 2020 по 2022 год. Поэтому помощь водой и едой была нужна одновременно.","ch.IN.t":"Сезон циклонов","ch.IN.f":"Циклон «Пайлин» (2013) затронул около 13,2 млн человек в Одише. Благодаря раннему оповещению и убежищам число погибших удалось ограничить 44.","ch.IN.i":"Подход Одиши «ноль жертв» стал моделью, которой Индия делится с другими.","ch.IN.q":"Сколько примерно людей Одиша вывела в безопасные места перед циклоном «Пайлин»?","ch.IN.a0":"10 000","ch.IN.a1":"100 000","ch.IN.a2":"Около 1 млн","ch.IN.w":"Около 1 млн человек примерно за 36 часов — одна из крупнейших эвакуаций в истории.","ch.ID.t":"Городские наводнения","ch.ID.f":"1 января 2020 года на одной из станций Джакарты за сутки выпало 377 мм осадков — больше всего с начала наблюдений в 1866 году.","ch.ID.q":"Сколько осадков выпало за сутки в Джакарте 1 января 2020 года?","ch.ID.a0":"37 мм","ch.ID.a1":"177 мм","ch.ID.a2":"377 мм","ch.ID.w":"377 мм за сутки. Во многих местах это месячная норма, и вся сразу.","ch.ZA.t":"Нехватка воды","ch.ZA.f":"В 2018 году Кейптаун ограничил каждого жителя 50 литрами воды в день, чтобы избежать «Дня ноль», когда краны отключили бы.","ch.ZA.q":"Сколько воды в день максимум просили расходовать каждого жителя Кейптауна в 2018 году?","ch.ZA.a0":"50 литров","ch.ZA.a1":"150 литров","ch.ZA.a2":"500 литров","ch.ZA.w":"50 литров — примерно один короткий душ. Люди экономили воду вместе, и «День ноль» так и не наступил.","ch.BR.t":"Тревога: денге","ch.BR.f":"2024 год стал рекордным по денге в Америке, и больше всего случаев зафиксировала Бразилия.","ch.BR.q":"Денге переносят комары, которые размножаются в…","ch.BR.a0":"стоячей воде","ch.BR.a1":"сухом песке","ch.BR.a2":"холодном снегу","ch.BR.w":"Стоячая вода в горшках, шинах и охладителях. Если раз в неделю её выливать, это помогает всем.","ch.IR.t":"Жара и водный стресс","ch.IR.f":"В атласе Aqueduct института WRI Иран входит в число стран с «чрезвычайно высоким» базовым водным стрессом.","ch.IR.q":"Древние подземные водоводы Ирана называются…","ch.IR.a0":"канаты","ch.IR.a1":"каналы","ch.IR.a2":"ступенчатые колодцы","ch.IR.w":"Канаты ведут воду самотёком. Ступенчатые колодцы Индии — ещё один старинный и умный способ хранить воду.","ch.RU.t":"Сезон лесных пожаров","ch.RU.f":"Готовность к лесным пожарам стала одним из итогов сотрудничества при председательстве Индии в БРИКС в 2026 году.","ch.RU.q":"Что помогает больше всего в первые часы лесного пожара?","ch.RU.a0":"Раннее обнаружение и оповещение","ch.RU.a1":"Ждать дождя","ch.RU.a2":"Рубить больше деревьев","ch.RU.w":"Раннее обнаружение: маленький пожар остановить гораздо легче.","ch.AE.t":"Сбой импорта продовольствия","ch.AE.f":"ОАЭ импортируют около 90% продовольствия. Национальная стратегия продовольственной безопасности 2051 нацелена на разнообразие поставок и рост местного производства.","ch.AE.q":"Какую примерно долю продовольствия импортируют ОАЭ?","ch.AE.a0":"10%","ch.AE.a1":"50%","ch.AE.a2":"90%","ch.AE.w":"Около 90%, поэтому бесперебойные перевозки и хранение очень важны.","ch.CN.t":"Речные наводнения","ch.CN.f":"Летом 2020 года долгие муссонные дожди вызвали сильные наводнения во всём бассейне Янцзы.","ch.CN.q":"Янцзы — самая длинная река какого континента?","ch.CN.a0":"Азии","ch.CN.a1":"Африки","ch.CN.a2":"Европы","ch.CN.w":"Азии. В её бассейне живут сотни миллионов людей.","ch.SA.t":"Внезапные паводки в пустыне","ch.SA.f":"В ноябре 2009 года внезапный сильный ливень вызвал смертоносные паводки в Джидде.","ch.SA.q":"Почему внезапные паводки так опасны в пустынных городах?","ch.SA.a0":"Твёрдая сухая земля не успевает впитать воду","ch.SA.a1":"В пустыне никогда не бывает дождей","ch.SA.a2":"Песок заставляет воду исчезать","ch.SA.w":"Сухая твёрдая земля и мало ливнёвок — и вода очень быстро несётся по улицам.","ch.EG.t":"Дельта и уровень моря","ch.EG.f":"Низменной дельте Нила, где находится большая часть сельхозугодий Египта, угрожают подъём уровня моря и проникновение солёной воды в почву. Проект Зелёного климатического фонда поддерживает адаптацию побережья.","ch.EG.q":"Что больше всего угрожает низменным сельхозугодьям в дельте?","ch.EG.a0":"Подъём моря и солёная вода","ch.EG.a1":"Слишком много деревьев","ch.EG.a2":"Снегопад","ch.EG.w":"Поднимающееся море загоняет солёную воду в почву, и выращивать еду становится труднее.","p.p-water.n":"Сбор дождевой воды и ремонт водохранилищ","p.p-food.n":"Хранение зерна и холодовая цепь","p.p-health.n":"Резервы здравоохранения и запасы лекарств","p.p-warn.n":"Многоугрозовое раннее оповещение до каждого дома","p.p-warn.note":"Предупреждение о шторме или жаре за 24 часа может снизить ущерб примерно на 30% (Global Commission on Adaptation, 2019).","p.p-infra.n":"Климатически устойчивые дренаж и дороги","p.p-solar.n":"Солнечная энергия и накопители для клиник и убежищ","p.p-irrig.n":"Водосберегающее орошение","p.p-shelter.n":"Защищённые от наводнений общественные убежища","lv.school.name":"Школа","lv.school.age":"10–14","lv.school.blurb":"Проиграть нельзя · подсказки · штампы в паспорте · мини-викторина","lv.college.name":"Колледж","lv.college.age":"15–22","lv.college.blurb":"Полная головоломка консенсуса","lv.expert.name":"Эксперт","lv.expert.age":"Взрослые","lv.expert.blurb":"4 хода · бюджет меньше · незакрытые нужды переносятся","q.1.name":"Устойчивость","q.1.o0":"Интеграция данных многоугрозового раннего оповещения","q.1.o1":"Добровольные принципы климатически устойчивой городской инфраструктуры","q.1.o2":"Подгруппа по раннему оповещению об инфекционных болезнях","q.1.o3":"Готовность к лесным пожарам","q.1.o4":"Сеть центров агроэкологии и регенеративного сельского хозяйства","q.2.name":"Инновации","q.3.name":"Сотрудничество","q.4.name":"Устойчивое развитие","strip.garib.n":"Гариб","strip.garib.d":"бедные","strip.yuva.n":"Юва","strip.yuva.d":"молодёжь","strip.annadata.n":"Аннадата","strip.annadata.d":"фермеры","strip.nari.n":"Нари","strip.nari.d":"женщины","strip.real":"Реальность: неископаемые энергомощности Индии достигли 300,5 ГВт (31 июля 2026), на пути к 500 ГВт к 2030 году.","act.plan":"🗺️ Составьте семейный план на случай ЧС: место встречи и важные номера телефонов на бумаге","act.water":"💧 Сэкономьте воду сегодня: используйте ведро или почините капающий кран вместе со взрослым","act.alert":"📲 Вместе со взрослым узнайте, как в вашем районе приходят предупреждения о погоде (например, от МЧС; в Индии — NDMA «Sachet», IMD)","act.kit":"🩹 Проверьте вместе домашнюю аптечку и запишите, чего не хватает","act.tree":"🌳 Полейте дерево или посадите что-нибудь на своей улице или балконе","about.0":"У БРИКС 10 подтверждённых членов: Бразилия, Россия, Индия, Китай, ЮАР, Египет, Эфиопия, Иран, ОАЭ и Индонезия. Саудовская Аравия была приглашена в 2023 году; индийское председательство 2026 года указывает её как члена, но Саудовская Аравия публично не подтвердила членство. Есть также 10 стран-партнёров. У БРИКС нет договора, бюджета и постоянного секретариата; решения принимаются консенсусом.","about.1":"В 2026 году Индия председательствует в БРИКС (в 4-й раз) под девизом «Строим ради устойчивости, инноваций, сотрудничества и устойчивого развития». 18-й саммит прошёл в Нью-Дели 12–13 сентября 2026 года.","about.2":"У Нового банка развития (Шанхай, с 2015 года) 10 членов: Бразилия, Россия, Индия, Китай, ЮАР, Бангладеш, ОАЭ, Египет, Алжир и Узбекистан. Каждый проект он связывает с целями ЦУР.","about.3":"«В БРИКС пока нет предложения о валюте БРИКС». (МИД Индии, сентябрь 2026)","disc":"BRICS Bridges — обучающая игра от Harpreet Raj Singh Games. Она не связана с БРИКС, МИД Индии, Новым банком развития или каким-либо правительством и не одобрена ими. Факты приводятся с датами. Сильные стороны и нужды упрощены для игры. Очки, Голос, фокус и кредиты — игровые механики, а не оценки какой-либо страны.","saudi":"Саудовская Аравия получила приглашение вступить в БРИКС в 2023 году. Официальные источники Индии и БРИКС, например сайт индийского председательства 2026 года, указывают её среди членов. Саудовская Аравия публично не подтвердила своё членство и участвовала в саммите 2026 года как приглашённая страна. В игре она показана как приглашённый гость: её сильные стороны могут помочь, но она не участвует в проверке консенсуса.","idx.1":"Индекс устойчивости","edition":"Первая версия","firstBanner":"Вы играете в первую версию BRICS Bridges.","playLatest":"Играть в новейшую версию","done":"Пройден ✓","lockedQ":"После квартала {n}","playQ":"Играть: квартал {n} · {q}","contQ":"Продолжить квартал {q} · ход {n}","qDone":"Квартал {n} пройден","idx.2":"Индекс инноваций","idx.3":"Индекс сотрудничества","idx.4":"Индекс устойчивости","idxTip":"{i} (игровая механика)","agendaQ":"Реальная повестка 2026 года: {q}","realAgreedQ":"О чём реально договорились в 2026 году:
