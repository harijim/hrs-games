тема UPI позволяет любому мгновенно переводить деньги с телефона. В 2025 году она провела более 20 млрд платежей за один месяц.","c.CNs.t":"Патенты и исследовательские лаборатории","c.CNs.f":"Китай получает больше патентных заявок, чем любая другая страна: около 1,6 млн в 2023 году.","c.ZAs.t":"Радиоастрономия (MeerKAT)","c.ZAs.f":"Южноафриканский MeerKAT — 64 радиоантенны в Кару — предшественник радиотелескопа Square Kilometre Array, который ЮАР размещает вместе с Австралией.","c.EGs.t":"Египетский банк знаний","c.EGs.f":"Египетский банк знаний, запущенный в 2016 году, даёт всем жителям Египта бесплатный онлайн-доступ к научным журналам и учебным материалам.","c.IRs.t":"Исследования фертильности и стволовых клеток","c.IRs.f":"Иранский институт Ройан, основанный в 1991 году, известен исследованиями в области лечения бесплодия и стволовых клеток.","c.AEs.t":"Марсианская миссия «Надежда»","c.AEs.f":"Зонд ОАЭ «Надежда» (Hope) вышел на орбиту Марса в феврале 2021 года — первая межпланетная миссия арабской страны.","c.IDd.t":"QRIS: один QR-код для всех","c.IDd.f":"Индонезийский QRIS, запущенный Банком Индонезии в 2019 году, позволяет любому магазину принимать оплату из любого приложения по единому стандартному QR-коду.","c.SAs.t":"Исследовательский университет (KAUST)","c.SAs.f":"Научно-технологический университет имени короля Абдаллы (KAUST), открытый в 2009 году, исследует опреснение, солнечную энергетику и Красное море.","c.INt.t":"Учебные партнёрства ITEC","c.INt.f":"С 1964 года индийская программа ITEC обучила более 200 000 чиновников и специалистов примерно из 160 стран-партнёров.","c.ZAt.t":"Порт Дурбан","c.ZAt.f":"Дурбан — один из самых загруженных контейнерных портов Африки и ворота торговли юга Африки.","c.IRt.t":"Транспортный коридор «Север — Юг»","c.IRt.f":"В 2000 году Иран, Индия и Россия договорились построить Международный транспортный коридор «Север — Юг» — морской, железнодорожный и автомобильный путь от Индийского океана до России.","c.IDt.t":"Региональный торговый центр (АСЕАН)","c.IDt.f":"Индонезия — один из основателей АСЕАН (1967), в Джакарте находится Секретариат АСЕАН.","c.INe.t":"Международный солнечный альянс","c.INe.f":"Индия и Франция создали Международный солнечный альянс в 2015 году. Его штаб-квартира в Гуруграме, соглашение подписали более 100 стран.","c.BRn.t":"Спутниковый мониторинг лесов","c.BRn.f":"Бразильский институт космических исследований INPE ежегодно с 1988 года измеряет вырубку лесов Амазонии со спутников (проект PRODES).","c.RUn.t":"Самые большие леса в мире","c.RUn.f":"У России самая большая площадь лесов среди всех стран — около пятой части всех лесов мира.","c.CNe.t":"Городские электробусы","c.CNe.f":"В 2017 году Шэньчжэнь стал первым крупным городом, где весь парк общественных автобусов — более 16 000 машин — перешёл на электричество.","c.ZAe.t":"Аукционы возобновляемой энергетики","c.ZAe.f":"С 2011 года программа аукционов возобновляемой энергетики ЮАР (REIPPPP) подключила к сети частные ветровые и солнечные электростанции.","ch.c2-IN.t":"Много языков в интернете","ch.c2-IN.f":"Конституция Индии перечисляет 22 языка в Восьмом приложении. Миссия Bhashini создаёт перевод на основе ИИ, чтобы люди пользовались цифровыми услугами на родном языке.","ch.c2-IN.i":"На Саммите о влиянии ИИ в феврале 2026 года Индия принимала лидеров, чтобы обсудить ИИ для всех (Нью-Делийская декларация ¶81).","ch.c2-IN.q":"Сколько языков перечислено в Восьмом приложении Конституции Индии?","ch.c2-IN.w":"22. Цифровые инструменты на всех языках помогают всем выйти в интернет.","ch.c2-BR.t":"Медицинские карты для 200 млн человек","ch.c2-BR.f":"Государственная система здравоохранения Бразилии SUS бесплатно лечит всех жителей страны — около 200 млн человек.","ch.c2-BR.q":"Чем помогает общая электронная медицинская карта?","ch.c2-BR.a0":"Врачи видят прошлые анализы и лекарства","ch.c2-BR.a1":"Больницы становятся больше","ch.c2-BR.a2":"Врачи больше никому не нужны","ch.c2-BR.w":"Врачи быстро видят историю болезни, поэтому лечение безопаснее и ничего не повторяется.","ch.c2-RU.t":"Посёлки вдали от больниц","ch.c2-RU.f":"Россия охватывает 11 часовых поясов, поэтому многие посёлки находятся в тысячах километров от крупных больниц.","ch.c2-RU.q":"Сколько часовых поясов охватывает Россия?","ch.c2-RU.w":"11. Телемедицина позволяет далёкому специалисту помочь местной поликлинике.","ch.c2-ZA.t":"Навыки для первой работы","ch.c2-ZA.f":"В 2024 году примерно 6 из 10 молодых южноафриканцев 15–24 лет, искавших работу, не могли её найти.","ch.c2-ZA.q":"Что больше всего помогает молодому человеку получить первую работу?","ch.c2-ZA.a0":"Навыки, обучение и первый шанс","ch.c2-ZA.a1":"Ждать дома","ch.c2-ZA.a2":"Только удача","ch.c2-ZA.w":"Навыки плюс первый шанс, например стажировка или ученичество.","ch.c2-ET.t":"Мобильные деньги для фермеров","ch.c2-ET.f":"В мае 2021 года Ethio Telecom запустила сервис мобильных денег telebirr, чтобы люди вдали от банков могли платить и копить с телефона.","ch.c2-ET.q":"Почему мобильные деньги помогают фермерам, живущим далеко от банков?","ch.c2-ET.a0":"Они получают оплату и копят через телефон","ch.c2-ET.a1":"Телефоны помогают урожаю расти","ch.c2-ET.a2":"Они приносят дождь","ch.c2-ET.w":"Телефон становится банковским счётом, и фермеру не нужно часами ехать за оплатой.","ch.c2-IR.t":"Оповещения о качестве воздуха","ch.c2-IR.f":"Тегеран лежит в горной котловине, где из-за зимнего загрязнения воздуха в некоторые дни закрывали школы.","ch.c2-IR.q":"Что помогает людям защищаться в дни плохого воздуха?","ch.c2-IR.a0":"Оповещения о качестве воздуха в реальном времени","ch.c2-IR.a1":"Более громкие гудки","ch.c2-IR.a2":"Больше пыли","ch.c2-IR.w":"Оповещения подсказывают, когда остаться дома или надеть маску.","ch.c2-ID.t":"17 000 островов на связи","ch.c2-ID.f":"В Индонезии более 17 000 островов. Оптоволоконная сеть Palapa Ring, завершённая в 2019 году, связывает все её провинции.","ch.c2-ID.q":"Примерно сколько островов в Индонезии?","ch.c2-ID.a1":"1 700","ch.c2-ID.a2":"Более 17 000","ch.c2-ID.w":"Более 17 000, поэтому связать их все — огромная задача.","ch.c3-RU.t":"Грузы через 9000 км","ch.c3-RU.f":"Транссибирская магистраль, около 9289 км от Москвы до Владивостока, — самая длинная железнодорожная линия в мире.","ch.c3-RU.q":"Какова примерная длина Транссиба?","ch.c3-RU.a0":"900 км","ch.c3-RU.a1":"9289 км","ch.c3-RU.a2":"29 000 км","ch.c3-RU.w":"Около 9289 км через 8 часовых поясов.","ch.c3-IN.t":"Малый бизнес выходит в мир","ch.c3-IN.f":"Лидеры БРИКС отметили в 2026 году, что доступ к недорогому финансированию — главное узкое место для микро-, малых и средних предприятий (МСП).","ch.c3-IN.i":"Индия провела первый Форум МСП БРИКС в Агре в 2026 году (Нью-Делийская декларация ¶71).","ch.c3-IN.q":"Что означает сокращение МСП (англ. MSME)?","ch.c3-IN.a0":"Микро-, малые и средние предприятия","ch.c3-IN.a1":"Много станков и моторов","ch.c3-IN.a2":"Магазины со скидками","ch.c3-IN.w":"Микро-, малые и средние предприятия: мастерские, магазины и небольшие фабрики.","ch.c3-CN.t":"Скачок цен на удобрения","ch.c3-CN.f":"В 2022 году мировые цены на удобрения достигли рекордов, и расходы фермеров выросли повсюду. Китай — крупнейший в мире потребитель удобрений.","ch.c3-CN.q":"Почему цены на удобрения важны для всех?","ch.c3-CN.a0":"От них зависит стоимость выращивания еды","ch.c3-CN.a1":"Они меняют погоду","ch.c3-CN.a2":"Они важны только заводам","ch.c3-CN.w":"Дорогие удобрения — дорогая еда для каждой семьи.","ch.c3-EG.t":"Хлеб и импорт пшеницы","ch.c3-EG.f":"Египет — один из крупнейших импортёров пшеницы в мире, а хлеб — основа ежедневного питания.","ch.c3-EG.q":"Какая культура — главный ингредиент большинства видов хлеба?","ch.c3-EG.a0":"Пшеница","ch.c3-EG.a1":"Хлопок","ch.c3-EG.a2":"Чай","ch.c3-EG.w":"Пшеница. Бесперебойная торговля и хорошее хранение делают хлеб доступным.","ch.c3-ET.t":"Торговля без морского берега","ch.c3-ET.f":"Эфиопия не имеет выхода к морю. Большая часть её морской торговли идёт через порт Джибути.","ch.c3-ET.q":"Что значит «не имеет выхода к морю»?","ch.c3-ET.a0":"Нет морского побережья","ch.c3-ET.a1":"Нет рек","ch.c3-ET.a2":"Нет гор","ch.c3-ET.w":"Нет побережья, поэтому грузы идут к порту через соседнюю страну.","ch.c3-IR.t":"Шафран на рынок","ch.c3-IR.f":"Иран выращивает большую часть шафрана в мире — дорогой пряности, которую вручную собирают с цветков крокуса.","ch.c3-IR.q":"Из какой части цветка крокуса получают шафран?","ch.c3-IR.a0":"Из тонких красных рылец","ch.c3-IR.a1":"Из корней","ch.c3-IR.a2":"Из листьев","ch.c3-IR.w":"Из тонких красных рылец, собранных вручную. Шафран выращивают и в Кашмире.","ch.c3-AE.t":"Много национальностей — одна рабочая сила","ch.c3-AE.f":"В ОАЭ живут и работают люди примерно 200 национальностей.","ch.c3-AE.q":"Почему признание квалификаций между странами помогает работникам?","ch.c3-AE.a0":"Их обучение засчитывается, где бы они ни работали","ch.c3-AE.a1":"Работу становится труднее найти","ch.c3-AE.a2":"Это останавливает торговлю","ch.c3-AE.w":"Сертификат, признанный за рубежом, позволяет мастеру работать на своём уровне.","ch.c4-BR.t":"Истощённые пастбища","ch.c4-BR.f":"В 2023 году Бразилия запустила программу восстановления до 40 млн гектаров деградировавших пастбищ для сельского хозяйства и лесов.","ch.c4-BR.q":"Восстановление истощённых земель помогает…","ch.c4-BR.a0":"выращивать еду без вырубки лесов","ch.c4-BR.a1":"создавать пустыни","ch.c4-BR.a2":"поднимать уровень моря","ch.c4-BR.w":"Здоровая земля даёт больше еды, и леса могут остаться нетронутыми.","ch.c4-CN.t":"Песчаные и пыльные бури","ch.c4-CN.f":"Песчаные и пыльные бури приходят на север Китая почти каждую весну. С 1978 года программа «Три Севера» сажает деревья, чтобы сдержать пустыню.","ch.c4-CN.q":"Что помогает удерживать песок на месте?","ch.c4-CN.a0":"Корни деревьев и трав","ch.c4-CN.a1":"Сухой ветер","ch.c4-CN.a2":"Голая почва","ch.c4-CN.w":"Корни скрепляют почву. Индийский проект «Зелёная стена Аравалли» использует ту же идею.","ch.c4-ZA.t":"Веерные отключения электричества","ch.c4-ZA.f":"В 2023 году в ЮАР большую часть дней действовали веерные отключения электричества (load-shedding).","ch.c4-ZA.q":"Что большая батарея даёт электросети?","ch.c4-ZA.a0":"Хранит энергию до момента, когда она нужна","ch.c4-ZA.a1":"Производит уголь","ch.c4-ZA.a2":"Охлаждает солнце","ch.c4-ZA.w":"Она запасает солнечную и ветровую энергию на вечерний пик.","ch.c4-EG.t":"Ниже черты водного дефицита","ch.c4-EG.f":"В Египте возобновляемой пресной воды на человека меньше 1000 кубометров в год — порога, который часто считают чертой водного дефицита.","ch.c4-EG.q":"Какой способ полива полей экономит больше всего воды?","ch.c4-EG.a0":"Капельное орошение","ch.c4-EG.a1":"Затопление полей","ch.c4-EG.a2":"Полив в полдень","ch.c4-EG.w":"Капельное орошение подаёт воду прямо к корням и часто экономит треть и больше.","ch.c4-AE.t":"Охлаждение в сильную жару","ch.c4-AE.f":"Летом в ОАЭ температура часто выше 45 °C, поэтому на охлаждение уходит большая доля электроэнергии. В 2023 году ОАЭ принимали климатическую конференцию COP28.","ch.c4-AE.q":"Что сохраняет здание прохладным при меньших затратах энергии?","ch.c4-AE.a0":"Тень, утепление и эффективное охлаждение","ch.c4-AE.a1":"Открытые двери","ch.c4-AE.a2":"Тёмные крыши","ch.c4-AE.w":"Тень, утепление и светлые крыши снижают потребность в охлаждении.","ch.c4-ID.t":"Исчезающие мангровые леса","ch.c4-ID.f":"В Индонезии крупнейшие в мире мангровые леса — около пятой части мировых — и национальная программа их восстановления.","ch.c4-ID.q":"Как мангровые леса защищают побережье?","ch.c4-ID.a0":"Их корни гасят волны и держат почву","ch.c4-ID.a1":"Они притягивают штормы","ch.c4-ID.a2":"Они растапливают лёд","ch.c4-ID.w":"Их сплетённые корни успокаивают волны и укрывают мальков.","p.p-dpi.n":"Пилот открытой цифровой общественной инфраструктуры","p.p-tele.n":"Сеть телемедицины для удалённых клиник","p.p-skill.n":"Академии цифровых навыков","p.p-lab.n":"Совместная лаборатория и стипендии","p.p-agri.n":"Цифровая агроконсультаци  bahan bakar etanol tebu.","c.RU1.t":"Gandum untuk dunia","c.RU1.f":"Rusia adalah pengekspor gandum terbesar di dunia: sekitar 43–45 juta ton, kira-kira seperlima perdagangan gandum global, diperkirakan untuk 2025/26.","c.RU2.t":"Pembangun pembangkit listrik","c.RU2.f":"Insinyur Rusia membangun PLTN di luar negeri, termasuk PLTN Kudankulam di Tamil Nadu, India.","c.IN1.t":"Obat terjangkau","c.IN1.f":"India memasok sekitar 20% obat generik dunia berdasarkan volume, sehingga dijuluki “apotek dunia”.","c.IN2.t":"Peringatan siklon dan tempat pengungsian","c.IN2.f":"Sebelum Siklon Phailin (2013), Odisha memindahkan sekitar 1 juta orang ke tempat pengungsian. 44 orang meninggal, dibandingkan sekitar 10.000 pada siklon super 1999.","c.CN1.t":"Manufaktur panel surya","c.CN1.f":"Pangsa Tiongkok di setiap tahap utama manufaktur panel surya PV di atas 80%, sehingga panel surya jauh lebih murah di seluruh dunia.","c.CN2.t":"Kereta api dan konstruksi besar","c.CN2.f":"Pada Desember 2025 jaringan kereta cepat Tiongkok melampaui 50.000 km, lebih panjang daripada gabungan seluruh dunia lainnya.","c.ZA1.t":"Program kesehatan masyarakat","c.ZA1.f":"Afrika Selatan menjalankan program pengobatan HIV terbesar di dunia, dengan sekitar 6,3 juta orang menjalani terapi antiretroviral pada 2024.","c.ZA2.t":"Keahlian menghemat air","c.ZA2.f":"Saat kekeringan 2018, Cape Town memangkas pemakaian air lebih dari separuh, dari sekitar 1,2 miliar menjadi sekitar 0,5 miliar liter per hari, dan terhindar dari “Hari Nol”.","c.EG1.t":"Pelayaran Terusan Suez","c.EG1.f":"Sekitar 12% perdagangan dunia, termasuk biji-bijian dan pupuk, melewati Terusan Suez di Mesir.","c.EG2.t":"Taman surya di gurun","c.EG2.f":"Taman surya Benban di Mesir dekat Aswan, sekitar 1,65 GW, adalah salah satu taman surya terbesar di dunia.","c.ET1.t":"Penanaman pohon Green Legacy","c.ET1.f":"Inisiatif Green Legacy Etiopia melaporkan lebih dari 48 miliar bibit ditanam sejak 2019 untuk memulihkan lahan dan daerah aliran sungai.","c.ET2.t":"Pusat udara kemanusiaan","c.ET2.f":"Pada 2020 sebuah pusat udara di Addis Ababa, yang dijalankan bersama Program Pangan Dunia PBB dan Ethiopian Airlines, mengirim pasokan COVID-19 ke 54 negara Afrika.","c.IR1.t":"Rekayasa air qanat","c.IR1.f":"Qanat di Iran adalah saluran bawah tanah kuno yang mengalirkan air dengan gravitasi. Qanat Persia adalah Situs Warisan Dunia UNESCO (2016).","c.IR2.t":"Rekayasa gempa","c.IR2.f":"Institut Internasional Rekayasa Gempa dan Seismologi Iran (IIEES, didirikan 1989) meneliti bangunan yang lebih aman dan pemantauan gempa.","c.SA1.t":"Desalinasi skala besar","c.SA1.f":"Arab Saudi adalah produsen air desalinasi terbesar di dunia: lebih dari 16 juta meter kubik per hari.","c.SA2.t":"PLTS besar","c.SA2.f":"PLTS Sudair berkapasitas 1,5 GW beroperasi penuh sejak Januari 2024.","c.AE1.t":"Listrik nuklir bersih","c.AE1.f":"PLTN Barakah di UEA memasok sekitar seperempat listrik negara itu.","c.AE2.t":"Pusat logistik kemanusiaan","c.AE2.f":"Dubai Humanitarian, dulu International Humanitarian City, menyebut dirinya pusat kemanusiaan terbesar di dunia, dengan sekitar 80 anggota dari PBB, LSM, dan lainnya.","c.ID1.t":"Peringatan dini tsunami","c.ID1.f":"InaTEWS milik Indonesia, diluncurkan pada 2008, dapat mengeluarkan peringatan tsunami sekitar 5 menit setelah gempa kuat.","c.ID2.t":"Energi panas bumi","c.ID2.f":"Indonesia memiliki kapasitas listrik panas bumi terbesar kedua di dunia, sekitar 2.744 MW.","ch.ET.t":"Kekeringan panjang","ch.ET.f":"Dari akhir 2020 hingga 2022, Tanduk Afrika, termasuk Etiopia, mengalami lima musim hujan gagal berturut-turut.","ch.ET.q":"Berapa musim hujan berturut-turut yang gagal saat kekeringan di Tanduk Afrika?","ch.ET.a0":"2","ch.ET.a1":"3","ch.ET.a2":"5","ch.ET.w":"Lima musim gagal, dari akhir 2020 hingga 2022. Karena itu bantuan air dan pangan dibutuhkan bersamaan.","ch.IN.t":"Musim siklon","ch.IN.f":"Siklon Phailin (2013) berdampak pada sekitar 13,2 juta orang di Odisha. Peringatan dini dan tempat pengungsian membuat korban jiwa hanya 44 orang.","ch.IN.i":"Pendekatan “nol korban” Odisha kini menjadi model yang dibagikan India kepada negara lain.","ch.IN.q":"Sebelum Siklon Phailin, kira-kira berapa orang yang dipindahkan Odisha ke tempat aman?","ch.IN.a0":"10.000","ch.IN.a1":"100.000","ch.IN.a2":"Sekitar 1 juta","ch.IN.w":"Sekitar 1 juta orang dipindahkan dalam kira-kira 36 jam, salah satu evakuasi terbesar yang pernah ada.","ch.ID.t":"Banjir kota","ch.ID.f":"Pada 1 Januari 2020, hujan 377 mm turun dalam satu hari di sebuah stasiun di Jakarta, tertinggi sejak pencatatan dimulai pada 1866.","ch.ID.q":"Berapa banyak hujan yang turun dalam sehari di Jakarta pada 1 Januari 2020?","ch.ID.a0":"37 mm","ch.ID.a1":"177 mm","ch.ID.a2":"377 mm","ch.ID.w":"377 mm dalam sehari. Itu seperti hujan sebulan penuh di banyak tempat, turun sekaligus.","ch.ZA.t":"Kelangkaan air","ch.ZA.f":"Pada 2018 Cape Town membatasi setiap orang 50 liter air per hari untuk menghindari “Hari Nol”, saat keran akan dimatikan.","ch.ZA.q":"Pada 2018, Cape Town meminta setiap orang memakai air paling banyak berapa per hari?","ch.ZA.a0":"50 liter","ch.ZA.a1":"150 liter","ch.ZA.a2":"500 liter","ch.ZA.w":"50 liter, kira-kira sekali mandi pancuran singkat. Warga menghemat air bersama dan Hari Nol tidak pernah datang.","ch.BR.t":"Waspada demam berdarah","ch.BR.f":"2024 adalah tahun rekor demam berdarah di Amerika, dan Brasil melaporkan kasus terbanyak.","ch.BR.q":"Demam berdarah menyebar lewat nyamuk yang berkembang biak di…","ch.BR.a0":"air tergenang","ch.BR.a1":"pasir kering","ch.BR.a2":"salju dingin","ch.BR.w":"Air tergenang di pot, ban, dan pendingin. Mengurasnya seminggu sekali membantu semua orang.","ch.IR.t":"Panas dan krisis air","ch.IR.f":"Iran termasuk negara dengan tekanan air dasar “sangat tinggi” dalam atlas Aqueduct dari WRI.","ch.IR.q":"Saluran air bawah tanah kuno di Iran disebut…","ch.IR.a0":"qanat","ch.IR.a1":"kanal","ch.IR.a2":"sumur bertangga","ch.IR.w":"Qanat mengalirkan air dengan gravitasi. Sumur bertangga di India adalah cara kuno cerdas lainnya untuk menyimpan air.","ch.RU.t":"Musim kebakaran hutan","ch.RU.f":"Kesiapsiagaan kebakaran hutan adalah salah satu hasil kerja sama keketuaan BRICS India pada 2026.","ch.RU.q":"Apa yang paling membantu pada jam-jam pertama kebakaran hutan?","ch.RU.a0":"Deteksi dan peringatan dini","ch.RU.a1":"Menunggu hujan","ch.RU.a2":"Menebang lebih banyak pohon","ch.RU.w":"Deteksi dini: api kecil jauh lebih mudah dipadamkan.","ch.AE.t":"Gangguan impor pangan","ch.AE.f":"UEA mengimpor sekitar 90% pangannya. Strategi Ketahanan Pangan Nasional 2051 bertujuan memperluas sumber pasokan dan menanam lebih banyak di dalam negeri.","ch.AE.q":"Kira-kira berapa banyak pangan yang diimpor UEA?","ch.AE.a0":"10%","ch.AE.a1":"50%","ch.AE.a2":"90%","ch.AE.w":"Sekitar 90%, jadi kelancaran pengiriman dan penyimpanan sangat penting.","ch.CN.t":"Banjir sungai","ch.CN.f":"Pada musim panas 2020, hujan monsun yang panjang menyebabkan banjir parah di seluruh lembah Sungai Yangtze.","ch.CN.q":"Yangtze adalah sungai terpanjang di benua mana?","ch.CN.a0":"Asia","ch.CN.a1":"Afrika","ch.CN.a2":"Eropa","ch.CN.w":"Asia. Ratusan juta orang tinggal di lembahnya.","ch.SA.t":"Banjir bandang di gurun","ch.SA.f":"Pada November 2009 hujan lebat yang tiba-tiba menyebabkan banjir bandang mematikan di Jeddah.","ch.SA.q":"Mengapa banjir bandang bisa sangat berbahaya di kota gurun?","ch.SA.a0":"Tanah keras dan kering tidak bisa menyerap air dengan cepat","ch.SA.a1":"Gurun tidak pernah hujan","ch.SA.a2":"Pasir membuat air menghilang","ch.SA.w":"Tanah kering yang keras dan sedikitnya saluran membuat air mengalir deras di jalan dengan sangat cepat.","ch.EG.t":"Delta dan permukaan laut","ch.EG.f":"Delta Nil di Mesir yang rendah, tempat banyak lahan pertaniannya, menghadapi kenaikan permukaan laut dan air asin yang merembes ke tanah. Sebuah proyek Green Climate Fund mendukung adaptasi pesisir.","ch.EG.q":"Apa ancaman terbesar bagi lahan pertanian delta yang rendah?","ch.EG.a0":"Kenaikan laut dan air asin","ch.EG.a1":"Terlalu banyak pohon","ch.EG.a2":"Hujan salju","ch.EG.w":"Laut yang naik mendorong air asin ke tanah, sehingga menanam pangan jadi lebih sulit.","p.p-water.n":"Panen air hujan dan perbaikan waduk","p.p-food.n":"Gudang biji-bijian dan rantai dingin","p.p-health.n":"Kapasitas darurat kesehatan dan stok obat","p.p-warn.n":"Peringatan dini multi-bahaya hingga ke tingkat paling bawah","p.p-warn.note":"Peringatan 24 jam sebelum badai atau gelombang panas dapat mengurangi kerusakan sekitar 30% (Global Commission on Adaptation, 2019).","p.p-infra.n":"Drainase dan jalan tahan iklim","p.p-solar.n":"Tenaga surya dan baterai untuk klinik dan tempat pengungsian","p.p-irrig.n":"Irigasi hemat air","p.p-shelter.n":"Tempat pengungsian komunitas aman banjir","lv.school.name":"Sekolah","lv.school.age":"10–14","lv.school.blurb":"Tak bisa gagal · petunjuk · cap paspor · kuis singkat","lv.college.name":"Kuliah","lv.college.age":"15–22","lv.college.blurb":"Teka-teki konsensus lengkap","lv.expert.name":"Ahli","lv.expert.age":"Dewasa","lv.expert.blurb":"4 giliran · anggaran lebih ketat · kebutuhan yang belum terpenuhi terbawa","q.1.name":"Ketahanan","q.1.o0":"Integrasi data peringatan dini multi-bahaya","q.1.o1":"Prinsip sukarela untuk infrastruktur kota tahan iklim","q.1.o2":"Subkelompok peringatan dini penyakit menular","q.1.o3":"Kesiapsiagaan kebakaran hutan","q.1.o4":"Jaringan pusat agroekologi dan pertanian regeneratif","q.2.name":"Inovasi","q.3.name":"Kerja sama","q.4.name":"Keberlanjutan","strip.garib.n":"Garib","strip.garib.d":"warga miskin","strip.yuva.n":"Yuva","strip.yuva.d":"pemuda","strip.annadata.n":"Annadata","strip.annadata.d":"petani","strip.nari.n":"Nari","strip.nari.d":"perempuan","strip.real":"Nyata: kapasitas listrik non-fosil India mencapai 300,5 GW (31 Juli 2026), menuju 500 GW pada 2030.","act.plan":"🗺️ Buat rencana darurat keluarga: titik kumpul dan nomor telepon penting yang ditulis di kertas","act.water":"💧 Hemat air hari ini: pakai ember, atau perbaiki keran yang menetes bersama orang dewasa","act.alert":"📲 Bersama orang dewasa, cari tahu bagaimana daerahmu menerima peringatan cuaca (mis. BMKG; di India NDMA “Sachet”, IMD)","act.kit":"🩹 Periksa kotak P3K di rumah bersama-sama dan catat apa yang kurang","act.tree":"🌳 Siram pohon atau tanam sesuatu di jalanmu atau balkon","about.0":"BRICS memiliki 10 anggota pasti: Brasil, Rusia, India, Tiongkok, Afrika Selatan, Mesir, Etiopia, Iran, UEA, dan Indonesia. Arab Saudi diundang pada 2023; keketuaan India 2026 mencantumkannya sebagai anggota, tetapi Arab Saudi belum mengonfirmasi keanggotaan secara terbuka. Ada juga 10 negara mitra. BRICS tidak memiliki perjanjian, anggaran, atau sekretariat tetap; keputusan diambil secara konsensus.","about.1":"India memegang keketuaan BRICS pada 2026 (untuk ke-4 kalinya) dengan tema “Membangun untuk Ketahanan, Inovasi, Kerja Sama, dan Keberlanjutan”. KTT ke-18 diadakan di New Delhi pada 12–13 September 2026.","about.2":"New Development Bank (Shanghai, sejak 2015) memiliki 10 anggota: Brasil, Rusia, India, Tiongkok, Afrika Selatan, Bangladesh, UEA, Mesir, Aljazair, dan Uzbekistan. Bank ini menandai setiap proyek dengan target TPB.","about.3":"“Untuk saat ini tidak ada usulan di BRICS mengenai mata uang BRICS.” (MEA, September 2026)","disc":"BRICS Bridges adalah gim edukasi dari Harpreet Raj Singh Games. Gim ini tidak berafiliasi dengan atau didukung oleh BRICS, Kementerian Luar Negeri India, New Development Bank, atau pemerintah mana pun. Fakta dikutip beserta tanggalnya. Kekuatan dan kebutuhan disederhanakan untuk permainan. Skor, Suara, fokus, dan kredit adalah mekanik gim, bukan penilaian atas negara mana pun.","saudi":"Arab Saudi diundang bergabung dengan BRICS pada 2023. Sumber resmi India dan BRICS, seperti situs keketuaan India 2026, mencantumkannya sebagai anggota. Arab Saudi belum mengonfirmasi keanggotaannya secara terbuka dan menghadiri KTT 2026 sebagai negara undangan. Gim ini menampilkannya sebagai tamu undangan: kekuatannya bisa membantu, tetapi tidak ikut dalam pemeriksaan konsensus.","idx.1":"Indeks Ketahanan","edition":"Versi pertama","firstBanner":"Anda sedang memainkan versi pertama BRICS Bridges.","playLatest":"Mainkan versi terbaru","done":"Selesai ✓","lockedQ":"Setelah Kuartal {n}","playQ":"Main Kuartal {n} · {q}","contQ":"Lanjutkan Kuartal {q} · Giliran {n}","qDone":"Kuartal {n} selesai","idx.2":"Indeks inovasi","idx.3":"Indeks kerja sama","idx.4":"Indeks keberlanjutan","idxTip":"{i} (mekanik permainan)","agendaQ":"Agenda nyata 2026 untuk {q}","realAgreedQ":"Yang benar-benar disepakati keketuaan 2026 tentang {q}","agendaSrcNdd":"Dari Deklarasi New Delhi para pemimpin BRICS (12 September 2026). ¶ = nomor paragraf.","doneTodayQ":"Hari ini kamu menyelesaikan Kuartal {n}. {next} Kamu boleh memainkan ulang kuartal yang terbuka, tetapi kehidupan nyata juga memanggil 🌿","nextQN":"Berikutnya: Kuartal {n} · {q} {e} terbuka besok. Melewatkan hari tidak apa-apa: tidak ada yang hilang.","nextYear":"Itu kuartal terakhir tahun ini. Ringkasan tahunmu membandingkan pilihanmu dengan yang benar-benar disepakati BRICS.","doneLineQ":"Kamu membangun {b} jembatan dan {i} mencapai {r}.","tagline.1":"Ketahanan dimulai dari rumah.","tagline.2":"Setiap ide baru dimulai dari rasa ingin tahu.","tagline.3":"Kerja sama dimulai dari satu uluran tangan.","tagline.4":"Masa depan berkelanjutan dimulai dari kebiasaan kecil sehari-hari.","howTwist":"Kuartal 2, 3, dan 4 masing-masing menambahkan satu aturan khusus di atas langkah-langkah ini. Aturannya dijelaskan di awal kuartal.","tw.joint.name":"Aturan khusus: panggilan riset bersama","tw.joint.rule":"Pilih kekuatan dari setidaknya {cap} anggota berbeda dan tim mendapat 1 poin kebutuhan bonus.","tw.joint.expert":"Ahli: ketiga kekuatan harus cocok dengan suatu kebutuhan.","tw.joint.on":"🔬 Bonus riset bersama: +1","tw.joint.off":"🔬 Bonus riset bersama: sejauh ini kekuatan dari {n} dari 3 anggota","tw.cofi.name":"Aturan arpemerintah, sering bersifat sukarela, dan butuh bertahun-tahun untuk dijalankan.","yearBack":"Kembali ke layar judul","rampNote":"Tahun ini makin sibuk: di level ini, setiap tantangan kuartal ini butuh 1 poin tambahan.","tag.digital":"Digital","tag.skills":"Keterampilan","tag.trade":"Jalur dagang","tag.nature":"Alam","c.BRd.t":"Pembayaran instan Pix","c.BRd.f":"Bank sentral Brasil meluncurkan Pix, sistem pembayaran instan gratis, pada November 2020. Pada 2025 penggunanya lebih dari 170 juta.","c.RUd.t":"Navigasi satelit GLONASS","c.RUd.f":"Rusia mengoperasikan GLONASS, salah satu dari empat sistem navigasi satelit global di dunia, dengan cakupan global penuh sejak 2011.","c.INd.t":"UPI dan infrastruktur publik digital","c.INd.f":"UPI India memungkinkan siapa saja mengirim uang seketika dari ponsel. Pada 2025 UPI memproses lebih dari 20 miliar pembayaran dalam satu bulan.","c.CNs.t":"Paten dan laboratorium riset","c.CNs.f":"Tiongkok menerima permohonan paten lebih banyak daripada negara mana pun: sekitar 1,6 juta pada 2023.","c.ZAs.t":"Astronomi radio (MeerKAT)","c.ZAs.f":"MeerKAT di Afrika Selatan, 64 antena radio di Karoo, adalah pendahulu teleskop Square Kilometre Array yang diselenggarakan Afrika Selatan bersama Australia.","c.EGs.t":"Bank Pengetahuan Mesir","c.EGs.f":"Bank Pengetahuan Mesir, diluncurkan pada 2016, memberi semua orang di Mesir akses daring gratis ke jurnal riset dan bahan belajar.","c.IRs.t":"Riset kesuburan dan sel punca","c.IRs.f":"Institut Royan di Iran, didirikan pada 1991, dikenal karena riset pengobatan kesuburan dan sel punca.","c.AEs.t":"Misi Mars Hope","c.AEs.f":"Wahana Hope milik UEA mencapai orbit Mars pada Februari 2021, misi antarplanet pertama oleh negara Arab.","c.IDd.t":"QRIS: satu kode QR untuk semua","c.IDd.f":"QRIS, yang diluncurkan Bank Indonesia pada 2019, memungkinkan toko mana pun menerima pembayaran dari aplikasi apa pun lewat satu kode QR standar.","c.SAs.t":"Universitas riset (KAUST)","c.SAs.f":"Universitas Sains dan Teknologi Raja Abdullah (KAUST), dibuka pada 2009, meneliti desalinasi, energi surya, dan ilmu Laut Merah.","c.INt.t":"Kemitraan pelatihan ITEC","c.INt.f":"Sejak 1964 program ITEC India telah melatih lebih dari 200.000 pejabat dan profesional dari sekitar 160 negara mitra.","c.ZAt.t":"Pelabuhan Durban","c.ZAt.f":"Durban adalah salah satu pelabuhan peti kemas tersibuk di Afrika dan gerbang perdagangan Afrika bagian selatan.","c.IRt.t":"Koridor Transportasi Utara–Selatan","c.IRt.f":"Pada 2000 Iran, India, dan Rusia sepakat membangun Koridor Transportasi Internasional Utara–Selatan, rute kapal, kereta, dan jalan yang menghubungkan Samudra Hindia dengan Rusia.","c.IDt.t":"Pusat dagang kawasan (ASEAN)","c.IDt.f":"Indonesia adalah anggota pendiri ASEAN (1967), dan Jakarta menjadi tuan rumah Sekretariat ASEAN.","c.INe.t":"Aliansi Surya Internasional","c.INe.f":"India dan Prancis meluncurkan Aliansi Surya Internasional pada 2015. Markasnya di Gurugram dan lebih dari 100 negara telah menandatanganinya.","c.BRn.t":"Pemantauan hutan lewat satelit","c.BRn.f":"Lembaga riset antariksa Brasil, INPE, mengukur deforestasi Amazon lewat satelit setiap tahun sejak 1988 (proyek PRODES).","c.RUn.t":"Hutan terluas di dunia","c.RUn.f":"Rusia memiliki kawasan hutan terluas di antara semua negara, sekitar seperlima hutan dunia.","c.CNe.t":"Bus kota listrik","c.CNe.f":"Pada 2017 Shenzhen menjadi kota besar pertama yang menjalankan seluruh armada bus umumnya, lebih dari 16.000 bus, dengan listrik.","c.ZAe.t":"Lelang energi terbarukan","c.ZAe.f":"Sejak 2011 program lelang energi terbarukan Afrika Selatan (REIPPPP) telah menyambungkan pembangkit angin dan surya swasta ke jaringan listrik.","ch.c2-IN.t":"Banyak bahasa di dunia maya","ch.c2-IN.f":"Konstitusi India mencantumkan 22 bahasa dalam Jadwal Kedelapan. Misi Bhashini membangun penerjemahan AI agar orang bisa memakai layanan digital dalam bahasanya sendiri.","ch.c2-IN.i":"Pada KTT Dampak AI, Februari 2026, India menjamu para pemimpin untuk membahas AI bagi semua (Deklarasi New Delhi ¶81).","ch.c2-IN.q":"Berapa bahasa yang tercantum dalam Jadwal Kedelapan Konstitusi India?","ch.c2-IN.w":"22. Alat digital yang bekerja dalam setiap bahasa membantu semua orang bisa daring.","ch.c2-BR.t":"Rekam medis untuk 200 juta orang","ch.c2-BR.f":"Sistem kesehatan publik Brasil, SUS, memberi layanan gratis kepada semua orang di negeri itu, sekitar 200 juta orang.","ch.c2-BR.q":"Bagaimana rekam medis digital bersama membantu?","ch.c2-BR.a0":"Dokter bisa melihat tes dan obat sebelumnya","ch.c2-BR.a1":"Rumah sakit menjadi lebih besar","ch.c2-BR.a2":"Tidak ada yang butuh dokter","ch.c2-BR.w":"Dokter melihat riwayatmu dengan cepat, jadi perawatan lebih aman dan tidak ada yang diulang.","ch.c2-RU.t":"Kota kecil jauh dari rumah sakit","ch.c2-RU.f":"Rusia membentang di 11 zona waktu, sehingga banyak kota kecil berjarak ribuan kilometer dari rumah sakit besar.","ch.c2-RU.q":"Rusia membentang di berapa zona waktu?","ch.c2-RU.w":"11. Telemedisin memungkinkan dokter spesialis di tempat jauh membantu klinik setempat.","ch.c2-ZA.t":"Keterampilan untuk kerja pertama","ch.c2-ZA.f":"Pada 2024 sekitar 6 dari 10 anak muda Afrika Selatan berusia 15–24 tahun yang mencari kerja tidak mendapat pekerjaan.","ch.c2-ZA.q":"Apa yang paling membantu anak muda mendapat pekerjaan pertama?","ch.c2-ZA.a0":"Keterampilan, pelatihan, dan kesempatan pertama","ch.c2-ZA.a1":"Menunggu di rumah","ch.c2-ZA.a2":"Hanya keberuntungan","ch.c2-ZA.w":"Keterampilan ditambah kesempatan pertama, seperti magang.","ch.c2-ET.t":"Uang seluler untuk petani","ch.c2-ET.f":"Ethio Telecom meluncurkan layanan uang seluler telebirr pada Mei 2021, agar orang yang jauh dari bank bisa membayar dan menabung lewat ponsel.","ch.c2-ET.q":"Mengapa uang seluler membantu petani yang tinggal jauh dari bank?","ch.c2-ET.a0":"Mereka bisa dibayar dan menabung lewat ponsel","ch.c2-ET.a1":"Ponsel membuat tanaman tumbuh","ch.c2-ET.a2":"Itu mendatangkan hujan","ch.c2-ET.w":"Ponsel menjadi rekening bank, jadi petani tidak perlu menempuh berjam-jam untuk dibayar.","ch.c2-IR.t":"Peringatan kualitas udara","ch.c2-IR.f":"Teheran terletak di cekungan pegunungan; polusi udara musim dingin pernah membuat sekolah tutup pada beberapa hari.","ch.c2-IR.q":"Apa yang membantu orang melindungi diri pada hari udara buruk?","ch.c2-IR.a0":"Peringatan kualitas udara langsung","ch.c2-IR.a1":"Klakson lebih keras","ch.c2-IR.a2":"Debu lebih banyak","ch.c2-IR.w":"Peringatan langsung memberi tahu kapan harus di dalam rumah atau memakai masker.","ch.c2-ID.t":"17.000 pulau untuk disambungkan","ch.c2-ID.f":"Indonesia memiliki lebih dari 17.000 pulau. Jaringan serat optik Palapa Ring, rampung pada 2019, menghubungkan semua provinsinya.","ch.c2-ID.q":"Kira-kira berapa jumlah pulau di Indonesia?","ch.c2-ID.a1":"1.700","ch.c2-ID.a2":"Lebih dari 17.000","ch.c2-ID.w":"Lebih dari 17.000, jadi menyambungkan semuanya adalah tugas raksasa.","ch.c3-RU.t":"Mengangkut barang sejauh 9.000 km","ch.c3-RU.f":"Jalur Kereta Trans-Siberia, sekitar 9.289 km dari Moskwa ke Vladivostok, adalah jalur kereta terpanjang di dunia.","ch.c3-RU.q":"Kira-kira berapa panjang Jalur Kereta Trans-Siberia?","ch.c3-RU.a0":"900 km","ch.c3-RU.a1":"9.289 km","ch.c3-RU.a2":"29.000 km","ch.c3-RU.w":"Sekitar 9.289 km, melintasi 8 zona waktu.","ch.c3-IN.t":"Usaha kecil go global","ch.c3-IN.f":"Para pemimpin BRICS mencatat pada 2026 bahwa akses ke pembiayaan terjangkau adalah hambatan utama usaha mikro, kecil, dan menengah (UMKM).","ch.c3-IN.i":"India menyelenggarakan Forum UKM BRICS pertama di Agra pada 2026 (Deklarasi New Delhi ¶71).","ch.c3-IN.q":"Apa kepanjangan MSME (UMKM)?","ch.c3-IN.a0":"Usaha mikro, kecil, dan menengah","ch.c3-IN.a1":"Banyak mesin kecil","ch.c3-IN.a2":"Pasar yang mudah","ch.c3-IN.w":"Usaha mikro, kecil, dan menengah: bengkel, toko, dan pabrik kecil.","ch.c3-CN.t":"Lonjakan harga pupuk","ch.c3-CN.f":"Pada 2022 harga pupuk dunia mencapai rekor tertinggi, menaikkan biaya petani di mana-mana. Tiongkok adalah pengguna pupuk terbesar di dunia.","ch.c3-CN.q":"Mengapa harga pupuk penting bagi semua orang?","ch.c3-CN.a0":"Harganya mengubah biaya menanam pangan","ch.c3-CN.a1":"Harganya mengubah cuaca","ch.c3-CN.a2":"Hanya penting bagi pabrik","ch.c3-CN.w":"Pupuk lebih mahal berarti makanan lebih mahal bagi setiap keluarga.","ch.c3-EG.t":"Roti dan impor gandum","ch.c3-EG.f":"Mesir adalah salah satu pengimpor gandum terbesar di dunia, dan roti menjadi inti makanan sehari-hari.","ch.c3-EG.q":"Tanaman apa bahan utama sebagian besar roti?","ch.c3-EG.a0":"Gandum","ch.c3-EG.a1":"Kapas","ch.c3-EG.a2":"Teh","ch.c3-EG.w":"Gandum. Perdagangan lancar dan penyimpanan baik menjaga harga roti terjangkau.","ch.c3-ET.t":"Berdagang tanpa pantai","ch.c3-ET.f":"Etiopia tidak memiliki laut. Sebagian besar perdagangan lautnya melewati pelabuhan Djibouti.","ch.c3-ET.q":"Apa arti “terkurung daratan”?","ch.c3-ET.a0":"Tidak punya garis pantai","ch.c3-ET.a1":"Tidak punya sungai","ch.c3-ET.a2":"Tidak punya gunung","ch.c3-ET.w":"Tidak punya garis pantai, jadi barang harus melewati negara tetangga untuk mencapai pelabuhan.","ch.c3-IR.t":"Membawa saffron ke pasar","ch.c3-IR.f":"Iran menanam sebagian besar saffron dunia, rempah mahal yang dipetik dengan tangan dari bunga krokus.","ch.c3-IR.q":"Saffron berasal dari bagian mana bunga krokus?","ch.c3-IR.a0":"Kepala putiknya yang tipis dan merah","ch.c3-IR.a1":"Akarnya","ch.c3-IR.a2":"Daunnya","ch.c3-IR.w":"Kepala putik merah yang tipis, dipetik dengan tangan. Kashmir juga menanam saffron.","ch.c3-AE.t":"Banyak kebangsaan, satu tenaga kerja","ch.c3-AE.f":"Orang dari sekitar 200 kebangsaan tinggal dan bekerja di UEA.","ch.c3-AE.q":"Mengapa pengakuan keterampilan antarnegara membantu pekerja?","ch.c3-AE.a0":"Pelatihan mereka diakui di mana pun mereka bekerja","ch.c3-AE.a1":"Pekerjaan jadi lebih sulit didapat","ch.c3-AE.a2":"Perdagangan berhenti","ch.c3-AE.w":"Sertifikat yang diakui di luar negeri membuat pekerja terampil tetap bekerja sesuai levelnya.","ch.c4-BR.t"     const k = q.twist; return `<p><b>${esc(T('idx.' + q.n))}: ${r.r}</b> · ${lv.e} ${esc(lv.name)}</p><p class="small">${esc(T('yearStats', { m: r.met, t: r.turns, b: r.bridges }))}</p>
      <p class="small">${pj.length ? esc(T('yearProj')) + ' ' + pj.map(p => `${p.e} ${esc(p.name)}`).join(T('sep')) : esc(T('yearNone'))}</p>${k ? `<p class="small">${D.TWISTS[k].e} ${esc(T('yearTw.' + k, { n: (r.tw || {})[k] || 0 }))}</p>` : ''}`; };
  const real = q => `<ul class="small">${D.YEAR_REAL.filter(x => x.q === q.n && x.st === 'agreed').map(x => `<li>${esc(x.t)} <small class="para" dir="ltr">¶${x.p}</small></li>`).join('')}</ul>`;
  $('#app').innerHTML = `<div class="endq year">
    <h1>${esc(T('yearTitle'))} 📜</h1><p class="sub">${esc(T('yearSub'))}</p>
    ${D.QUARTERS.map(q => `<section class="card yq"><h3>${q.e} ${esc(T('qN', { n: q.n }))} · ${esc(q.name)}</h3><div class="ycols"><div><h4>${esc(T('yearYou'))}</h4>${col(q)}</div><div><h4>${esc(T('yearReal'))}</h4>${real(q)}</div></div></section>`).join('')}
    <section class="card"><h3>${esc(T('yearProposals'))}</h3><p class="muted small">${esc(T('yearProposalsNote'))}</p><ul class="small">${D.YEAR_REAL.filter(x => x.st === 'proposal').map(x => `<li>${esc(x.t)} <small class="para" dir="ltr">¶${x.p}</small></li>`).join('')}<li>${esc(D.FACTS.about[3].t)} ${src(D.FACTS.about[3].srcName, D.FACTS.about[3].src)}</li></ul></section>
    <p class="muted small">${esc(T('agendaSrcNdd'))} ${src(D.NDD.name, D.NDD.src)}</p>
    <p class="note">${esc(T('yearNote'))}</p>
    <p class="disc">${esc(D.DISCLAIMER)}</p></div>
    <div class="cta"><button class="btn" data-act="back-title">${esc(T('yearBack'))}</button></div>`;
  emoji($('#app')); window.scrollTo({ top: 0 });
}
function doneForToday() {
  const sm = L.summary(S), q = S.quarter || 1, fin = () => { S = null; renderTitle(); };
  if (WB) WB.doneForToday({ lines: [T('doneLineQ', { b: sm.bridges, i: T('idx.' + q), r: sm.resilience }) + ' ' + T('tagline.' + q)], actions: D.ACTIONS[q] || D.ACTIONS_Q1, onClose: fin });
  else fin();
}

/* ---------- events ---------- */
function act(a, el) {
  const id = el && el.dataset.id;
  switch (a) {
    case 'close-sheet': closeSheet(); return;
    case 'member': memberSheet(id); return;
    case 'how': howSheet(); return;
    case 'about': aboutSheet(); return;
    case 'limits': if (WB) WB.openMySettings(); return;
    case 'passport': passportSheet(); return;
    case 'pickq': store.set({ quarter: +el.dataset.q }); sfx('tap'); renderTitle(); { const b = $(`.q[data-q="${el.dataset.q}"]`); if (b) b.focus(); } return;
    case 'year': renderYear(); return;
    case 'back-title': renderTitle(); return;
    case 'forget': if (confirm(T('forgetSure'))) { store.clear(); renderTitle(); } return;
    case 'new': begin(true); return;
    case 'continue': begin(false); return;
    case 'back': save(); renderTitle(); return;
    case 'to-help': S.phase = 'help'; break;
    case 'to-help-back': S.phase = 'help'; break;
    case 'pick': if (!L.togglePick(S, id)) { buzz('light'); announce(T('maxPick')); return; } sfx('tap'); break;
    case 'redraw': L.redraw(S); sfx('select'); break;
    case 'to-fund': S.phase = 'fund'; break;
    case 'proj': L.setProject(S, id || null); sfx('tap'); break;
    case 'to-cons': S.phase = 'consensus'; break;
    case 'to-fund-back': S.phase = 'fund'; break;
    case 'consult': L.setConsult(S, id); sfx('select'); break;
    case 'propose': { const e = L.resolve(S); sfx(e.pct >= 1 ? 'good' : 'select'); announce(T('annResult', { r: T('rate.' + e.rating), g: e.gain })); break; }
    case 'quiz': if (S.quizAns == null) { S.quizAns = +el.dataset.i; sfx(S.quizAns === L.cur(S).quiz.c ? 'good' : 'tap'); } break;
    case 'next': L.next(S); break;
    case 'done': doneForToday(); return;
    default: return;
  }
  save(); const y = $('#panel') ? $('#panel').scrollTop : 0, keep = a === 'pick' || a === 'proj' || a === 'consult' || a === 'quiz';
  renderGame(); if (keep && $('#panel')) $('#panel').scrollTop = y;
  if (!keep) { const p = $('#panel'); if (p && matchMedia('(max-width: 899px)').matches) window.scrollTo({ top: 0 }); }
}
document.addEventListener('click', e => {
  const ext = e.target.closest('a[data-ext]'); if (ext && H && H.openExternal) { e.preventDefault(); H.openExternal(ext.href); return; }
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return; e.preventDefault(); act(el.dataset.act, el);
});
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('g[data-act]')) { e.preventDefault(); act(e.target.dataset.act, e.target); } });
if (H && H.onBack) H.onBack(() => { if (view === 'game' || view === 'end') { save(); renderTitle(); return true; } if (view === 'year') { renderTitle(); return true; } return false; });
// the site language changed (hrs-common, possibly from another tab): follow it if the player never picked a BRICS language here
addEventListener('hrs-lang-change', () => { let own = null; try { own = localStorage.getItem(I.KEY); } catch (e) {}
  const before = I.lang(); applyLang(own || I.detect()); if (I.lang() !== before) { if (WB && WB.langChanged) WB.langChanged(); if (view === 'title') renderTitle(); else if (S) renderGame(); } });

/* ---------- boot ---------- */
// keep page content clear of the fixed bottom bar, whatever its height (two-line buttons on narrow phones)
const fitCta = () => { const c = $('.cta'); document.body.style.paddingBottom = c ? `${Math.ceil(c.getBoundingClientRect().height) + 12}px` : ''; };
new MutationObserver(fitCta).observe($('#app'), { childList: true }); addEventListener('resize', fitCta);
applyLang(Q.get('lang') ? I.set(Q.get('lang')) : I.detect());
if (WB) WB.init({ gameId: 'brics-bridges', profile: store.get().level, langs: I.CODES, getLang: () => I.lang(), onExit: () => { if (H && H.home) H.home(); else { S && save(); renderTitle(); } } });
renderTitle();
if (Q.get('continue') === '1' && store.get().save) begin(false);
if ('serviceWorker' in navigator && window.BB_SW && location.protocol.startsWith('http')) navigator.serviceWorker.register(window.BB_SW).catch(() => {});
window.BB = { get state() { return S; }, act, render: renderGame, title: renderTitle, year: renderYear, store, i18n: I, setLanguage, qState };
})();
</script>
</body>
